const CONSUMABLE_ICON_TONE = {
  'battery-aa':'amber','battery-aaa':'amber','battery-9v':'amber','battery-coin':'amber','bulb':'amber',
  'phone':'blue','mobile':'blue','tablet':'blue','headset':'blue','key-card':'blue','lock':'blue',
  'remote':'teal','tv':'teal','monitor':'teal','printer':'teal',
  'hdmi':'green','ethernet':'green','router':'green','usb':'green','mouse':'green','keyboard':'green',
  'charger':'red','power-strip':'red',
  'box':'gray',
};
const CONSUMABLE_ICON_KEYS = Object.keys(CONSUMABLE_ICONS);
const MAX_CONSUMABLE_QTY = 99;

function ConsumableIcon({ name, size=36 }) {
  const key = CONSUMABLE_ICONS[name] ? name : 'box'; // unknown key → generic box
  return (
    <span className={`cicon tone-${CONSUMABLE_ICON_TONE[key]}`}
      style={{width:size, height:size, borderRadius:Math.round(size*0.26)}} aria-hidden="true">
      {/* trusted static markup from CONSUMABLE_ICONS above, never user input */}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"
        strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html: CONSUMABLE_ICONS[key]}}/>
    </span>
  );
}

/* The grid of icons a manager picks from when creating / editing a consumable. */
function ConsumableIconGrid({ value, onChange }) {
  return (
    <div className="icon-grid">
      {CONSUMABLE_ICON_KEYS.map(k=>(
        <button type="button" key={k} title={k.replace(/-/g,' ')} aria-pressed={value===k}
          className={`icon-opt ${value===k?'selected':''}`} onClick={()=>onChange(k)}>
          <ConsumableIcon name={k} size={30}/>
        </button>
      ))}
    </div>
  );
}

/* Small icons (with a quantity badge) shown in the issue tables. */
function ConsumableStrip({ items }) {
  if (!items || items.length === 0) return null;
  return (
    <div className="cstrip">
      {items.map((c,i)=>(
        <span key={i} className="cstrip-item" title={`${c.item} × ${c.quantity}`}>
          <ConsumableIcon name={c.icon} size={22}/>
          {c.quantity > 1 && <span className="cstrip-qty">{c.quantity}</span>}
        </span>
      ))}
    </div>
  );
}

/* The handovers to Telnet / Telefonica, shown read-only under an issue in the
   tables. One pill per handover, so a support call that is still outstanding
   is visible without opening the issue. */
function SupportRequestStrip({ requests, t }) {
  if (!requests || requests.length === 0) return null;
  return (
    <div className="tp-strip">
      {requests.map(s=>{
        const label = s.company==='telnet' ? t.companyTelnet : t.companyTelefonica;
        const detail = s.company==='telnet'
          ? s.technician || '—'
          : s.ticketId;
        const state  = s.status==='solved' ? t.supportSolved : t.supportPending;
        return (
          <span key={s.id} className={`tp-strip-item ${s.company}`} title={`${label} · ${detail} · ${state}`}>
            {s.status==='solved' ? Ic.check : Ic.clock} {label}{detail ? ` ${detail}` : ''}
          </span>
        );
      })}
    </div>
  );
}

/* The dialog opened by "Add consumables". Works on a draft copy of the selection;
   nothing changes on the issue until the user presses Done. */
function ConsumablePicker({ items, value, onCancel, onDone }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [draft, setDraft] = useState(value);   // [{itemId, quantity}]
  const [query, setQuery] = useState('');

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);

  const byId = useMemo(()=>Object.fromEntries(draft.map(d=>[d.itemId,d])), [draft]);
  const q = query.trim().toLowerCase();
  const shown = q ? items.filter(it=>it.name.toLowerCase().includes(q)) : items;

  function toggle(id) {
    setDraft(d => d.some(x=>x.itemId===id) ? d.filter(x=>x.itemId!==id) : [...d, {itemId:id, quantity:1}]);
  }
  // Works from the latest state (not the last render), so fast clicks never lose a step.
  function bump(id, delta) {
    setDraft(d => d.flatMap(x => {
      if (x.itemId !== id) return [x];
      const qty = x.quantity + delta;
      return qty < 1 ? [] : [{...x, quantity: Math.min(qty, MAX_CONSUMABLE_QTY)}];  // stepping down from 1 un-selects it
    }));
  }

  return (
    <div className="modal-overlay picker-overlay" onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="modal picker-modal" role="dialog" aria-modal="true" aria-label={t.consumablePickerTitle}>
        <div className="modal-header">
          <div>
            <h2>{t.consumablePickerTitle}</h2>
            <div className="picker-sub">{t.consumablePickerSub}</div>
          </div>
          <button type="button" className="icon-btn" onClick={onCancel}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {items.length > 8 && (
            <div className="search-wrap" style={{width:'100%'}}>
              {Ic.search}
              <input placeholder={t.consumableSearch} value={query} onChange={e=>setQuery(e.target.value)} autoFocus/>
            </div>
          )}
          {items.length === 0 ? (
            <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.box}<p>{t.consumableNone}</p></div>
          ) : shown.length === 0 ? (
            <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.search}<p>{t.consumableNoMatch}</p></div>
          ) : (
            <div className="cpick-grid">
              {shown.map(it=>{
                const sel = byId[it.id];
                return (
                  <div key={it.id} role="button" tabIndex={0} aria-pressed={!!sel}
                    className={`cpick-card ${sel?'selected':''}`}
                    onClick={()=>toggle(it.id)}
                    onKeyDown={e=>{ if (e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(it.id); } }}>
                    <span className="cpick-check">{Ic.check}</span>
                    <ConsumableIcon name={it.icon} size={48}/>
                    <span className="cpick-name">{it.name}</span>
                    {sel ? (
                      <div className="cpick-stepper" onClick={e=>e.stopPropagation()} onKeyDown={e=>e.stopPropagation()}>
                        <button type="button" aria-label="−" onClick={()=>bump(it.id, -1)}>{Ic.minus}</button>
                        <span>{sel.quantity}</span>
                        <button type="button" aria-label="+" onClick={()=>bump(it.id, +1)}>{Ic.plus}</button>
                      </div>
                    ) : (
                      <span className="cpick-hint">{t.consumableTapToAdd}</span>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button type="button" className="btn btn-ghost" onClick={onCancel}>{t.cancel}</button>
          <button type="button" className="btn btn-primary" onClick={()=>onDone(draft)}>
            {Ic.check} {t.consumableDone}{draft.length > 0 ? ` (${draft.length})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

/* The dialog opened by "Third-party support" in the issue form. Works on a
   draft copy of the handovers; nothing changes on the issue until Done.
   `key` is client-only and identifies a handover that doesn't exist on the
   server yet, so `id` stays the server's own row id (0 for a new one). */
function SupportRequestModal({ requests, onCancel, onDone }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [items, setItems] = useState(requests);
  const [draft, setDraft] = useState(null);   // null = list view, otherwise the handover being added/edited
  const [err, setErr] = useState('');

  // A "YYYY-MM-DDTHH:MM" value in the browser's own timezone, matching the
  // format the datetime-local inputs and the API use.
  function localDateTimeValue(d) {
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function blank() {
    // We know when we are reporting it — it is now — so the start is prefilled
    // rather than left as one more empty field to discover.
    return {key: `new-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, id: 0,
            company: 'telnet', status: 'pending',
            technician: '', confirmedBy: '', ticketId: '',
            startedAt: localDateTimeValue(new Date()), resolvedAt: '', notes: ''};
  }
  function startAdd()   { setDraft(blank());            setErr(''); }
  function startEdit(s) { setDraft({...s});             setErr(''); }
  function cancelEdit() { setDraft(null);               setErr(''); }
  function patch(k,v)   { setDraft(d=>({...d,[k]:v})); setErr(''); }

  // Whole minutes between the two moments, or null when either is missing.
  const elapsed = useMemo(()=>{
    if (!draft || !draft.startedAt) return null;
    const start = new Date(draft.startedAt).getTime();
    const end   = draft.resolvedAt ? new Date(draft.resolvedAt).getTime() : Date.now();
    if (isNaN(start) || isNaN(end)) return null;
    const mins = Math.round((end - start) / 60000);
    return mins < 0 ? null : mins;
  }, [draft]);

  // Mirrors ValidateSupportRequests on the server, so the user is told here
  // rather than after a round-trip.
  function commit() {
    const technician  = (draft.technician ||'').trim();
    const confirmedBy = (draft.confirmedBy||'').trim();
    if (draft.company === 'telnet') {
      if (!technician) return setErr(t.telnetNeedsTechnician);
      if (draft.status==='solved' && !confirmedBy) return setErr(t.telnetNeedsConfirmation);
    } else {
      const ticket = (draft.ticketId||'').trim();
      if (!ticket) return setErr(t.telefonicaNeedsTicket);
      if (items.some(s=>s.key!==draft.key && (s.ticketId||'').trim().toLowerCase()===ticket.toLowerCase()))
        return setErr(t.telefonicaNeedsTicket);
    }
    if (!draft.startedAt) return setErr(t.supportNeedsReported);
    if (draft.status==='solved' && !draft.resolvedAt) return setErr(t.supportNeedsResolved);
    if (draft.startedAt && draft.resolvedAt && draft.resolvedAt < draft.startedAt) {
      return setErr(t.supportResolvedBefore);
    }
    const saved = {
      ...draft,
      // Fields that don't belong to the chosen company are dropped here as
      // well as on the server, so a draft can't carry stale values around.
      ticketId:      draft.company==='telefonica' ? (draft.ticketId||'').trim() : '',
      technician:    draft.company==='telnet' ? technician  : '',
      confirmedBy:   draft.company==='telnet' ? confirmedBy : '',
      notes: (draft.notes||'').trim(),
    };
    setItems(list=> list.some(s=>s.key===draft.key) ? list.map(s=>s.key===draft.key?saved:s) : [...list, saved]);
    cancelEdit();
  }

  function remove(s) {
    setItems(list=>list.filter(x=>x.key!==s.key));
  }

  // Switching company on an existing draft can strand a half-filled field
  // (e.g. a Telnet technician with no Telefónica ticket id), so start it clean.
  function setCompany(company) {
    setDraft(d=>({...d, company,
      ticketId:    company==='telefonica' ? d.ticketId : '',
      technician:  company==='telnet' ? d.technician  : '',
      confirmedBy: company==='telnet' ? d.confirmedBy : '',
    }));
    setErr('');
  }

  // Marking a handover OK is the moment a solution arrived, so offer "now" as
  // the answer rather than making it be looked up.
  function markSolvedNow() {
    patch('status', 'solved');
    patch('resolvedAt', localDateTimeValue(new Date()));
  }

  // The second line of a handover row. The company line already names the
  // Telnet technician, so this carries whatever it doesn't: Telefonica's ticket
  // id, or who confirmed the Telnet fix. Returns null when there is genuinely
  // nothing to add, so the row collapses instead of repeating the status badge.
  function detail(s) {
    if (s.company === 'telnet') {
      if (s.confirmedBy) return `${t.telnetConfirmedBy}: ${s.confirmedBy}`;
      return s.notes || null;
    }
    return `${t.telefonicaTicket}: ${s.ticketId}`;
  }

  return (
    <div className="modal-overlay picker-overlay" onClick={e=>e.target===e.currentTarget&&(draft?cancelEdit():onCancel())}>
      <div className="modal picker-modal" role="dialog" aria-modal="true" aria-label={t.thirdPartyTitle}>
        <div className="modal-header">
          <div>
            <h2>{t.thirdPartyTitle}</h2>
            <div className="picker-sub">{t.thirdPartySub}</div>
          </div>
          <button type="button" className="icon-btn" onClick={()=>draft?cancelEdit():onCancel()}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {draft ? (
            <>
              <div className="form-group">
                <label>{t.company}</label>
                <div className="tp-company">
                  <button type="button" className={`tp-company-opt ${draft.company==='telnet'?'active':''}`}
                    aria-pressed={draft.company==='telnet'} onClick={()=>setCompany('telnet')}>
                    <span className="tp-company-dot telnet"/>{t.companyTelnet}
                  </button>
                  <button type="button" className={`tp-company-opt ${draft.company==='telefonica'?'active':''}`}
                    aria-pressed={draft.company==='telefonica'} onClick={()=>setCompany('telefonica')}>
                    <span className="tp-company-dot telefonica"/>{t.companyTelefonica}
                  </button>
                </div>
              </div>

              {draft.company==='telnet' ? (
                <div className="form-row">
                  <div className="form-group">
                    <label>{t.telnetTechnician}</label>
                    <input className="form-control" placeholder={t.telnetTechPlaceholder} value={draft.technician}
                      onChange={e=>patch('technician', e.target.value)}/>
                  </div>
                  <div className="form-group">
                    <label>{t.telnetConfirmedBy}</label>
                    <input className="form-control" placeholder={t.telnetConfirmPlaceholder} value={draft.confirmedBy}
                      onChange={e=>patch('confirmedBy', e.target.value)}/>
                  </div>
                </div>
              ) : (
                <div className="form-group">
                  <label>{t.telefonicaTicket}</label>
                  <input className="form-control" placeholder={t.ticketIdPlaceholder} value={draft.ticketId}
                    onChange={e=>patch('ticketId', e.target.value)}/>
                </div>
              )}

              <div className="form-group">
                <label>{t.supportStatus}</label>
                <select className="form-control" value={draft.status} onChange={e=>patch('status', e.target.value)}>
                  <option value="pending">{t.supportPending}</option>
                  <option value="solved">{t.supportSolved}</option>
                </select>
              </div>

              {/* When we reported the problem, and when the company answered.
                  This is the company's turnaround, so it is wall-clock across
                  days rather than a shift length. */}
              <div className="form-row">
                <div className="form-group">
                  <label>{t.supportReportedAt}</label>
                  <input type="datetime-local" className="form-control" value={draft.startedAt}
                    onChange={e=>patch('startedAt', e.target.value)}/>
                </div>
                <div className="form-group">
                  <label>{t.supportResolvedAt}</label>
                  <input type="datetime-local" className="form-control" value={draft.resolvedAt}
                    onChange={e=>patch('resolvedAt', e.target.value)}/>
                </div>
              </div>

              {/* Live duration, so the effect of the two times above is
                  visible before saving. */}
              {elapsed != null && (
                <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:-8}}>
                  {t.supportDuration}: <strong style={{color:'var(--gray-600)'}}>{formatSupportDuration(elapsed)}</strong>
                </div>
              )}

              <div className="form-group">
                <label>{t.supportNotes}</label>
                <input className="form-control" placeholder={t.supportNotesPlaceholder} value={draft.notes}
                  onChange={e=>patch('notes', e.target.value)}/>
              </div>

              {err && <div style={{fontSize:12.5,color:'var(--red)'}}>{err}</div>}
            </>
          ) : items.length === 0 ? (
            <div className="empty-state" style={{padding:'24px 12px'}}>{Ic.users}<p>{t.thirdPartyNoneLogged}</p></div>
          ) : (
            <div className="tp-list">
              {items.map(s=>(
                <div className="tp-row" key={s.key}>
                  <div className="tp-row-main">
                    <div className="tp-row-company">
                      <span className={`tp-company-dot ${s.company}`}/>
                      {s.company==='telnet' ? t.companyTelnet : t.companyTelefonica}
                      {s.company==='telnet' && s.technician && (
                        <span style={{fontWeight:400,color:'var(--gray-500)'}}>— {s.technician}</span>
                      )}
                    </div>
                    {detail(s) && <div className="tp-row-detail">{detail(s)}</div>}
                    {s.durationMinutes != null && (
                      <div className="tp-row-detail">
                        {t.supportDuration}: <strong>{formatSupportDuration(s.durationMinutes)}</strong>
                      </div>
                    )}
                  </div>
                  <span className={`tp-row-status ${s.status}`}>{s.status==='solved' ? t.supportSolved : t.supportPending}</span>
                  <button type="button" className="icon-btn" title={t.editThirdParty} onClick={()=>startEdit(s)}>{Ic.edit}</button>
                  <button type="button" className="icon-btn danger" title={t.thirdPartyRemove} onClick={()=>remove(s)}>{Ic.trash}</button>
                </div>
              ))}
            </div>
          )}

          {!draft && (
            <button type="button" className="consumable-add-btn" onClick={startAdd} style={{width:'100%',padding:'9px 12px',fontSize:13}}>
              {Ic.plus} {items.length ? t.editThirdParty : t.addThirdParty}
            </button>
          )}
        </div>
        <div className="modal-footer">
          {draft ? (
            <>
              <button type="button" className="btn btn-ghost" onClick={cancelEdit}>{t.cancel}</button>
              <button type="button" className="btn btn-primary" onClick={commit}>{Ic.check} {t.saveChanges}</button>
            </>
          ) : (
            <>
              <button type="button" className="btn btn-ghost" onClick={onCancel}>{t.cancel}</button>
              <button type="button" className="btn btn-primary" onClick={()=>onDone(items)}>
                {Ic.check} {t.consumableDone}{items.length > 0 ? ` (${items.length})` : ''}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Asks before deleting an issue. Deleting takes the issue's consumables and its
   third-party handovers with it, so it is not something to do on a stray click.
   The subject line repeats which issue is about to go, because the confirm can
   be triggered from a row the user is looking at rather than at. */
function ConfirmDeleteIssue({ issue, onCancel, onConfirm, deleting }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape' && !deleting) onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel, deleting]);

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && !deleting && onCancel()}>
      <div className="modal confirm-modal" role="dialog" aria-modal="true" aria-label={t.deleteIssueTitle}>
        <div className="modal-header">
          <h2>{t.deleteIssueTitle}</h2>
          <button type="button" className="icon-btn" onClick={onCancel} disabled={deleting}>{Ic.x}</button>
        </div>
        <div className="modal-body confirm-body">
          <span className="confirm-icon">{Ic.trash}</span>
          <div className="confirm-text">
            {t.deleteIssueBody}
            <span className="confirm-subject">
              {issue.apt||issue.dept} · {issue.type} — {issue.problem}
            </span>
          </div>
        </div>
        <div className="modal-footer">
          {/* Cancel takes the initial focus, not the delete button: Enter is
              often still held over from whatever the user did before, and a
              reflexive Enter should not destroy an issue. */}
          <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={deleting} autoFocus>{t.cancel}</button>
          <button type="button" className="btn btn-danger" onClick={onConfirm} disabled={deleting}>
            {deleting ? t.deleting : <>{Ic.trash} {t.deleteIssueConfirm}</>}
          </button>
        </div>
      </div>
    </div>
  );
}

function IssueModal({ issueMode, editIssue, currentUser, issueTypes, departments, connectaAgents, consumableItems, token, onClose, onSave }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const isEdit = !!editIssue;
  const typeNames = (issueTypes || []).map(it => it.name);
  if (isEdit && editIssue.type && !typeNames.includes(editIssue.type)) {
    typeNames.unshift(editIssue.type);
  }
  const deptNames = (departments || []).map(d => d.name);
  if (isEdit && editIssue.dept && !deptNames.includes(editIssue.dept)) {
    deptNames.unshift(editIssue.dept);
  }
  const agentNames = (connectaAgents || []).map(a => a.name);
  if (isEdit && editIssue.reportedByAgent && !agentNames.includes(editIssue.reportedByAgent)) {
    agentNames.unshift(editIssue.reportedByAgent);
  }
  if (isEdit && editIssue.confirmedByAgent && !agentNames.includes(editIssue.confirmedByAgent)) {
    agentNames.unshift(editIssue.confirmedByAgent);
  }
  const firstType = typeNames[0] || '';
  const catalogById = Object.fromEntries((consumableItems || []).map(ci => [ci.id, ci]));
  const defaults = issueMode==='apt'
    ? {apt:'', type:firstType, problem:'', resolution:'', startTime:'', endTime:'', status:'Ok', reportedByAgent:'', confirmedByAgent:'', falsePositive:false, consumables:[], supportRequests:[]}
    : {dept:'',type:firstType, problem:'', resolution:'', startTime:'', endTime:'', status:'Ok', reportedByAgent:'', confirmedByAgent:'', falsePositive:false, consumables:[], supportRequests:[]};
  const [form, setForm] = useState(isEdit ? {
    apt:        editIssue.apt||'',
    dept:       editIssue.dept||'',
    type:       editIssue.type,
    problem:    editIssue.problem,
    resolution: editIssue.resolution,
    // Use the actual start/end times the issue was logged with. Only
    // issues logged before this feature existed lack them — for those
    // legacy rows only, fall back to a placeholder pair ending "now" that
    // reproduces the existing total duration, since real clock times were
    // never recorded for them.
    ...(editIssue.startTime && editIssue.endTime
      ? { startTime: editIssue.startTime, endTime: editIssue.endTime }
      : (() => {
          const end = new Date();
          const start = new Date(end.getTime() - editIssue.time*60000);
          const toHM = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
          return { startTime: toHM(start), endTime: toHM(end) };
        })()
    ),
    status:           editIssue.status,
    reportedByAgent:  editIssue.reportedByAgent || '',
    confirmedByAgent: editIssue.confirmedByAgent || '',
    falsePositive: !!editIssue.falsePositive,
    // Only items still in the catalog can be edited here. Usage recorded against
    // an item that has since been removed is kept on the server untouched.
    consumables: (editIssue.consumables || [])
      .filter(c => c.itemId != null && catalogById[c.itemId])
      .map(c => ({ itemId: c.itemId, quantity: c.quantity })),
    // Handovers to Telnet / Telefonica, as they are on the issue. The `key`
    // is client-only and derived from the server's row id, so the list can be
    // edited in place without an extra round-trip.
    supportRequests: (editIssue.supportRequests || []).map(s => ({...s, key: `srv-${s.id}`})),
  } : defaults);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [supportOpen, setSupportOpen] = useState(false);
  const selectedConsumables = form.consumables
    .map(c => ({ ...c, ...catalogById[c.itemId] }))     // adds name + icon
    .filter(c => c.name);

  function set(k,v) { setForm(f=>({...f,[k]:v})); }
  const duration = useMemo(()=>computeDurationMinutes(form.startTime, form.endTime), [form.startTime, form.endTime]);
  const timeRangeInvalid = form.startTime && form.endTime && duration === null;
  const valid = (issueMode==='apt'
    ? form.apt && form.type && form.problem && form.resolution
    : form.dept && form.type && form.problem && form.resolution
  ) && duration !== null;

  // Recurring-issue check: once a location + type are picked, ask the
  // backend (debounced) whether this same issue type has already happened
  // there within the manager-configured window.
  const location = issueMode==='apt' ? form.apt : form.dept;
  const [dupeInfo, setDupeInfo] = useState(null); // {count, window_hours, issues}
  useEffect(() => {
    if (!location || !form.type || !token) { setDupeInfo(null); return; }
    const handle = setTimeout(() => {
      const params = new URLSearchParams({ mode: issueMode, location, type: form.type });
      if (isEdit) params.set('exclude_id', String(editIssue.id));
      apiFetch(`/issue-duplicates?${params.toString()}`, {token})
        .then(res => setDupeInfo(res))
        .catch(() => {}); // non-critical — fail silently, don't block logging
    }, 400);
    return () => clearTimeout(handle);
  }, [location, form.type, issueMode, token, isEdit, editIssue?.id]);

  return (
    <>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h2>{isEdit ? t.editIssue : (issueMode==='apt' ? t.logAptIssue : t.logDeptIssue)}</h2>
          <button className="icon-btn" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            {issueMode==='apt' ? (
              <div className="form-group">
                <label>{t.aptNum}</label>
                <input className="form-control" placeholder="e.g. 1234" value={form.apt} onChange={e=>set('apt',e.target.value)} />
              </div>
            ) : (
              <div className="form-group">
                <label>{t.department}</label>
                <select className="form-control" value={form.dept} onChange={e=>set('dept',e.target.value)}>
                  <option value="">{t.selectDept}</option>
                  {deptNames.map(d=><option key={d}>{d}</option>)}
                </select>
              </div>
            )}
            <div className="form-group">
              <label>{t.issueType}</label>
              <select className="form-control" value={form.type} onChange={e=>set('type',e.target.value)}>
                {typeNames.length === 0 && <option value="">{t.selectDept}</option>}
                {typeNames.map(t2=><option key={t2}>{t2}</option>)}
              </select>
            </div>
          </div>
          {dupeInfo && dupeInfo.count > 0 && (
            <div style={{background:'var(--amber-light)',borderRadius:'var(--radius-md)',padding:'10px 14px',fontSize:13,color:'var(--amber)',display:'flex',alignItems:'flex-start',gap:8}}>
              <span style={{flexShrink:0,marginTop:1}}>{Ic.clock}</span>
              <div>
                <strong>{t.duplicateAlertTitle}.</strong>{' '}
                {duplicateAlertMessage(lang, dupeInfo.count, location, dupeInfo.window_hours)}
              </div>
            </div>
          )}
          <div className="form-group">
            <label>{t.problemDesc}</label>
            <input className="form-control" placeholder={t.descPlaceholder} value={form.problem} onChange={e=>set('problem',e.target.value)} />
          </div>
          <div className="form-group">
            <label>{t.resolutionLabel}</label>
            <input className="form-control" placeholder={t.resolutionPlaceholder} value={form.resolution} onChange={e=>set('resolution',e.target.value)} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>{t.startTime}</label>
              <input className="form-control" type="time" lang="sv-SE" value={form.startTime} onChange={e=>set('startTime',e.target.value)} />
            </div>
            <div className="form-group">
              <label>{t.endTime}</label>
              <input className="form-control" type="time" lang="sv-SE" value={form.endTime} onChange={e=>set('endTime',e.target.value)} />
            </div>
          </div>
          <div className="form-group">
            <label>{t.statusLabel}</label>
            <select className="form-control" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="Ok">{t.statusOk}</option>
              <option value="Pending">{t.statusPending}</option>
            </select>
          </div>
          <label className={`fp-check ${form.falsePositive ? 'checked' : ''}`}>
            <input type="checkbox" checked={form.falsePositive} onChange={e=>set('falsePositive', e.target.checked)}/>
            <span className="fp-box">{Ic.check}</span>
            <span>
              <span className="fp-title">{t.falsePositiveLabel}</span>
              <span className="fp-sub">{t.falsePositiveHint}</span>
            </span>
          </label>
          <div className="form-group">
            <label>{t.consumablesLabel}</label>
            <div className={`consumable-box ${selectedConsumables.length ? 'has-items' : ''}`}>
              {selectedConsumables.map(c=>(
                <span className="consumable-chip" key={c.itemId}>
                  <ConsumableIcon name={c.icon} size={22}/>
                  <span className="consumable-chip-name">{c.name}</span>
                  {c.quantity > 1 && <span className="consumable-chip-qty">×{c.quantity}</span>}
                  <button type="button" className="consumable-chip-x" aria-label={t.consumableRemove}
                    onClick={()=>set('consumables', form.consumables.filter(x=>x.itemId!==c.itemId))}>{Ic.x}</button>
                </span>
              ))}
              <button type="button" className="consumable-add-btn" onClick={()=>setPickerOpen(true)}>
                {selectedConsumables.length ? Ic.edit : Ic.plus} {selectedConsumables.length ? t.editConsumables : t.addConsumables}
              </button>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>{t.reportedByAgent}</label>
              <select className="form-control" value={form.reportedByAgent} onChange={e=>set('reportedByAgent',e.target.value)}>
                <option value="">{t.noAgentSelected}</option>
                {agentNames.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>{t.confirmedByAgent}</label>
              <select className="form-control" value={form.confirmedByAgent} onChange={e=>set('confirmedByAgent',e.target.value)}>
                <option value="">{t.noAgentSelected}</option>
                {agentNames.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group">
            <label>{t.thirdPartyLabel}</label>
            <div className={`tp-box ${form.supportRequests.length ? 'has-items' : ''}`}>
              {form.supportRequests.map(s=>(
                <span className={`tp-chip tp-chip-${s.company}`} key={s.key}>
                  <span className="tp-chip-company">{s.company==='telnet' ? t.companyTelnet : t.companyTelefonica}</span>
                  <span className="tp-chip-detail">
                    {s.company==='telnet' ? (s.technician || '—') : s.ticketId}
                  </span>
                  {s.status==='solved' && <span style={{color:'var(--green)'}}>{Ic.check}</span>}
                  <button type="button" className="consumable-chip-x" aria-label={t.thirdPartyRemove}
                    onClick={()=>set('supportRequests', form.supportRequests.filter(x=>x.key!==s.key))}>{Ic.x}</button>
                </span>
              ))}
              <button type="button" className="consumable-add-btn" onClick={()=>setSupportOpen(true)}>
                {form.supportRequests.length ? Ic.edit : Ic.plus} {form.supportRequests.length ? t.editThirdParty : t.addThirdParty}
              </button>
            </div>
          </div>
          {timeRangeInvalid ? (
            <div style={{fontSize:12.5,color:'var(--red)',marginTop:-8}}>{t.invalidTimeRange}</div>
          ) : duration !== null ? (
            <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:-8}}>{t.duration}: <strong style={{color:'var(--gray-600)'}}>{duration}m</strong></div>
          ) : null}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
          <button className="btn btn-primary" disabled={!valid} onClick={()=>{onSave({...form,time:duration,reportedByAgent:form.reportedByAgent||null,confirmedByAgent:form.confirmedByAgent||null});onClose();}}>
            {Ic.check} {isEdit ? t.saveChanges : t.logIssue}
          </button>
        </div>
      </div>
    </div>
    {pickerOpen && (
      <ConsumablePicker items={consumableItems || []} value={form.consumables}
        onCancel={()=>setPickerOpen(false)}
        onDone={sel=>{ set('consumables', sel); setPickerOpen(false); }}/>
    )}
    {supportOpen && (
      <SupportRequestModal requests={form.supportRequests}
        onCancel={()=>setSupportOpen(false)}
        onDone={sel=>{ set('supportRequests', sel); setSupportOpen(false); }}/>
    )}
    </>
  );
}

/* ════════════════ DASHBOARD ════════════════ */
function Dashboard({ apt, dept, users, stats }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];

  // Fall back to local computation while stats load
  const all = [...apt,...dept];
  const totalIssues  = stats ? stats.total_issues  : all.length;
  const resolved     = stats ? stats.resolved       : all.filter(i=>i.status==='Ok').length;
  const avgTime      = stats ? stats.avg_minutes.toFixed(1) : (all.length ? (all.reduce((s,i)=>s+Number(i.time),0)/all.length).toFixed(1) : '—');
  const byType       = stats ? stats.by_type        : (() => { const m={}; all.forEach(i=>{m[i.type]=(m[i.type]||0)+1;}); return m; })();
  const byTech       = stats ? stats.by_technician  : [];
  const maxWork      = Math.max(...(byTech.map(t=>t.count)), 1);
  const maxType      = Math.max(...Object.values(byType), 1);
  const activeTechs  = users.filter(u=>u.role==='technician');

  return (
    <div>
      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-label">{t.totalToday}</div>

          <div className="stat-sub"><span className="stat-dot" style={{background:'#1769AA'}}></span>{t.aptsAndDepts}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.resolved}</div>
          <div className="stat-value" style={{color:'#2E8B57'}}>{resolved}</div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#639922'}}></span>{totalIssues ? Math.round(resolved/totalIssues*100) : 0}{t.resolutionRate}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.avgTime}</div>
          <div className="stat-value">{avgTime}<span style={{fontSize:14,fontWeight:400,color:'var(--gray-400)'}}>m</span></div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#EF9F27'}}></span>{t.acrossAll}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.activeTechs}</div>
          <div className="stat-value">{activeTechs.length}</div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#9FE1CB'}}></span>{activeTechs.map(u=>u.name).join(' · ')||'—'}</div>
        </div>
      </div>
      <div className="bottom-grid">
        <div className="mini-card">
          <div className="mini-card-title">{t.workload}</div>
          {byTech.length===0 && <p style={{color:'var(--gray-400)',fontSize:13}}>{t.noTechs}</p>}
          {byTech.map(ts=>(
            <div className="bar-row" key={ts.user_id}>
              <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxWork)*100}%`,background:'#1769AA'}}></div></div>
              <div className="bar-count">{ts.count}</div>
            </div>
          ))}
        </div>
        <div className="mini-card">
          <div className="mini-card-title">{t.byType}</div>
          {Object.keys(byType).length===0 && <p style={{color:'var(--gray-400)',fontSize:13}}>{t.noIssues}</p>}
          {Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
            <div className="bar-row" key={type}>
              <div className="bar-label">
                <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                {type}
              </div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
              <div className="bar-count">{count}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ════════════════ ISSUES TABLE ════════════════ */
function IssuesTable({ issues, tableMode, currentUser, newIssueId, onDelete, onEdit }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  // `null` means "no type filter", rather than the translated word for "All".
  // Comparing against t.all left the table empty in any language whose word
  // for "All" isn't literally "All" (Portuguese: "Todas"), and an issue type
  // could also be *named* All/Todas, which the old check couldn't tell apart
  // from the catch-all chip.
  const [filter, setFilter] = useState(null);
  const [search, setSearch] = useState('');
  // The catch-all chip is labelled with t.all but filters on null; the rest
  // filter on the type name itself. Keyed separately so an issue type that
  // happens to be called "All" still gets its own working chip.
  const chips   = [{label:t.all, value:null}, ...Array.from(new Set(issues.map(i=>i.type))).map(ty=>({label:ty, value:ty}))];
  const filtered = useMemo(()=>issues.filter(i=>{
    const ok1 = filter===null||i.type===filter;
    const q   = search.toLowerCase();
    const ok2 = !q||(i.apt||i.dept||'').toLowerCase().includes(q)||i.problem.toLowerCase().includes(q)||i.loggedByName.toLowerCase().includes(q)||i.type.toLowerCase().includes(q);
    return ok1&&ok2;
  }),[issues,filter,search]);

  const canAct = issue => currentUser.role==='manager' || issue.loggedBy===currentUser.id;

  // Clicking anywhere in a row opens it for editing, but only for the user who
  // logged it (or a manager) — the same rule the edit button and the API enforce.
  function openFromRow(e, issue) {
    // A click that ends with text selected is someone trying to copy
    // something out of the row, not someone trying to edit the issue.
    if (window.getSelection()?.toString()) return;
    onEdit(issue, tableMode);
  }

  return (
    <div className="table-card">
      <div className="table-header">
        <span className="table-title">{tableMode==='apt' ? t.aptIssuesTitle : t.deptIssuesTitle}</span>
        <div className="table-actions">
          <div className="filter-chips">

function AlertsPage({ alerts, currentUser, token, onAlertsUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const isManager = currentUser.role === 'manager';
  const [filter, setFilter] = useState('pending');
  const [solvingId, setSolvingId] = useState(null);
  const [solutionText, setSolutionText] = useState('');
  const [saving, setSaving] = useState(false);

  const list = alerts || [];
  const pendingCount = list.filter(a => a.status === 'pending').length;
  const solvedCount = list.filter(a => a.status === 'solved').length;
  const filtered = list.filter(a => a.status === filter);

  async function submitSolve(id) {
    const trimmed = solutionText.trim();
    if (!trimmed) return;
    setSaving(true);
    try {
      const res = await apiFetch(`/alerts/${id}/solve`, {method:'PATCH', body:{solution:trimmed}, token});
      onAlertsUpdate(prev => prev.map(a => a.id===id ? {...a, ...res.alert} : a));
      setSolvingId(null);
      setSolutionText('');
      setToast(t.alertSolved);
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSaving(false); }
  }

  async function removeAlert(id) {
    try {
      await apiFetch(`/alerts/${id}`, {method:'DELETE', token});
      onAlertsUpdate(prev => prev.filter(a => a.id !== id));
      setToast(t.alertDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  return (
    <div>

        <button className={`chip ${filter==='pending'?'active':''}`} onClick={()=>setFilter('pending')}>
          {t.alertsPending} ({pendingCount})

        <button className={`chip ${filter==='solved'?'active':''}`} onClick={()=>setFilter('solved')}>
          {t.alertsSolved} ({solvedCount})

      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">{Ic.bell}<p>{filter==='pending' ? t.alertsEmpty : t.alertsSolvedEmpty}</p></div>
      ) : filtered.map(alert => (
        <div className="table-card" key={alert.id} style={{marginBottom:16}}>
          <div className="table-header">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{color: alert.status==='solved' ? 'var(--green)' : 'var(--amber)'}}>{Ic.bell}</span>

              {isManager && alert.status==='pending' && solvingId!==alert.id && (

              {isManager && (

          {alert.status === 'solved' && (

/* ── Third-party support: how long the company took ── */
/* Renders a number of minutes the way the support page shows it: days first
   once a handover runs past a day, then hours and minutes. Returns null for a
   missing duration, so callers can show a dash rather than a misleading "0m". */
function formatSupportDuration(minutes) {
  if (minutes == null) return null;
  const total = Math.round(minutes);
  if (total <= 0) return '0m';
  const days   = Math.floor(total / 1440);
  const hours  = Math.floor((total % 1440) / 60);
  const mins   = total % 60;
  const unit = (n, u) => `${n}${u}${n === 1 ? '' : 's'}`;
  if (days > 0 && hours > 0) return `${unit(days,'d')} ${unit(hours,'h')}`;
  if (days > 0)             return unit(days, 'd');
  if (hours > 0 && mins > 0) return `${unit(hours,'h')} ${unit(mins,'m')}`;
  if (hours > 0)             return unit(hours, 'h');
  return unit(mins, 'm');
}

/* Formats a timestamp for the "Reported" / "Solution" columns. Shows just the
   date when the range spans more than a day, and the time as well when it does
   not, which is what makes a same-day turnaround readable. */
function formatSupportMoment(iso, withTime) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return withTime
    ? d.toLocaleString(undefined, {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})
    : d.toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric'});
}

/* Formats a current-vs-previous change: {pct, dir, color}. goodDirection
   is 'up', 'down', or 'neutral' — determines whether an increase should be
   shown as good (green) or bad (red). */
function analyticsChange(current, previous, goodDirection) {
  if (previous === 0) {
    if (current === 0) return null;
    const dir = current > 0 ? 'up' : 'down';
    return { pct: null, dir, color: analyticsChangeColor(dir, goodDirection) };
  }
  const pct = ((current - previous) / previous) * 100;
  if (Math.abs(pct) < 0.5) return { pct: 0, dir: 'flat', color: 'var(--gray-400)' };
  const dir = pct > 0 ? 'up' : 'down';
  return { pct, dir, color: analyticsChangeColor(dir, goodDirection) };
}
function analyticsChangeColor(dir, goodDirection) {
  if (goodDirection === 'neutral') return 'var(--gray-400)';
  const isGood = (dir === 'up' && goodDirection === 'up') || (dir === 'down' && goodDirection === 'down');
  return isGood ? 'var(--green)' : 'var(--red)';
}

function AnalyticsMetricCard({ label, current, previous, suffix, decimals, goodDirection, t }) {
  const change = analyticsChange(current, previous, goodDirection);
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value">{current.toFixed(decimals||0)}{suffix||''}</div>
      <div className="stat-sub">
        {change && change.dir !== 'flat' && (
          <span style={{color:change.color,fontWeight:600}}>
            {change.dir==='up' ? '▲' : '▼'} {change.pct!=null ? Math.abs(change.pct).toFixed(0)+'%' : ''}
          </span>
        )}
        <span style={{color:'var(--gray-400)'}}>{t.vsPrevious}</span>
      </div>
    </div>
  );
}

function AnalyticsPage({ token, alertsPendingCount }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [range, setRange] = useState('week');
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    apiFetch(`/analytics?range=${range}`, {token})
      .then(res => { if (!cancelled) setData(res.analytics); })
      .catch(() => {})
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [range, token]);

  const bestTech = data && data.best_technician_id != null
    ? data.by_technician.find(tech => tech.user_id === data.best_technician_id)
    : null;

  const techByAvg = data ? [...data.by_technician].filter(x=>x.resolved>0).sort((a,b)=>a.avg_time_minutes-b.avg_time_minutes) : [];

  const watchItems = [];
  if (data) {
    const pendingChange = analyticsChange(data.pending.current, data.pending.previous, 'down');
    if (pendingChange && pendingChange.dir==='up') {
      watchItems.push(lang==='pt'
        ? `A pendência subiu de ${data.pending.previous} para ${data.pending.current} avarias.`
        : `Pending backlog rose from ${data.pending.previous} to ${data.pending.current} issues.`);
    }
    const avgChange = analyticsChange(data.avg_time_minutes.current, data.avg_time_minutes.previous, 'down');
    if (avgChange && avgChange.dir==='up') {
      watchItems.push(lang==='pt'
        ? `O tempo médio de resolução aumentou ${Math.abs(avgChange.pct).toFixed(0)}%.`
        : `Average resolution time increased ${Math.abs(avgChange.pct).toFixed(0)}%.`);
    }
    const rateChange = analyticsChange(data.resolution_rate.current, data.resolution_rate.previous, 'up');
    if (rateChange && rateChange.dir==='down') {
      watchItems.push(lang==='pt'
        ? `A taxa de resolução desceu de ${data.resolution_rate.previous}% para ${data.resolution_rate.current}%.`
        : `Resolution rate dropped from ${data.resolution_rate.previous}% to ${data.resolution_rate.current}%.`);
    }
    if (alertsPendingCount > 0) {
      watchItems.push(lang==='pt'
        ? `${alertsPendingCount} avaria(s) recorrente(s) ainda por resolver.`
        : `${alertsPendingCount} recurring issue${alertsPendingCount===1?'':'s'} still unresolved.`);
    }
  }

  return (
    <div>
      <div className="table-card" style={{marginBottom:16,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
        <p style={{fontSize:13,color:'var(--gray-400)',margin:0}}>{t.analyticsSubtitle}</p>
        <div style={{display:'flex',gap:8}}>
          <button className={`chip ${range==='week'?'active':''}`} onClick={()=>setRange('week')}>{t.rangeWeek}</button>
          <button className={`chip ${range==='month'?'active':''}`} onClick={()=>setRange('month')}>{t.rangeMonth}</button>
        </div>
      </div>

      {loading ? (
        <div className="empty-state"><p>{t.analyticsLoading}</p></div>
      ) : !data || data.total_issues.current + data.total_issues.previous === 0 ? (
        <div className="empty-state">{Ic.trending}<p>{t.analyticsNoData}</p></div>
      ) : (
        <>
          <div className="analytics-grid">
            <AnalyticsMetricCard t={t} label={t.totalIssuesMetric} current={data.total_issues.current} previous={data.total_issues.previous} goodDirection="neutral"/>
            <AnalyticsMetricCard t={t} label={t.resolvedMetric} current={data.resolved.current} previous={data.resolved.previous} goodDirection="up"/>
            <AnalyticsMetricCard t={t} label={t.pendingMetric} current={data.pending.current} previous={data.pending.previous} goodDirection="down"/>
            <AnalyticsMetricCard t={t} label={t.resolutionRateMetric} current={data.resolution_rate.current} previous={data.resolution_rate.previous} suffix="%" decimals={0} goodDirection="up"/>
            <AnalyticsMetricCard t={t} label={t.avgTimeMetric} current={data.avg_time_minutes.current} previous={data.avg_time_minutes.previous} suffix="m" decimals={1} goodDirection="down"/>
            <AnalyticsMetricCard t={t} label={t.fastestTimeMetric} current={data.fastest_time_minutes.current} previous={data.fastest_time_minutes.previous} suffix="m" decimals={0} goodDirection="down"/>
            <AnalyticsMetricCard t={t} label={t.recurringAlertsMetric} current={data.recurring_alerts_opened.current} previous={data.recurring_alerts_opened.previous} goodDirection="down"/>
            <AnalyticsMetricCard t={t} label={t.falsePositivesMetric} current={data.false_positives.current} previous={data.false_positives.previous} goodDirection="down"/>
            <AnalyticsMetricCard t={t} label={t.falsePositiveRateMetric} current={data.false_positive_rate.current} previous={data.false_positive_rate.previous} suffix="%" decimals={1} goodDirection="down"/>
          </div>

          {bestTech && (
            <div className="mini-card" style={{marginBottom:20,display:'flex',alignItems:'center',gap:14}}>
              <span style={{color:'var(--green)'}}>{Ic.check}</span>
              <div>
                <div className="mini-card-title" style={{marginBottom:2}}>{t.bestAvgTime}: {bestTech.name}</div>
                <div style={{fontSize:13,color:'var(--gray-400)'}}>{bestTech.avg_time_minutes}m {t.avgTimeMetric.toLowerCase()} · {bestTech.resolved} {t.resolvedMetric.toLowerCase()}</div>

          {watchItems.length > 0 ? (

            <div className="mini-card" style={{marginBottom:20,background:'var(--green-light)',border:'none'}}>
              <div style={{fontSize:13,color:'var(--green)',fontWeight:500}}>✓ {t.allGood}</div>

          <div className="admin-grid">

              <table>
                <thead><tr><th>{t.loggedBy}</th><th>{t.issuesLogged}</th><th>{t.resolvedMetric}</th><th>{t.avgTimeMetric}</th></tr></thead>
                <tbody>

/* ════════════════ REPORTS PAGE ════════════════ */
function ReportsPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [date,    setDate]    = useState(new Date().toISOString().slice(0,10));
  const [report,  setReport]  = useState(null);
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');
  const [downloading, setDownloading] = useState(false);

  async function fetchReport() {
    setLoading(true); setError(''); setReport(null);
    try {
      const res = await apiFetch(`/reports/daily?date=${date}`, {token});
      setReport(res.report);
    } catch(ex) { setError(ex.message); }
    finally { setLoading(false); }
  }

  useEffect(() => { fetchReport(); }, [date]);

  // The printable report is rendered server-side: the Go backend builds an
  // HTML+CSS document styled with this app's own palette and prints it with a
  // headless Chromium (see internal/report). Fetching it as a blob, rather
  // than linking straight to the URL, is what lets us send the Authorization
  // header the endpoint requires.
  async function downloadPDF() {
    if (!report || downloading) return;
    setDownloading(true);
    try {
      const res = await fetch(`${API}/reports/daily.pdf?date=${date}`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) {
        let msg = 'Could not generate the PDF';
        try {
          const body = await res.json();
          if (body.error) msg = typeof body.error === 'string' ? body.error : Object.values(body.error).join(', ');
        } catch {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `LIRA-Daily-Report-${report.date}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Release the object URL once the download has been handed to the browser.
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (ex) {
      setError('Error: ' + ex.message);
    } finally {
      setDownloading(false);
    }
  }

  const fpCount    = report ? (report.summary.false_positives || 0) : 0;
  const realCount  = report ? report.summary.total_issues - fpCount : 0;
  const fpRate     = report && report.summary.total_issues > 0 ? (fpCount / report.summary.total_issues * 100).toFixed(0) : '0';

  const summaryCards = report ? [
    {label:'Total issues',     value: report.summary.total_issues,  sub:'Apts + Departments',             color:'#1769AA'},
    {label:'Resolved',         value: report.summary.resolved,      sub:`${report.summary.resolution_rate.toFixed(0)}% rate`, color:'#2E8B57'},
    {label:'Pending',          value: report.summary.pending,       sub:'Still open',                     color:'#D88A18'},
    {label:'Avg. time',        value: report.summary.avg_minutes.toFixed(1)+'m', sub:'Per issue',         color:'#1D9E75'},
    {label:'Total time spent', value: report.summary.total_minutes+'m', sub:'All issues combined',        color:'#1769AA'},
    {label:'Fastest fix',      value: report.summary.fastest_minutes+'m', sub:'Quickest resolution',     color:'#2E8B57'},
    {label:'Slowest fix',      value: report.summary.slowest_minutes+'m', sub:'Longest resolution',      color:'#D88A18'},
    {label:'Apt. issues',      value: report.summary.apt_issues,    sub:'Apartment',                     color:'#1769AA'},
    {label:'Dept. issues',     value: report.summary.dept_issues,   sub:'Department',                    color:'#1D9E75'},
    {label:'False positives',  value: fpCount,                      sub:'Nothing was wrong',              color:'#D88A18'},
    {label:'False positive rate', value: fpRate+'%',                sub:'Of all issues',                  color:'#D88A18'},
    {label:'Real issues',      value: realCount,                    sub:'Something was wrong',            color:'#2E8B57'},
  ] : [];

  const maxType = report ? Math.max(...Object.values(report.by_type), 1) : 1;
  const maxTech = report ? Math.max(...(report.by_technician||[]).map(t=>t.count), 1) : 1;

  return (
    <div>
      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid var(--gray-200)',borderRadius:'var(--radius-md)',padding:'6px 12px'}}>
          {Ic.calendar}
          <input
            type="date" value={date} onChange={e=>setDate(e.target.value)}
            style={{border:'none',outline:'none',fontSize:13,fontFamily:'DM Sans,sans-serif',color:'var(--gray-900)',background:'transparent'}}
          />
        </div>
        <button className="btn btn-ghost" onClick={fetchReport} disabled={loading}>
          {loading ? '…' : 'Refresh'}
        </button>
        <button className="btn btn-primary" onClick={downloadPDF} disabled={!report || loading || downloading}
          style={{marginLeft:'auto'}}>
          {Ic.download} {downloading ? 'Generating…' : 'Download PDF'}
        </button>
      </div>

      {error && (
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,marginBottom:16}}>
          {error}
        </div>
      )}

      {loading && (
        <div style={{textAlign:'center',padding:'60px 0',color:'var(--gray-400)',fontSize:14}}>
          Loading report…
        </div>
      )}

      {report && !loading && (
        <>
          {/* Summary cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:22}}>
            {summaryCards.map(c=>(
              <div className="stat-card" key={c.label}>
                <div className="stat-label">{c.label}</div>
                <div className="stat-value" style={{color:c.color}}>{c.value}</div>
                <div className="stat-sub"><span className="stat-dot" style={{background:c.color}}></span>{c.sub}</div>
              </div>
            ))}
          </div>

          {/* Breakdowns */}
          <div className="bottom-grid" style={{marginBottom:22}}>
            <div className="mini-card">
              <div className="mini-card-title">Issues by type</div>
              {Object.keys(report.by_type).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No issues logged.</p>
                : Object.entries(report.by_type).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
                    <div className="bar-row" key={type}>
                      <div className="bar-label">
                        <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                        {type}
                      </div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
                      <div className="bar-count">{count}</div>
                    </div>
                  ))
              }
            </div>
            <div className="mini-card">
              <div className="mini-card-title">By technician</div>
              {(report.by_technician||[]).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No technicians.</p>
                : report.by_technician.map(ts=>(
                    <div className="bar-row" key={ts.user_id}>
                      <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxTech)*100}%`,background:'#1769AA'}}></div></div>
                      <div className="bar-count">{ts.count}</div>
                    </div>
                  ))
              }
            </div>
          </div>

          {/* Apt issues table */}
          {(report.apt_issues||[]).length > 0 && (
            <div className="table-card" style={{marginBottom:20}}>
              <div className="table-header">
                <span className="table-title">Apartment issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.apt_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Apt.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.apt_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.time_minutes}m</td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Dept issues table */}
          {(report.dept_issues||[]).length > 0 && (
            <div className="table-card">
              <div className="table-header">
                <span className="table-title">Department issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.dept_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Dept.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.dept_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.time_minutes}m</td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {report.summary.total_issues === 0 && (
            <div className="table-card">
              <div className="empty-state">
                {Ic.report}
                <p>No issues logged on {report.date}.</p>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

    setIdErr(''); setSaving(true);
    if (pw && pw !== pwConf) { setPwErr('Passwords do not match.'); setSaving(false); return; }
    try {
      const body = { name, email };
      if (pw) body.password = pw;
      const res = await apiFetch('/profile', {method:'PATCH', body, token});
      onSessionUpdate(res.user);
      setPw(''); setPwConf(''); setPwErr('');
      setToast('Profile updated');
    } catch(ex) { setIdErr(ex.message); }
    finally { setSaving(false); }
  }

  async function saveAvatar(data) {
    try {
      const res = await apiFetch('/profile', {method:'PATCH', body:{avatar_data: data}, token});
      setAvatarData(data);
      onSessionUpdate(res.user);
      setToast('Avatar updated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      // Resize using canvas
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 160;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width  - min) / 2;
        const sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        saveAvatar(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function saveLang(l) {
    onLangChange(l);
    try {
      await apiFetch('/profile', {method:'PATCH', body:{language: l}, token});
    } catch(ex) {}

              display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>

          </button>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFileChange}/>
        </div>
        <div>
          <div style={{fontSize:18,fontWeight:600}}>{currentUser.name}</div>
          <div style={{fontSize:13,color:'var(--gray-400)',marginTop:2,display:'flex',alignItems:'center',gap:6}}>

      {/* Sub-nav */}

        {sections.map(s=>(

      {/* ── Identity ── */}
      {section==='identity' && (

          <div style={{display:'flex',flexDirection:'column',gap:14}}>
