  const [session, setSession] = useState(()=>loadLS('lira_session', null)); // {user, token}
  const [apt,     setApt]     = useState([]);
  const [dept,    setDept]    = useState([]);
  const [users,   setUsers]   = useState([]);
  const [stats,   setStats]   = useState(null);
  const [page,    setPage]    = useState('dashboard');
  const [modal,   setModal]   = useState(null);
  const [editing, setEditing] = useState(null);
  const [toast,   setToast]   = useState(null);
  const [apiErr,  setApiErr]  = useState('');

  const t     = T[lang];
  const token = session?.token;
  const me    = session?.user;

  useEffect(()=>{ saveLS('lira_lang', lang); }, [lang]);
  useEffect(()=>{
    saveLS('lira_theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);
  useEffect(()=>{ saveLS('lira_session', session); }, [session]);

  // Load all data when logged in
  useEffect(() => {
    if (!token) return;
    const todayStr = new Date().toISOString().slice(0,10);
    Promise.all([
      apiFetch('/issues?mode=apt', {token}),
      apiFetch('/issues?mode=dept', {token}),
      apiFetch('/users', {token}),
      apiFetch(`/stats?date=${todayStr}`, {token}),
    ]).then(([aptRes, deptRes, usersRes, statsRes]) => {
      setApt((aptRes.issues || []).map(mapIssue));
      setDept((deptRes.issues || []).map(mapIssue));
      setUsers(usersRes.users || []);
      setStats(statsRes.stats);
    }).catch(ex => {
      if (ex.message.includes('401') || ex.message.toLowerCase().includes('token')) {
        setSession(null); // token expired
      } else {
        setApiErr(ex.message);
      }
    });
  }, [token]);

  function login(user, token) {
    setSession({user, token});
    setPage('dashboard');
  }

  function logout() {
    setSession(null);
    setApt([]); setDept([]); setUsers([]); setStats(null);
  }

  // Called when profile updates come back from API
  function onSessionUpdate(updatedUser) {
    setSession(s => ({...s, user: updatedUser}));
    saveLS('lira_session', {...session, user: updatedUser});
  }

  async function addIssue(form, mode) {
    try {
      const body = {
        mode,
        location: mode==='apt' ? form.apt : form.dept,
        type:         form.type,
        problem:      form.problem,
        resolution:   form.resolution,
        time_minutes: Number(form.time),
        status:       form.status,
      };
      const res = await apiFetch('/issues', {method:'POST', body, token});
      const issue = mapIssue(res.issue);
      if (mode==='apt') setApt(p=>[issue,...p]);
      else              setDept(p=>[issue,...p]);
      // Refresh stats
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastLogged);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function saveEdit(form, mode, id) {
    try {
      const body = {
        mode,
        location:     mode==='apt' ? form.apt : form.dept,
        type:         form.type,
        problem:      form.problem,
        resolution:   form.resolution,
        time_minutes: Number(form.time),
        status:       form.status,
      };
      const res = await apiFetch(`/issues/${id}`, {method:'PATCH', body, token});
      const updated = mapIssue(res.issue);
      const upd = list => list.map(i=>i.id===id ? updated : i);
      if (mode==='apt') setApt(upd); else setDept(upd);
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function delIssue(id, mode) {
    try {
      await apiFetch(`/issues/${id}`, {method:'DELETE', token});
      if (mode==='apt') setApt(p=>p.filter(i=>i.id!==id));
      else              setDept(p=>p.filter(i=>i.id!==id));
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  if (!session) return (
    <LangCtx.Provider value={lang}>
      <AuthScreen onLogin={login} lang={lang} onLangChange={setLang} theme={theme} onThemeChange={setTheme}/>
    </LangCtx.Provider>
  );

  const nav = [
    {id:'dashboard', label:t.dashboard,  icon:Ic.grid },
    {id:'apt',       label:t.aptIssues,  icon:Ic.list },
    {id:'dept',      label:t.deptIssues, icon:Ic.edit },
    {id:'history',   label:t.history,    icon:Ic.clock},
    {id:'team',      label:t.team,       icon:Ic.users},
    {id:'reports',   label:'Reports',    icon:Ic.report},
    {id:'profile',   label:'Profile',    icon:Ic.person},
  ];

  return (
    <LangCtx.Provider value={lang}>
      <div className="app">
        <aside className="sidebar">
          <div className="sidebar-logo">
            <div className="logo-mark">{Ic.logo}</div>
            <div><div className="logo-text">LIRA</div><div className="logo-sub">{t.appSub}</div></div>
          </div>
          <div className="sidebar-section">
            <div className="sidebar-section-label">{t.menu}</div>
            {nav.map(n=>(
              <button key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
                {n.icon}<span>{n.label}</span>
              </button>
            ))}
          </div>
          <div className="sidebar-footer">
            <div className="sidebar-user" style={{cursor:'pointer'}} onClick={()=>setPage('profile')}>
              {me.avatar_data
                ? <img src={me.avatar_data} style={{width:30,height:30,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                : <Avatar name={me.name} idx={me.avatar_idx}/>
              }
              <div>
                <div className="sidebar-user-name">{me.name}</div>
                <div className="sidebar-user-role">{me.role==='manager' ? t.managerRole : t.techRole}</div>
              </div>
            </div>
            <button className="logout-btn" onClick={logout}>{Ic.logout} {t.signOut}</button>
          </div>
        </aside>

        <div className="main">
          <div className="topbar">
            <div className="topbar-left">
              <h1>{nav.find(n=>n.id===page)?.label || page.charAt(0).toUpperCase() + page.slice(1)}</h1>
              <p>{today(lang)}</p>
            </div>
            <div className="topbar-right">
              <ThemeToggle theme={theme} onChange={setTheme}/>
              <LangToggle lang={lang} onChange={setLang}/>
              {page !== 'profile' && page !== 'reports' && <>
                <button className="btn btn-ghost" onClick={()=>setModal('dept')}>{Ic.plus} {t.deptIssueBtn}</button>
                <button className="btn btn-primary" onClick={()=>setModal('apt')}>{Ic.plus} {t.aptIssueBtn}</button>
              </>}
            </div>
          </div>

          {apiErr && (
            <div style={{margin:'16px 28px 0',background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
              {Ic.info} {apiErr} <button style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'var(--red)'}} onClick={()=>setApiErr('')}>{Ic.x}</button>
            </div>
          )}

          <div className="content">
            {page==='dashboard' && <Dashboard apt={apt} dept={dept} users={users} stats={stats}/>}
            {page==='apt'       && <IssuesTable issues={apt}  tableMode="apt"  currentUser={me} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='dept'      && <IssuesTable issues={dept} tableMode="dept" currentUser={me} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='history'   && <div>
              <IssuesTable issues={apt}  tableMode="apt"  currentUser={me} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>
              <IssuesTable issues={dept} tableMode="dept" currentUser={me} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>
            </div>}
            {page==='team'    && <TeamPage users={users} apt={apt} dept={dept} currentUser={me}/>}
            {page==='reports' && <ReportsPage token={token}/>}
            {page==='profile' && <ProfilePage
              currentUser={me}
              token={token}
              users={users}
              onSessionUpdate={onSessionUpdate}
              onUsersUpdate={setUsers}
              setToast={setToast}
              lang={lang}
              onLangChange={setLang}
            />}
          </div>
        </div>

        {modal && (
          <IssueModal issueMode={modal} currentUser={me} onClose={()=>setModal(null)} onSave={form=>addIssue(form,modal)}/>
        )}
        {editing && (
          <IssueModal issueMode={editing.mode} editIssue={editing.issue} currentUser={me}
            onClose={()=>setEditing(null)} onSave={form=>saveEdit(form,editing.mode,editing.issue.id)}/>
        )}
        {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
