    doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(28,28,26);
    doc.text('Issues by Type', 10, y); y += 4;
    const typeData = Object.entries(report.by_type).sort((a,b)=>b[1]-a[1])
      .map(([type, count]) => [type, String(count)]);
    doc.autoTable({
      startY: y,
      tableWidth: halfW,
      margin: {left: 10},
      head: [['Type', 'Count']],
      body: typeData.length ? typeData : [['No data', '']],
      styles: {fontSize: 8, cellPadding: 2},
      headStyles: {fillColor: blue, textColor: 255, fontStyle:'bold'},
      alternateRowStyles: {fillColor: [248,248,246]},
      theme: 'grid',
    });

    // By technician
    doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(28,28,26);
    doc.text('By Technician', 14 + halfW, y);
    const techData = (report.by_technician || []).map(ts => [ts.name, String(ts.count)]);
    doc.autoTable({
      startY: y + 4,
      tableWidth: halfW,
      margin: {left: 14 + halfW},
      head: [['Technician', 'Issues']],
      body: techData.length ? techData : [['No data', '']],
      styles: {fontSize: 8, cellPadding: 2},
      headStyles: {fillColor: blue, textColor: 255, fontStyle:'bold'},
      alternateRowStyles: {fillColor: [248,248,246]},
      theme: 'grid',
    });

    y = Math.max(doc.lastAutoTable.finalY, y + 30) + 8;

    // ── Apartment Issues ──
    if (report.apt_issues?.length > 0) {
      if (y > 230) { doc.addPage(); y = 15; }
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(28,28,26);
      doc.text(`Apartment Issues (${report.apt_issues.length})`, 10, y); y += 4;
      doc.autoTable({
        startY: y,
        margin: {left: 10, right: 10},
        head: [['Apt.', 'Type', 'Problem', 'Resolution', 'Time', 'Status', 'Technician']],
        body: report.apt_issues.map(i => [
          i.location, i.type, problemText(i),
          i.resolution || '—',
          `${i.time_minutes}m`, i.status, i.logged_by_name,
        ]),
        styles: {fontSize: 7.5, cellPadding: 2, overflow: 'linebreak'},
        headStyles: {fillColor: blue, textColor: 255, fontStyle:'bold'},
        columnStyles: {
          0: {cellWidth: 14}, 1: {cellWidth: 18}, 2: {cellWidth: 38},
          3: {cellWidth: 44}, 4: {cellWidth: 12}, 5: {cellWidth: 16}, 6: {cellWidth: 22},
        },
        alternateRowStyles: {fillColor: [248,248,246]},
        theme: 'grid',
        ...withFalsePositiveMarks(report.apt_issues, 2, statusColor),
      });
      y = doc.lastAutoTable.finalY + 8;
    }

    // ── Department Issues ──
    if (report.dept_issues?.length > 0) {
      if (y > 230) { doc.addPage(); y = 15; }
      doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(28,28,26);
      doc.text(`Department Issues (${report.dept_issues.length})`, 10, y); y += 4;
      doc.autoTable({
        startY: y,
        margin: {left: 10, right: 10},
        head: [['Dept.', 'Type', 'Problem', 'Resolution', 'Time', 'Status', 'Technician']],
        body: report.dept_issues.map(i => [
          i.location, i.type, problemText(i),
          i.resolution || '—',
          `${i.time_minutes}m`, i.status, i.logged_by_name,
        ]),
        styles: {fontSize: 7.5, cellPadding: 2, overflow: 'linebreak'},
        headStyles: {fillColor: [29, 158, 117], textColor: 255, fontStyle:'bold'},
        columnStyles: {
          0: {cellWidth: 20}, 1: {cellWidth: 18}, 2: {cellWidth: 38},
          3: {cellWidth: 44}, 4: {cellWidth: 12}, 5: {cellWidth: 16}, 6: {cellWidth: 16},
        },
        alternateRowStyles: {fillColor: [248,248,246]},
        theme: 'grid',
        ...withFalsePositiveMarks(report.dept_issues, 2, statusColor),
      });
    }

    // ── Footer on every page ──
    const pages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFillColor(...lightGray);
      doc.rect(0, doc.internal.pageSize.getHeight() - 10, W, 10, 'F');
      doc.setFontSize(7); doc.setTextColor(...gray); doc.setFont('helvetica','normal');
      doc.text('LIRA — Llana IT Reporting & Alerts', 10, doc.internal.pageSize.getHeight() - 4);
      doc.text(`Page ${i} of ${pages}`, W - 10, doc.internal.pageSize.getHeight() - 4, {align:'right'});
    }

    doc.save(`LIRA-Daily-Report-${report.date}.pdf`);
  }

  const TYPE_COLORS_HEX = {
    Door:'#1769AA', Internet:'#1D9E75', Hardware:'#D88A18',
    TV:'#9D174D', AC:'#3730A3', Phone:'#854F0B', Other:'#4B5563',
  };

  const fpCount    = report ? (report.summary.false_positives || 0) : 0;
  const realCount  = report ? report.summary.total_issues - fpCount : 0;
  const fpRate     = report && report.summary.total_issues > 0 ? (fpCount / report.summary.total_issues * 100).toFixed(0) : '0';

  const summaryCards = report ? [
    {label:'Total issues',     value: report.summary.total_issues,  sub:'Apts + Departments',             color:'#1769AA'},
    {label:'Resolved',         value: report.summary.resolved,      sub:`${report.summary.resolution_rate.toFixed(0)}% rate`, color:'#2E8B57'},
    {label:'Pending',          value: report.summary.pending,       sub:'Still open',                     color:'#D88A18'},
    {label:'Avg. time',        value: report.summary.avg_minutes.toFixed(1)+'m', sub:'Per issue',         color:'#1D9E75'},
    {label:'Total time spent', value: report.summary.total_minutes+'m', sub:'All issues combined',        color:'#1769AA'},
    {label:'Fastest fix',      value: report.summary.fastest_minutes+'m', sub:'Quickest resolution',     color:'#2E8B57'},
    {label:'Slowest fix',      value: report.summary.slowest_minutes+'m', sub:'Longest resolution',      color:'#D88A18'},
    {label:'Apt. issues',      value: report.summary.apt_issues,    sub:'Apartment',                     color:'#1769AA'},
    {label:'Dept. issues',     value: report.summary.dept_issues,   sub:'Department',                    color:'#1D9E75'},
    {label:'False positives',  value: fpCount,                      sub:'Nothing was wrong',              color:'#D88A18'},
    {label:'False positive rate', value: fpRate+'%',                sub:'Of all issues',                  color:'#D88A18'},
    {label:'Real issues',      value: realCount,                    sub:'Something was wrong',            color:'#2E8B57'},
  ] : [];

  const maxType = report ? Math.max(...Object.values(report.by_type), 1) : 1;
  const maxTech = report ? Math.max(...(report.by_technician||[]).map(t=>t.count), 1) : 1;

  return (
    <div>
      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid var(--gray-200)',borderRadius:'var(--radius-md)',padding:'6px 12px'}}>
          {Ic.calendar}
          <input
            type="date" value={date} onChange={e=>setDate(e.target.value)}
            style={{border:'none',outline:'none',fontSize:13,fontFamily:'DM Sans,sans-serif',color:'var(--gray-900)',background:'transparent'}}
          />
        </div>
        <button className="btn btn-ghost" onClick={fetchReport} disabled={loading}>
          {loading ? '…' : 'Refresh'}
        </button>
        <button className="btn btn-primary" onClick={downloadPDF} disabled={!report || loading}
          style={{marginLeft:'auto'}}>
          {Ic.download} Download PDF
        </button>
      </div>

      {error && (
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,marginBottom:16}}>
          {error}
        </div>
      )}

      {loading && (
        <div style={{textAlign:'center',padding:'60px 0',color:'var(--gray-400)',fontSize:14}}>
          Loading report…
        </div>
      )}

      {report && !loading && (
        <>
          {/* Summary cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:22}}>
            {summaryCards.map(c=>(
              <div className="stat-card" key={c.label}>
                <div className="stat-label">{c.label}</div>
                <div className="stat-value" style={{color:c.color}}>{c.value}</div>
                <div className="stat-sub"><span className="stat-dot" style={{background:c.color}}></span>{c.sub}</div>
              </div>
            ))}
          </div>

          {/* Breakdowns */}
          <div className="bottom-grid" style={{marginBottom:22}}>
            <div className="mini-card">
              <div className="mini-card-title">Issues by type</div>
              {Object.keys(report.by_type).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No issues logged.</p>
                : Object.entries(report.by_type).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
                    <div className="bar-row" key={type}>
                      <div className="bar-label">
                        <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                        {type}
                      </div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
                      <div className="bar-count">{count}</div>
                    </div>
                  ))
              }
            </div>
            <div className="mini-card">
              <div className="mini-card-title">By technician</div>
              {(report.by_technician||[]).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No technicians.</p>
                : report.by_technician.map(ts=>(
                    <div className="bar-row" key={ts.user_id}>
                      <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxTech)*100}%`,background:'#1769AA'}}></div></div>
                      <div className="bar-count">{ts.count}</div>
                    </div>
                  ))
              }
            </div>
          </div>

          {/* Apt issues table */}
          {(report.apt_issues||[]).length > 0 && (
            <div className="table-card" style={{marginBottom:20}}>
              <div className="table-header">
                <span className="table-title">Apartment issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.apt_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Apt.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.apt_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.time_minutes}m</td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Dept issues table */}
          {(report.dept_issues||[]).length > 0 && (
            <div className="table-card">
              <div className="table-header">
                <span className="table-title">Department issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.dept_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Dept.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.dept_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.time_minutes}m</td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {report.summary.total_issues === 0 && (
            <div className="table-card">
              <div className="empty-state">
                {Ic.report}
                <p>No issues logged on {report.date}.</p>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ════════════════ PROFILE PAGE ════════════════ */
function ProfilePage({ currentUser, token, users, onSessionUpdate, onUsersUpdate, setToast, lang, onLangChange }) {
  const t = T[lang];
  const [myStats,  setMyStats]  = useState(null);
  const [myIssues, setMyIssues] = useState([]);
  const [section,  setSection]  = useState('identity');
  const [saving,   setSaving]   = useState(false);

  // identity form
  const [name,     setName]     = useState(currentUser.name);
  const [email,    setEmail]    = useState(currentUser.email);
  const [pw,       setPw]       = useState('');
  const [pwConf,   setPwConf]   = useState('');
  const [pwErr,    setPwErr]    = useState('');
  const [idErr,    setIdErr]    = useState('');

  // avatar
  const [avatarData, setAvatarData] = useState(currentUser.avatar_data || '');
  const fileRef = useRef();

  useEffect(() => {
    Promise.all([
      apiFetch('/profile/stats',  {token}),
      apiFetch('/profile/issues?limit=10', {token}),
    ]).then(([sRes, iRes]) => {
      setMyStats(sRes.stats);
      setMyIssues((iRes.issues || []).map(mapIssue));
    }).catch(() => {});
  }, [token]);

  async function saveIdentity() {
    setIdErr(''); setSaving(true);
    if (pw && pw !== pwConf) { setPwErr('Passwords do not match.'); setSaving(false); return; }
    try {
      const body = { name, email };
      if (pw) body.password = pw;
      const res = await apiFetch('/profile', {method:'PATCH', body, token});
      onSessionUpdate(res.user);
      setPw(''); setPwConf(''); setPwErr('');
      setToast('Profile updated');
    } catch(ex) { setIdErr(ex.message); }
    finally { setSaving(false); }
  }

  async function saveAvatar(data) {
    try {
      const res = await apiFetch('/profile', {method:'PATCH', body:{avatar_data: data}, token});
      setAvatarData(data);
      onSessionUpdate(res.user);
      setToast('Avatar updated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      // Resize using canvas
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 160;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width  - min) / 2;
        const sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        saveAvatar(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function saveLang(l) {
    onLangChange(l);
    try {
      await apiFetch('/profile', {method:'PATCH', body:{language: l}, token});
    } catch(ex) {}
  }

  async function changeRole(userId, newRole) {
    try {
      const res = await apiFetch(`/users/${userId}/role`, {method:'PATCH', body:{role: newRole}, token});
      onUsersUpdate(prev => prev.map(u => u.id === userId ? {...u, role: res.user.role} : u));
      setToast('Role updated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function toggleActive(userId, active) {
    try {
      const res = await apiFetch(`/users/${userId}/deactivate`, {method:'PATCH', body:{active}, token});
      onUsersUpdate(prev => prev.map(u => u.id === userId ? {...u, active: res.user.active} : u));
      setToast(active ? 'Account reactivated' : 'Account deactivated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  const sections = [
    {id:'identity',    label:'Identity'},
    {id:'avatar',      label:'Avatar'},
    {id:'preferences', label:'Preferences'},
    {id:'activity',    label:'My Activity'},
    ...(currentUser.role === 'manager' ? [{id:'team', label:'Team Management'}] : []),
  ];

  const statCards = myStats ? [
    {label:'Total issues',  value: myStats.total_issues, color:'#1769AA'},
    {label:'Resolved',      value: myStats.resolved,     color:'#2E8B57'},
    {label:'This week',     value: myStats.this_week,    color:'#D88A18'},
    {label:'Avg. time',     value: myStats.avg_minutes.toFixed(1)+'m', color:'#1D9E75'},
  ] : [];

  return (
    <div style={{maxWidth:720,margin:'0 auto'}}>

      {/* Profile header */}
      <div className="mini-card" style={{display:'flex',alignItems:'center',gap:20,marginBottom:20,padding:'20px 24px'}}>
        <div style={{position:'relative',flexShrink:0}}>
          {avatarData
            ? <img src={avatarData} style={{width:64,height:64,borderRadius:'50%',objectFit:'cover',border:'2px solid var(--gray-200)'}}/>
            : <Avatar name={currentUser.name} idx={currentUser.avatar_idx} size="lg" style={{width:64,height:64,fontSize:22}}/>
          }
          <button onClick={()=>fileRef.current.click()}
            style={{position:'absolute',bottom:0,right:0,width:22,height:22,borderRadius:'50%',
              background:'var(--blue)',border:'2px solid #fff',cursor:'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="white" strokeWidth="2"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>
          </button>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFileChange}/>
        </div>
        <div>
          <div style={{fontSize:18,fontWeight:600}}>{currentUser.name}</div>
          <div style={{fontSize:13,color:'var(--gray-400)',marginTop:2,display:'flex',alignItems:'center',gap:6}}>
            {currentUser.role==='manager' ? Ic.shield : Ic.tool}
            {currentUser.role==='manager' ? t.managerRole : t.techRole}
          </div>
          <div style={{fontSize:12,color:'var(--gray-400)',marginTop:2}}>{currentUser.email}</div>
        </div>
      </div>

      {/* Sub-nav */}
      <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid var(--gray-200)',paddingBottom:0}}>
        {sections.map(s=>(
          <button key={s.id} onClick={()=>setSection(s.id)}
            style={{padding:'8px 14px',border:'none',background:'none',cursor:'pointer',
              fontSize:13,fontWeight:500,fontFamily:'DM Sans,sans-serif',
              color: section===s.id ? 'var(--blue)' : 'var(--gray-600)',
              borderBottom: section===s.id ? '2px solid var(--blue)' : '2px solid transparent',
              marginBottom:-1}}>
            {s.label}
          </button>
        ))}
      </div>

      {/* ── Identity ── */}
      {section==='identity' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Personal information</div>
          {idErr && <div className="auth-error" style={{marginBottom:14}}>{idErr}</div>}
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="form-row">
              <div className="form-group">
                <label>Full name</label>
                <input className="form-control" value={name} onChange={e=>setName(e.target.value)}/>
              </div>
              <div className="form-group">
                <label>Email address</label>
                <input className="form-control" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
              </div>
            </div>
            <div style={{borderTop:'1px solid var(--gray-200)',paddingTop:14}}>
              <div style={{fontSize:13,fontWeight:600,color:'var(--gray-600)',marginBottom:12}}>Change password</div>
              {pwErr && <div style={{color:'var(--red)',fontSize:12,marginBottom:8}}>{pwErr}</div>}
              <div className="form-row">
                <div className="form-group">
                  <label>New password</label>
                  <input className="form-control" type="password" placeholder="Min. 6 characters" value={pw} onChange={e=>{setPw(e.target.value);setPwErr('');}}/>
                </div>
                <div className="form-group">
                  <label>Confirm password</label>
                  <input className="form-control" type="password" placeholder="Repeat new password" value={pwConf} onChange={e=>{setPwConf(e.target.value);setPwErr('');}}/>
                </div>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'flex-end'}}>
              <button className="btn btn-primary" onClick={saveIdentity} disabled={saving}>
                {Ic.check} {saving ? 'Saving…' : 'Save changes'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Avatar ── */}
      {section==='avatar' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Profile picture</div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20,padding:'20px 0'}}>
            {avatarData
              ? <img src={avatarData} style={{width:120,height:120,borderRadius:'50%',objectFit:'cover',border:'3px solid var(--gray-200)'}}/>
              : <div style={{width:120,height:120,borderRadius:'50%',background:'var(--blue-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,fontWeight:600,color:'var(--blue)'}}>
                  {initials(currentUser.name)}
                </div>
            }
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-primary" onClick={()=>fileRef.current.click()}>
                {Ic.upload} Upload photo
              </button>
              {avatarData && (
                <button className="btn btn-ghost" onClick={()=>saveAvatar('')}>
                  Remove photo
                </button>
              )}
            </div>
            <div style={{fontSize:12,color:'var(--gray-400)',textAlign:'center'}}>
              JPG, PNG or GIF. Max 2MB. Will be cropped to a square.
            </div>
          </div>
        </div>

function sysTone(value, warn, bad) {          // lower is better (usage %, latency ms)
  if (value == null) return 'gray';
  if (value >= bad) return 'red';
  if (value >= warn) return 'amber';
  return 'green';
}

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
}

function formatUptime(totalSeconds, t) {
  const d = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

// One of the four headline cards: an icon, a big value, and a usage gauge underneath.
function SysCard({ icon, label, tone, value, unit, gauge, sub, na }) {
  return (
    <div className="sys-card">
      <div className="sys-card-head">
        <span className="sys-card-label">{label}</span>
        <span className={`sys-icon tone-${tone}`}>{icon}</span>
      </div>
      <div className={`sys-value tone-${tone}`}>{value}{unit && <span className="sys-unit">{unit}</span>}</div>
      {gauge != null && (
        <div className="sys-gauge-track"><div className={`sys-gauge-fill tone-${tone}`} style={{width:`${Math.min(gauge,100)}%`}}/></div>
      )}
      {na ? <div className="sys-na">{na}</div> : sub && <div className="sys-sub">{sub}</div>}
    </div>
  );
}

// Server health: CPU, RAM, and round-trip latency to the server and the database.
// Refetches on a fixed 60s clock (see REFRESH_MS) for as long as this page stays open.
const SYS_REFRESH_MS = 60000;

function SystemStatusPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [data, setData] = useState(null);
  const [serverLatency, setServerLatency] = useState(null);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);
  const [secondsAgo, setSecondsAgo] = useState(0);
  const lastFetchedAt = useRef(null);

  const load = useCallback(async () => {
    const start = performance.now();
    try {
      const res = await apiFetch('/system/status', { token });
      setServerLatency(Math.round(performance.now() - start));
      setData(res.system);
      setErr('');
    } catch (ex) {
      setErr(ex.message);
    } finally {
      lastFetchedAt.current = Date.now();
      setSecondsAgo(0);
      setLoading(false);
    }
  }, [token]);

  useEffect(() => {
    load();
    const refresh = setInterval(load, SYS_REFRESH_MS);
    const tick = setInterval(() => {
      if (lastFetchedAt.current) setSecondsAgo(Math.round((Date.now() - lastFetchedAt.current) / 1000));
    }, 1000);
    return () => { clearInterval(refresh); clearInterval(tick); };
  }, [load]);

  if (loading) return <div className="empty-state">{Ic.server}<p>{t.sysRefreshing}</p></div>;

  const stale = !!err;
  const cpu = data?.cpu;
  const mem = data?.memory;
  const db = data?.database;
  const cpuTone = cpu?.available ? sysTone(cpu.percent, 60, 85) : 'gray';
  const memTone = mem?.system_wide ? sysTone(mem.percent, 70, 90) : 'gray';
  const srvTone = sysTone(serverLatency, 100, 300);
  const dbTone = db ? (db.reachable ? sysTone(db.latency_ms, 100, 300) : 'red') : 'gray';

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18, flexWrap:'wrap', gap:10}}>
        <p style={{fontSize:13, color:'var(--gray-400)', margin:0}}>{t.systemStatusSub}</p>
        <div className="sys-live">
          <span className={`sys-live-dot ${stale ? 'stale' : ''}`}/>
          {stale ? t.sysStale : (secondsAgo < 2 ? t.sysUpdatedJustNow : t.sysUpdatedAgo.replace('{n}', secondsAgo))}
          <span style={{opacity:0.6}}>· {t.sysAutoRefresh}</span>
        </div>
      </div>

      <div className="sys-grid">
        <SysCard icon={Ic.cpu} label={t.cpuUsage} tone={cpuTone}
          value={cpu?.available ? cpu.percent : '—'} unit={cpu?.available ? '%' : ''}
          gauge={cpu?.available ? cpu.percent : null}
          sub={cpu?.available ? `${cpu.cores} ${t.sysCores}` : null}
          na={!cpu?.available ? t.sysCpuUnavailable.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.server} label={t.ramUsage} tone={memTone}
          value={mem?.system_wide ? mem.percent : formatBytes(mem?.used_bytes)}
          unit={mem?.system_wide ? '%' : ''}
          gauge={mem?.system_wide ? mem.percent : null}
          sub={mem?.system_wide ? `${formatBytes(mem.used_bytes)} / ${formatBytes(mem.total_bytes)}` : null}
          na={!mem?.system_wide ? t.sysProcessOnly.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.activity} label={t.latencyServer} tone={srvTone}
          value={serverLatency ?? '—'} unit="ms"
          sub="Round trip from your browser"/>

        <SysCard icon={Ic.database} label={t.latencyDatabase} tone={dbTone}
          value={db?.reachable ? db.latency_ms : (db ? '—' : '—')} unit={db?.reachable ? 'ms' : ''}
          sub={db && !db.reachable ? null : (db ? t.dbConnectionsSub.replace('{inUse}',db.in_use).replace('{idle}',db.idle).replace('{max}',db.max_open_connections) : null)}
          na={db && !db.reachable ? t.dbUnreachable : null}/>
      </div>

      <div className="mini-card">
        <div className="mini-card-title">{t.systemStatus}</div>
        <div className="sys-detail-grid">
          <div className="sys-detail-item"><div className="sys-detail-label">{t.uptime}</div><div className="sys-detail-value">{data ? formatUptime(data.uptime_seconds, t) : '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goroutines}</div><div className="sys-detail-value">{data?.goroutines ?? '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.serverOs}</div><div className="sys-detail-value" style={{textTransform:'capitalize'}}>{data?.os || '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goVersion}</div><div className="sys-detail-value">{data?.go_version || '—'}</div></div>
        </div>
      </div>
    </div>
  );
}

function AdminPage({ token, issueTypes, onTypesUpdate, departments, onDepartmentsUpdate, connectaAgents, onConnectaAgentsUpdate, consumableItems, onConsumableItemsUpdate, settings, onSettingsUpdate, setToast }) {

  const t = T[lang];
  const [name, setName] = useState('');
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  const [deptName, setDeptName] = useState('');
  const [savingDept, setSavingDept] = useState(false);
  const [deptErr, setDeptErr] = useState('');

  const [agentName, setAgentName] = useState('');
  const [savingAgent, setSavingAgent] = useState(false);
  const [agentErr, setAgentErr] = useState('');

  const [ciName, setCiName] = useState('');
  const [ciIcon, setCiIcon] = useState('box');
  const [savingCi, setSavingCi] = useState(false);
  const [ciErr, setCiErr] = useState('');
  const [editingIconId, setEditingIconId] = useState(null);

  const [windowHours, setWindowHours] = useState(settings?.duplicate_window_hours ?? 24);
  const [savingSettings, setSavingSettings] = useState(false);
  useEffect(() => {
    if (settings) setWindowHours(settings.duplicate_window_hours);
  }, [settings]);

  async function saveSettings(e) {
    e.preventDefault();
    setSavingSettings(true);
    try {
      const res = await apiFetch('/settings', {method:'PATCH', body:{duplicate_window_hours: Number(windowHours)}, token});
      onSettingsUpdate(res.settings);
      setToast(t.settingsSaved);
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSavingSettings(false); }
  }

  async function addType(e) {
    e.preventDefault();
    const trimmed = name.trim();
    if (!trimmed) return;
    setSaving(true); setErr('');
    try {
      const res = await apiFetch('/issue-types', {method:'POST', body:{name: trimmed}, token});
      onTypesUpdate(prev => [...prev, res.issue_type].sort((a,b)=>a.name.localeCompare(b.name)));
      setName('');
      setToast(t.toastTypeAdded);
    } catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  async function removeType(id) {
    try {
      await apiFetch(`/issue-types/${id}`, {method:'DELETE', token});
      onTypesUpdate(prev => prev.filter(it => it.id !== id));
      setToast(t.toastTypeDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function updateTypeColor(id, hex) {
    try {
      const res = await apiFetch(`/issue-types/${id}/color`, {method:'PATCH', body:{color:hex}, token});
      onTypesUpdate(prev => prev.map(it => it.id===id ? res.issue_type : it));
      setToast(t.toastTypeColorUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addDept(e) {
    e.preventDefault();
    const trimmed = deptName.trim();
    if (!trimmed) return;
    setSavingDept(true); setDeptErr('');
    try {
      const res = await apiFetch('/departments', {method:'POST', body:{name: trimmed}, token});
      onDepartmentsUpdate(prev => [...prev, res.department].sort((a,b)=>a.name.localeCompare(b.name)));
      setDeptName('');
      setToast(t.toastDeptAdded);
    } catch(ex) { setDeptErr(ex.message); }
    finally { setSavingDept(false); }
  }

  async function removeDept(id) {
    try {
      await apiFetch(`/departments/${id}`, {method:'DELETE', token});
      onDepartmentsUpdate(prev => prev.filter(d => d.id !== id));
      setToast(t.toastDeptDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addAgent(e) {
    e.preventDefault();
    const trimmed = agentName.trim();
    if (!trimmed) return;
    setSavingAgent(true); setAgentErr('');
    try {
      const res = await apiFetch('/connecta-agents', {method:'POST', body:{name: trimmed}, token});
      onConnectaAgentsUpdate(prev => [...prev, res.connecta_agent].sort((a,b)=>a.name.localeCompare(b.name)));
      setAgentName('');
      setToast(t.toastAgentAdded);
    } catch(ex) { setAgentErr(ex.message); }
    finally { setSavingAgent(false); }
  }

  async function removeAgent(id) {
    try {
      await apiFetch(`/connecta-agents/${id}`, {method:'DELETE', token});
      onConnectaAgentsUpdate(prev => prev.filter(a => a.id !== id));
      setToast(t.toastAgentDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addConsumableItem(e) {
    e.preventDefault();
    const trimmed = ciName.trim();
    if (!trimmed) return;
    setSavingCi(true); setCiErr('');
    try {
      const res = await apiFetch('/consumable-items', {method:'POST', body:{name: trimmed, icon: ciIcon}, token});
      onConsumableItemsUpdate(prev => [...prev, res.consumable_item].sort((a,b)=>a.name.localeCompare(b.name)));
      setCiName(''); setCiIcon('box');
      setToast(t.toastConsumableAdded);
    } catch(ex) { setCiErr(ex.message); }
    finally { setSavingCi(false); }
  }

  async function removeConsumableItem(id) {
    try {
      await apiFetch(`/consumable-items/${id}`, {method:'DELETE', token});
      onConsumableItemsUpdate(prev => prev.filter(ci => ci.id !== id));
      if (editingIconId === id) setEditingIconId(null);
      setToast(t.toastConsumableDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function updateConsumableItemIcon(id, icon) {
    try {
      const res = await apiFetch(`/consumable-items/${id}/icon`, {method:'PATCH', body:{icon}, token});
      onConsumableItemsUpdate(prev => prev.map(ci => ci.id===id ? res.consumable_item : ci));
      setEditingIconId(null);
      setToast(t.toastConsumableIconUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  return (
    <div style={{maxWidth:1360}}>

      </div>

      <div className="admin-grid">
        <div>

                <label>{t.issueType}</label>
                <input className="form-control" placeholder={t.issueTypePlaceholder} value={name}
                  onChange={e=>setName(e.target.value)} maxLength={50}/>
              </div>
              <button type="submit" className="btn btn-primary" disabled={saving || !name.trim()} style={{marginBottom:1}}>
                {Ic.plus} {saving ? '…' : t.addIssueType}
              </button>
            </form>
          </div>

          <div className="table-card">
            <div className="table-header">
              <span className="table-title">{t.adminIssueTypes}</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{issueTypes.length}</span>
            </div>
            {issueTypes.length === 0
              ? <div className="empty-state">{Ic.list}<p>{t.noIssueTypes}</p></div>
              : <table>
                  <thead>
                    <tr><th>{t.type}</th><th></th></tr>
                  </thead>
                  <tbody>
                    {issueTypes.map(it=>(

                      <tr key={a.id}>
                        <td>{a.name}</td>
                        <td style={{textAlign:'right'}}>
                          <button className="icon-btn" title={t.removeAgent} onClick={()=>removeAgent(a.id)}>{Ic.trash}</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>

        <div>
          <div className="mini-card" style={{marginBottom:20}}>
            <div className="mini-card-title" style={{marginBottom:6}}>{t.adminConsumables}</div>
            <p style={{fontSize:13,color:'var(--gray-400)',margin:'0 0 16px'}}>{t.adminConsumablesSub}</p>
            {ciErr && <div className="auth-error" style={{marginBottom:14}}>{ciErr}</div>}
            <form onSubmit={addConsumableItem}>
              <div className="form-group">
                <label>{t.consumableName}</label>
                <input className="form-control" placeholder={t.consumableNamePlaceholder} value={ciName}
                  onChange={e=>setCiName(e.target.value)} maxLength={50}/>
              </div>
              <div className="form-group" style={{marginTop:14}}>
                <label>{t.consumableIconLabel}</label>
                <ConsumableIconGrid value={ciIcon} onChange={setCiIcon}/>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:12,marginTop:16}}>
                <div className="ci-preview">
                  <ConsumableIcon name={ciIcon} size={36}/>
                  <span style={{color: ciName.trim() ? 'var(--gray-900)' : 'var(--gray-400)'}}>{ciName.trim() || t.consumableNamePlaceholder}</span>
                </div>
                <button type="submit" className="btn btn-primary" disabled={savingCi || !ciName.trim()}>
                  {Ic.plus} {savingCi ? '…' : t.addConsumable}
                </button>
              </div>
            </form>
          </div>

          <div className="table-card">
            <div className="table-header">
              <span className="table-title">{t.adminConsumables}</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{consumableItems.length}</span>
            </div>
            {consumableItems.length === 0
              ? <div className="empty-state">{Ic.box}<p>{t.noConsumableItems}</p></div>
              : <table>
                  <thead>
                    <tr><th>{t.consumableName}</th><th></th></tr>
                  </thead>
                  <tbody>
                    {consumableItems.map(ci=>(
                      <React.Fragment key={ci.id}>
                        <tr>
                          <td>
                            <div style={{display:'flex',alignItems:'center',gap:10}}>
                              <button type="button" className="cicon-btn" title={t.changeIcon}
                                onClick={()=>setEditingIconId(editingIconId===ci.id ? null : ci.id)}>
                                <ConsumableIcon name={ci.icon} size={34}/>
                              </button>
                              <span style={{fontWeight:500}}>{ci.name}</span>
                            </div>
                          </td>
                          <td style={{textAlign:'right'}}>
                            <button className="icon-btn" title={t.removeConsumable} onClick={()=>removeConsumableItem(ci.id)}>{Ic.trash}</button>
                          </td>
                        </tr>
                        {editingIconId === ci.id && (
                          <tr className="icon-editor-row">
                            <td colSpan={2}>
                              <div className="icon-editor-label">{t.changeIcon}</div>
                              <ConsumableIconGrid value={ci.icon} onChange={icon=>updateConsumableItemIcon(ci.id, icon)}/>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════ ROOT APP ════════════════ */
function App() {
  const [lang,    setLang]    = useState(()=>loadLS('lira_lang','en'));
  const [theme,   setTheme]   = useState(()=>loadLS('lira_theme','light'));
  const [session, setSession] = useState(()=>loadLS('lira_session', null)); // {user, token}
  const [apt,     setApt]     = useState([]);
  const [dept,    setDept]    = useState([]);
  const [users,   setUsers]   = useState([]);
  const [issueTypes, setIssueTypes] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [connectaAgents, setConnectaAgents] = useState([]);
  const [consumableItems, setConsumableItems] = useState([]);
  const [settings, setSettings] = useState(null);
  const [alerts, setAlerts] = useState([]);
  const alertsPendingCount = useMemo(() => alerts.filter(a => a.status === 'pending').length, [alerts]);
  const typeColorMap = useMemo(
    () => Object.fromEntries(issueTypes.map(it => [it.name, it.color])),
    [issueTypes]
  );
  const [stats,   setStats]   = useState(null);
  const [page,    setPage]    = useState('dashboard');
  const [modal,   setModal]   = useState(null);
  const [editing, setEditing] = useState(null);
  const [toast,   setToast]   = useState(null);
  const [newIssueId, setNewIssueId] = useState(null);
  const [apiErr,  setApiErr]  = useState('');

  const t     = T[lang];
  const token = session?.token;
  const me    = session?.user;

  useEffect(()=>{
    if ((page === 'admin' || page === 'system') && me?.role !== 'manager') setPage('dashboard');
  }, [page, me]);

  useEffect(()=>{ saveLS('lira_lang', lang); }, [lang]);
  useEffect(()=>{
    saveLS('lira_theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);
  useEffect(()=>{ saveLS('lira_session', session); }, [session]);

  // Load all data when logged in
  useEffect(() => {
    if (!token) return;
    const todayStr = new Date().toISOString().slice(0,10);
    Promise.all([
      apiFetch('/issues?mode=apt', {token}),
      apiFetch('/issues?mode=dept', {token}),
      apiFetch('/users', {token}),
      apiFetch(`/stats?date=${todayStr}`, {token}),
      apiFetch('/issue-types', {token}),
      apiFetch('/departments', {token}),
      apiFetch('/connecta-agents', {token}),
      apiFetch('/settings', {token}),
      apiFetch('/alerts', {token}),
      apiFetch('/consumable-items', {token}),
    ]).then(([aptRes, deptRes, usersRes, statsRes, typesRes, deptsRes, agentsRes, settingsRes, alertsRes, consumableItemsRes]) => {
      setApt((aptRes.issues || []).map(mapIssue));
      setDept((deptRes.issues || []).map(mapIssue));
      setUsers(usersRes.users || []);
      setStats(statsRes.stats);
      setIssueTypes(typesRes.issue_types || []);
      setDepartments(deptsRes.departments || []);
      setConnectaAgents(agentsRes.connecta_agents || []);
      setSettings(settingsRes.settings);
      setAlerts(alertsRes.alerts || []);
      setConsumableItems(consumableItemsRes.consumable_items || []);
    }).catch(ex => {
      if (ex.message.includes('401') || ex.message.toLowerCase().includes('token')) {
        setSession(null); // token expired
      } else {
        setApiErr(ex.message);
      }
    });
  }, [token]);

  function login(user, token) {
    setSession({user, token});
    setPage('dashboard');
  }

  function logout() {
    setSession(null);
    setApt([]); setDept([]); setUsers([]); setStats(null); setIssueTypes([]); setDepartments([]); setConnectaAgents([]); setConsumableItems([]); setSettings(null); setAlerts([]);
  }

  // Called when profile updates come back from API
  function onSessionUpdate(updatedUser) {
    setSession(s => ({...s, user: updatedUser}));
    saveLS('lira_session', {...session, user: updatedUser});
  }

  async function addIssue(form, mode) {
    try {
      const body = {
        mode,
        location: mode==='apt' ? form.apt : form.dept,
        type:         form.type,
        problem:      form.problem,
        resolution:   form.resolution,
        time_minutes: Number(form.time),
        start_time:   form.startTime,
        end_time:     form.endTime,
        status:       form.status,
        reported_by_agent:  form.reportedByAgent,
        confirmed_by_agent: form.confirmedByAgent,
        false_positive: !!form.falsePositive,
        consumables: (form.consumables || []).map(c => ({item_id: c.itemId, quantity: c.quantity})),
      };
      const res = await apiFetch('/issues', {method:'POST', body, token});
      const issue = mapIssue(res.issue);
      if (mode==='apt') setApt(p=>[issue,...p]);
      else              setDept(p=>[issue,...p]);
      // Briefly flag the new row so IssuesTable can animate it in and
      // pulse its status indicator, then clear the flag once that's done.
      setNewIssueId(issue.id);
      setTimeout(() => setNewIssueId(id => id===issue.id ? null : id), 1200);
      // Refresh stats
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastLogged);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function saveEdit(form, mode, id) {
    try {
      const body = {
        mode,
        location:     mode==='apt' ? form.apt : form.dept,
        type:         form.type,
        problem:      form.problem,
        resolution:   form.resolution,
        time_minutes: Number(form.time),
        start_time:   form.startTime,
        end_time:     form.endTime,
        status:       form.status,
        reported_by_agent:  form.reportedByAgent,
        confirmed_by_agent: form.confirmedByAgent,
        false_positive: !!form.falsePositive,
        consumables: (form.consumables || []).map(c => ({item_id: c.itemId, quantity: c.quantity})),
      };
      const res = await apiFetch(`/issues/${id}`, {method:'PATCH', body, token});
      const updated = mapIssue(res.issue);
      const upd = list => list.map(i=>i.id===id ? updated : i);
      if (mode==='apt') setApt(upd); else setDept(upd);
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function delIssue(id, mode) {
    try {
      await apiFetch(`/issues/${id}`, {method:'DELETE', token});
      if (mode==='apt') setApt(p=>p.filter(i=>i.id!==id));
      else              setDept(p=>p.filter(i=>i.id!==id));
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  if (!session) return (
    <LangCtx.Provider value={lang}>
      <AuthScreen onLogin={login} lang={lang} onLangChange={setLang} theme={theme} onThemeChange={setTheme}/>
    </LangCtx.Provider>
  );

  const nav = [
    {id:'dashboard', label:t.dashboard,  icon:Ic.grid },
    {id:'apt',       label:t.aptIssues,  icon:Ic.list },
    {id:'dept',      label:t.deptIssues, icon:Ic.edit },
    {id:'history',   label:t.history,    icon:Ic.clock},
    {id:'alerts',    label:t.alerts,     icon:Ic.bell },
    {id:'analytics', label:t.analytics,  icon:Ic.trending},
    {id:'consumables', label:t.consumables, icon:Ic.box},
    {id:'team',      label:t.team,       icon:Ic.users},
    {id:'reports',   label:'Reports',    icon:Ic.report},
    ...(me.role === 'manager' ? [{id:'system', label:t.systemStatus, icon:Ic.server}] : []),
    ...(me.role === 'manager' ? [{id:'admin', label:t.admin, icon:Ic.shield}] : []),
    {id:'profile',   label:'Profile',    icon:Ic.person},
  ];

  return (
    <LangCtx.Provider value={lang}>
    <TypeColorCtx.Provider value={typeColorMap}>
      <div className="app">
        <aside className="sidebar">
          <div className="sidebar-logo">
            <div className="logo-mark">{Ic.logo}</div>
            <div><div className="logo-text">LIRA</div><div className="logo-sub">{t.appSub}</div></div>
          </div>
          <div className="sidebar-section">
            <div className="sidebar-section-label">{t.menu}</div>
            {nav.map(n=>(
              <button key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
                {n.id==='alerts' && alertsPendingCount > 0 ? (
                  <span className="nav-icon-wrap">
                    {n.icon}
                    <span className="nav-badge">{alertsPendingCount > 99 ? '99+' : alertsPendingCount}</span>
                  </span>
                ) : n.icon}
                <span>{n.label}</span>
              </button>
            ))}
          </div>
          <div className="sidebar-footer">
            <div className="sidebar-user" style={{cursor:'pointer'}} onClick={()=>setPage('profile')}>
              {me.avatar_data
                ? <img src={me.avatar_data} style={{width:30,height:30,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                : <Avatar name={me.name} idx={me.avatar_idx}/>
              }
              <div>
                <div className="sidebar-user-name">{me.name}</div>
                <div className="sidebar-user-role">{me.role==='manager' ? t.managerRole : t.techRole}</div>
              </div>
            </div>
            <button className="logout-btn" onClick={logout}>{Ic.logout} {t.signOut}</button>
          </div>
        </aside>

        <div className="main">
          <div className="topbar">
            <div className="topbar-left">
              <h1>{nav.find(n=>n.id===page)?.label || page.charAt(0).toUpperCase() + page.slice(1)}</h1>
              <p>{today(lang)}</p>
            </div>
            <div className="topbar-right">
              <ThemeToggle theme={theme} onChange={setTheme}/>
              <LangToggle lang={lang} onChange={setLang}/>
              {page !== 'profile' && page !== 'reports' && page !== 'admin' && <>
                <button className="btn btn-ghost" onClick={()=>setModal('dept')}>{Ic.plus} {t.deptIssueBtn}</button>
                <button className="btn btn-primary" onClick={()=>setModal('apt')}>{Ic.plus} {t.aptIssueBtn}</button>
              </>}
            </div>
          </div>

          {apiErr && (
            <div style={{margin:'16px 28px 0',background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
              {Ic.info} {apiErr} <button style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'var(--red)'}} onClick={()=>setApiErr('')}>{Ic.x}</button>
            </div>
          )}

          <div className="content">
            {page==='dashboard' && <Dashboard apt={apt} dept={dept} users={users} stats={stats}/>}
            {page==='apt'       && <IssuesTable issues={apt}  tableMode="apt"  currentUser={me} newIssueId={newIssueId} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='dept'      && <IssuesTable issues={dept} tableMode="dept" currentUser={me} newIssueId={newIssueId} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='history'   && <HistoryPage apt={apt} dept={dept} currentUser={me} onDelete={delIssue} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='alerts'    && <AlertsPage alerts={alerts} currentUser={me} token={token} onAlertsUpdate={setAlerts} setToast={setToast}/>}
            {page==='analytics' && <AnalyticsPage token={token} alertsPendingCount={alertsPendingCount}/>}
            {page==='consumables' && <ConsumablesPage token={token}/>}
            {page==='team'    && <TeamPage users={users} apt={apt} dept={dept} currentUser={me}/>}
            {page==='reports' && <ReportsPage token={token}/>}
            {page==='system' && me.role==='manager' && <SystemStatusPage token={token}/>}
            {page==='admin' && me.role==='manager' && <AdminPage
              token={token}
              issueTypes={issueTypes}
              onTypesUpdate={setIssueTypes}
              departments={departments}
              onDepartmentsUpdate={setDepartments}
              connectaAgents={connectaAgents}
              onConnectaAgentsUpdate={setConnectaAgents}
              consumableItems={consumableItems}
              onConsumableItemsUpdate={setConsumableItems}
              settings={settings}
              onSettingsUpdate={setSettings}
              setToast={setToast}
            />}
            {page==='profile' && <ProfilePage
              currentUser={me}
              token={token}
              users={users}
              onSessionUpdate={onSessionUpdate}
              onUsersUpdate={setUsers}
              setToast={setToast}
              lang={lang}
              onLangChange={setLang}
            />}
          </div>
        </div>

        {modal && (
          <IssueModal issueMode={modal} currentUser={me} issueTypes={issueTypes} departments={departments} connectaAgents={connectaAgents} consumableItems={consumableItems} token={token} onClose={()=>setModal(null)} onSave={form=>addIssue(form,modal)}/>
        )}
        {editing && (
          <IssueModal issueMode={editing.mode} editIssue={editing.issue} currentUser={me} issueTypes={issueTypes} departments={departments} connectaAgents={connectaAgents} consumableItems={consumableItems} token={token}
            onClose={()=>setEditing(null)} onSave={form=>saveEdit(form,editing.mode,editing.issue.id)}/>
        )}
        {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>
    </TypeColorCtx.Provider>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
