   .btn-primary and .rota-cell.is-away. */

.roster-section {
  display: flex; align-items: baseline; gap: 8px;
  margin: 16px 0 6px;
  font-size: 10px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--gray-400);
}
/* The count sits beside the heading rather than in SetGroup's own badge, because the
   badge belongs to the collapsed group header and this number changes with every tick --
   a count that moved while the header is off-screen would be a count nobody saw change.
   Tabular figures so a row of them lines up as they tick. */
.roster-count { margin-left: auto; font-family: 'DM Mono', monospace; letter-spacing: 0; }

.roster-list { display: flex; flex-direction: column; }
/* The rule under the first section, so the two halves read as two halves. --gray-200,
   the same separator the picker's absence split uses. */
.roster-list + .roster-section { border-top: 1px solid var(--gray-200); }

.roster-row {
  /* Still positioned: the drop indicator and the moved-row flash both need a containing
     block. The HIDDEN INPUT does not -- that moved to .roster-pick below. */
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 6px; border-radius: var(--radius-md);
  /* default, not pointer: the row now carries a grip and two arrow buttons that are
     their own targets, so the pointer cursor moved onto .roster-pick, which is the part
     that actually toggles. A pointer cursor across the arrows would be a lie about what
     a click does. */
  cursor: default;
}
.roster-row:hover { background: var(--gray-100); }
html.dark .roster-row:hover { background: var(--gray-200); }

/* opacity 0 rather than display:none, so the input stays focusable and keeps its native
   checkbox semantics -- a screen reader announces "checkbox, checked" without a word of
   ARIA from us, and that is the whole accessibility story of this control. */
.roster-box {
  position: absolute; inset: 0; width: 100%; height: 100%;
  margin: 0; opacity: 0; cursor: pointer;
}
/* :focus-within, not :focus-visible on the input: a zero-opacity input cannot draw a ring
   of its own. .rota-abs-kind and .rota-tint already do exactly this.
   The selector is .roster-pick rather than .roster-row because the row is no longer the
   thing the checkbox lives in -- the arrows and the grip are siblings of the label now,
   and a ring around a row that contains three other controls says "this whole strip is
   the checkbox", which stopped being true when they arrived. */
.roster-pick:focus-within { outline: 2px solid var(--blue); outline-offset: -2px; }

.roster-tick {
  flex: 0 0 auto;
  width: 20px; height: 20px; border-radius: var(--radius-sm);
  /* --gray-400, not --gray-300. The lighter token is the right hairline for a border
     around a filled cell and the wrong one for the single control that tells you a
     checkbox is there: measured at 1.42:1 light and 1.58:1 dark against a 3:1 floor
     for a non-text indicator, so the box was invisible until the pointer landed on it.
     --gray-400 measures 5.5:1 and 5.33:1 on this same row. */
  border: 1.5px solid var(--gray-400); background: var(--gray-50);
  display: flex; align-items: center; justify-content: center;
  /* Two inks on one fill, because --blue INVERTS between themes. White is right on the
     dark blue (5.77:1) and unreadable on the pale one (2.37:1, measured) -- the same
     trap as the run-count pill and the range multiplier, and written here from the
     pattern rather than measured, so it got wrong a third time. --gray-700 resolves to
     the same dark ink in BOTH themes, which is why one dark rule covers it. */
  color: #FFFFFF;
}
html.dark .roster-tick { color: var(--gray-700); }
.roster-tick svg { width: 13px; height: 13px; }
.roster-box:checked ~ .roster-tick { background: var(--blue); border-color: var(--blue); }
/* Checked, the border is the fill, so it is not a separate contrast question -- but the
   FOCUS ring still has to clear 3:1 against whatever it lands on. */
.roster-pick:focus-within .roster-tick { border-color: var(--blue); }

/* min-width: 0 so a long name TRUNCATES instead of pushing the badges off the row --
   the .set-group-label failure verbatim, and a 34-character Portuguese name will hit it.
   flex-shrink: 0 on the pill instead, so the count stays whole while the name gives. */
.roster-id { flex: 1 1 auto; min-width: 0; }
.roster-name {
  display: block; font-size: 13.5px; font-weight: 500; color: var(--gray-900);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* A DEACTIVATED ACCOUNT, not an excluded person. Dimmed and badged, never hidden, and
   never the reason the row is in the second section -- the two are orthogonal and this
   stylesheet keeps them orthogonal. Same t.inactive string the Team page shows. */
.roster-row.is-inactive .roster-name { color: var(--gray-600); font-weight: 400; }
.roster-inactive, .roster-role {
  display: inline-block; margin: 3px 5px 0 0; border-radius: 10px;
  font-size: 10px; font-weight: 600; padding: 2px 7px;
  background: var(--gray-100); color: var(--gray-600);
}
html.dark .roster-inactive,
html.dark .roster-role { background: var(--gray-200); color: var(--gray-600); }

/* The kept-shifts pill IS .rota-free, so it needs no rule -- only this much, so it
   survives a long name at 380px while the name truncates instead. */
.roster-row .rota-free, .roster-offlist-row .rota-free { flex-shrink: 0; margin-top: 0; }

/* The confirmation list. Same three class names as .confirm-modal's body; only the list
   is new. */
.roster-offlist {
  list-style: none; margin: 10px 0 0; padding: 0;
  max-height: 210px; overflow-y: auto;
}
.roster-offlist-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 4px; border-bottom: 1px solid var(--gray-200);
}
.roster-offlist-row:last-child { border-bottom: 0; }
.roster-offlist-name {
  flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 500; color: var(--gray-900);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* -- Rota ordering ------------------------------------------------------------
   Three things this block is opinionated about.

   1. NO MOTION, AND THEREFORE NO prefers-reduced-motion RULE. The rows jump, and the
      moved row's background is set instantly and cleared by a timer. There is nothing
      here to reduce. The rule is absent on purpose and this sentence is here so the
      next person looking for it finds a reason rather than an oversight.

   2. --blue INVERTS between themes, so every --blue/--blue-light pairing below is
      correct in both with no dark override. Nothing here pairs a hue with a grey
      SURFACE, which is the trap that inversion exists to warn about.

   3. The rank is INK, not a chip. .roster-tick is already the only bordered box in the
      row, and a second one 8px to its left turns the row's left edge into two competing
      affordances while the numeral starts reading as a control. A number is
      information; a box is a target. */

/* The ordinal. Same family as .roster-count so the card has ONE set of numerals.
   --gray-400 measures 5.5:1 light and 5.33:1 dark on this row -- the figure the tick's
   border was measured against -- so it clears 4.5:1 for text in both themes and needs
   no dark rule of its own. */
.roster-rank {
  flex: 0 0 auto; min-width: 22px; text-align: center;
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 600;
  letter-spacing: 0; font-variant-numeric: tabular-nums;
  color: var(--gray-400);
}
/* min-width and not width, deliberately: one-digit and two-digit rows are BOTH 22px, so
   the gutter stays aligned while somebody is moved between them. A hypothetical
   three-digit row at 100+ people grows the box by about 6px rather than clipping. The
   cap is 200 and the real ceiling is a hotel's headcount, so that is not a design
   problem worth solving -- but a min-width solves it for free anyway. */

/* The grip. Ic.brackets, sized DOWN from .icon-btn's 14px: it was drawn for an 11px
   grid cell and at 14px it closes up into a filled blob. */
.roster-grip {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 26px; border: none; border-radius: var(--radius-sm);
  background: none; color: var(--gray-400); cursor: grab;
  /* touch-action, not a passive event handler: without it a touch drag is a page scroll
     and onPointerMove never fires at all, which is why the grip is pointer-only below. */
  touch-action: none;
}
.roster-grip:hover { background: var(--gray-100); color: var(--gray-600); }
html.dark .roster-grip:hover { background: var(--gray-200); color: var(--gray-600); }
.roster-grip svg { width: 12px; height: 12px; pointer-events: none; }
.roster-row.is-dragging .roster-grip { cursor: grabbing; color: var(--blue); }

/* The pickable region. It is a label now rather than the row, which is what puts the
   arrows outside the label's activation behaviour -- a button inside a label fires the
   label on Space and Enter, which would toggle MEMBERSHIP from a REORDER button.

   position: relative so .roster-box's inset: 0 resolves HERE rather than against the
   whole row. That is a correctness fix, not tidiness: the invisible checkbox covers the
   area it is placed in, and left on the row it would sit on top of the grip and both
   arrows, swallowing clicks aimed at them. */
.roster-pick {
  position: relative;
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
}

.roster-moves { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }
/* Rotated rather than mirrored, so the chevron points the way the person travels -- the
   same reasoning .rota-week-prev and .set-group-chev give. */
.roster-move.is-up svg   { transform: rotate(-90deg); }
.roster-move.is-down svg { transform: rotate(90deg); }
.roster-move:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* DIMMED, NOT REMOVED, so the two-arrow block keeps a constant width and the gutter
   does not jog every time somebody reaches the top. 1.4.3 exempts inactive controls
   from the contrast minimum, which is what makes .25 legal here -- and that is the
   difference between this and .roster-tick's --gray-300, which was a real bug. */
.roster-move:disabled { opacity: 0.25; cursor: default; }

/* Drag states. Background and opacity only -- no transform anywhere, so nothing reflows
   and nothing animates. */
.roster-row.is-dragging { background: var(--blue-light); }
.roster-row.is-dragging .roster-tick,
.roster-row.is-dragging .roster-name,
.roster-row.is-dragging .roster-rank { opacity: .5; }
html.dark .roster-row.is-dragging { background: var(--gray-200); }

/* The insertion point, drawn OUTSIDE the box with a negative spread so it costs zero
   layout. An inset ring would have had to out-shout the hover fill and the focus ring
   these rows already carry, and the point of an insertion line is that it is a line. */
.roster-row.drop-before { box-shadow: 0 -2px 0 -1px var(--blue); }
.roster-row.drop-after  { box-shadow: 0  2px 0 -1px var(--blue); }

/* The flash after a move committed by arrow, key or drop. Set by the handler, cleared by
   a timer -- no transition, so reduced-motion behaviour is identical by construction. */
.roster-row.is-moved { background: var(--blue-light); }
html.dark .roster-row.is-moved { background: var(--gray-200); }

/* .rota-note carries margin: 0 18px 14px because it was written for a .table-card,
   which pads its content by 18px. cat-members is level={1}, so .set-group--sub's inner
   padding is 0 0 18px and the note already sits 18px right of the section headings it
   belongs to. Zeroed HERE rather than in .rota-note, whose margins are correct
   everywhere else in the file. */
.roster .rota-note { margin-left: 0; margin-right: 0; }

/* The two-line dirty sentence. */
.roster-dirty { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* Coarse pointers. The grip GOES -- a finger cannot aim at an 18px strip, and the drag
   threshold it needs would turn every scroll into a reorder -- and the arrows take the
   size the rota's own edit cells take, for the same reason: on touch these are the
   primary targets of this card, so the settings card and the rota grid agree about what
   a finger-sized control is. */
@media (hover: none), (pointer: coarse) {
  .roster-grip { display: none; }
  .roster-move { width: 44px; height: 44px; }
  .roster-move svg { width: 16px; height: 16px; }
  .roster-moves { gap: 4px; }
  .roster-row { min-height: 44px; }
}

/* ── Dashboard: "who is on now" and "needs attention" ──
   Two bands above the bar charts, in .mini-card so they inherit the dark surface and
   border from the existing override at 2665 and need NO override of their own. That is
   the whole reason they are not a new surface class: a new surface is the one way this
   block could acquire a dark rule, and a block made of tokens needs none. */

.now-band { margin-bottom: 20px; }
.now-band-head {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.now-band-head .mini-card-title { margin-bottom: 0; }
.now-band-head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.now-group + .now-group { margin-top: 14px; }
.now-group-head {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gray-400);
}
.now-group-count { font-family: 'DM Mono', monospace; letter-spacing: 0; color: var(--gray-400); }
.now-group-empty { font-size: 12.5px; color: var(--gray-600); }

/* The wrap is what makes this a dashboard rather than a roster: each group wraps
   INDEPENDENTLY, so the cells just fit fewer per row as the page narrows and no media
   query is needed. A vertical list has no such property and twenty people is 880px. */
.now-people { display: flex; flex-wrap: wrap; gap: 8px; }

/* ONE PERSON. A wash on the cell, a coloured LEFT EDGE, and the name in body ink.
   Colour on an edge rather than a ring because the rota page already uses an inset ring
   for selection (.rota-cell.is-sel), and reusing it for status makes the two
   indistinguishable. This is .rota-cell.is-night's arrangement, which is the app's
   established state channel. */
.rota-person {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  min-width: 200px; max-width: 280px; flex: 0 1 auto;
  padding: 9px 12px 9px 14px;
  border-radius: var(--radius-md);
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  overflow: hidden;
}
/* The edge, drawn with a pseudo-element so it costs no layout and cannot be rounded off
   by the container's overflow:hidden the way a border-left would be. */
.rota-person::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--gray-300);
}
.rota-person.is-now   { background: var(--green-light);  border-color: var(--green); }
.rota-person.is-now::before   { background: var(--green); }
.rota-person.is-soon  { background: var(--orange-light); border-color: var(--orange); }
.rota-person.is-soon::before  { background: var(--orange); }
.rota-person.is-done  { background: var(--gray-100); border-color: var(--gray-200); }
.rota-person.is-away  { background: var(--gray-50); border-color: var(--gray-200); }

/* Two lines, not one. "Halef Spencer · Morning until 16:00" lets a long Portuguese name
   push the time out of view, and the time is the decision-relevant half. */
.rota-person-id { flex: 1 1 auto; min-width: 0; }
.rota-person-name {
  display: block; font-size: 13px; font-weight: 500; color: var(--gray-900);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rota-person-when {
  display: block; font-size: 11.5px; color: var(--gray-600); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* DM Mono with tabular figures, so a row of times scans as a column while the names stay
   quiet. The app's established face for figures: .rota-legend-hours, .cpick-stock. */
.rota-person-time { font-family: 'DM Mono', monospace; color: var(--gray-900); }
/* On an overnight tail the end time is tomorrow's, so "until 06:00" alone would read as
   06:00 tonight. Reuses the rota page's own +1 mark verbatim. */
.rota-person-plus1 { color: var(--orange); font-family: 'DM Mono', monospace; font-size: 11px; }
.rota-person-mark { flex: 0 0 auto; display: inline-flex; }
.rota-person-mark svg { width: 14px; height: 14px; }
.rota-person.is-now .rota-person-mark  { color: var(--green); }
.rota-person.is-soon .rota-person-mark { color: var(--orange); }
.rota-person.is-done .rota-person-mark { color: var(--gray-300); }
.rota-person.is-away .rota-person-mark { color: var(--gray-400); }

/* A DEACTIVATED member keeps their row, muted, exactly as the rota grid renders them --
   dropping it would make a reactivated account reappear here, and would contradict the
   grid it sits beside. */
.rota-person.is-inactive .rota-person-name { color: var(--gray-600); font-weight: 400; }
.rota-person.is-inactive .rota-person-mark  { color: var(--gray-300); }

.now-note { margin-top: 12px; font-size: 11.5px; color: var(--gray-400); }

/* The "as of" line. Reuses .sys-live / .sys-live-dot VERBATIM -- same pulse, same .stale
   grey -- because that is already the app's liveness mark. What differs is the TEXT:
   System says "updated Ns ago", a live countdown. This says "as of 14:22", formatted
   once from the server's own instant, because the reader's question is WHEN THIS WAS
   TRUE rather than how old this is, and a one-second counter churning on a dashboard
   nobody is watching is exactly the cost useIdleSignOut exists to avoid. */
.now-asof { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--gray-400); }

/* Needs attention: a legend-style chip wrap rather than a table. Eleven table rows in a
   band sitting beside a three-row rota block makes the page ragged, and these items are
   four fields wide rather than a column. The flex declaration is copied from
   .rota-legend, which also carries a border-top and a --gray-50 background it should
   not bring along, hence a name of its own. */
.attn-chips { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.attn-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 11px; border-radius: var(--radius-md);
  background: var(--orange-light); border: 1px solid var(--orange);
}
.attn-chip.is-over { background: var(--red-light); border-color: var(--red-mid); }
.attn-chip.is-all { background: none; border-color: var(--gray-200); }
/* --orange, NOT --amber: the file already established at length that amber is too close
   to white to carry 13px text (2.54:1 on --amber-light), which is why .badge-soon
   exists. --orange on its own wash measures 4.88:1. */
.attn-name { font-size: 12.5px; font-weight: 500; color: var(--gray-900); }
.attn-stock { font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--orange); }
.attn-chip.is-over .attn-stock { color: var(--red); }
.attn-more { font-size: 12px; color: var(--gray-400); align-self: center; }
.attn-allgood { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--gray-600); }
.attn-allgood svg { width: 14px; height: 14px; color: var(--green); }

/* Status changes on a refresh. Reuses statusHighlightPulse -- already the app's "that
   landed" moment, used by .rota-cell.just-saved and .status-highlight -- rather than a
   fourth keyframe for "a figure changed". */
.now-person-changed { animation: statusHighlightPulse 700ms ease-out; }

@media (prefers-reduced-motion: reduce) {
  .now-person-changed { animation: none; }
}

/* The quiet link from the rota page into Settings. It sits with the week controls rather
   than near the grid, because it navigates rather than acts on what is below it. */
.rota-rosterlink {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: auto; padding: 6px 11px;
  border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  background: none; color: var(--gray-600);
  font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500;
  white-space: nowrap; cursor: pointer;
}
.rota-rosterlink:hover { border-color: var(--blue-mid); color: var(--blue); background: var(--blue-light); }
.rota-rosterlink svg { width: 14px; height: 14px; }
html.dark .rota-rosterlink { border-color: var(--gray-300); color: var(--gray-600); }
html.dark .rota-rosterlink:hover { color: var(--gray-900); }.rota-picker-foot {
  margin-top: 4px; padding: 6px 10px 4px; font-size: 11.5px; color: var(--gray-400);
  border-top: 1px solid var(--gray-100);
}

/* The dirty count and the save bar. The count sits in the header so the state of
   the edit is visible without scrolling; the actions sit under the grid, because
   .table-footer is already this file's home for "a button about the list as a
   whole rather than an action on one row" -- Save is exactly that -- and because
   DOM order puts them after the grid, so Tab out of the last cell lands on
   Cancel and then Save with no key handling at all. */
.rota-dirty {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  padding: 4px 11px; border-radius: 999px; white-space: nowrap;
  font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700;
  color: var(--blue); background: #fff; border: 1px solid var(--blue-mid);
}
html.dark .rota-dirty { background: var(--gray-50); }
.rota-savebar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 18px; text-align: left;
  background: var(--blue-light); border-top: 1px solid var(--blue-mid);
  font-size: 12.5px; color: var(--gray-600); line-height: 1.45;
}
.rota-savebar svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--blue); }
.rota-savebar-spacer { flex: 1 1 auto; }
/* .table-footer centres; this one does not, because it carries a sentence on the
   left and two buttons on the right. */
.rota-savebar .btn { font-size: 12px; padding: 6px 14px; }

/* A save that was REFUSED, told apart from the save bar's own hint.

   Inside the bar rather than in the page-level error banner, because the page did
   not fail -- the request did, and only because the week ended while the page was
   open. Putting it in the page banner would make a working page look broken.

   Red, and the one place on this page that is: everything else here is a quiet
   fact about the rota, and this is the single thing the manager got wrong by
   continuing. role="alert" so it is announced, since it replaces a toast that has
   already been read by nobody at a keyboard.

   No html.dark override: --red-light, --red-mid and --red are each defined twice
   already, so the tokens flip with the theme and a rule here would only be able to
   disagree with them. .rota-savebar above is the same and says the same. */
.rota-savebar-error {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 18px; text-align: left;
  background: var(--red-light); border-top: 1px solid var(--red-mid);
  font-size: 12.5px; font-weight: 500; color: var(--red); line-height: 1.45;
}

/* The attendance-sheet download. It sits last in .table-actions and owns the right
   edge with margin-left:auto, so the week controls stay grouped on the left with
   the mode switch rather than being shoved apart by a growing spacer. */
/* Only the first of the two owns the auto margin. On both, the first
   would grow into a spacer and shove the week controls apart. */
.rota-pdf-btn { margin-left: auto; }
.rota-pdf-btn + .btn-ghost { margin-left: 0; }
.rota-pdf-btn svg { transition: transform 0.15s ease; }
.rota-pdf-btn.spinning svg { animation: sysSpin 0.7s linear infinite; }
/* .btn-ghost has no :disabled rule, so a disabled ghost button otherwise keeps its
   hover background and hover colour and reads as live. Say so explicitly. */
.btn-ghost:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost:disabled:hover { background: none; color: var(--gray-600); }
/* Respect the preference. .sys-refresh-btn does not, which is an omission rather
   than a decision worth copying. */
@media (prefers-reduced-motion: reduce) {
  .rota-pdf-btn.spinning svg { animation: none; }
}

/* The PDF error strip. A toast alone would be wrong: a missing Chromium is
   permanent and will not fix itself while a 2.8s toast is still fading, and this
   notice does not dismiss for the same reason. The raw server wording -- which
   names a browser binary for an operator -- never reaches the DOM. */
.rota-notice {
  display: flex; align-items: center; gap: 10px;
  margin: 0 18px 14px; padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--red-light); color: var(--red);
  border-left: 3px solid var(--red);
  font-size: 13px;
}
.rota-notice svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Empty states. */
.rota-empty-head { margin: 0; font-size: 15px; font-weight: 600; color: var(--gray-900); }
.rota-empty-sub  { margin: 0; max-width: 46ch; font-size: 13px; color: var(--gray-600); line-height: 1.55; }
/* The one empty state on this page that carries an action, and only for a
   manager. It navigates to the Settings group rather than opening a second copy
   of the shift form -- the form has exactly one home and duplicating it would be
   the second of them in a fortnight. */
.rota-empty-cta { margin-top: 8px; }

/* The shift templates card, on the Settings page. Nothing here that .set-body,
   .set-form and .table-card do not already do. Only the rows needed three things
   the catalogs did not: two time fields side by side, an in-place edit holding
   three controls in one row, and the night marker surviving at 12.5px. */
.rota-settings-times { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rota-settings-times .form-control { width: 88px; padding: 6px 8px; text-align: center; }
.rota-settings-dash { font-size: 13px; color: var(--gray-400); }
/* Stated, not predicted. The hint appears only once the server has said
   overnight:true, so a disagreement between here and there cannot show a manager
   a warning that turns out to be wrong. */
.rota-settings-night {
  display: flex; align-items: center; gap: 7px; width: 100%;
  margin-top: 9px; padding: 6px 9px; border-radius: var(--radius-sm);
  border: 1px solid var(--orange); background: var(--orange-light);
  font-size: 12px; color: var(--gray-600);
}
.rota-settings-night svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--orange); }

/* -- Absences -----------------------------------------------------------------
   All four kinds share ONE wash, and that is the whole design. A tinted shift cell
   and an absence cell cannot be separated by colour at any wash strength -- the
   nearest of the six tint washes measures between 1.00:1 and 1.11:1 against
   --abs-wash, because a wash is a wash -- so what separates them is structural: a
   hatch, a 3px rule, a glyph and a word. Colour is left with the only job it can
   still do here, telling the four kinds apart from each other.

   Four different washes would imply four different SORTS of absence, which is a
   distinction no reader of a rota needs and which would collide with six shift tints
   in the same 42-cell grid.

   --gray-900 on --abs-wash measures 11.73:1 light and 13.03:1 dark, so the word in an
   absence cell is exactly as legible as a shift name. */
.rota-cell.is-away {
  position: relative; overflow: hidden; isolation: isolate;
  flex-direction: column; gap: 2px; padding: 4px 4px 3px;
  background: var(--abs-wash); border-color: var(--gray-300);
  color: var(--gray-900); font-size: 10.5px; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase; line-height: 1.15;
}
/* The hatch. This is the application's first use of a texture and it is the right
   one: it survives greyscale printing, it survives every colour-vision deficiency,
   and it is what makes the cell look like a different KIND OF OBJECT rather than a
   differently-coloured shift. isolation:isolate above keeps it under the glyph and
   the word without a z-index. */
.rota-cell-hatch {
  position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(45deg,
    var(--gray-300) 0, var(--gray-300) 0.9px, transparent 0.9px, transparent 5px);
  opacity: .55;
}
.rota-cell-kind { position: relative; display: inline-flex; color: var(--abs-ink); }
.rota-cell-kind svg { width: 13px; height: 13px; }
.rota-cell-absword {
  position: relative; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The 3px rule goes on TOP, not as a left rail: the rail slot belongs to overnight
   and an absence is never an overnight shift. */
.rota-cell.is-away::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--abs-ink);
}
/* "And it carries on past Sunday." On the last covered cell of the week, and only
   when the run really does continue -- a run ending on the Sunday has nothing to
   announce. This is the one piece of absence state that CANNOT come out of a per-week
   array of cells, and it is why the server sends ranges. */
.rota-cell-then {
  position: absolute; right: 2px; bottom: 2px;
  color: var(--gray-400); display: inline-flex;
}
.rota-cell-then svg { width: 10px; height: 10px; }
/* An absent day is not hoverable-to-blue: blue on a cell means "you can change
   this", and the honest answer is "not until the absence is removed". */
.rota-cell.is-away.is-editable:hover { border-color: var(--blue-mid); background: var(--abs-wash); color: var(--gray-900); }
.rota-cell.is-away.is-editable:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* A leaver's row is dimmed. An absence is a fact about the CALENDAR, not about the
   account, so the hatch and the rule are NOT dimmed with it -- a greyed-out hatch is
   a hatch you cannot count, and counting absent people is the thing a manager does
   with this feature. */
.rota-table tr.rota-inactive .rota-cell.is-away { opacity: .72; }
.rota-table tr.rota-inactive .rota-cell.is-away .rota-cell-hatch,
.rota-table tr.rota-inactive .rota-cell.is-away::after { opacity: 1; }

/* The legend's second group. */
.rota-legend-sep { width: 1px; align-self: stretch; margin: 0 4px; background: var(--gray-200); }
.rota-legend-abs {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 6px; border-radius: var(--radius-sm);
  border: 1px solid var(--gray-300); background: var(--abs-wash);
}
.rota-legend-abs-ic { display: inline-flex; color: var(--abs-ink); }
.rota-legend-abs-ic svg { width: 12px; height: 12px; }
.rota-legend-abs-name { font-size: 12px; font-weight: 600; color: var(--gray-900); white-space: nowrap; }
.rota-legend-abs-count { font-size: 11px; color: var(--gray-600); white-space: nowrap; }

/* "Not on this rota" and "away all week" both used to be the same pill, and they are
   materially different statements: one says nobody put this person on anything, the
   other says they are on the rota and will be back. */
.rota-free.is-away { gap: 4px; }
.rota-free.is-away svg { width: 10px; height: 10px; flex: 0 0 auto; }
/* The run's size, in the name cell. A pill rather than plain text, because it is a
   transient state and the row's permanent two lines -- name and hours -- must not be
   pushed around by it appearing and disappearing.

   Two inks on one fill, because --blue INVERTS between themes: rgb(23,105,170) light,
   rgb(95,176,232) dark. White is right on the first (5.77:1) and unreadable on the
   second (2.37:1, measured, against a 4.5:1 floor for 10.5px text). --gray-700 is the
   one token that is the same dark ink in both themes, but on its own it only reaches
   2.85:1 in light -- so it is the dark-theme half, not a universal answer.

   Scoped to html.dark rather than given a token pair, because this is plain CSS with
   no inline declaration for a theme selector to lose to. */
.rota-sel-count {
  display: inline-flex; margin-top: 4px; padding: 1px 7px; border-radius: 999px;
  font-size: 10.5px; font-weight: 700; white-space: nowrap;
  background: var(--blue); color: #FFFFFF;
}
html.dark .rota-sel-count { color: var(--gray-700); }
/* The multiplier on a picker's options. NOT margin-left:auto: the panel overflows its
   scroll container on a right-hand column, and the right edge is what gets clipped.

   --blue is right on the panel's own background (5.77:1 light, 6.98:1 dark) and wrong
   on a wash: measured at 4.47:1 on Night's indigo, just under the 4.5:1 floor for
   11px text. So the tint gets its own ink, scoped rather than global -- the same
   failure the legend count had, with the same answer.

   --gray-700 because it resolves to the same dark ink in BOTH themes, so one
   declaration covers light and dark. Only .is-tinted needs it: the absence options
   carry no badge, being per-day rather than per-cell. */
.rota-option-multi {
  flex-shrink: 0; font-family: 'DM Mono', monospace; font-size: 11px;
  font-weight: 700; color: var(--blue); white-space: nowrap;
}
.rota-option.is-tinted .rota-option-multi { color: var(--gray-700); }
/* The hours actually worked, with the difference named on its own line rather than
   two numbers struck through each other in one column. */
.rota-away-hours {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 3px;
  padding: 1px 7px; border-radius: 999px;
  font-family: 'DM Mono', monospace; font-size: 10.5px; font-weight: 600;
  white-space: nowrap; color: var(--gray-600);
  background: var(--gray-100); border: 1px solid var(--gray-200);
}
.rota-away-hours svg { width: 10px; height: 10px; flex: 0 0 auto; }
html.dark .rota-away-hours { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }

/* The editor. */
.rota-abs-kinds { border: 0; margin: 0; padding: 0; }
.rota-abs-kinds legend { padding: 0; margin-bottom: 6px; }
.rota-abs-kindgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rota-abs-kind {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 4px 7px; border-radius: var(--radius-md); cursor: pointer;
  border: 1px solid var(--gray-200); background: var(--gray-100);
}
.rota-abs-kind input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.rota-abs-kind:hover { border-color: var(--blue-mid); }
.rota-abs-kind.is-on { border-color: var(--blue); background: var(--blue-light); box-shadow: 0 0 0 1px var(--blue); }
.rota-abs-kind:focus-within { outline: 2px solid var(--blue); outline-offset: 1px; }
.rota-abs-kind-ic { display: inline-flex; color: var(--abs-ink); }
.rota-abs-kind-ic svg { width: 17px; height: 17px; }
.rota-abs-kind-name { font-size: 11px; font-weight: 600; color: var(--gray-900); text-align: center; line-height: 1.2; }
.rota-abs-who { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--gray-900); }
.rota-abs-who svg { width: 16px; height: 16px; color: var(--gray-400); }
.rota-abs-span { font-size: 12px; color: var(--gray-600); }
.rota-abs-privacy {
  display: flex; gap: 8px; margin-top: 7px; padding: 8px 10px;
  border-radius: var(--radius-sm); background: var(--gray-100);
  border: 1px solid var(--gray-200); font-size: 11.5px; line-height: 1.45; color: var(--gray-600);
}
.rota-abs-privacy svg { width: 13px; height: 13px; flex: 0 0 auto; color: var(--gray-400); margin-top: 1px; }
/* .form-control sets padding and font but no width, and a textarea with no UA
   sizing in a flex column collapses to about 20px. */
.rota-abs-note { min-height: 68px; resize: vertical; width: 100%; font-family: 'DM Sans', sans-serif; }
.rota-abs-footer { justify-content: space-between; }
.rota-abs-left { display: flex; gap: 8px; }
.rota-abs-locked {
  margin-top: 4px; padding: 6px 10px 4px; font-size: 11.5px; line-height: 1.45;
  color: var(--gray-600); border-top: 1px solid var(--gray-100);
}

/* -- Shift tints --------------------------------------------------------------
   One rule this whole block is built on:

   THE RAIL SLOT BELONGS TO OVERNIGHT. THE WASH SLOT BELONGS TO THE TINT.

   --orange appears on the rota as a 3px left edge and nowhere else, and it means
   one thing. A tint is therefore never a rail: it is a background wash, which is why
   a manager who picks orange in the native picker gets an orange WASH that cannot be
   mistaken for the overnight marker. A shift that is both tinted and overnight keeps
   its orange rail and shows the tint as the wash alone, so there are never two bars
   to read as one six-pixel bar.

   Nothing here joins the blanket dark surface block at the end of this stylesheet.
   That block sets background on CARDS; .rota-cell is a button inside a td, and
   html.dark tbody tr:hover td paints the td behind it, which is why an untinted
   cell has never needed a dark override and a tinted one does not either. */

/* Positioned, because the tint dot and the drag affordance are absolutely placed
   inside a cell. Safe: .rota-cell had no positioned children before, so nothing in
   the file can be displaced by it. */
.rota-cell { position: relative; }
.rota-settings-hours { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

/* --tint-wash is emitted by tintStyle(). An untinted shift gets no inline style at
   all, so .rota-cell's own --gray-100 stands: "no colour" is guaranteed to look
   exactly as it did before the feature rather than being an approximation of it. */
.rota-cell.is-tinted { background: var(--tint-wash); }
html.dark .rota-cell.is-tinted { background: var(--tint-wash-dark); }
.rota-legend-item.is-tinted, .rota-option.is-tinted { background: var(--tint-wash); }
html.dark .rota-legend-item.is-tinted,
html.dark .rota-option.is-tinted { background: var(--tint-wash-dark); }

/* --tint-dot, never the raw hue: full strength against its own dark wash measured
   2.16:1 to 2.71:1, which a 10px marker cannot spend. It is a 3:1 non-text cue and
   it has to clear that on its own. */
.rota-tint-dot {
  width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
  background: var(--tint-dot);
}
html.dark .rota-tint-dot { background: var(--tint-dot-dark); }

/* The button in the Settings Hours cell. 20px rather than the 24px
   .color-swatch-input, because this one sits in a table cell with 6px of padding
   either side of it. */
.rota-tint-btn {
  width: 20px; height: 20px; flex: 0 0 auto; padding: 0; cursor: pointer;
  border-radius: 50%; background: none; color: var(--gray-400);
  display: inline-flex; align-items: center; justify-content: center;
  /* Two rings, and the outer one --gray-400 rather than --gray-200 on purpose: a
     mid-tone swatch measured against the dark card --gray-50 comes out between 2.56:1
     and 3.24:1, and four of the six presets are under 3:1. The ring is what makes the
     object visible at all, and --gray-400 gives 5.33:1 in dark and 5.50:1 in light. */
  box-shadow: 0 0 0 1px var(--gray-200), 0 0 0 2px var(--gray-400);
  transition: box-shadow .12s;
}
.rota-tint-btn.is-set { background: var(--tint-wash); color: var(--tint-ink); }
.rota-tint-btn:hover { box-shadow: 0 0 0 1px var(--gray-300), 0 0 0 2px var(--gray-600); }
.rota-tint-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.rota-tint-btn-ic { display: inline-flex; }
.rota-tint-btn-ic svg { width: 11px; height: 11px; }

/* The popover reuses .rota-picker-panel's geometry, box and z-index verbatim -- this
   class only widens it and lays out the tiles. Reusing the panel rather than making
   a second popover type is the rule RotaPicker states: one set of answers to "what
   does Escape do" and "what closes this on an outside click". */
.rota-tint-wrap { position: relative; display: inline-flex; }
.rota-tint-pop { min-width: 268px; max-width: 288px; }
.rota-tint-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 4px; }
.rota-tint {
  position: relative; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 4px 2px 3px; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent;
}
/* The native radio fills the tile, so the focus ring is the tile outline and the
   whole tile is the hit target. opacity 0 rather than display:none, so it stays in
   the accessibility tree and keeps the group's arrow-key traversal. */
.rota-tint input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.rota-tint.is-none { background: #fff; box-shadow: inset 0 0 0 1px var(--gray-200); color: var(--gray-400); }
html.dark .rota-tint.is-none { background: var(--gray-50); box-shadow: inset 0 0 0 1px var(--gray-300); color: var(--gray-600); }
.rota-tint:not(.is-none) { background: var(--tint-wash); color: #FFFFFF; }
html.dark .rota-tint:not(.is-none) { background: var(--tint-wash-dark); color: #FFFFFF; }
.rota-tint:hover { border-color: var(--blue-mid); }
.rota-tint.is-on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.rota-tint:focus-within { outline: 2px solid var(--blue); outline-offset: 1px; }
.rota-tint-ic { display: inline-flex; }
.rota-tint-ic svg { width: 13px; height: 13px; }
.rota-tint-cap {
  font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: var(--gray-600);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rota-tint.is-on .rota-tint-cap { color: var(--blue); }
/* The escape hatch, last and on its own bordered row, so it reads as a different
   kind of act from "pick one of these six". */
.rota-tint-custom {
  display: flex; align-items: center; gap: 9px; margin: 4px; padding: 7px 9px;
  border-top: 1px solid var(--gray-200); font-size: 12.5px; color: var(--gray-600);
}
.rota-tint-custom .color-swatch-input { width: 22px; height: 22px; }
.rota-settings-tint-hint { margin-top: 9px; font-size: 11.5px; line-height: 1.45; color: var(--gray-400); }

/* Print. The week navigation exists largely for this: the same standing pattern,
   printed with a different week's dates on it. The mode switch and the save bar
   are the two things that must not reach paper, and the pinned column has to let
   go or the sheet prints with every name on top of every other row. The day
   header repeats on each sheet, which is the whole reason a rota gets printed. */
@media print {
  .rota-modeswitch, .rota-savebar, .rota-readonly, .rota-week-btn { display: none !important; }
  .rota-table-wrap { overflow: visible; }
  .rota-table { min-width: 0; }
  .rota-table thead th.rota-name-head,
  .rota-table tbody th.rota-name-cell { position: static; box-shadow: none; }
  /* The edit panels are position:fixed, so they would print wherever they happened to
     be when the print dialog opened -- possibly off the sheet entirely, since the
     clamp keeps them inside the VIEWPORT rather than inside the page. */
  .rota-picker-panel { display: none !important; }
  .rota-table thead { display: table-header-group; }
}
.bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--gray-100); }
.bar-row:last-child { border-bottom: none; }
.bar-label { font-size: 13px; display: flex; align-items: center; gap: 7px; min-width: 90px; }
.bar-track { flex: 1; height: 6px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.bar-count { font-size: 13px; font-weight: 600; min-width: 20px; text-align: right; }

/* ── Team page ── */
/* The role icon is an inline <svg> with a viewBox and no width/height. Without
   a rule like this one it has no intrinsic size and flex stretches it to
   hundreds of pixels — and to a *different* size per icon, so manager and
   technician cards ended up different heights. Every other icon in the app is
   sized the same way; see .nav-item svg, .btn svg and friends. */
.team-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; min-width: 0; }
/* min-width:0 lets the name shrink inside the flex row so it can ellipsis
   instead of forcing the card wider than its grid track. */
.team-card-id { min-width: 0; }
.team-card-name {
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 7px; min-width: 0;
}
.team-card-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-card-role {
  font-size: 12px; color: var(--gray-400); margin-top: 2px;
  display: flex; align-items: center; gap: 5px;
}
.team-role-icon { display: flex; align-items: center; flex-shrink: 0; }
.team-role-icon svg { width: 13px; height: 13px; flex-shrink: 0; }
.team-card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.team-stat {
  background: var(--gray-50); border: 1px solid var(--gray-200);
  border-radius: var(--radius-md); padding: 10px 12px; min-width: 0;
}
.team-stat-label { font-size: 11px; color: var(--gray-400); margin-bottom: 3px; }
.team-stat-value { font-size: 18px; font-weight: 600; }
.team-you {
  background: var(--blue-light); color: var(--blue);
  font-size: 10px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
}
html.dark .team-you { background: var(--blue-light) !important; color: var(--blue) !important; }
/* A deactivated account cannot log in, so it is dimmed and labelled rather
   than presented like a working member of the team. */
.team-card-inactive { opacity: 0.6; }
.team-inactive-badge {
  background: var(--gray-100); color: var(--gray-400);
  font-size: 10px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
}

/* Switches the Team page between the member cards and the manager-only
   management table. */
.team-viewbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
.team-segmented {
  display: inline-flex; gap: 2px;
  background: var(--gray-100); border: 1px solid var(--gray-200);
  border-radius: var(--radius-md); padding: 3px;
}
.team-segmented button {
  border: none; background: none; cursor: pointer;
  padding: 6px 14px; border-radius: 6px;
  font: 500 13px 'DM Sans', sans-serif; color: var(--gray-600);
  display: flex; align-items: center; gap: 6px;
}
.team-segmented button:hover { color: var(--gray-900); }
.team-segmented button.active {
  background: #fff; color: var(--blue);
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
html.dark .team-segmented button.active { background: var(--gray-50); }
/* Sized here rather than left to the flex default, which stretches an unsized
   svg to hundreds of pixels. */
.team-segmented button svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Weekly consumables report ────────────────────────────────────────── */

.week-nav { display: flex; align-items: center; gap: 8px; }
.week-nav .label {
  font-size: 13px; color: var(--gray-600); font-weight: 500;
  min-width: 150px; text-align: center;
}
.week-nav button {
  border: 1px solid var(--gray-200); background: #fff; cursor: pointer;
  border-radius: var(--radius-md); padding: 6px 10px;
  display: flex; align-items: center; color: var(--gray-600);
}
.week-nav button:hover:not(:disabled) { background: var(--gray-100); color: var(--gray-900); }
.week-nav button:disabled { opacity: 0.4; cursor: default; }
.week-nav button svg { width: 14px; height: 14px; flex-shrink: 0; }
html.dark .week-nav button { background: var(--gray-50); }

/* Per-day usage. Bars grow from a fixed baseline and are floored so a day with
   a single unit is still visible. */
.daychart {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 10px; align-items: end; height: 130px;
}
.daycol { display: flex; flex-direction: column; align-items: center; height: 100%; }
.daycol .qty { font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
.daycol .track {
  flex: 1; width: 100%; display: flex; align-items: flex-end;
  background: var(--gray-100); border-radius: var(--radius-sm); overflow: hidden;
}
.daycol .fill { width: 100%; background: var(--blue); border-radius: var(--radius-sm); min-height: 2px; }
.daycol.empty .fill { background: var(--gray-300); }
.daycol .dow { font-size: 10px; color: var(--gray-400); margin-top: 6px; text-transform: uppercase; }
.daycol .dom { font-size: 10px; color: var(--gray-300); }

.week-breakdowns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.week-bar-row { display: grid; grid-template-columns: 1fr 90px 34px; align-items: center; gap: 8px; padding: 5px 0; }
.week-bar-label {
  display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--gray-600);
  min-width: 0;
}
.week-bar-label > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.week-bar-track { height: 7px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
.week-bar-fill { height: 100%; border-radius: 4px; }
.week-bar-count { font-size: 13px; font-weight: 600; text-align: right; }
.week-none { font-size: 13px; color: var(--gray-400); }

/* ── LCU testing ──────────────────────────────────────────────────────── */
/* The seven-day strip: one cell per calendar day of a reader's trial, so a
   week reads left to right at a glance and a gap is obvious. */
.lcu-strip { display: flex; gap: 6px; flex-wrap: wrap; }
.lcu-day {
  width: 46px; padding: 7px 0 6px; border-radius: var(--radius-md);
  border: 1px solid var(--gray-200); background: var(--gray-100);
  text-align: center; line-height: 1.25;
}
.lcu-day-dow {
  display: block; font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--gray-400);
}
.lcu-day-date { display: block; font-size: 12px; color: var(--gray-600); }
/* The light itself: green means the reader took the card, red means it did not. */
.lcu-day-light {
  display: block; width: 13px; height: 13px; border-radius: 50%;
  margin: 5px auto 0; background: var(--gray-300); border: 1px solid var(--gray-200);
}
.lcu-day.pass { background: var(--green-light); border-color: var(--green-mid); }
.lcu-day.pass .lcu-day-light { background: var(--green); border-color: var(--green); }
.lcu-day.fail { background: var(--red-light); border-color: var(--red-mid); }
.lcu-day.fail .lcu-day-light { background: var(--red); border-color: var(--red); }
/* Today is ringed rather than recoloured, so it is still obvious on a cell that
   has a verdict. */
.lcu-day.today { outline: 2px solid var(--blue); outline-offset: 1px; }
.lcu-day:not(.pass):not(.fail) .lcu-day-dow,
.lcu-day:not(.pass):not(.fail) .lcu-day-date { color: var(--gray-400); }

/* The pass/fail choice, built around the light the technician actually looks
   at. Sized for a thumb: this is answered one-handed, holding a card. */
.lcu-choice { display: flex; gap: 10px; }
.lcu-choice-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 14px; border-radius: var(--radius-md); cursor: pointer;
  border: 1.5px solid var(--gray-200); background: #fff; color: var(--gray-600);
  font-size: 13.5px; font-weight: 500; transition: all 0.12s;
}
.lcu-choice-btn:hover { border-color: var(--gray-400); }
.lcu-choice-btn .lcu-bulb {
  width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
  background: var(--gray-300); border: 1px solid var(--gray-200);
}
.lcu-choice-btn.pass.on { background: var(--green-light); border-color: var(--green); color: var(--green); }
.lcu-choice-btn.pass.on .lcu-bulb { background: var(--green); border-color: var(--green); }
.lcu-choice-btn.fail.on { background: var(--red-light); border-color: var(--red); color: var(--red); }
.lcu-choice-btn.fail.on .lcu-bulb { background: var(--red); border-color: var(--red); }
.lcu-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--gray-400); }
.lcu-serial {
  font-family: 'DM Mono', monospace; font-size: 13.5px; font-weight: 600; color: var(--gray-900);
}
.lcu-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.lcu-tally { font-size: 12.5px; color: var(--gray-600); }
.lcu-tally b { color: var(--gray-900); }
/* The prompt cannot be dismissed, so it is marked as such rather than looking
   like an ordinary dialog with a stray close button. */
.lcu-gate-body { display: flex; flex-direction: column; gap: 16px; }
.lcu-gate-unit { border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 14px; }
.lcu-gate-unit:last-of-type { margin-bottom: 0; }
.lcu-howto {
  display: flex; gap: 11px; padding: 12px 14px; border-radius: var(--radius-md);
  background: var(--blue-light); font-size: 12.5px; color: var(--gray-600); line-height: 1.5;
}
.lcu-howto svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--blue); margin-top: 1px; }
.lcu-lockout { text-align: center; font-size: 12px; color: var(--gray-400); margin-top: 4px; }

/* ── Resting history and the reconditioned pool ──
   Every colour below is an existing token, so dark mode flips with no override of
   its own. That is the test: if one of these ever needs a dark rule, a token was
   bypassed. */

/* Two cards, not one card with two numbers. "Pool: 40, yours: 3" reads as a
   contradiction however it is worded -- wording cannot fix a layout problem. Two
   surfaces is what structurally separates a fact about the hotel from a fact about
   you, and it is why this is not .stats-grid (which is hard-coded to four columns
   and would leave two of them empty). */
.lcu-pool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
@media (max-width: 520px) { .lcu-pool-grid { grid-template-columns: 1fr; } }

/* The resting section is a ledger, not a set of cards: homogeneous records, scanned
   down a column, paged. .table-card / .table-header / table is the register
   ConsumablesPage already established, so this borrows it rather than inventing a
   fourth idiom. The alternative -- reusing LCUUnitCard -- gives a reader that
   finished three weeks ago the same seven-cell day strip and the same entrance
   animation as live work, which is the problem the section exists to solve. */
.lcu-resting-table { width: 100%; border-collapse: collapse; }
.lcu-resting-table th {
  text-align: left; padding: 9px 20px;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gray-400); border-bottom: 1px solid var(--gray-200);
  /* Wrapping heads, because the longest one is "LEITORES RECONDICIONADOS" and
     uppercase plus letter-spacing makes it wider than the column it names. */
  white-space: normal;
}
/* The delete column holds a button or nothing at all, so it must not be a column the
   browser sizes by content. width:1% + nowrap shrinks it to exactly what it needs and
   hands the space back to the columns that have something to say -- which is what was
   clipping the pool header in Portuguese. */
.lcu-resting-table th:last-child,
.lcu-resting-table td:last-child { width: 1%; white-space: nowrap; }
.lcu-resting-table td { padding: 11px 20px; border-bottom: 1px solid var(--gray-100); font-size: 13px; vertical-align: middle; }
.lcu-resting-table tr:last-child td { border-bottom: 0; }
html.dark .lcu-resting-table td { border-color: var(--gray-200); }

/* is-pass is .badge-ok and is-fail is .sla-breach, restated as classes rather than
   the inline style LCUUnitCard carries for the same two colours. */
.lcu-verdict.is-pass { background: var(--green-light); color: var(--green); }
.lcu-verdict.is-fail { background: var(--red-light); color: var(--red); }

.lcu-cell-dim { color: var(--gray-400); font-size: 12.5px; white-space: nowrap; }
/* DM Mono because the pass figure is a RATIO, and a ratio set in a proportional face
   is hard to scan down a column -- the same reasoning .roster-count gives. */
.lcu-cell-fig { font-family: 'DM Mono', monospace; color: var(--gray-900); white-space: nowrap; }
.lcu-cell-recond { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.lcu-pool-since { font-size: 12.5px; color: var(--gray-600); font-weight: 500; white-space: nowrap; }
/* An em-dash, not a blank. Same grammar .rota-cell.is-off uses: in a bordered row a
   blank reads as loading, and a ledger that looks like it is loading looks broken. */
.lcu-cell-none { color: var(--gray-300); }

/* The pool number, on the load that moved it. Reuses statusHighlightPulse rather than
   declaring a fourth keyframe for "a figure just changed" -- it is already exactly
   that, and it is already known to read on both surfaces. */
.lcu-pool-fresh { animation: statusHighlightPulse 700ms ease-out; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,28,26,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal {
  background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp 0.18s ease;
}
@keyframes slideUp { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.modal-header {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { padding: 14px 24px 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }

/* ── Delete confirmation ── */
.confirm-modal { max-width: 420px; }
.confirm-body { display: flex; gap: 14px; align-items: flex-start; }
.confirm-icon {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  background: var(--red-light); color: var(--red);
  display: flex; align-items: center; justify-content: center;
}
.confirm-icon svg { width: 17px; height: 17px; }
.confirm-text { font-size: 13.5px; color: var(--gray-600); line-height: 1.5; }
.confirm-subject {
  display: block; margin-top: 6px; font-weight: 600; color: var(--gray-900);
  font-family: 'DM Mono', monospace; font-size: 12.5px;
  word-break: break-word;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.07em; }
.form-group .form-group-h { font-size: 11px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.07em; }
.form-control {
  padding: 8px 11px; border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  font-size: 13.5px; color: var(--gray-900); background: #fff;
  font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.12s;
}
.form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
.form-control::placeholder { color: var(--gray-400); }
select.form-control { cursor: pointer; }

/* ── room typeahead ──
   The apartment room field. A plain <select> cannot be used here: the inventory
   is potentially hundreds of rooms and the whole point of the field is to narrow
   it by typing, so the options have to be filtered as the user types rather than
   scrolled through.

   The panel is absolutely positioned inside a relatively positioned wrapper, so it
   overlays the fields below it rather than pushing the form down while it is
   open -- otherwise the form would reflow on every keystroke and the field would
   move out from under the cursor. */
.room-picker { position: relative; }
.room-picker-panel {
  position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0;
  max-height: 232px; overflow-y: auto;
  background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); padding: 4px;
}
/* The selected-or-typed value, and the keyboard cursor over the options. Both are
   the same tint, because both mean "this is where you are". */
.room-option {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; border: none; background: none; border-radius: 6px;
  font-family: 'DM Mono', monospace; font-size: 13px; color: var(--gray-900);
  text-align: left; cursor: pointer;
}
.room-option:hover, .room-option.active { background: var(--blue-light); }
.room-option-chosen { color: var(--blue); font-weight: 600; }
/* The tick on the chosen option. It needs its own size: like every icon in this
   app the SVG carries a viewBox and no width or height, and in a flex row with
   nothing to size it, it resolved to 0x0 and drew nothing -- the same trap the
   API error banner walked into, documented above .page-banner. At the option's
   own 13px. */
.room-option-tick { display: inline-flex; align-items: center; }
.room-option-tick svg { width: 13px; height: 13px; flex-shrink: 0; }
.room-picker-foot {
  padding: 6px 10px 4px; font-size: 11.5px; color: var(--gray-400);
  border-top: 1px solid var(--gray-100); margin-top: 4px;
}
.room-picker-foot.warn { color: var(--red); }
/* An inventory with nothing in it is a different situation from a search that
   matched nothing, and the difference decides whether the form can be used at
   all, so they are worded apart rather than sharing one "no results" line. */
.room-picker-empty {
  padding: 10px; font-size: 12.5px; color: var(--gray-500, var(--gray-400)); line-height: 1.45;
}
/* The field turns red once something has been typed but not chosen, because that
   is the one state where the form looks complete and is not. */
.room-picker.unmatched .form-control { border-color: var(--red); }
.room-picker.unmatched .form-control:focus { box-shadow: 0 0 0 3px rgba(217,75,75,0.12); }
/* A locked field has to look locked, or "uneditable" is invisible and people
   still try to type in it. Dimmed, flat, and explicitly not-allowed. */
.form-control:disabled {
  background: var(--gray-100); color: var(--gray-400);
  border-color: var(--gray-200); cursor: not-allowed; box-shadow: none;
}

/* ── Consumables ── */
/* Icon tile: a tinted rounded square with a duotone drawing inside. Colors come
   from the theme variables, so it follows light / dark mode automatically. */
.cicon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cicon svg { width: 62%; height: 62%; display: block; }
.cicon.tone-blue  { background: var(--blue-light);  color: var(--blue); }
.cicon.tone-teal  { background: var(--teal-light);  color: var(--teal); }
.cicon.tone-amber { background: var(--amber-light); color: var(--amber); }
.cicon.tone-green { background: var(--green-light); color: var(--green); }
.cicon.tone-red   { background: var(--red-light);   color: var(--red); }
.cicon.tone-gray  { background: var(--gray-200);    color: var(--gray-600); }

/* Issue form: the "Add consumables" box and the chips inside it */
.consumable-box {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px; border: 1.5px dashed var(--gray-300); border-radius: var(--radius-md);
  background: var(--gray-100); transition: border-color 0.12s;
}
.consumable-box.has-items { border-style: solid; border-color: var(--gray-200); }
.consumable-add-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--gray-300); background: var(--gray-50);
  color: var(--gray-600); font: 500 12.5px 'DM Sans', sans-serif; cursor: pointer; transition: all 0.12s;
}
.consumable-add-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.consumable-add-btn svg { width: 13px; height: 13px; }
.consumable-box:not(.has-items) .consumable-add-btn {
  flex: 1; padding: 9px 12px; border-color: transparent; background: transparent; font-size: 13px;
}
.consumable-box:not(.has-items) .consumable-add-btn:hover { border-color: transparent; }
.consumable-chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 3px 4px 3px 3px;
  border: 1px solid var(--gray-200); border-radius: 999px; background: var(--gray-50);
  font-size: 12.5px; font-weight: 500; color: var(--gray-900); animation: chipIn 0.16s ease;
}
.consumable-chip-name { padding-right: 2px; }
.consumable-chip-qty { font-weight: 600; color: var(--blue); font-variant-numeric: tabular-nums; }
.consumable-chip-x {
  width: 18px; height: 18px; padding: 0; border-radius: 50%; border: none; background: none;
  color: var(--gray-400); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.consumable-chip-x:hover { background: var(--red-light); color: var(--red); }
.consumable-chip-x svg { width: 9px; height: 9px; }
@keyframes chipIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Issue form: the "Third-party support" box and the handover chips inside it.
   Reuses the consumable box/chip visuals — same dashed placeholder when empty,
   same pill per entry — with the company colour as the accent. */
.tp-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px; border: 1.5px dashed var(--gray-300); border-radius: var(--radius-md);
  background: var(--gray-100); transition: border-color 0.12s; }
.tp-box.has-items { border-style: solid; border-color: var(--gray-200); }
.tp-chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 3px 4px 3px 8px;
  border: 1px solid var(--gray-200); border-radius: 999px; background: var(--gray-50);
  font-size: 12.5px; font-weight: 500; color: var(--gray-900); animation: chipIn 0.16s ease;
}
.tp-chip-company { font-weight: 700; }
.tp-chip-detail  { color: var(--gray-500); font-weight: 400; }
.tp-chip-telnet     { border-left: 3px solid var(--blue); }
.tp-chip-telefonica { border-left: 3px solid var(--amber); }
.tp-chip-swap       { border-left: 3px solid var(--green); }
/* The set icon inside a swap chip needs to sit on the chip's line box rather
   than stretch to the text height. */
.tp-chip-swap svg { width: 13px; height: 13px; }

/* Admin page: the per-type "issues of this type can involve moving equipment
   between rooms" toggle. */
.swap-toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; color: var(--gray-600); }
.swap-toggle input { accent-color: var(--blue); width: 15px; height: 15px; cursor: pointer; }

/* Compact per-issue markers shown in the issue tables. */
.tp-strip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.tp-strip-item {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
  border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap;
}
.tp-strip-item.telnet     { background: var(--blue-light);   color: var(--blue); }
.tp-strip-item.telefonica { background: var(--amber-light);  color: var(--amber); }
.tp-strip-item.swap       { background: var(--green-light);  color: var(--green); }
.tp-strip-item svg { width: 11px; height: 11px; }
/* The arrow is what makes the pair read as a movement rather than two rooms. */
.tp-swap-arrow { opacity: .7; font-weight: 400; margin: 0 1px; }

/* The company picker inside the third-party support dialog. */
.tp-company { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tp-company-opt {
  display: flex; align-items: center; gap: 10px; padding: 13px 14px;
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-md);
  background: var(--gray-50); color: var(--gray-600); cursor: pointer;
  text-align: left; font: 600 13.5px 'DM Sans', sans-serif; transition: all 0.12s;
}
.tp-company-opt:hover { border-color: var(--gray-300); }
.tp-company-opt.active { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
.tp-company-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.tp-company-dot.telnet     { background: var(--blue); }
.tp-company-dot.telefonica { background: var(--amber); }
.tp-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.tp-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); background: var(--gray-50);
}
.tp-row-main { min-width: 0; flex: 1; }
/* Both of these were used in the JSX with no rule anywhere, and both were broken
   in the same way the room picker's tick was: tp-row-icon wrapped an unsized SVG
   that collapsed to 0x0 in a flex row, so the TV swap rows had no icon at all;
   tp-row-sub inherited the body's 14px body-ink, so a note sat at exactly the
   size and weight of the room numbers above it and the two lines read as one.
   Sizing the icon and demoting the note restores the pair that .tp-row-company
   and .tp-row-detail already form on the support side of this panel. */
.tp-row-icon { display: inline-flex; align-items: center; color: var(--gray-600); }
.tp-row-icon svg { width: 15px; height: 15px; flex-shrink: 0; }
.tp-row-sub { font-size: 12.5px; color: var(--gray-600); margin-top: 2px; }
.tp-row-company { font-size: 13.5px; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 7px; }
.tp-row-detail { font-size: 12.5px; color: var(--gray-500); margin-top: 2px; }
.tp-row-detail strong { color: var(--gray-600); }

/* The support page: one stat card per company */
.support-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 8px; }
.support-stat-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 16px 18px; }
.support-stat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.support-stat-name { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--gray-900); }
.support-stat-figures { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; }
.support-figure-label { font-size: 10.5px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; }
.support-figure-value { font-size: 17px; font-weight: 700; color: var(--gray-900); font-variant-numeric: tabular-nums; margin-top: 1px; }
.support-figure-note { font-size: 11.5px; color: var(--gray-400); margin-top: 1px; }
.support-stat-empty { font-size: 12.5px; color: var(--gray-400); padding: 6px 0 2px; }
.support-counts { display: flex; gap: 14px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--gray-100); }
.support-count { font-size: 12px; color: var(--gray-500); }
.support-count b { color: var(--gray-900); font-variant-numeric: tabular-nums; }
.support-note { font-size: 12.5px; color: var(--gray-400); margin: 0 0 18px; }

/* Duration cells in the handovers table: tabular so the column reads as a scale. */
.support-dur { font-family: 'DM Mono', monospace; font-size: 12.5px; font-weight: 600; color: var(--gray-900); white-space: nowrap; }
.support-dur.pending { color: var(--gray-400); font-weight: 400; }
.tp-row-status {
  font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.tp-row-status.pending { background: var(--amber-light); color: var(--amber); }
.tp-row-status.solved  { background: var(--green-light); color: var(--green); }

/* Remaining-stock line under an item's name in the consumable picker. */
.cpick-stock { font-size: 11.5px; color: var(--gray-400); font-variant-numeric: tabular-nums; }
.cpick-stock strong { font-weight: 700; }

/* Picker dialog (opens over the issue form) */
.picker-overlay { z-index: 110; }
.picker-modal { max-width: 620px; }
.picker-sub { font-size: 12.5px; color: var(--gray-400); margin-top: 2px; }
.cpick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cpick-card {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 10px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-lg);
  background: var(--gray-50); color: var(--gray-900); text-align: center; cursor: pointer; user-select: none;
  transition: border-color 0.12s, background 0.12s, transform 0.12s;
}
.cpick-card:hover { border-color: var(--gray-300); background: var(--gray-100); transform: translateY(-1px); }
.cpick-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.cpick-card.selected, .cpick-card.selected:hover { border-color: var(--blue); background: var(--blue-light); transform: none; }
.cpick-check {
  position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center;
  transform: scale(0); transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.6, 1);
}
.cpick-check svg { width: 10px; height: 10px; }
.cpick-card.selected .cpick-check { transform: scale(1); }
.cpick-name { font-size: 13px; font-weight: 600; line-height: 1.25; }
.cpick-hint { height: 28px; display: flex; align-items: center; font-size: 11.5px; color: var(--gray-400); }
.cpick-stepper {
  height: 28px; display: inline-flex; align-items: center; gap: 2px; padding: 0 2px;
  border: 1px solid var(--blue-mid); border-radius: 999px; background: var(--gray-50);
}
.cpick-stepper button {
  width: 24px; height: 24px; padding: 0; border: none; border-radius: 50%; background: none;
  color: var(--gray-600); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, color 0.12s;
}
.cpick-stepper button:hover { background: var(--blue-light); color: var(--blue); }
.cpick-stepper button svg { width: 12px; height: 12px; }
.cpick-stepper span { min-width: 24px; text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.picker-footer-note { margin-right: auto; align-self: center; font-size: 12.5px; color: var(--gray-400); }
@media (max-width: 640px) { .cpick-grid { grid-template-columns: repeat(2, 1fr); } }

/* ── System status page ── */
.sys-live {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray-400);
}
.sys-live-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0;
  animation: sysPulse 2s ease-in-out infinite;
}
.sys-live-dot.stale { background: var(--gray-300); animation: none; }
.sys-refresh-btn {
  width: 26px; height: 26px; padding: 0; border: 1px solid var(--gray-200); border-radius: 7px;
  background: var(--gray-50); color: var(--gray-600); display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color 0.12s, color 0.12s;
}
.sys-refresh-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.sys-refresh-btn:disabled { cursor: default; opacity: 0.7; }
.sys-refresh-btn svg { width: 13px; height: 13px; }
.sys-refresh-btn.spinning svg { animation: sysSpin 0.7s linear infinite; }
@keyframes sysSpin { to { transform: rotate(360deg); } }
@keyframes sysPulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 45%, transparent); }
  50%      { box-shadow: 0 0 0 4px transparent; }
}
.sys-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
@media (max-width: 1100px) { .sys-grid { grid-template-columns: repeat(2, 1fr); } }
.sys-card { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 18px 20px; }
.sys-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sys-card-label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--gray-600); }
.sys-icon {
  width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sys-icon svg { width: 14px; height: 14px; }
.sys-icon.tone-green { background: var(--green-light); color: var(--green); }
.sys-icon.tone-amber { background: var(--amber-light); color: var(--amber); }
.sys-icon.tone-red   { background: var(--red-light);   color: var(--red); }
.sys-icon.tone-blue  { background: var(--blue-light);  color: var(--blue); }
.sys-icon.tone-gray  { background: var(--gray-200);    color: var(--gray-600); }
.sys-value { font-size: 26px; font-weight: 700; color: var(--gray-900); line-height: 1; font-variant-numeric: tabular-nums; }
.sys-value .sys-unit { font-size: 14px; font-weight: 600; color: var(--gray-400); margin-left: 3px; }
.sys-value.tone-green { color: var(--green); }
.sys-value.tone-amber { color: var(--amber); }
.sys-value.tone-red   { color: var(--red); }
.sys-gauge-track { height: 7px; border-radius: 4px; background: var(--gray-100); overflow: hidden; margin-top: 12px; }
.sys-gauge-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.3s ease; }
.sys-gauge-fill.tone-green { background: var(--green); }
.sys-gauge-fill.tone-amber { background: var(--amber); }
.sys-gauge-fill.tone-red   { background: var(--red); }
.sys-sub { font-size: 12px; color: var(--gray-400); margin-top: 10px; }
.sys-na { font-size: 13px; color: var(--gray-400); margin-top: 8px; line-height: 1.5; }
.sys-detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1100px) { .sys-detail-grid { grid-template-columns: repeat(2, 1fr); } }
.sys-detail-item { padding: 14px 16px; }
.sys-detail-label { font-size: 11px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.sys-detail-value { font-size: 15px; font-weight: 600; color: var(--gray-900); }

/* False-positive checkbox on the issue form, and its badge in the tables */
.fp-check {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 14px;
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); background: var(--gray-50);
  cursor: pointer; user-select: none; transition: border-color 0.12s, background 0.12s;
}
.fp-check:hover { border-color: var(--gray-300); }
.fp-check input { position: absolute; opacity: 0; pointer-events: none; }
.fp-check:has(input:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
.fp-box {
  width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; border: 1.5px solid var(--gray-300);
  background: var(--gray-50); color: transparent; display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.fp-box svg { width: 12px; height: 12px; }
.fp-check.checked { border-color: var(--amber); background: var(--amber-light); }
.fp-check.checked .fp-box { background: var(--amber); border-color: var(--amber); color: var(--gray-50); }
.fp-title { display: block; font-size: 13px; font-weight: 600; color: var(--gray-900); }
.fp-sub { display: block; font-size: 12px; color: var(--gray-400); margin-top: 1px; }
.fp-badge {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 2px 8px;
  border-radius: 999px; background: var(--amber-light); color: var(--amber); font-size: 10.5px; font-weight: 600;
}
.fp-badge svg { width: 10px; height: 10px; }

/* Daily report: a false-positive row gets an amber tint and a left accent bar */
tbody tr.fp-row td { background: color-mix(in srgb, var(--amber-light) 55%, transparent); }
