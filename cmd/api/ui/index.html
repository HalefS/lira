tbody tr.fp-row:hover td { background: color-mix(in srgb, var(--amber-light) 90%, transparent); }
tbody tr.fp-row td:first-child { box-shadow: inset 3px 0 0 var(--amber); }

/* Tiny icon strip shown under an issue's problem text in the tables */
.cstrip { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.cstrip-item { position: relative; display: inline-flex; }
.cstrip-qty {
  position: absolute; top: -5px; right: -6px; min-width: 14px; height: 14px; padding: 0 3px;
  border-radius: 7px; border: 1.5px solid var(--gray-50); background: var(--gray-900); color: var(--gray-50);
  font-size: 9px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center;
}

/* Admin: icon picker grid + list rows */
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
.icon-opt {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 0;
  border: 2px solid transparent; border-radius: 12px; background: none; cursor: pointer; transition: all 0.12s;
}
.icon-opt:hover { background: var(--gray-100); }
.icon-opt.selected { border-color: var(--blue); background: var(--blue-light); }
.cicon-btn { padding: 0; border: none; background: none; border-radius: 10px; cursor: pointer; display: inline-flex; }
.cicon-btn:hover .cicon { box-shadow: 0 0 0 2px var(--blue-mid); }
.icon-editor-row td { background: var(--gray-100); padding: 12px 16px; }
.icon-editor-label { font-size: 11px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
.ci-preview { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; font-size: 13px; font-weight: 500; }
.ci-preview span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Empty ── */
.empty-state { padding: 48px; text-align: center; color: var(--gray-400); display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* Shown on a recurring alert whose issues have all been deleted. */
.alert-stale { padding: 20px; text-align: center; border-top: 1px solid var(--gray-200); }
.alert-stale-title { font-size: 13px; font-weight: 600; color: var(--gray-900); margin: 0 0 5px; }
.alert-stale-body { font-size: 12.5px; color: var(--gray-400); margin: 0 0 12px; line-height: 1.5; }

/* Error boundary fallback. Kept deliberately plain: this is shown when a page
   has already thrown, so it must not depend on any of the app's own state. */
.error-boundary { display: flex; align-items: center; justify-content: center; padding: 48px 24px; min-height: 60vh; }
.error-boundary-card {
  max-width: 560px; width: 100%; text-align: center;
  background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
  padding: 32px 28px; box-shadow: var(--shadow-md);
}
.error-boundary-icon { color: var(--red); display: flex; justify-content: center; margin-bottom: 12px; }
.error-boundary-icon svg { width: 30px; height: 30px; }
.error-boundary-card h2 { font-size: 17px; margin: 0 0 8px; }
.error-boundary-msg { font-size: 13px; color: var(--gray-400); margin: 0 0 18px; line-height: 1.55; }
.error-boundary-detail, .error-boundary-stack {
  text-align: left; font-family: 'DM Mono', monospace; font-size: 11.5px; line-height: 1.5;
  background: var(--gray-100); color: var(--gray-600); border-radius: var(--radius-sm);
  padding: 10px 12px; margin: 0 0 10px; max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.error-boundary-stack { max-height: 96px; color: var(--gray-400); }
.error-boundary-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.empty-state svg { width: 36px; height: 36px; opacity: 0.25; }
.empty-state p { font-size: 13.5px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--gray-900); color: #fff;
  padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500;
  z-index: 200; animation: toastIn 0.2s ease; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-md);
}
@keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: #63C48A; flex-shrink: 0; }

/* ── lang toggle ── */
.lang-toggle {
  display: inline-flex; align-items: center; border-radius: var(--radius-md);
  border: 1px solid var(--gray-200); background: #fff; overflow: hidden; flex-shrink: 0;
}
.lang-btn {
  padding: 6px 11px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; background: none; color: var(--gray-500);
  font-family: 'DM Sans', sans-serif; transition: all 0.12s; line-height: 1;
  display: flex; align-items: center; gap: 5px;
}
.lang-btn:first-child { border-right: 1px solid var(--gray-200); }
.lang-btn.active { background: var(--blue-light); color: var(--blue); }
.lang-btn:hover:not(.active) { background: var(--gray-100); color: var(--gray-900); }
.lang-flag { font-size: 14px; line-height: 1; }

/* ── pw toggle ── */
.pw-wrap { position: relative; }
.pw-wrap .form-control { width: 100%; padding-right: 36px; }
.pw-toggle {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--gray-400);
  display: flex; padding: 0;
}

/* ── dark mode surface overrides ── */
html.dark .sidebar,
html.dark .topbar,
html.dark .stat-card,
html.dark .table-card,
html.dark .mini-card,
html.dark .set-group,
html.dark .maint-card,
html.dark .maint-tile,
html.dark .support-stat-card,
html.dark .modal,
html.dark .auth-card,
html.dark .error-boundary-card,
html.dark .btn-ghost,
html.dark .lang-toggle,
html.dark .form-control { background: var(--gray-50) !important; }

html.dark .sidebar { border-color: var(--gray-200) !important; }
html.dark .topbar  { border-color: var(--gray-200) !important; }
html.dark .stat-card,
html.dark .table-card,
html.dark .mini-card,
html.dark .set-group,
html.dark .maint-card,
html.dark .maint-tile,
html.dark .support-stat-card { border-color: var(--gray-200) !important; }
/* The tinted border is the strongest signal that a tile is filtering the queue,
   so it has to outlive the !important above -- otherwise the selected tile looks
   the same in both themes except for its edge width. */
html.dark .maint-tile.is-filter { border-color: var(--tile-color) !important; }
/* The wash over a live tile is a tint in light mode, because the pastel it uses is
   already pale. The dark theme's --*-light values are not pastels of a dark surface,
   they are full-strength colours, so the same overlay at the same opacity fills the
   whole tile rather than washing it -- the scheduled one most of all, where #085041
   reads as a solid green block with a grey label stranded on it. Dark mode gets a
   much lower alpha instead, which keeps the hue as a wash, which is all the overlay
   was ever for. */
html.dark .maint-tile.live::after { opacity: 0.25; }
html.dark .error-boundary-card { border-color: var(--gray-200) !important; }
html.dark .support-counts { border-color: var(--gray-200) !important; }

html.dark thead th { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }
html.dark tbody td { border-color: var(--gray-200) !important; }
html.dark tbody tr:hover td { background: var(--gray-200) !important; }

html.dark .form-control {
  border-color: var(--gray-300) !important;
  color: var(--gray-900) !important;
}
/* Dark --blue is a light accent rather than a dark one, so white ink on it -- the
   app's main action on every page, "Apt. issue", "Download PDF", all eight
   "Mark done" buttons -- measured 2.86:1. Dark ink on the same fill gives
   5.99:1, the same way the dark theme treats that blue as an accent everywhere
   else it appears.
   The hover needs its own rule rather than being left to .btn-primary:hover.
   `html.dark .btn-primary` outranks a single class on that pseudo-class, so
   without this the hover would never apply in dark at all. It keeps
   --blue-hover, which in this theme is lighter than --blue rather than darker --
   the correct direction now that the ink sitting on it is dark, at 8.35:1. */
html.dark .btn-primary       { background: var(--blue); color: #0B1D2C; }
html.dark .btn-primary:hover { background: var(--blue-hover); }

html.dark .btn-ghost {
  color: var(--gray-600) !important;
  border-color: var(--gray-300) !important;
}
html.dark .btn-ghost:hover { background: var(--gray-200) !important; color: var(--gray-900) !important; }
/* In dark mode --red is a light salmon, so white text on it would be barely
   legible. Flip the pairing to a dark red fill with the light red as the text,
   the same way .icon-btn.danger:hover does it. */
html.dark .btn-danger        { background: var(--red-light) !important; color: var(--red) !important; }
html.dark .btn-danger:hover  { background: var(--red-mid) !important; }

/* The count of outstanding alerts, on the nav item a technician checks first.
   Dark --red is a pale salmon, so white on it measured 2.67:1 at 10px. Dark ink
   on the same fill gives 6.71:1. The light pairing needs no override of its own:
   it is the light --red on white, which now clears at 5.34:1. */
html.dark .nav-badge { color: #2A0F0F; }

html.dark .nav-item.active { background: var(--blue-light) !important; color: var(--blue) !important; }
html.dark .nav-item:hover  { background: var(--gray-200) !important; }

html.dark .chip        { background: var(--gray-100) !important; border-color: var(--gray-300) !important; color: var(--gray-600) !important; }
html.dark .chip.active { background: var(--blue-light) !important; color: var(--blue) !important; border-color: var(--blue-mid) !important; }

html.dark .lang-toggle  { border-color: var(--gray-300) !important; }
html.dark .lang-btn.active { background: var(--blue-light) !important; color: var(--blue) !important; }
html.dark .lang-btn:first-child { border-color: var(--gray-300) !important; }

html.dark .search-wrap {
  background: var(--gray-200) !important;
  border-color: var(--gray-300) !important;
}
html.dark .search-wrap input { color: var(--gray-900) !important; }

html.dark .modal-overlay { background: rgba(0,0,0,0.65) !important; }
html.dark .bar-track { background: var(--gray-200) !important; }
html.dark .badge-type,
html.dark .badge-slate { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }
html.dark .demo-box { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }
html.dark .auth-screen { background: var(--gray-50) !important; }
html.dark .auth-right  { background: var(--gray-50) !important; }
   /* The brand panel is the one large surface that is a saturated blue rather than
      a neutral, so it is the one place where the dark --blue token is used as a
      background rather than as an accent. That token is a *light* blue: fine as
      ink on a dark card, wrong as a field behind white text, which lands at 2.4:1
      -- the sign-in screen, which is the first thing anyone sees. Light mode keeps
      white on the mid blue at 5.8:1 and the relationship is the same here, white on
      a blue dark enough to hold it: 12.5:1.

      Using --blue-light rather than a new value also keeps the panel inside the
      dark theme's own surfaces, so the eye is drawn to the login card on the right
      rather than to a bright slab on the left. */
html.dark .auth-left   { background: var(--blue-light) !important; }

@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .bottom-grid { grid-template-columns: 1fr; }
  .auth-left { display: none; }
}
@media (max-width: 640px) {
  .auth-right { padding: 20px; }
  .auth-card { padding: 28px 22px; }
}

/* Self-service reset: the link under the sign-in button, the six-digit code
   field, and the note shown when sign-in was blocked rather than wrong.
   Top level, outside the media queries above — these are not small-screen
   adjustments. */
.auth-forgot-link {
  display: block; width: 100%; margin: 14px 0 0; background: none; border: none;
  font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; color: var(--blue);
  cursor: pointer; text-align: center; padding: 4px;
}
.auth-forgot-link:hover { text-decoration: underline; }

/* The selector repeats .form-control on purpose: the generic input styling is
   declared earlier in this stylesheet, but a single-class rule on an element
   carrying two classes still needs the pairing to be unambiguous. */
.form-control.reset-code-input {
  font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: 0.42em;
  text-align: center; padding-left: 0.42em; /* keeps the digits optically centred */
}

.reset-note {
  display: flex; align-items: flex-start; gap: 8px; margin: 0 0 18px;
  padding: 11px 13px; border-radius: var(--radius-md);
  background: var(--blue-light); color: var(--blue);
  font-size: 12.5px; line-height: 1.5;
}
.reset-note svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }

/* The code the manager has just been handed. Deliberately the loudest thing on
   the dialog: it is shown once and never again, so it has to be readable from
   arm's length across a desk. */
.reset-code-display {
  font-family: 'DM Mono', monospace; font-size: 40px; font-weight: 500;
  letter-spacing: 0.3em; text-align: center; color: var(--blue);
  padding: 18px 10px 18px 0.3em; margin: 4px 0 14px;
  background: var(--blue-light); border-radius: var(--radius-md);
  user-select: all;
}
</style>
</head>
