<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LIRA — Llana IT Reporting & Alerts</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>try{if(localStorage.getItem('lira_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:        #1769AA;
  --blue-hover:  #125480;
  --blue-light:  #E8F2FC;
  --blue-mid:    #A9D1F0;
  --teal:        #1D9E75;
  --teal-light:  #E1F5EE;
  --teal-mid:    #9FE1CB;
  --amber:       #D88A18;
  --amber-light: #FFF4DF;
  --green:       #2E8B57;
  --green-light: #EAF6EE;
  --red:         #D94B4B;
  --red-light:   #FBEAEA;
  --red-mid:     #F0B8B8;
  --gray-50:     #FAFAF8;
  --gray-100:    #F5F4F0;
  --gray-200:    #E4E5E7;
  --gray-300:    #D2D4D7;
  --gray-400:    #7A8490;
  --gray-600:    #4B5563;
  --gray-900:    #17202A;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --shadow-md:   0 4px 20px rgba(0,0,0,0.10);
  --shadow-lg:   0 8px 40px rgba(0,0,0,0.14);
}

html.dark {
  --blue:        #4C9FE0;
  --blue-hover:  #79BCEE;
  --blue-light:  #123655;
  --blue-mid:    #1D5F91;
  --teal:        #5DCAA5;
  --teal-light:  #085041;
  --teal-mid:    #0F6E56;
  --amber:       #F0A63C;
  --amber-light: #4A320D;
  --green:       #52B37F;
  --green-light: #17301F;
  --red:         #E8817E;
  --red-light:   #4A1E1E;
  --red-mid:     #7A3232;
  --gray-50:     #1B1F25;
  --gray-100:    #12151A;
  --gray-200:    #262B33;
  --gray-300:    #3A4048;
  --gray-400:    #8A93A0;
  --gray-600:    #C3C9D1;
  --gray-900:    #EDEFF2;
  --shadow-md:   0 4px 20px rgba(0,0,0,0.40);
  --shadow-lg:   0 8px 40px rgba(0,0,0,0.55);
}

/* ── theme toggle ── */
.theme-btn {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  border: 1px solid var(--gray-200); background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s; flex-shrink: 0; position: relative; overflow: hidden;
}
html.dark .theme-btn { background: var(--gray-50); border-color: var(--gray-300); }
.theme-btn:hover { background: var(--gray-100); border-color: var(--gray-300); }
html.dark .theme-btn:hover { background: var(--gray-200); }
.theme-btn svg { width: 16px; height: 16px; transition: transform 0.3s, opacity 0.2s; }
.theme-icon-sun  { color: #D88A18; }
.theme-icon-moon { color: #1769AA; }
html, body, #root { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: var(--gray-100); color: var(--gray-900); font-size: 14px; line-height: 1.5; transition: background 0.2s, color 0.2s; }

/* ── Auth ── */
.auth-screen { min-height: 100vh; display: flex; }
.auth-left {
  width: 400px; min-width: 400px; background: var(--blue);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 48px 44px; position: relative; overflow: hidden;
}
.auth-left::before {
  content: ''; position: absolute; top: -80px; right: -80px;
  width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,0.07);
}
.auth-left::after {
  content: ''; position: absolute; bottom: -60px; left: -60px;
  width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.05);
}
.auth-brand { position: relative; z-index: 1; }
.auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
.auth-logo-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;
}
.auth-logo-mark svg { width: 20px; height: 20px; }
.auth-logo-name { font-size: 18px; font-weight: 600; color: #fff; }
.auth-headline { font-size: 26px; font-weight: 600; color: #fff; line-height: 1.35; margin-bottom: 14px; }
.auth-sub { font-size: 13.5px; color: rgba(255,255,255,0.65); line-height: 1.65; }
.auth-features { position: relative; z-index: 1; }
.auth-feature {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-top: 1px solid rgba(255,255,255,0.1); font-size: 13px; color: rgba(255,255,255,0.78);
}
.auth-feature-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); flex-shrink: 0; }
.auth-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
.auth-card {
  background: #fff; border-radius: var(--radius-xl); border: 1px solid var(--gray-200);
  padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md);
  animation: fadeUp 0.22s ease;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.auth-card-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.auth-card-sub { font-size: 13px; color: var(--gray-400); margin-bottom: 28px; }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.auth-toggle { text-align: center; font-size: 13px; color: var(--gray-400); margin-top: 20px; }
.auth-toggle button {
  background: none; border: none; color: var(--blue); font-weight: 500;
  cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif;
  text-decoration: underline; text-underline-offset: 2px;
}
.auth-error {
  background: var(--red-light); color: var(--red);
  border: 1px solid var(--red-mid); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px;
}
.demo-box {
  margin-top: 16px; padding: 12px 14px;
  background: var(--gray-50); border-radius: var(--radius-md); border: 1px solid var(--gray-200);
}
.demo-box-label { font-size: 10px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
.demo-row { font-size: 12px; color: var(--gray-600); padding: 2px 0; }
.demo-sep { color: var(--gray-300); margin: 0 6px; }

/* ── App layout ── */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 230px; min-width: 230px; background: #fff;
  border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; overflow-y: auto;
}
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: #fff; border-bottom: 1px solid var(--gray-200); padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ── Sidebar ── */
.sidebar-logo {
  padding: 20px 18px 18px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--gray-200);
}
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px; background: var(--blue);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo-mark svg { width: 16px; height: 16px; }
.logo-text { font-size: 15px; font-weight: 600; }
.logo-sub { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
.sidebar-section { padding: 16px 10px 6px; }
.sidebar-section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--gray-400); padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-md);
  font-size: 13.5px; color: var(--gray-600); cursor: pointer; transition: all 0.12s;
  border: none; background: none; width: 100%; text-align: left; user-select: none;
}
.nav-item:hover { background: var(--gray-100); color: var(--gray-900); }
.nav-item.active { background: var(--blue-light); color: var(--blue); font-weight: 500; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-icon-wrap { position: relative; display: inline-flex; }
.nav-badge {
  position: absolute; top: -6px; right: -8px;
  background: var(--red); color: #fff;
  font-size: 10px; font-weight: 600; line-height: 1;
  min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 999px; display: flex; align-items: center; justify-content: center;
}
.sidebar-footer { margin-top: auto; padding: 10px 10px 12px; border-top: 1px solid var(--gray-200); }
.sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 2px; }
.sidebar-user-name { font-size: 13px; font-weight: 500; }
.sidebar-user-role { font-size: 11px; color: var(--gray-400); text-transform: capitalize; }
.logout-btn {
  width: 100%; padding: 8px 10px; border-radius: var(--radius-md);
  border: none; background: none; color: var(--gray-600);
  font-size: 13.5px; font-weight: 400; cursor: pointer; font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; gap: 9px; transition: all 0.12s; text-align: left;
}
.logout-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.logout-btn:hover { background: var(--red-light); color: var(--red); }

/* ── Avatar ── */
.avatar-circle {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
}
.av-0 { background: var(--blue-light); color: var(--blue); }
.av-1 { background: var(--teal-light); color: var(--teal); }
.av-2 { background: #EEF2FF; color: #3730A3; }
.av-3 { background: var(--amber-light); color: var(--amber); }
.av-4 { background: #FDF2F8; color: #9D174D; }

/* ── Topbar ── */
.topbar-left h1 { font-size: 16px; font-weight: 600; }
.topbar-left p { font-size: 12px; color: var(--gray-400); margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent;
  transition: all 0.12s; font-family: 'DM Sans', sans-serif;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost { background: #fff; color: var(--gray-600); border-color: var(--gray-200); }
.btn-ghost:hover { background: var(--gray-100); color: var(--gray-900); }
.btn-full { width: 100%; justify-content: center; padding: 10px 14px; font-size: 14px; }
.btn svg { width: 14px; height: 14px; }

/* ── Stats ── */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 22px; }
.stat-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); padding: 16px 18px; }
.stat-label { font-size: 11.5px; color: var(--gray-400); font-weight: 500; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 600; line-height: 1; }
.stat-sub { font-size: 11.5px; color: var(--gray-400); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* ── Table ── */
.table-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); margin-bottom: 20px; overflow: hidden; }
.table-header {
  padding: 14px 18px; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.table-title { font-size: 13.5px; font-weight: 600; }
.table-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-chips { display: flex; gap: 6px; }
.chip {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--gray-200); background: #fff; color: var(--gray-600);
  transition: all 0.12s; font-family: 'DM Sans', sans-serif;
}
.chip:hover { border-color: var(--blue-mid); color: var(--blue); }
.chip.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue-mid); }
.search-wrap {
  display: flex; align-items: center; gap: 7px;
  background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 5px 11px;
}
.search-wrap svg { width: 13px; height: 13px; color: var(--gray-400); flex-shrink: 0; }
.search-wrap input {
  border: none; background: none; outline: none;
  font-size: 13px; color: var(--gray-900); font-family: 'DM Sans', sans-serif; width: 130px;
}
.search-wrap input::placeholder { color: var(--gray-400); }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 9px 18px; text-align: left; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--gray-400);
  border-bottom: 1px solid var(--gray-200); background: var(--gray-50); white-space: nowrap;
}
tbody td { padding: 11px 18px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #F8FAFC; }

/* ── New-row entrance + status highlight ── */
@keyframes rowFadeSlide {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.row-enter td { animation: rowFadeSlide 200ms ease-out; }

@keyframes statusHighlightPulse {
  0%   { box-shadow: 0 0 0 0 rgba(37,99,235,0.35); }
  100% { box-shadow: 0 0 0 6px rgba(37,99,235,0); }
}
.status-highlight { animation: statusHighlightPulse 700ms ease-out; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.badge-ok { background: var(--green-light); color: var(--green); }
.badge-pending { background: var(--amber-light); color: var(--amber); }
.badge-internet { background: var(--teal-light); color: var(--teal); border: 1px solid var(--teal-mid); }
.badge-type { background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-200); }

/* ── Icon btn ── */
.icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; background: none; color: var(--gray-400); transition: all 0.12s;
}
.icon-btn:hover { background: var(--gray-100); color: var(--gray-900); }
.icon-btn.danger:hover { background: var(--red-light); color: var(--red); }
.icon-btn svg { width: 14px; height: 14px; }
.color-swatch-input {
  width: 24px; height: 24px; padding: 0; border: 1px solid var(--gray-200);
  border-radius: 50%; cursor: pointer; background: none; overflow: hidden;
  vertical-align: middle;
}
.color-swatch-input::-webkit-color-swatch-wrapper { padding: 0; }
.color-swatch-input::-webkit-color-swatch { border: none; border-radius: 50%; }
.color-swatch-input::-moz-color-swatch { border: none; border-radius: 50%; }
.action-cell { display: flex; gap: 2px; }

/* ── Bottom grid ── */
.bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.mini-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 18px 20px; }
.mini-card-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; }
.bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--gray-100); }
.bar-row:last-child { border-bottom: none; }
.bar-label { font-size: 13px; display: flex; align-items: center; gap: 7px; min-width: 90px; }
.bar-track { flex: 1; height: 6px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.bar-count { font-size: 13px; font-weight: 600; min-width: 20px; text-align: right; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,28,26,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal {
  background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 520px;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp 0.18s ease;
}
@keyframes slideUp { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
.modal-header {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 15px; font-weight: 600; }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { padding: 14px 24px 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.07em; }
.form-control {
  padding: 8px 11px; border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  font-size: 13.5px; color: var(--gray-900); background: #fff;
  font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.12s;
}
.form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
.form-control::placeholder { color: var(--gray-400); }
select.form-control { cursor: pointer; }

/* ── Consumables ── */
/* Icon tile: a tinted rounded square with a duotone drawing inside. Colors come
   from the theme variables, so it follows light / dark mode automatically. */
.cicon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cicon svg { width: 62%; height: 62%; display: block; }
.cicon.tone-blue  { background: var(--blue-light);  color: var(--blue); }
.cicon.tone-teal  { background: var(--teal-light);  color: var(--teal); }
.cicon.tone-amber { background: var(--amber-light); color: var(--amber); }
.cicon.tone-green { background: var(--green-light); color: var(--green); }
.cicon.tone-red   { background: var(--red-light);   color: var(--red); }
.cicon.tone-gray  { background: var(--gray-200);    color: var(--gray-600); }

/* Issue form: the "Add consumables" box and the chips inside it */
.consumable-box {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 10px; border: 1.5px dashed var(--gray-300); border-radius: var(--radius-md);
  background: var(--gray-100); transition: border-color 0.12s;
}
.consumable-box.has-items { border-style: solid; border-color: var(--gray-200); }
.consumable-add-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--gray-300); background: var(--gray-50);
  color: var(--gray-600); font: 500 12.5px 'DM Sans', sans-serif; cursor: pointer; transition: all 0.12s;
}
.consumable-add-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.consumable-add-btn svg { width: 13px; height: 13px; }
.consumable-box:not(.has-items) .consumable-add-btn {
  flex: 1; padding: 9px 12px; border-color: transparent; background: transparent; font-size: 13px;
}
.consumable-box:not(.has-items) .consumable-add-btn:hover { border-color: transparent; }
.consumable-chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 3px 4px 3px 3px;
  border: 1px solid var(--gray-200); border-radius: 999px; background: var(--gray-50);
  font-size: 12.5px; font-weight: 500; color: var(--gray-900); animation: chipIn 0.16s ease;
}
.consumable-chip-name { padding-right: 2px; }
.consumable-chip-qty { font-weight: 600; color: var(--blue); font-variant-numeric: tabular-nums; }
.consumable-chip-x {
  width: 18px; height: 18px; padding: 0; border-radius: 50%; border: none; background: none;
  color: var(--gray-400); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.consumable-chip-x:hover { background: var(--red-light); color: var(--red); }
.consumable-chip-x svg { width: 9px; height: 9px; }

/* ── API config ── */
const API = '/v1';

/* ── API client ── */
async function apiFetch(path, { method='GET', body, token } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) {
    const msg = data.error
      ? (typeof data.error === 'object' ? Object.values(data.error).join(', ') : data.error)
      : 'Something went wrong';
    throw new Error(msg);
  }
  return data;
}

/* ── helpers ── */
function today(lang) {
  return new Date().toLocaleDateString(lang==='pt' ? 'pt-PT' : 'en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function initials(name) {
  return name.trim().split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
}
function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

/* ── Map API issue → frontend shape ── */
function mapIssue(i) {
  return {
    id:            i.id,
    apt:           i.mode === 'apt'  ? i.location : undefined,
    dept:          i.mode === 'dept' ? i.location : undefined,
    mode:          i.mode,
    type:          i.type,
    problem:       i.problem,
    resolution:    i.resolution,
    time:          i.time_minutes,
    startTime:     i.start_time || undefined,
    endTime:       i.end_time || undefined,
    // Only ever read/written by the add/edit issue modal — never shown in
    // any table, history, or dashboard view.
    reportedByAgent:  i.reported_by_agent || undefined,
    confirmedByAgent: i.confirmed_by_agent || undefined,
    falsePositive: !!i.false_positive,
    // Consumables used on the issue: [{itemId, item, icon, quantity}]. itemId is
    // null when the item has since been removed from the catalog.
    consumables: (i.consumables || []).map(c => ({
      itemId: c.item_id ?? null, item: c.item, icon: c.icon, quantity: c.quantity,
    })),
    status:        i.status,
    loggedBy:      i.logged_by,
    loggedByName:  i.logged_by_name,
    loggedByIdx:   i.logged_by_idx,
    createdAt:     i.created_at?.slice(0,10),
    version:       i.version,
  };
}

/* ── TypeBadge ── */
// Colors are assigned server-side and stored per issue type as a "#RRGGBB"
// hex value (guaranteed unique — see the admin issue-types catalog).
// TypeColorCtx makes that name -> hex lookup available to any <TypeBadge>
// without having to thread issueTypes through every table component that
// renders one.
const TypeColorCtx = React.createContext({});

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch (max) {
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      default: h = (r-g)/d + 4;
    }
    h /= 6;
  }
  return [h*360, s*100, l*100];
}
function hslToHex(h, s, l) {
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
// Turns any "#RRGGBB" hex into a soft badge style — a light tint
// background and a deep, readable text color of the same hue — matching
// the app's existing badge look regardless of which raw color a manager
// picks in the color picker.
function badgeStyleFromHex(hex) {
  if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return null;
  const [h, s] = hexToHsl(hex);
  const sat = Math.min(s, 70);
  return {
    background: hslToHex(h, sat, 93),
    borderColor: hslToHex(h, sat, 82),
    color: hslToHex(h, Math.min(Math.max(s,40),80), 32),
    borderWidth: 1, borderStyle: 'solid',
  };
}

function TypeBadge({ type }) {
  const colors = React.useContext(TypeColorCtx);
  const hex = colors[type];
  const style = hex ? badgeStyleFromHex(hex) : null;
  return <span className="badge" style={style || undefined}>{type}</span>;
}

/* ════════════════ AUTH SCREEN ════════════════ */
function AuthScreen({ onLogin, lang, onLangChange, theme, onThemeChange }) {
  const t = T[lang];
  const [mode, setMode]       = useState('login');
  const [email, setEmail]     = useState('');
  const [pw, setPw]           = useState('');
  const [name, setName]       = useState('');
  const [showPw, setShowPw]   = useState(false);
  const [err, setErr]         = useState('');
  const [loading, setLoading] = useState(false);

  async function doLogin(e) {
    e.preventDefault(); setErr(''); setLoading(true);
    try {
      const data = await apiFetch('/tokens/authentication', {
        method:'POST', body:{ email, password:pw }
      });
      onLogin(data.user, data.token);
    } catch(ex) {
      setErr(ex.message==='invalid authentication credentials' ? t.errWrongCreds : ex.message);
    } finally { setLoading(false); }
  }

  async function doRegister(e) {
    e.preventDefault(); setErr(''); setLoading(true);
    try {
      const data = await apiFetch('/users', {
        method:'POST', body:{ name, email, password:pw }
      });
      onLogin(data.user, data.token);
    } catch(ex) {
      setErr(ex.message);
    } finally { setLoading(false); }
  }

  function switchMode(m) { setMode(m); setErr(''); setEmail(''); setPw(''); setName(''); }

  return (
    <div className="auth-screen">
      <div className="auth-left">
        <div className="auth-brand">
          <div className="auth-logo">
            <div className="auth-logo-mark">{Ic.logo}</div>
            <span className="auth-logo-name">LIRA</span>
          </div>
          <div className="auth-headline">{t.authHeadline.split('\n').map((l,i)=><span key={i}>{l}{i===0&&<br/>}</span>)}</div>
          <div className="auth-sub">{t.authSub}</div>
        </div>
        <div className="auth-features">
          {t.authFeatures.map(f=>(
            <div className="auth-feature" key={f}><span className="auth-feature-dot"></span>{f}</div>
          ))}
        </div>
      </div>

      <div className="auth-right">
        <div className="auth-card">
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16,gap:8}}>
            <ThemeToggle theme={theme} onChange={onThemeChange}/>
            <LangToggle lang={lang} onChange={onLangChange}/>
          </div>
          <div className="auth-card-title">{mode==='login' ? t.welcomeBack : t.createAccount}</div>
          <div className="auth-card-sub">{mode==='login' ? t.signIn : t.joinTeam}</div>

          <form className="auth-form" onSubmit={mode==='login' ? doLogin : doRegister}>
            {err && <div className="auth-error">{err}</div>}

            {mode==='register' && (
              <div className="form-group">
                <label>{t.fullName}</label>
                <input className="form-control" placeholder={t.fullNamePlaceholder} value={name} onChange={e=>setName(e.target.value)} required />
              </div>
            )}
            <div className="form-group">
              <label>{t.email}</label>
              <input className="form-control" type="email" placeholder={t.emailPlaceholder} value={email} onChange={e=>setEmail(e.target.value)} required />
            </div>
            <div className="form-group">
              <label>{t.password}</label>
              <div className="pw-wrap">
                <input
                  className="form-control" type={showPw?'text':'password'}
                  placeholder={mode==='register'?t.passwordPlaceholder:'••••••••'}
                  value={pw} onChange={e=>setPw(e.target.value)} required
                />
                <button type="button" className="pw-toggle" onClick={()=>setShowPw(s=>!s)}>
                  {showPw ? Ic.eyeoff : Ic.eye}
                </button>
              </div>
            </div>

            <button type="submit" className="btn btn-primary btn-full" style={{marginTop:4}} disabled={loading}>
              {loading ? '…' : (mode==='login' ? t.signInBtn : t.createBtn)}
            </button>
          </form>

          <div className="auth-toggle">
            {mode==='login'
              ? <>{t.noAccount} <button onClick={()=>switchMode('register')}>{t.signUp}</button></>
              : <>{t.haveAccount} <button onClick={()=>switchMode('login')}>{t.signInBtn}</button></>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* Builds the recurring-issue warning sentence in the active language. */
function duplicateAlertMessage(lang, count, location, windowHours) {
  if (lang === 'pt') {
    return `Este tipo de avaria já ocorreu ${count} ${count===1?'vez':'vezes'} em ${location} nas últimas ${windowHours}h.`;
  }
  return `This issue type has happened ${count} ${count===1?'time':'times'} at ${location} in the last ${windowHours}h.`;
}

/* Computes whole minutes between two "HH:MM" times, treating an end time
   earlier than the start time as crossing midnight. Returns null when the
   inputs are missing or the duration works out to zero. */
function computeDurationMinutes(startTime, endTime) {
  if (!startTime || !endTime) return null;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  if ([sh,sm,eh,em].some(n => Number.isNaN(n))) return null;
  let diff = (eh*60+em) - (sh*60+sm);
  if (diff < 0) diff += 24*60; // crossed midnight
  return diff > 0 ? diff : null;
}

const CONSUMABLE_ICON_TONE = {
  'battery-aa':'amber','battery-aaa':'amber','battery-9v':'amber','battery-coin':'amber','bulb':'amber',
  'phone':'blue','mobile':'blue','tablet':'blue','headset':'blue','key-card':'blue','lock':'blue',
  'remote':'teal','tv':'teal','monitor':'teal','printer':'teal',
  'hdmi':'green','ethernet':'green','router':'green','usb':'green','mouse':'green','keyboard':'green',
  'charger':'red','power-strip':'red',
  'box':'gray',
};
const CONSUMABLE_ICON_KEYS = Object.keys(CONSUMABLE_ICONS);
const MAX_CONSUMABLE_QTY = 99;

function ConsumableIcon({ name, size=36 }) {
  const key = CONSUMABLE_ICONS[name] ? name : 'box'; // unknown key → generic box
  return (
    <span className={`cicon tone-${CONSUMABLE_ICON_TONE[key]}`}
      style={{width:size, height:size, borderRadius:Math.round(size*0.26)}} aria-hidden="true">
      {/* trusted static markup from CONSUMABLE_ICONS above, never user input */}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"
        strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html: CONSUMABLE_ICONS[key]}}/>
    </span>
  );
}

/* The grid of icons a manager picks from when creating / editing a consumable. */
function ConsumableIconGrid({ value, onChange }) {
  return (
    <div className="icon-grid">
      {CONSUMABLE_ICON_KEYS.map(k=>(
        <button type="button" key={k} title={k.replace(/-/g,' ')} aria-pressed={value===k}
          className={`icon-opt ${value===k?'selected':''}`} onClick={()=>onChange(k)}>
          <ConsumableIcon name={k} size={30}/>
        </button>
      ))}
    </div>
  );
}

/* Small icons (with a quantity badge) shown in the issue tables. */
function ConsumableStrip({ items }) {
  if (!items || items.length === 0) return null;
  return (
    <div className="cstrip">
      {items.map((c,i)=>(
        <span key={i} className="cstrip-item" title={`${c.item} × ${c.quantity}`}>
          <ConsumableIcon name={c.icon} size={22}/>
          {c.quantity > 1 && <span className="cstrip-qty">{c.quantity}</span>}
        </span>
      ))}
    </div>
  );
}

/* The dialog opened by "Add consumables". Works on a draft copy of the selection;
   nothing changes on the issue until the user presses Done. */
function ConsumablePicker({ items, value, onCancel, onDone }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [draft, setDraft] = useState(value);   // [{itemId, quantity}]
  const [query, setQuery] = useState('');

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);

  const byId = useMemo(()=>Object.fromEntries(draft.map(d=>[d.itemId,d])), [draft]);
  const q = query.trim().toLowerCase();
  const shown = q ? items.filter(it=>it.name.toLowerCase().includes(q)) : items;

  function toggle(id) {
    setDraft(d => d.some(x=>x.itemId===id) ? d.filter(x=>x.itemId!==id) : [...d, {itemId:id, quantity:1}]);
  }
  // Works from the latest state (not the last render), so fast clicks never lose a step.
  function bump(id, delta) {
    setDraft(d => d.flatMap(x => {
      if (x.itemId !== id) return [x];
      const qty = x.quantity + delta;
      return qty < 1 ? [] : [{...x, quantity: Math.min(qty, MAX_CONSUMABLE_QTY)}];  // stepping down from 1 un-selects it
    }));
  }

  return (
    <div className="modal-overlay picker-overlay" onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="modal picker-modal" role="dialog" aria-modal="true" aria-label={t.consumablePickerTitle}>
        <div className="modal-header">
          <div>
            <h2>{t.consumablePickerTitle}</h2>
            <div className="picker-sub">{t.consumablePickerSub}</div>
          </div>
          <button type="button" className="icon-btn" onClick={onCancel}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {items.length > 8 && (
            <div className="search-wrap" style={{width:'100%'}}>
              {Ic.search}
              <input placeholder={t.consumableSearch} value={query} onChange={e=>setQuery(e.target.value)} autoFocus/>
            </div>
          )}
          {items.length === 0 ? (
            <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.box}<p>{t.consumableNone}</p></div>
          ) : shown.length === 0 ? (
            <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.search}<p>{t.consumableNoMatch}</p></div>
          ) : (
            <div className="cpick-grid">
              {shown.map(it=>{
                const sel = byId[it.id];
                return (
                  <div key={it.id} role="button" tabIndex={0} aria-pressed={!!sel}
                    className={`cpick-card ${sel?'selected':''}`}
                    onClick={()=>toggle(it.id)}
                    onKeyDown={e=>{ if (e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(it.id); } }}>
                    <span className="cpick-check">{Ic.check}</span>
                    <ConsumableIcon name={it.icon} size={48}/>
                    <span className="cpick-name">{it.name}</span>
                    {sel ? (
                      <div className="cpick-stepper" onClick={e=>e.stopPropagation()} onKeyDown={e=>e.stopPropagation()}>
                        <button type="button" aria-label="−" onClick={()=>bump(it.id, -1)}>{Ic.minus}</button>
                        <span>{sel.quantity}</span>
                        <button type="button" aria-label="+" onClick={()=>bump(it.id, +1)}>{Ic.plus}</button>
                      </div>
                    ) : (
                      <span className="cpick-hint">{t.consumableTapToAdd}</span>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button type="button" className="btn btn-ghost" onClick={onCancel}>{t.cancel}</button>
          <button type="button" className="btn btn-primary" onClick={()=>onDone(draft)}>
            {Ic.check} {t.consumableDone}{draft.length > 0 ? ` (${draft.length})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

function IssueModal({ issueMode, editIssue, currentUser, issueTypes, departments, connectaAgents, consumableItems, token, onClose, onSave }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const isEdit = !!editIssue;
  const typeNames = (issueTypes || []).map(it => it.name);
  if (isEdit && editIssue.type && !typeNames.includes(editIssue.type)) {
    typeNames.unshift(editIssue.type);
  }
  const deptNames = (departments || []).map(d => d.name);
  if (isEdit && editIssue.dept && !deptNames.includes(editIssue.dept)) {
    deptNames.unshift(editIssue.dept);
  }
  const agentNames = (connectaAgents || []).map(a => a.name);
  if (isEdit && editIssue.reportedByAgent && !agentNames.includes(editIssue.reportedByAgent)) {
    agentNames.unshift(editIssue.reportedByAgent);
  }
  if (isEdit && editIssue.confirmedByAgent && !agentNames.includes(editIssue.confirmedByAgent)) {
    agentNames.unshift(editIssue.confirmedByAgent);
  }
  const firstType = typeNames[0] || '';
  const catalogById = Object.fromEntries((consumableItems || []).map(ci => [ci.id, ci]));
  const defaults = issueMode==='apt'
    ? {apt:'', type:firstType, problem:'', resolution:'', startTime:'', endTime:'', status:'Ok', reportedByAgent:'', confirmedByAgent:'', falsePositive:false, consumables:[]}
    : {dept:'',type:firstType, problem:'', resolution:'', startTime:'', endTime:'', status:'Ok', reportedByAgent:'', confirmedByAgent:'', falsePositive:false, consumables:[]};
  const [form, setForm] = useState(isEdit ? {
    apt:        editIssue.apt||'',
    dept:       editIssue.dept||'',
    type:       editIssue.type,
    problem:    editIssue.problem,
    resolution: editIssue.resolution,
    // Use the actual start/end times the issue was logged with. Only
    // issues logged before this feature existed lack them — for those
    // legacy rows only, fall back to a placeholder pair ending "now" that
    // reproduces the existing total duration, since real clock times were
    // never recorded for them.
    ...(editIssue.startTime && editIssue.endTime
      ? { startTime: editIssue.startTime, endTime: editIssue.endTime }
      : (() => {
          const end = new Date();
          const start = new Date(end.getTime() - editIssue.time*60000);
          const toHM = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
          return { startTime: toHM(start), endTime: toHM(end) };
        })()
    ),
    status:           editIssue.status,
    reportedByAgent:  editIssue.reportedByAgent || '',
    confirmedByAgent: editIssue.confirmedByAgent || '',
    falsePositive: !!editIssue.falsePositive,
    // Only items still in the catalog can be edited here. Usage recorded against
    // an item that has since been removed is kept on the server untouched.
    consumables: (editIssue.consumables || [])
      .filter(c => c.itemId != null && catalogById[c.itemId])
      .map(c => ({ itemId: c.itemId, quantity: c.quantity })),
  } : defaults);
  const [pickerOpen, setPickerOpen] = useState(false);
  const selectedConsumables = form.consumables
    .map(c => ({ ...c, ...catalogById[c.itemId] }))     // adds name + icon
    .filter(c => c.name);

  function set(k,v) { setForm(f=>({...f,[k]:v})); }
  const duration = useMemo(()=>computeDurationMinutes(form.startTime, form.endTime), [form.startTime, form.endTime]);
  const timeRangeInvalid = form.startTime && form.endTime && duration === null;
  const valid = (issueMode==='apt'
    ? form.apt && form.type && form.problem && form.resolution
    : form.dept && form.type && form.problem && form.resolution
  ) && duration !== null;

  // Recurring-issue check: once a location + type are picked, ask the
  // backend (debounced) whether this same issue type has already happened
  // there within the manager-configured window.
  const location = issueMode==='apt' ? form.apt : form.dept;
  const [dupeInfo, setDupeInfo] = useState(null); // {count, window_hours, issues}
  useEffect(() => {
    if (!location || !form.type || !token) { setDupeInfo(null); return; }
    const handle = setTimeout(() => {
      const params = new URLSearchParams({ mode: issueMode, location, type: form.type });
      if (isEdit) params.set('exclude_id', String(editIssue.id));
      apiFetch(`/issue-duplicates?${params.toString()}`, {token})
        .then(res => setDupeInfo(res))
        .catch(() => {}); // non-critical — fail silently, don't block logging
    }, 400);
    return () => clearTimeout(handle);
  }, [location, form.type, issueMode, token, isEdit, editIssue?.id]);

  return (
    <>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h2>{isEdit ? t.editIssue : (issueMode==='apt' ? t.logAptIssue : t.logDeptIssue)}</h2>
          <button className="icon-btn" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            {issueMode==='apt' ? (
              <div className="form-group">
                <label>{t.aptNum}</label>
                <input className="form-control" placeholder="e.g. 1234" value={form.apt} onChange={e=>set('apt',e.target.value)} />
              </div>
            ) : (
              <div className="form-group">
                <label>{t.department}</label>
                <select className="form-control" value={form.dept} onChange={e=>set('dept',e.target.value)}>
                  <option value="">{t.selectDept}</option>
                  {deptNames.map(d=><option key={d}>{d}</option>)}
                </select>
              </div>
            )}
            <div className="form-group">
              <label>{t.issueType}</label>
              <select className="form-control" value={form.type} onChange={e=>set('type',e.target.value)}>
                {typeNames.length === 0 && <option value="">{t.selectDept}</option>}
                {typeNames.map(t2=><option key={t2}>{t2}</option>)}
              </select>
            </div>
          </div>
          {dupeInfo && dupeInfo.count > 0 && (
            <div style={{background:'var(--amber-light)',borderRadius:'var(--radius-md)',padding:'10px 14px',fontSize:13,color:'var(--amber)',display:'flex',alignItems:'flex-start',gap:8}}>
              <span style={{flexShrink:0,marginTop:1}}>{Ic.clock}</span>
              <div>
                <strong>{t.duplicateAlertTitle}.</strong>{' '}
                {duplicateAlertMessage(lang, dupeInfo.count, location, dupeInfo.window_hours)}
              </div>
            </div>
          )}
          <div className="form-group">
            <label>{t.problemDesc}</label>
            <input className="form-control" placeholder={t.descPlaceholder} value={form.problem} onChange={e=>set('problem',e.target.value)} />
          </div>
          <div className="form-group">
            <label>{t.resolutionLabel}</label>
            <input className="form-control" placeholder={t.resolutionPlaceholder} value={form.resolution} onChange={e=>set('resolution',e.target.value)} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>{t.startTime}</label>
              <input className="form-control" type="time" lang="sv-SE" value={form.startTime} onChange={e=>set('startTime',e.target.value)} />
            </div>
            <div className="form-group">
              <label>{t.endTime}</label>
              <input className="form-control" type="time" lang="sv-SE" value={form.endTime} onChange={e=>set('endTime',e.target.value)} />
            </div>
          </div>
          <div className="form-group">
            <label>{t.statusLabel}</label>
            <select className="form-control" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="Ok">{t.statusOk}</option>
              <option value="Pending">{t.statusPending}</option>
            </select>
          </div>
          <label className={`fp-check ${form.falsePositive ? 'checked' : ''}`}>
            <input type="checkbox" checked={form.falsePositive} onChange={e=>set('falsePositive', e.target.checked)}/>
            <span className="fp-box">{Ic.check}</span>
            <span>
              <span className="fp-title">{t.falsePositiveLabel}</span>
              <span className="fp-sub">{t.falsePositiveHint}</span>
            </span>
          </label>
          <div className="form-group">
            <label>{t.consumablesLabel}</label>
            <div className={`consumable-box ${selectedConsumables.length ? 'has-items' : ''}`}>
              {selectedConsumables.map(c=>(
                <span className="consumable-chip" key={c.itemId}>
                  <ConsumableIcon name={c.icon} size={22}/>
                  <span className="consumable-chip-name">{c.name}</span>
                  {c.quantity > 1 && <span className="consumable-chip-qty">×{c.quantity}</span>}
                  <button type="button" className="consumable-chip-x" aria-label={t.consumableRemove}
                    onClick={()=>set('consumables', form.consumables.filter(x=>x.itemId!==c.itemId))}>{Ic.x}</button>
                </span>
              ))}
              <button type="button" className="consumable-add-btn" onClick={()=>setPickerOpen(true)}>
                {selectedConsumables.length ? Ic.edit : Ic.plus} {selectedConsumables.length ? t.editConsumables : t.addConsumables}
              </button>
            </div>
          </div>
          <div className="form-row">
            <div className="form-group">
              <label>{t.reportedByAgent}</label>
              <select className="form-control" value={form.reportedByAgent} onChange={e=>set('reportedByAgent',e.target.value)}>
                <option value="">{t.noAgentSelected}</option>
                {agentNames.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>{t.confirmedByAgent}</label>
              <select className="form-control" value={form.confirmedByAgent} onChange={e=>set('confirmedByAgent',e.target.value)}>
                <option value="">{t.noAgentSelected}</option>
                {agentNames.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
          </div>
          {timeRangeInvalid ? (
            <div style={{fontSize:12.5,color:'var(--red)',marginTop:-8}}>{t.invalidTimeRange}</div>
          ) : duration !== null ? (
            <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:-8}}>{t.duration}: <strong style={{color:'var(--gray-600)'}}>{duration}m</strong></div>
          ) : null}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
          <button className="btn btn-primary" disabled={!valid} onClick={()=>{onSave({...form,time:duration,reportedByAgent:form.reportedByAgent||null,confirmedByAgent:form.confirmedByAgent||null});onClose();}}>
            {Ic.check} {isEdit ? t.saveChanges : t.logIssue}
          </button>
        </div>
      </div>
    </div>
    {pickerOpen && (
      <ConsumablePicker items={consumableItems || []} value={form.consumables}
        onCancel={()=>setPickerOpen(false)}
        onDone={sel=>{ set('consumables', sel); setPickerOpen(false); }}/>
    )}
    </>
  );
}

/* ════════════════ DASHBOARD ════════════════ */
function Dashboard({ apt, dept, users, stats }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];

  // Fall back to local computation while stats load
  const all = [...apt,...dept];
  const totalIssues  = stats ? stats.total_issues  : all.length;
  const resolved     = stats ? stats.resolved       : all.filter(i=>i.status==='Ok').length;
  const avgTime      = stats ? stats.avg_minutes.toFixed(1) : (all.length ? (all.reduce((s,i)=>s+Number(i.time),0)/all.length).toFixed(1) : '—');
  const byType       = stats ? stats.by_type        : (() => { const m={}; all.forEach(i=>{m[i.type]=(m[i.type]||0)+1;}); return m; })();
  const byTech       = stats ? stats.by_technician  : [];
  const maxWork      = Math.max(...(byTech.map(t=>t.count)), 1);
  const maxType      = Math.max(...Object.values(byType), 1);
  const activeTechs  = users.filter(u=>u.role==='technician');

  return (
    <div>
      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-label">{t.totalToday}</div>
          <div className="stat-value">{totalIssues}</div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#1769AA'}}></span>{t.aptsAndDepts}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.resolved}</div>
          <div className="stat-value" style={{color:'#2E8B57'}}>{resolved}</div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#639922'}}></span>{totalIssues ? Math.round(resolved/totalIssues*100) : 0}{t.resolutionRate}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.avgTime}</div>
          <div className="stat-value">{avgTime}<span style={{fontSize:14,fontWeight:400,color:'var(--gray-400)'}}>m</span></div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#EF9F27'}}></span>{t.acrossAll}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.activeTechs}</div>
          <div className="stat-value">{activeTechs.length}</div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'#9FE1CB'}}></span>{activeTechs.map(u=>u.name).join(' · ')||'—'}</div>
        </div>
      </div>
      <div className="bottom-grid">
        <div className="mini-card">
          <div className="mini-card-title">{t.workload}</div>
          {byTech.length===0 && <p style={{color:'var(--gray-400)',fontSize:13}}>{t.noTechs}</p>}
          {byTech.map(ts=>(
            <div className="bar-row" key={ts.user_id}>
              <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxWork)*100}%`,background:'#1769AA'}}></div></div>
              <div className="bar-count">{ts.count}</div>
            </div>
          ))}
        </div>
        <div className="mini-card">
          <div className="mini-card-title">{t.byType}</div>
          {Object.keys(byType).length===0 && <p style={{color:'var(--gray-400)',fontSize:13}}>{t.noIssues}</p>}
          {Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
            <div className="bar-row" key={type}>
              <div className="bar-label">
                <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                {type}
              </div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
              <div className="bar-count">{count}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ════════════════ ISSUES TABLE ════════════════ */
function IssuesTable({ issues, tableMode, currentUser, newIssueId, onDelete, onEdit }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');
  const types    = [t.all,...Array.from(new Set(issues.map(i=>i.type)))];
  const filtered = useMemo(()=>issues.filter(i=>{
    const ok1 = filter===t.all||i.type===filter;
    const q   = search.toLowerCase();
    const ok2 = !q||(i.apt||i.dept||'').toLowerCase().includes(q)||i.problem.toLowerCase().includes(q)||i.loggedByName.toLowerCase().includes(q)||i.type.toLowerCase().includes(q);
    return ok1&&ok2;
  }),[issues,filter,search,t.all]);

  const canAct = issue => currentUser.role==='manager' || issue.loggedBy===currentUser.id;

  return (
    <div className="table-card">
      <div className="table-header">
        <span className="table-title">{tableMode==='apt' ? t.aptIssuesTitle : t.deptIssuesTitle}</span>
        <div className="table-actions">
          <div className="filter-chips">
            {types.map(tp=><button key={tp} className={`chip ${filter===tp?'active':''}`} onClick={()=>setFilter(tp)}>{tp}</button>)}
          </div>
          <div className="search-wrap">
            {Ic.search}
            <input placeholder={tableMode==='apt' ? t.searchApt : t.searchDept} value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
        </div>
      </div>
      {filtered.length===0 ? (
        <div className="empty-state">{Ic.list}<p>{t.noMatch}</p></div>
      ) : (
        <table>
          <thead>
            <tr>
              <th>{tableMode==='apt' ? t.apt : t.dept}</th>
              <th>{t.type}</th><th>{t.problem}</th><th>{t.resolution}</th><th>{t.time}</th><th>{t.status}</th><th>{t.loggedBy}</th><th></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(issue=>(
              <tr key={issue.id} className={issue.id===newIssueId ? 'row-enter' : ''}>
                <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{issue.apt||issue.dept}</strong></td>
                <td><TypeBadge type={issue.type}/></td>
                <td style={{maxWidth:150}}>{issue.problem}{issue.falsePositive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}<ConsumableStrip items={issue.consumables}/></td>
                <td style={{maxWidth:190,color:'var(--gray-600)',fontSize:13}}>{issue.resolution}</td>
                <td style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{issue.time}m</td>
                <td><span className={`badge ${issue.status==='Ok'?'badge-ok':'badge-pending'} ${issue.id===newIssueId ? 'status-highlight' : ''}`}>{issue.status}</span></td>
                <td>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <Avatar name={issue.loggedByName} idx={issue.loggedByIdx??0} size="sm"/>
                    <span style={{fontSize:13,color:'var(--gray-600)'}}>{issue.loggedByName}</span>
                    {issue.loggedBy===currentUser.id && (
                      <span className="badge" style={{background:'var(--blue-light)',color:'var(--blue)',fontSize:10,padding:'1px 6px'}}>{t.you}</span>
                    )}
                  </div>
                </td>
                <td>
                  <div className="action-cell">
                    {canAct(issue) ? (
                      <>
                        <button className="icon-btn" title={t.saveChanges} onClick={()=>onEdit(issue,tableMode)}>{Ic.edit}</button>
                        <button className="icon-btn danger" title={t.toastDeleted} onClick={()=>onDelete(issue.id,tableMode)}>{Ic.trash}</button>
                      </>
                    ) : (
                      <span style={{fontSize:11,color:'var(--gray-300)',padding:'0 8px',userSelect:'none'}} title="Only the owner or a manager can edit this">—</span>
                    )}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

/* ════════════════ HISTORY PAGE ════════════════ */
function HistoryPage({ apt, dept, currentUser, onDelete, onEdit }) {

        <input
          type="date" className="form-control" style={{width:'auto'}}
          value={date} max={todayStr}
          onChange={e=>setDate(e.target.value)}

        <button className="btn btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>setDate(todayStr)}>{t.historyToday}</button>
        <button className="btn btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>setDate('')}>{t.historyAllDates}</button>

}

/* ════════════════ ALERTS PAGE ════════════════ */
function AlertsPage({ alerts, currentUser, token, onAlertsUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const isManager = currentUser.role === 'manager';
  const [filter, setFilter] = useState('pending');
  const [solvingId, setSolvingId] = useState(null);
  const [solutionText, setSolutionText] = useState('');
  const [saving, setSaving] = useState(false);

  const list = alerts || [];
  const pendingCount = list.filter(a => a.status === 'pending').length;
  const solvedCount = list.filter(a => a.status === 'solved').length;
  const filtered = list.filter(a => a.status === filter);

  async function submitSolve(id) {
    const trimmed = solutionText.trim();
    if (!trimmed) return;
    setSaving(true);
    try {
      const res = await apiFetch(`/alerts/${id}/solve`, {method:'PATCH', body:{solution:trimmed}, token});
      onAlertsUpdate(prev => prev.map(a => a.id===id ? {...a, ...res.alert} : a));
      setSolvingId(null);
      setSolutionText('');
      setToast(t.alertSolved);
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSaving(false); }
  }

  async function removeAlert(id) {
    try {
      await apiFetch(`/alerts/${id}`, {method:'DELETE', token});
      onAlertsUpdate(prev => prev.filter(a => a.id !== id));
      setToast(t.alertDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  return (
    <div>
      <div className="table-card" style={{marginBottom:16,padding:'14px 20px'}}>
        <p style={{fontSize:13,color:'var(--gray-400)',margin:0}}>{t.alertsSubtitle}</p>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <button className={`chip ${filter==='pending'?'active':''}`} onClick={()=>setFilter('pending')}>
          {t.alertsPending} ({pendingCount})
        </button>
        <button className={`chip ${filter==='solved'?'active':''}`} onClick={()=>setFilter('solved')}>
          {t.alertsSolved} ({solvedCount})
        </button>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">{Ic.bell}<p>{filter==='pending' ? t.alertsEmpty : t.alertsSolvedEmpty}</p></div>
      ) : filtered.map(alert => (
        <div className="table-card" key={alert.id} style={{marginBottom:16}}>
          <div className="table-header">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{color: alert.status==='solved' ? 'var(--green)' : 'var(--amber)'}}>{Ic.bell}</span>
              <span className="table-title">{alert.location}</span>
              <TypeBadge type={alert.type}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{alert.issues.length} {t.alertsOccurrences}</span>
              {isManager && alert.status==='pending' && solvingId!==alert.id && (
                <button className="btn btn-ghost" style={{padding:'4px 10px',fontSize:12}}
                  onClick={()=>{setSolvingId(alert.id); setSolutionText('');}}>
                  {t.markSolved}
                </button>
              )}
              {isManager && (
                <button className="icon-btn" title={t.deleteAlert} onClick={()=>removeAlert(alert.id)}>{Ic.trash}</button>
              )}
            </div>
          </div>

/* Formats a current-vs-previous change: {pct, dir, color}. goodDirection
   is 'up', 'down', or 'neutral' — determines whether an increase should be
   shown as good (green) or bad (red). */
function analyticsChange(current, previous, goodDirection) {
  if (previous === 0) {
    if (current === 0) return null;
    const dir = current > 0 ? 'up' : 'down';
    return { pct: null, dir, color: analyticsChangeColor(dir, goodDirection) };
  }
  const pct = ((current - previous) / previous) * 100;
  if (Math.abs(pct) < 0.5) return { pct: 0, dir: 'flat', color: 'var(--gray-400)' };
  const dir = pct > 0 ? 'up' : 'down';
  return { pct, dir, color: analyticsChangeColor(dir, goodDirection) };
}
function analyticsChangeColor(dir, goodDirection) {
  if (goodDirection === 'neutral') return 'var(--gray-400)';
  const isGood = (dir === 'up' && goodDirection === 'up') || (dir === 'down' && goodDirection === 'down');
  return isGood ? 'var(--green)' : 'var(--red)';
}

function AnalyticsMetricCard({ label, current, previous, suffix, decimals, goodDirection, t }) {
  const change = analyticsChange(current, previous, goodDirection);
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value">{current.toFixed(decimals||0)}{suffix||''}</div>
      <div className="stat-sub">
        {change && change.dir !== 'flat' && (
          <span style={{color:change.color,fontWeight:600}}>
            {change.dir==='up' ? '▲' : '▼'} {change.pct!=null ? Math.abs(change.pct).toFixed(0)+'%' : ''}
          </span>
        )}
        <span style={{color:'var(--gray-400)'}}>{t.vsPrevious}</span>
      </div>
    </div>
  );
}

    // "FALSE POSITIVE" pill under the problem text. The pill is drawn over an extra
    // blank line (added to the problem text below) so it never overlaps the text.
    const fpFill = [255, 244, 224];
    const withFalsePositiveMarks = (issues, problemCol, statusHook) => ({
      didParseCell: (data) => {
        if (data.section !== 'body') return;
        if (statusHook) statusHook(data);
        if (issues[data.row.index]?.false_positive) data.cell.styles.fillColor = fpFill;
      },
      didDrawCell: (data) => {
        if (data.section !== 'body' || !issues[data.row.index]?.false_positive) return;
        if (data.column.index === 0) {
          doc.setFillColor(...amber);
          doc.rect(data.cell.x, data.cell.y, 1.2, data.cell.height, 'F');

        if (data.column.index === problemCol) {
          const pillW = 24, pillH = 3.6;

    doc.text('Summary', 10, y); y += 5;

    const cards = [
      {label:'Total Issues',    value: String(report.summary.total_issues),  color: blue},
