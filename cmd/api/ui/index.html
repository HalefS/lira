<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LIRA — Llana IT Reporting & Alerts</title>
<!-- Fonts are served from this binary, in the woff2 files Google itself hands
     out for this exact request, with the unicode-ranges it sends. Served from
     here for the same reason React is: a <link> to a font host is render
     blocking, so first paint waits on their DNS and TLS -- measured at 0.75s
     cold from this machine, and unbounded on a hotel network that throttles or
     blocks outside traffic. Self-hosted, the cost is a local request the app
     already knows how to make.
     Latin only, which is all this app needs: it renders English and Portuguese,
     and both sit inside U+0000-00FF. The latin-ext files were dropped because
     nothing the app can display uses a character they cover. The box-drawing
     characters in the tables, the arrows and the flag emoji already fall back to
     a system font today, and still do. -->
<style>
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  /* One file for the whole 400-600 range: DM Sans ships as a variable font, so
     the three weights the app asks for are one file, not three. */
  font-weight: 400 600;
  font-display: swap;
  src: url(/vendor/dmsans-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA-02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'DM Sans';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(/vendor/dmsans-italic-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA-02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'DM Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(/vendor/dmmono-400-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA-02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'DM Mono';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url(/vendor/dmmono-500-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA-02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
</style>
<script>try{if(localStorage.getItem('lira_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<!-- React is served from this binary rather than a CDN, in its production
     build: the development builds are ~8x larger and carry warnings that are
     never seen in production. The version is in the filename so that upgrading
     React changes the URL and no browser can keep serving a stale copy. -->
<script src="/vendor/react-18.3.1.production.min.js"></script>
<script src="/vendor/react-dom-18.3.1.production.min.js"></script>
<!-- GSAP drives the page transition, the dashboard counters and the bars.
     Core only: the plugins are not needed for any of them. Served from the
     binary like React rather than a CDN, because the app should not stop
     working when the hotel's network does. The version is in the filename, so
     upgrading it is a new URL and no browser can be holding a stale copy. -->
<script src="/vendor/gsap-3.15.0.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:        #1769AA;
  --blue-hover:  #125480;
  --blue-light:  #E8F2FC;
  --blue-mid:    #A9D1F0;
  --teal:        #1D9E75;
  --teal-light:  #E1F5EE;
  --teal-mid:    #9FE1CB;
  /* Orange sits between the amber and the red on purpose. Amber is too close to
     white to carry 13px text -- #D88A18 on #FFF4DF measures 2.54:1 -- and red is
     this app's error colour, already spoken for by the API error banner and every
     "incorrect details" message. This pair is a deeper, redder orange that clears
     4.5:1 against its own wash (4.9:1) while still reading as caution rather than
     as something having gone wrong. */
  --orange:      #C2410C;
  --orange-light:#FFF7ED;
  --amber:       #D88A18;
  --amber-light: #FFF4DF;
  --green:       #2E8B57;
  --green-light: #EAF6EE;
  /* Red is used as ink on its own wash more often than as a fill, and #D94B4B on
     --red-light measured 3.57:1 -- passing as large text only, while the SLA
     breach pill and the overdue badges on the maintenance card are both small.
     #C13A3A reaches 4.59:1 on the same wash. The dark value is a separate colour
     for a separate surface; do not assume this one carries over. */
  --red:         #C13A3A;
  --red-light:   #FBEAEA;
  --red-mid:     #F0B8B8;
  --gray-50:     #FAFAF8;
  --gray-100:    #F5F4F0;
  --gray-200:    #E4E5E7;
  --gray-300:    #D2D4D7;
  /* The app's secondary text, and it carries nearly all of it: table headers,
     stat labels, tile captions, metadata lines, placeholders. #7A8490 measured
     3.63:1 on --gray-50, 3.80:1 on white and 3.45:1 on --gray-100, so it failed
     AA on every surface it was used on -- but only in this theme. The dark value
     below sits at 5.33:1 on its card surface, which is why a dark-only audit
     never saw it. #5F6A78 clears 4.5:1 on all three. */
  --gray-400:    #5F6A78;
  --gray-600:    #4B5563;
  --gray-900:    #17202A;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --shadow-md:   0 4px 20px rgba(0,0,0,0.10);
  --shadow-lg:   0 8px 40px rgba(0,0,0,0.14);
}

html.dark {
  /* A dark --blue is mostly ink on a tinted fill rather than a fill itself, and
     --blue-light is the tint it lands on for every "you are here" state -- the
     active nav item, the selected chip, the active language button, the printer
     chip, the avatar, the tick on the chosen room. #4C9FE0 on #123655 measured
     4.36:1, so all ten of those failed. #5FB0E8 reaches 5.26:1 on the same tint
     and 6.98:1 on the card surface, which is where the rest of it is used. */
  --blue:        #5FB0E8;
  --blue-hover:  #79BCEE;
  --blue-light:  #123655;
  --blue-mid:    #1D5F91;
  --teal:        #5DCAA5;
  --teal-light:  #085041;
  --teal-mid:    #0F6E56;
  /* Lightened for a dark surface, the same way --red and --amber are: a mid-dark
     wash with a bright hue on it, 5.9:1 here. */
  --orange:      #F59B5C;
  --orange-light:#4A2A10;
  --amber:       #F0A63C;
  --amber-light: #4A320D;
  --green:       #52B37F;
  --green-light: #17301F;
  --red:         #E8817E;
  --red-light:   #4A1E1E;
  --red-mid:     #7A3232;
  --gray-50:     #1B1F25;
  --gray-100:    #12151A;
  --gray-200:    #262B33;
  --gray-300:    #3A4048;
  --gray-400:    #8A93A0;
  --gray-600:    #C3C9D1;
  --gray-900:    #EDEFF2;
  --shadow-md:   0 4px 20px rgba(0,0,0,0.40);
  --shadow-lg:   0 8px 40px rgba(0,0,0,0.55);
}

/* ── theme toggle ── */
.theme-btn {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  border: 1px solid var(--gray-200); background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s; flex-shrink: 0; position: relative; overflow: hidden;
}
html.dark .theme-btn { background: var(--gray-50); border-color: var(--gray-300); }
.theme-btn:hover { background: var(--gray-100); border-color: var(--gray-300); }
html.dark .theme-btn:hover { background: var(--gray-200); }
.theme-btn svg { width: 16px; height: 16px; transition: transform 0.3s, opacity 0.2s; }
.theme-icon-sun  { color: #D88A18; }
.theme-icon-moon { color: #1769AA; }
html, body, #root { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: var(--gray-100); color: var(--gray-900); font-size: 14px; line-height: 1.5; transition: background 0.2s, color 0.2s; }

/* ── Auth ── */
.auth-screen { min-height: 100vh; display: flex; }
.auth-left {
  width: 400px; min-width: 400px; background: var(--blue);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 48px 44px; position: relative; overflow: hidden;
}
.auth-left::before {
  content: ''; position: absolute; top: -80px; right: -80px;
  width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,0.07);
}
.auth-left::after {
  content: ''; position: absolute; bottom: -60px; left: -60px;
  width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.05);
}
.auth-brand { position: relative; z-index: 1; }
.auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
.auth-logo-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;
}
.auth-logo-mark svg { width: 20px; height: 20px; }
.auth-logo-name { font-size: 18px; font-weight: 600; color: #fff; }
.auth-headline { font-size: 26px; font-weight: 600; color: #fff; line-height: 1.35; margin-bottom: 14px; }
.auth-sub { font-size: 13.5px; color: rgba(255,255,255,0.65); line-height: 1.65; }
.auth-features { position: relative; z-index: 1; }
.auth-feature {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-top: 1px solid rgba(255,255,255,0.1); font-size: 13px; color: rgba(255,255,255,0.78);
}
.auth-feature-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); flex-shrink: 0; }
.auth-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
.auth-card {
  background: #fff; border-radius: var(--radius-xl); border: 1px solid var(--gray-200);
  padding: 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md);
  animation: fadeUp 0.22s ease;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.auth-card-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.auth-card-sub { font-size: 13px; color: var(--gray-400); margin-bottom: 28px; }
.auth-form { display: flex; flex-direction: column; gap: 14px; }
.auth-toggle { text-align: center; font-size: 13px; color: var(--gray-400); margin-top: 20px; }
.auth-toggle button {
  background: none; border: none; color: var(--blue); font-weight: 500;
  cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif;
  text-decoration: underline; text-underline-offset: 2px;
}
.auth-error {
  background: var(--red-light); color: var(--red);
  border: 1px solid var(--red-mid); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px;
}
/* Not an error. Being signed out for inactivity is the app working, so this is
   stated in the same blue as the rest of the informational furniture rather than
   in the red of a failure, and it sits above the form where it is read before the
   email field rather than after a failed attempt to use it. */
.auth-notice {
  background: var(--blue-light); color: var(--blue);
  border: 1px solid var(--blue-mid); border-radius: var(--radius-md);
  padding: 11px 14px; font-size: 13px; line-height: 1.45; margin-bottom: 18px;
  display: flex; align-items: flex-start; gap: 8px;
}
.auth-notice svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }
.demo-box {
  margin-top: 16px; padding: 12px 14px;
  background: var(--gray-50); border-radius: var(--radius-md); border: 1px solid var(--gray-200);
}
.demo-box-label { font-size: 10px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
.demo-row { font-size: 12px; color: var(--gray-600); padding: 2px 0; }
.demo-sep { color: var(--gray-300); margin: 0 6px; }

/* ── App layout ── */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 230px; min-width: 230px; background: #fff;
  border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; overflow-y: auto;
}
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: #fff; border-bottom: 1px solid var(--gray-200); padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* A message that sits under the topbar and applies to the whole page rather than
   to one panel: an API error, and the inactivity warning.

   The svg rule is not decoration. These icons carry only a viewBox, which gives
   an inline SVG no intrinsic size of its own, so with nothing to size it a flex
   row hands it whatever width is going and a one-line message renders as a
   several-hundred-pixel slab with a giant icon in it. The API error banner had
   been doing exactly that for as long as it had existed. */
.page-banner {
  margin: 16px 28px 0; border-radius: var(--radius-md); padding: 11px 16px;
  font-size: 13px; display: flex; align-items: center; gap: 9px;
}
.page-banner svg { width: 15px; height: 15px; flex-shrink: 0; }
.page-banner-error   { background: var(--red-light);    color: var(--red); }
.page-banner-warning { background: var(--orange-light); color: var(--orange); border: 1px solid var(--orange); }
.page-banner-dismiss { margin-left: auto; background: none; border: none; cursor: pointer; color: inherit; }

/* ── Sidebar ── */
.sidebar-logo {
  padding: 20px 18px 18px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--gray-200);
}
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px; background: var(--blue);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo-mark svg { width: 16px; height: 16px; }
.logo-text { font-size: 15px; font-weight: 600; }
.logo-sub { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
.sidebar-section { padding: 16px 10px 6px; }
.sidebar-section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--gray-400); padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-md);
  font-size: 13.5px; color: var(--gray-600); cursor: pointer; transition: all 0.12s;
  border: none; background: none; width: 100%; text-align: left; user-select: none;
}
.nav-item:hover { background: var(--gray-100); color: var(--gray-900); }
.nav-item.active { background: var(--blue-light); color: var(--blue); font-weight: 500; }

/* ── Collapsible nav group ────────────────────────────────────────────── */
/* A group is a parent button that reveals its children; the chevron rotates to
   show whether it is open. The parent is not itself a destination, so it never
   takes the .active class -- a child does instead. */
.nav-group-chevron {
  display: flex; align-items: center; flex-shrink: 0;
  transition: transform 0.15s ease;
}
/* Sized here rather than left to the flex default, which stretches an unsized
   svg to hundreds of pixels. The selector repeats .nav-item to outrank the
   generic `.nav-item svg` sizing that comes later in this stylesheet. */
.nav-item .nav-group-chevron svg { width: 12px; height: 12px; }
.nav-group-toggle.open .nav-group-chevron { transform: rotate(90deg); }
/* A group holding the current page stays marked while collapsed, so the user can
   still see where they are without opening it. */
.nav-group-toggle.contains-active { color: var(--blue); }
.nav-group-children { padding-left: 20px; }
.nav-item-child { font-size: 13px; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-icon-wrap { position: relative; display: inline-flex; }
.nav-badge {
  position: absolute; top: -6px; right: -8px;
  background: var(--red); color: #fff;
  font-size: 10px; font-weight: 600; line-height: 1;
  min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 999px; display: flex; align-items: center; justify-content: center;
}
.sidebar-footer { margin-top: auto; padding: 10px 10px 12px; border-top: 1px solid var(--gray-200); }
/* A <button>, not a div with an onClick: this is the only route to Profile from
   the footer, and as a div it was unreachable by keyboard and announced as plain
   text. The resets below are what a bare <button> brings that a <div> did not --
   UA font, border, background and centring -- so the row looks exactly as it did
   while finally being operable. */
.sidebar-user {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 2px;
  width: 100%; border: none; background: none; border-radius: var(--radius-md);
  color: inherit; font-family: 'DM Sans', sans-serif; text-align: left;
  cursor: pointer; transition: all 0.12s;
}
.sidebar-user:hover { background: var(--gray-100); }
.sidebar-user:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sidebar-user-name { font-size: 13px; font-weight: 500; }
.sidebar-user-role { font-size: 11px; color: var(--gray-400); text-transform: capitalize; }
.logout-btn {
  width: 100%; padding: 8px 10px; border-radius: var(--radius-md);
  border: none; background: none; color: var(--gray-600);
  font-size: 13.5px; font-weight: 400; cursor: pointer; font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; gap: 9px; transition: all 0.12s; text-align: left;
}
.logout-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.logout-btn:hover { background: var(--red-light); color: var(--red); }

/* ── Avatar ── */
.avatar-circle {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
}
/* An uploaded photo occupies the same circle as the initials, cropped to fill
   it. The neutral background shows through while the image decodes. */
img.avatar-circle { object-fit: cover; background: var(--gray-100); }
.av-0 { background: var(--blue-light); color: var(--blue); }
.av-1 { background: var(--teal-light); color: var(--teal); }
.av-2 { background: #EEF2FF; color: #3730A3; }
.av-3 { background: var(--amber-light); color: var(--amber); }
.av-4 { background: #FDF2F8; color: #9D174D; }

/* ── Topbar ── */
.topbar-left h1 { font-size: 16px; font-weight: 600; }
.topbar-left p { font-size: 12px; color: var(--gray-400); margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent;
  transition: all 0.12s; font-family: 'DM Sans', sans-serif;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-ghost { background: #fff; color: var(--gray-600); border-color: var(--gray-200); }
.btn-ghost:hover { background: var(--gray-100); color: var(--gray-900); }
/* Destructive action that needs a deliberate click (the delete confirmation). */
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: var(--red-mid); }
.btn-danger:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-full { width: 100%; justify-content: center; padding: 10px 14px; font-size: 14px; }
.btn svg { width: 14px; height: 14px; }

/* ── Stats ── */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 22px; }
.stat-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); padding: 16px 18px; }
.stat-label { font-size: 11.5px; color: var(--gray-400); font-weight: 500; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 600; line-height: 1; }
.stat-sub { font-size: 11.5px; color: var(--gray-400); margin-top: 5px; display: flex; align-items: center; gap: 5px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* ── Table ── */
.table-card { background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); margin-bottom: 20px; overflow: hidden; }
.table-header {
  padding: 14px 18px; border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.table-title { font-size: 13.5px; font-weight: 600; }
/* Footer under a catalog list that is showing only its first rows. Centred,
   because the button is about the list as a whole rather than an action on any
   one row, and ruled off from the table above it so the two do not read as one
   continuous list of unknown length. */
.table-footer { padding: 9px 16px; border-top: 1px solid var(--gray-200); text-align: center; }
.table-footer .btn { font-size: 12px; padding: 5px 14px; }
.table-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-chips { display: flex; gap: 6px; }
.chip {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1px solid var(--gray-200); background: #fff; color: var(--gray-600);
  transition: all 0.12s; font-family: 'DM Sans', sans-serif;
}
.chip:hover { border-color: var(--blue-mid); color: var(--blue); }
.chip.active { background: var(--blue-light); color: var(--blue); border-color: var(--blue-mid); }
.search-wrap {
  display: flex; align-items: center; gap: 7px;
  background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 5px 11px;
}
.search-wrap svg { width: 13px; height: 13px; color: var(--gray-400); flex-shrink: 0; }
.search-wrap input {
  border: none; background: none; outline: none;
  font-size: 13px; color: var(--gray-900); font-family: 'DM Sans', sans-serif; width: 130px;
}
.search-wrap input::placeholder { color: var(--gray-400); }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 9px 18px; text-align: left; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--gray-400);
  border-bottom: 1px solid var(--gray-200); background: var(--gray-50); white-space: nowrap;
}
tbody td { padding: 11px 18px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #F8FAFC; }
/* Rows the current user is allowed to edit open the issue form when clicked
   anywhere, so they advertise it with a pointer. Rows belonging to another
   technician (visible to managers only) deliberately get no pointer and no
   click handler — the "—" in the actions cell still explains why. */
tbody tr.row-clickable { cursor: pointer; }

/* ── New-row entrance + status highlight ── */
@keyframes rowFadeSlide {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.row-enter td { animation: rowFadeSlide 200ms ease-out; }

@keyframes statusHighlightPulse {
  0%   { box-shadow: 0 0 0 0 rgba(37,99,235,0.35); }
  100% { box-shadow: 0 0 0 6px rgba(37,99,235,0); }
}
.status-highlight { animation: statusHighlightPulse 700ms ease-out; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.badge-ok { background: var(--green-light); color: var(--green); }
/* An issue whose resolution time ran past the SLA. A filled pill rather than red
   text on its own: these tables are read by scanning down a column of small
   numbers, and colour alone on one figure among twenty is easy to walk past. The
   colours are all theme variables, so this flips correctly in dark mode without
   an override of its own. */
.sla-breach {
  display: inline-block; font-weight: 600;
  padding: 1px 6px; border-radius: 5px;
  background: var(--red-light); color: var(--red); border: 1px solid var(--red-mid);
}
.badge-pending { background: var(--amber-light); color: var(--amber); }
/* The maintenance card states its urgency three ways -- the 3px left border, the
   ::before wash and this badge -- and when the badge was a fourth colour the card
   was arguing with itself: an overdue device carried red everywhere and an amber
   pill, at 2.54:1. Both of these reuse the .sla-breach pairing above, so the
   badge and the border it sits beside are the same red from one token.
   They are not interchangeable with each other, though: overdue is a failure and
   says so, while "due soon" is a warning, which in this app is --orange. Making
   that one red would have it shouting in the error colour while its own card
   border, summary tile and queue dot stayed amber. */
.badge-overdue { background: var(--red-light);    color: var(--red);    border: 1px solid var(--red-mid); }
.badge-soon    { background: var(--orange-light); color: var(--orange); border: 1px solid var(--orange); }
.badge-internet { background: var(--teal-light); color: var(--teal); border: 1px solid var(--teal-mid); }
.badge-type { background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-200); }
/* "Retired" on a maintenance card. Without a rule of its own it fell through to
   the bare .badge -- transparent background, body ink -- so it read as loose text
   with invisible padding beside two real tinted pills. A neutral of the same
   weight as the others, which says "not one of the states" rather than raising an
   alarm the way amber does. */
.badge-slate { background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-200); }

/* ── Icon btn ── */
.icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; background: none; color: var(--gray-400); transition: all 0.12s;
}
.icon-btn:hover { background: var(--gray-100); color: var(--gray-900); }
.icon-btn.danger:hover { background: var(--red-light); color: var(--red); }
.icon-btn svg { width: 14px; height: 14px; }
.color-swatch-input {
  width: 24px; height: 24px; padding: 0; border: 1px solid var(--gray-200);
  border-radius: 50%; cursor: pointer; background: none; overflow: hidden;
  vertical-align: middle;
}
.color-swatch-input::-webkit-color-swatch-wrapper { padding: 0; }
.color-swatch-input::-webkit-color-swatch { border: none; border-radius: 50%; }
.color-swatch-input::-moz-color-swatch { border: none; border-radius: 50%; }
.action-cell { display: flex; gap: 2px; }

/* ── Bottom grid ── */
.bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

/* The "add" row shared by every admin card: a labelled input with its submit
   button. The button sits on its own line, right-aligned, because these cards
   are only ~300px wide inside. Side by side, a translated button label eats the
   field: "Adicionar departamento" left the department name just 89px, and in
   English the same row wrapped the label onto two lines and made the button
   50px tall. Stacked, the field always gets the full card width in any
   language. Both controls are pinned to one height so their edges line up. */
/* The footer under a paginated table. Centred rather than left-aligned, so it
   reads as belonging to the table above it rather than as another column of it. */
.loadmore {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  flex-wrap: wrap; padding: 12px 16px;
  border-top: 1px solid var(--gray-200);
}
.loadmore-count { font-size: 12.5px; color: var(--gray-400); }
.loadmore-note  { font-size: 11.5px; color: var(--amber); }

/* ── Maintenance ──
   A tile, not a full-width row. One device per row left most of each line empty
   and pushed the queue several screens down, so the queue is a grid: three or four
   across, and the detail that does not fit a tile -- the technician's own note,
   who recorded a check -- lives in the history dialog where it already was.

   Colour on this page answers the one question it exists to answer -- how urgent
   is this -- so intensity tracks urgency. Overdue shouts in red, due soon says so
   once in amber, scheduled is a quiet teal edge and stops there. A page where
   every tile shouted equally would say nothing at all.

   The urgency wash is a pseudo-element rather than a background so it layers over
   the card's own surface: dark mode forces card backgrounds with !important, and
   this way the tint needs no !important of its own to survive that. It also fades
   to nothing by 58%, so the tile's text stays on white instead of on red. */
/* As many 180px cards across as the window will hold, and no wider than that.

   A fixed column count was the mistake here. `repeat(3, minmax(0, 1fr))` hands
   every spare pixel to the tiles, so a card was 226px on a small window and 550px
   on a 1920px one, with the action button stretched across all of it -- three
   enormous blocks on a big screen instead of a queue you can scan. auto-fill
   spends spare width on more cards instead, so the tile stays a card. The
   min(180px, 100%) is what keeps it from collapsing to zero tracks on a window
   too narrow to hold even one. */
.maint-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
}
.maint-card {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 6px;
  padding: 10px 11px 9px;
  background: #fff; border: 1px solid var(--gray-200); border-radius: 9px;
  border-left: 3px solid var(--gray-200);
  transition: border-color 0.25s ease;
}
.maint-card::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, var(--maint-wash, transparent) 0, transparent 58%);
  opacity: 0; transition: opacity 0.3s ease;
}
/* Positioned children paint above the wash without needing a z-index: both are
   positioned with z-index auto, so source order decides. */
.maint-card > * { position: relative; }
.maint-card.maint-overdue { border-left-color: var(--red);       --maint-wash: var(--red-light); }
.maint-card.maint-soon    { border-left-color: var(--amber); }
.maint-card.maint-scheduled { border-left-color: var(--teal-mid); }
.maint-card.maint-overdue::before { opacity: 1; }
.maint-card.maint-retired { opacity: 0.62; }

/* Icon and name share the top line. align-items flex-start rather than center so a
   name that wraps to two lines still sits against the top of the icon instead of
   floating beside its midpoint. */
.maint-head { display: flex; align-items: flex-start; gap: 8px; }
.maint-name { font-size: 13px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.maint-tags { display: flex; align-items: center; gap: 5px 7px; flex-wrap: wrap; }
.maint-sub  {
  display: flex; flex-wrap: wrap; gap: 3px 9px;
  font-size: 11px; color: var(--gray-400); overflow-wrap: anywhere;
}
/* The foot, and the rule that opens it. Everything above the rule describes the
   device -- what it is, where it lives, how often it is looked at. Everything
   below it is a date, and dates are what a reader scans a queue for. The dot and
   the green say whether the previous check found something; the words beside it
   say when it happened, and only spell out a date when that date is not today.

   The two dates together want about 175px, which is a little more than a 180px
   tile has once the padding is off it, so at the narrow end of the range the
   countdown drops to its own line. It wraps; nothing is cut off. */
.maint-last {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px;
  margin-top: auto; padding-top: 8px; border-top: 1px solid var(--gray-100);
  font-size: 11px; color: var(--gray-400);
}
.maint-last-when.ok    { color: var(--green); }
.maint-last-when.fault { color: var(--red); }
.maint-last-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--gray-300); }
.maint-last-dot.fault { background: var(--red); }
.maint-last-dot.ok    { background: var(--green); }
/* margin-top auto pins the buttons to the bottom, so the actions line up across a
   row of tiles whose text is one or two lines different in height.

   The button hugs its label. It used to be flex: 1 1 auto and then 1 1 0%, both of
   which stretch it to fill whatever the icons left -- 203px of button around 62px
   of words, and 520px of it on a 1920px screen, which is what made it look
   ridiculous. flex: 0 0 auto sizes it to "check + Mark done" and no further, so it
   is the same modest size on every screen and every column count.

   History and edit are icons rather than labelled buttons for the same reason:
   three labels do not fit a 180px tile at any size. */
.maint-card-actions { margin-top: auto; padding-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.maint-card-actions svg { width: 12px; height: 12px; }
/* No nowrap on the label, because the two languages are not the same length:
   "Marcar como feita" wants about 85px where "Mark done" wants 55px. Without nowrap
   the button can still shrink to its longest word if a tile gets very narrow, so
   the label wraps rather than pushing past the tile's edge. */
.maint-card-actions .btn { flex: 0 0 auto; padding: 5px 8px; font-size: 11px; }
.maint-card-actions .icon-btn { width: 24px; height: 24px; flex-shrink: 0; }

/* No column breakpoints. auto-fill already takes the tile down to a single 100%
   column on a window too narrow for two, and every step in between is handled by
   the floor rather than by a hand-picked pixel count. */

/* Printer and phone are the only two kinds, so they get the two strongest tints
   and a reader can tell them apart before they read a word. */
.maint-chip {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.maint-chip svg { width: 15px; height: 15px; }
.maint-chip-printer { background: var(--blue-light); color: var(--blue); }
.maint-chip-phone   { background: var(--teal-light);  color: var(--teal); }
/* The caption that stands in for the removed type pill: one step below the
   device name, so the card reads name > type > facts without the type needing a
   badge to be noticed. Uses --gray-600 rather than --gray-500, which is used in
   eighteen places in this file but never defined, so every one of those
   declarations is invalid and silently inherits body ink. */
.maint-caption { font-size: 11px; color: var(--gray-600); }
/* A fact is an icon and its value. The gap between facts does the separating, so
   the middots that used to join these three values are gone -- an icon followed
   by a middot reads as clutter at this size. --gray-400 to match the last-check
   line below, so the two metadata lines are one quiet block. */
.maint-fact { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.maint-fact-ic { display: inline-flex; flex-shrink: 0; color: var(--gray-400); }
.maint-fact-ic svg { width: 11px; height: 11px; }
/* Location and periodicity are the two things a reader actually looks up on a
   tile -- where the thing is, and how often it wants seeing -- so they are set a
   step heavier than the rest of the metadata block. 600 rather than 700 because at
   11px a full-bold run of letters closes up into a smudge, and because 600 is the
   weight the rest of this file already uses for small emphasis.

   The assignee is deliberately left at the regular weight. It is a third line of
   its own rather than half of this pair, and bolding it would make an optional
   detail shout louder than the two facts that are always there. */
.maint-fact-location,
.maint-fact-interval { font-weight: 600; }
/* How often it is looked at gets a line to itself, always. As an ordinary flex
   sibling it sat beside the department whenever the two fitted together -- which
   they did for "F&B" or "Bar" and did not for "Back Office" -- so the same card
   was laid out two different ways depending on the length of a word. flex-basis
   100% is the same trick as the countdown in the foot: in a wrapping row, an item
   asking for the full width never shares that row with anything.

   The assignee has no such rule, and needs none: it comes after this one, so a
   full-width interval always pushes it down with everything else. */
.maint-fact-interval { flex: 0 0 100%; }

/* The summary strip. Four tiles that hold their positions whatever the numbers
   are, so the page does not reshuffle itself as checks are recorded. A tile at
   zero stays grey rather than disappearing: "nothing overdue" is the good outcome
   and should read as an answer, not as missing data. */
.maint-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.maint-tile {
  position: relative; overflow: hidden;
  background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
  padding: 12px 15px 13px 17px;
  /* A button, so the browser's own chrome is undone: the tile supplies its own
     surface, and the label has to sit left like every other one in the app. */
  font-family: inherit; text-align: left; color: inherit; cursor: pointer;
  transition: border-color 0.25s ease, transform 0.12s ease;
}
/* Left edge and value take the tile's colour; the tint comes from the overlay
   below. Retired is deliberately the quietest of the four -- it is an archive,
   not a queue, and should never compete with what is actually waiting. */
.maint-tile.overdue   { --tile-color: var(--red);       --tile-tint: var(--red-light); }
.maint-tile.soon      { --tile-color: var(--amber);     --tile-tint: var(--amber-light); }
.maint-tile.scheduled { --tile-color: var(--teal);      --tile-tint: var(--teal-light); }
.maint-tile.retired   { --tile-color: var(--gray-400);  --tile-tint: transparent; }
.maint-tile::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--gray-200); transition: background 0.25s ease;
}
.maint-tile::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: var(--tile-tint, transparent);
  opacity: 0; transition: opacity 0.3s ease;
}
/* The wash sits behind the tile's contents, and needs saying so. ::after is a
   positioned pseudo-element with z-index auto, which puts it in the same painting
   step as the positioned children and wins on tree order -- it is the last child
   in the box tree, so it paints last, on top. Without the z-index below, a live
   tile's tint covers its own label and number completely: the scheduled tile came
   out as a flat mint block with nothing written on it at all.

   z-index 1 puts the children in the later painting step, so the tint is behind
   the text rather than over it. It cannot go the other way -- z-index -1 on the
   wash would drop it behind the tile's own background, where nothing can see it.
   A wash that is invisible and text that is legible is not an improvement. */
.maint-tile > * { position: relative; z-index: 1; }
.maint-tile.live::after { opacity: 1; }
.maint-tile.live::before { background: var(--tile-color); }
/* Pressed: a border in the group's own colour and a wider edge, which is a
   different signal from `live` -- that one means "there is something here",
   this one means "you are looking at this one". Both can be true at once. */
.maint-tile.is-filter { border-color: var(--tile-color); }
.maint-tile.is-filter::before { width: 4px; }
.maint-tile.is-filter .maint-tile-label { color: var(--tile-color); font-weight: 600; }
/* The nudge is the whole click affordance, so it is kept under a tenth of a
   second: enough to feel pressed, not enough to lag behind the list changing. */
.maint-tile:hover { transform: translateY(-1px); }
.maint-tile:active { transform: none; }
/* A visible ring on keyboard focus only. The outline is outside the tile, which
   overflow:hidden would normally clip -- it does not, because overflow clips
   descendants, not the element's own outline. */
.maint-tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.maint-tile-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 500; color: var(--gray-400);
  transition: color 0.2s ease;
}
.maint-tile-value {
  display: block;
  font-size: 25px; font-weight: 600; line-height: 1; margin-top: 8px;
  color: var(--gray-300); transition: color 0.25s ease;
}
.maint-tile.live .maint-tile-value { color: var(--tile-color); }
.maint-tile .stat-dot { background: var(--gray-300); transition: background 0.25s ease; }
.maint-tile.live .stat-dot { background: var(--tile-color); }

/* The queue headings carry the same four colours as the tiles above them, so the
   strip reads as a legend for the sections under it. */
.maint-queue { margin-bottom: 22px; }
.maint-queue-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.maint-queue-head h2 { font-size: 15px; margin: 0; }
.maint-queue-count { font-size: 12.5px; color: var(--gray-400); }
.maint-queue-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--gray-300); }
.maint-queue.maint-queue-overdue   .maint-queue-dot { background: var(--red); }
.maint-queue.maint-queue-soon      .maint-queue-dot { background: var(--amber); }
.maint-queue.maint-queue-scheduled .maint-queue-dot { background: var(--teal); }

/* Cards arrive rather than snap in, and the one genuinely overdue tile breathes.
   Both are plain CSS: no tween to leak and no cleanup path to get wrong. React
   reuses the card nodes across a refresh, so only genuinely new rows animate.

   The entrance moves but does not fade, deliberately. An opacity in the `from`
   keyframe means the resting state lives inside the animation, so any situation
   where the timeline does not advance -- a backgrounded tab, a print, an
   extension, anything that stops animations outright -- leaves the whole queue
   invisible. Displacing by a few pixels instead has the same effect when it runs
   and costs nothing when it does not. */
@keyframes maintCardIn {
  from { transform: translateY(-8px); }
  to   { transform: none; }
}
@keyframes maintBreathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(217, 75, 75, 0); }
  50%      { box-shadow: 0 0 0 4px rgba(217, 75, 75, 0.20); }
}
.maint-card.maint-enter { animation: maintCardIn 220ms ease-out backwards; }
.maint-tile.overdue.live { animation: maintBreathe 2.8s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .maint-card.maint-enter,
  .maint-tile.overdue.live { animation: none; }
  .maint-card, .maint-card::before,
  .maint-tile, .maint-tile::after { transition: none; }
}
/* The same breakpoints as the cards above, so the summary strip never shows a
   different number of columns than the queue it is summarising. */
@media (max-width: 820px) { .maint-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .maint-tiles { grid-template-columns: 1fr; } }

/* ── Maintenance: equipment type choice ──
   Tiles rather than chips. These set a form value rather than filtering a list,
   so they want the affordance of something you pick, and two across fills the
   row exactly -- where the five cadence presets would not, and left them
   stranding "Every N days" on a row of its own. */
.maint-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.maint-choice {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 12px; cursor: pointer; text-align: left;
  border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  background: #fff; font-size: 13.5px; color: var(--gray-600);
  font-family: inherit; transition: border-color 0.12s, background 0.12s, color 0.12s;
}
.maint-choice:hover { border-color: var(--blue-mid); }
.maint-choice.on {
  border-color: var(--blue); background: var(--blue-light); color: var(--blue); font-weight: 500;
}
.maint-choice svg { width: 16px; height: 16px; flex-shrink: 0; }
html.dark .maint-choice      { background: var(--gray-50); border-color: var(--gray-300); color: var(--gray-600); }
html.dark .maint-choice.on   { background: var(--blue-light); border-color: var(--blue-mid); color: var(--blue); }

/* The name field's own hint. Sits under the input rather than as a placeholder
   alone, so the guidance is still there once a real name is being typed. */
.maint-hint { font-size: 11.5px; color: var(--gray-400); }

.admin-form { display: grid; gap: 10px; }
.admin-form .form-control { height: 36px; }
.admin-form .btn { height: 36px; white-space: nowrap; justify-self: end; }

/* The consumables card pairs a live name+icon preview with its button instead
   of a text field, so that row stays on one line — the preview ellipsizes
   rather than competing for width. */
.admin-form-inline { display: flex; align-items: center; gap: 12px; }
.admin-form-inline .ci-preview { flex: 1 1 auto; min-width: 0; }
.admin-form-inline .btn { flex: 0 0 auto; height: 36px; white-space: nowrap; }
.analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.mini-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 18px 20px; }
.mini-card-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; }

/* ── Settings: collapsible groups ────────────────────────────────────────
   The page used to be ten sibling cards -- three global thresholds, then five
   catalogs, each of which was two cards of its own -- all the same weight, with
   nothing on screen saying how any two of them related. That is what made it
   hard to take in: no entry point, and every catalog announced its own name
   twice, once over its add form and once over its list.

   Two levels now, and only the top level is a card. A group is a card because a
   group is a thing; a catalog inside one is a row, because a catalog is a detail
   of the group rather than a destination in its own right.

   Height animates with grid-template-rows 0fr -> 1fr rather than a max-height.
   A catalog can hold any number of rows and a max-height has to be a guess:
   guess low and the bottom of a long list is clipped with no scrollbar and no
   way to reach the rows behind it. At 0fr the row collapses to the height of a
   hidden child, which is right for any content and needs no number kept in step
   with the data. */
.set-group { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); }
.set-group + .set-group { margin-top: 14px; }

/* One button, not a heading with a toggle button beside it: the native element
   brings Enter, Space, the button role and a focus ring without any of it being
   reimplemented, and the whole 44px row is one tab stop instead of two. */
.set-group-head {
  display: flex; align-items: flex-start; gap: 12px; width: 100%;
  padding: 14px 18px; text-align: left;
  background: transparent; border: 0; border-radius: var(--radius-lg);
  font-family: inherit; color: var(--gray-900); cursor: pointer;
}
.set-group-head:hover { background: var(--gray-100); }
/* The one place a hover has to be spelled out per theme. The greys run the other
   way in dark -- --gray-100 is darker than the --gray-50 card it sits on -- so the
   token that reads as "raised" in light reads as "punched in" in dark. */
html.dark .set-group-head:hover { background: var(--gray-200); }
.set-group-head:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }

.set-group-icon { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 2px; color: var(--gray-400); }
.set-group-title { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }
.set-group-sub { display: block; font-size: 12.5px; color: var(--gray-400); margin-top: 3px; line-height: 1.45; }
/* min-width:0 so a long word in the subtitle wraps instead of pushing the count
   and the chevron off the right edge of the row. */
.set-group-label { min-width: 0; }
/* Eats the slack, so the count and the chevron stay pinned to the right edge at
   any width instead of drifting inwards as the title wraps. */
.set-group-spacer { flex: 1 1 auto; }
.set-group-count {
  flex: 0 0 auto; align-self: center; padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; color: var(--gray-600); background: var(--gray-100);
}
.set-group-chev {
  width: 18px; height: 18px; flex: 0 0 auto; align-self: center;
  color: var(--gray-400); transition: transform .2s ease;
}
/* Rotates rather than flips, so the chevron keeps pointing the way it travels:
   sideways when open and shut alike, down when the group is closed. */
.set-group.open > :is(h2, h3) .set-group-chev { transform: rotate(90deg); }

.set-group-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
.set-group.open > .set-group-body { grid-template-rows: 1fr; }
.set-group-inner { overflow: hidden; min-height: 0; }
.set-group.open > .set-group-body > .set-group-inner { padding: 0 18px 18px; }

/* Nested: no border and no fill of its own. The divider is enough to say "this
   is inside something", and a second ring of cards inside the first is the same
   nesting that made the old page hard to read. */
.set-group--sub { background: transparent; border: 0; border-radius: 0; border-top: 1px solid var(--gray-200); }
.set-group--sub:first-child { border-top: 0; }
.set-group--sub .set-group-head { padding: 13px 0; border-radius: 0; }
.set-group--sub .set-group-head:hover { background: transparent; }
.set-group--sub .set-group-head:hover .set-group-title { color: var(--blue); }
.set-group--sub.open > .set-group-body > .set-group-inner { padding: 0 0 18px; }

/* Inside an open catalog the add form sits beside the list rather than above it.
   Stacked, each catalog had to be two cards and so had to repeat its own name;
   side by side the section heading already says what this is, and the form
   column can stay a width a number input and a button actually fit in. */
.set-body { display: grid; grid-template-columns: minmax(250px, 300px) 1fr; gap: 22px; align-items: start; }
.set-body > .table-card { margin-bottom: 0; }
/* --gray-100 rather than --gray-50 for the fill: the card it sits on is white in
   light and --gray-50 in dark, and --gray-100 is distinguishable from both --
   lighter than white there, darker than the dark card there. One token, both
   themes, and neither of them ends up with an invisible box. */
.set-form { background: var(--gray-100); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 16px; }
@media (max-width: 860px) {
  .set-body { grid-template-columns: 1fr; }
}

/* -- Weekly rota -----------------------------------------------------------
   One standing weekly pattern, read down a column and across a week. Three
   things this block is opinionated about, and why:

   1. Colour is spent on two facts and no others. Blue means "you are here"
      everywhere else in this file -- active nav item, selected chip, active
      language button, the avatar -- so painting every assigned cell blue would
      leave nothing for the column that genuinely needs it, which is today. And
      shifts are NOT colour-coded by index: the API carries no colour on a shift,
      so the mapping would live only in this stylesheet and the seventh shift
      would be a design change. A new shift gets a new name and nothing else.

   2. --orange appears exactly once, as a 3px left edge. Its ink value reaches
      4.9:1 on --orange-light and only just clears 4.5:1 against the --gray-100
      the chips sit on, and a border is a non-text cue that only has to clear 3:1
      -- which it does several times over.

   3. Nothing here invents a surface. --gray-50 is the card in both themes
      (white in light, and --gray-50 under the dark block at the end of this
      stylesheet), which is the same reasoning .set-form was built on. */

/* Visually hidden, still announced. This file has no such utility and the rota
   needs one: "day off" sits behind the dash, and the times sit behind a cell,
   and neither is a control, so aria-label cannot carry them. */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* The standing-pattern note. Four declarations lifted from .lcu-howto under a
   name of their own: that class means the LCU gate, and a rota borrowing it
   would say so in the markup to anyone reading it. */
.rota-note {
  display: flex; gap: 11px; padding: 12px 14px;
  margin: 0 18px 14px; border-radius: var(--radius-md);
  background: var(--blue-light); font-size: 12.5px; color: var(--gray-600);
  line-height: 1.5;
}
.rota-note svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--blue); margin-top: 1px; }

/* Week navigation. Present so a different set of dates can be printed and so
   "today" can be pointed at. Deliberately the quietest thing in the header: a
   control that looks like a destination is a promise a standing rota cannot
   keep. */
.rota-week { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.rota-week-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm); flex-shrink: 0;
  border: 1px solid var(--gray-200); background: none; color: var(--gray-600);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.12s;
}
.rota-week-btn:hover:not(:disabled) { background: var(--gray-100); color: var(--gray-900); border-color: var(--gray-300); }
.rota-week-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.rota-week-btn svg { width: 13px; height: 13px; }
/* Rotated rather than mirrored, so the chevron points the way it travels -- the
   same reasoning .set-group-chev gives. */
.rota-week-prev svg { transform: rotate(180deg); }
.rota-week-range {
  min-width: 172px; padding: 0 8px; text-align: center;
  font-size: 13px; font-weight: 500; color: var(--gray-900);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
/* When the week on screen IS the current one there is nowhere to jump to, so
   the same slot stops being a control and becomes the fact it reports. A
   permanently disabled button reads as broken; a pill that only becomes a button
   when it would do something is the same control with an honest affordance. */
.rota-week-pill {
  padding: 4px 11px; border-radius: 999px; border: 1px solid var(--gray-200);
  background: var(--gray-100); font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 600; color: var(--gray-600); white-space: nowrap;
}
button.rota-week-pill { cursor: pointer; transition: all 0.12s; }
button.rota-week-pill:hover { background: var(--blue-light); border-color: var(--blue-mid); color: var(--blue); }
.rota-week-pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
html.dark .rota-week-pill { background: var(--gray-200); border-color: var(--gray-300); }

/* View / edit. Four declarations from .lang-toggle: this app already owns
   exactly one two-state segmented control and this is the second, so it is built
   from the same shape rather than a new one. */
.rota-modeswitch {
  display: inline-flex; align-items: center; flex-shrink: 0;
  border-radius: var(--radius-md); border: 1px solid var(--gray-200); overflow: hidden;
}
.rota-mode-btn {
  padding: 6px 13px; font-size: 12.5px; font-weight: 500; cursor: pointer;
  border: none; background: none; color: var(--gray-600);
  font-family: 'DM Sans', sans-serif; transition: all 0.12s; line-height: 1.4;
  display: flex; align-items: center; gap: 6px;
}
.rota-mode-btn + .rota-mode-btn { border-left: 1px solid var(--gray-200); }
.rota-mode-btn svg { width: 13px; height: 13px; }
.rota-mode-btn[aria-checked="true"] { background: var(--blue-light); color: var(--blue); font-weight: 600; }
.rota-mode-btn:hover { background: var(--gray-100); color: var(--gray-900); }
.rota-mode-btn[aria-checked="true"]:hover { background: var(--blue-light); color: var(--blue); }
.rota-mode-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
html.dark .rota-modeswitch { border-color: var(--gray-300) !important; }
html.dark .rota-mode-btn + .rota-mode-btn { border-left-color: var(--gray-300) !important; }
html.dark .rota-mode-btn:hover { background: var(--gray-200) !important; color: var(--gray-900) !important; }
html.dark .rota-mode-btn[aria-checked="true"] { background: var(--blue-light) !important; color: var(--blue) !important; }

/* The read-only chip. What stands in for the mode switch when can_edit is false.
   Grey, not amber and not red: being shown a rota you cannot change is the app
   working, and .badge-slate already set the precedent that "not one of the
   states" is a neutral rather than an alarm.

   Its entire job is to answer "is this page broken?" before anyone has to ask.
   An anonymous visitor lands on a PUBLIC endpoint, finds no Edit button, and
   without this the absence is indistinguishable from a failed load. It never
   says the word "permission", and there is no second variant of it for
   technicians -- one chip covers both, because the server says the same thing
   about both. */
.rota-readonly {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  padding: 6px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--gray-200); background: var(--gray-100);
  font-size: 12.5px; font-weight: 500; color: var(--gray-600);
}
.rota-readonly svg { width: 13px; height: 13px; color: var(--gray-400); flex-shrink: 0; }
html.dark .rota-readonly { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }

/* The legend. The grid prints shift names and nothing else, so "Night" arrives
   with no hours attached -- and the reader of a pinned-up rota has never seen
   this UI. It sits in the card, always open, never behind a hover: it is half of
   what the page is for, not a tooltip about it.

   Each item carries the same orange left edge as the cells that use it, so the
   mapping from legend to grid is visual as well as verbal. */
.rota-legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding: 11px 18px; border-top: 1px solid var(--gray-200);
  background: var(--gray-50);
}
.rota-legend-item {
  display: inline-flex; align-items: center; gap: 8px; min-width: 0;
  padding: 4px 10px 4px 8px; border-radius: var(--radius-sm);
  border: 1px solid var(--gray-200);
}
.rota-legend-name { font-size: 12.5px; font-weight: 600; color: var(--gray-900); white-space: nowrap; }
.rota-legend-hours {
  font-family: 'DM Mono', monospace; font-size: 11.5px; color: var(--gray-600);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* Counted from the grid, not read off assignment_count: a person on Night five
   times is one person, and "5 people" beside a shift worked by two technicians
   is a number nobody believes. */
.rota-legend-count { font-size: 11px; color: var(--gray-400); white-space: nowrap; }
.rota-legend-item.is-night { border-left: 3px solid var(--orange); padding-left: 6px; }
/* Only reachable for a manager: /v1/shifts honours include_retired for managers
   alone, so nobody else is told a retired shift exists. */
.rota-legend-retired {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 1px 6px; border-radius: 999px; white-space: nowrap;
  background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-200);
}
html.dark .rota-legend-retired { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }

/* The grid. */
.rota-table-wrap { overflow-x: auto; }
/* separate, not collapsed. This stylesheet sets border-collapse:collapse on every
   table, and a sticky cell in a collapsed table takes its border with it as the
   table scrolls -- so the name column loses its right-hand rule exactly when it
   is doing the job of being a fixed edge. Spacing 0 keeps every existing cell
   border on this table looking identical to every other table in the app. */
.rota-table {
  width: 100%; min-width: 852px;
  border-collapse: separate; border-spacing: 0; table-layout: fixed;
}
.rota-table thead th { padding: 7px 10px; text-align: center; }
/* The number under the day name is what makes a printed sheet worth printing;
   the name above it is what makes the grid readable on screen. */
.rota-daynum {
  display: block; margin-top: 1px; font-family: 'DM Mono', monospace;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0; text-transform: none;
  color: var(--gray-400);
}
.rota-table tbody td { padding: 5px; text-align: center; vertical-align: middle; }
/* Column rules in --gray-100 and row rules in the same token, deliberately: the
   row divider is what you notice scanning across, the column divider is what
   you notice scanning down, and neither should out-shout the other. */
.rota-table tbody td.rota-day { border-left: 1px solid var(--gray-100); }
html.dark .rota-table tbody td.rota-day { border-left-color: var(--gray-200) !important; }

/* The name column, pinned. 208px holds a 24px avatar, a name and the weekly
   hours without wrapping, and it is the same width in view and in edit mode: a
   column that changes width when Edit is pressed throws the eye off the row it
   is reading. */
.rota-table thead th.rota-name-head,
.rota-table tbody td.rota-name-cell {
  position: sticky; left: 0; width: 208px; box-shadow: 1px 0 0 var(--gray-200);
}
.rota-table thead th.rota-name-head { z-index: 4; }
.rota-table tbody td.rota-name-cell { z-index: 2; text-align: left; }
/* The header is given no background at all: `thead th` already paints it
   --gray-50 in light and the dark block repaints it --gray-200, and both are
   correct for a pinned cell. Declaring one here would have to fight an
   !important and win it back for no gain. */
.rota-table tbody td.rota-name-cell { background: var(--gray-50); }
.rota-table tbody tr:hover td.rota-name-cell { background: var(--gray-100); }
/* !important because the blanket dark rule near the end of this stylesheet
   paints every td on hover with it, and this cell has to be told otherwise or
   the name column goes white-on-white against the dark card. */
html.dark .rota-table tbody tr:hover td.rota-name-cell { background: var(--gray-200) !important; }

.rota-member { display: flex; align-items: center; gap: 9px; min-width: 0; }
.rota-member-text { min-width: 0; }
.rota-member-name {
  font-size: 13.5px; font-weight: 600; color: var(--gray-900);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The standing week's total, from the durations of the shifts actually in the
   row. It answers "is this person on forty hours or twenty", which seven names
   cannot, and it makes an uneven rota visible before anybody reads a word.
   Tabular figures so the column of them lines up. */
.rota-member-hours {
  margin-top: 1px; font-family: 'DM Mono', monospace; font-size: 11px;
  font-weight: 600; color: var(--gray-600); font-variant-numeric: tabular-nums;
}
/* Nobody said this person has left -- they may simply not be on this rota -- so
   the row dims rather than disappearing. A rota that hides people is a more
   frightening document than one that shows them greyed out, and --gray-600 clears
   4.5:1 where --gray-400 was the tempting choice. */
.rota-table tr.rota-inactive .rota-member-name { color: var(--gray-600); font-weight: 500; }

/* A member with nothing assigned all week. The seven day-off cells are the truth
   and they stay: replacing them with one merged cell would break the eight
   columns that every arrow key and every screen reader is counting. So the row
   is marked from the name side instead. */
.rota-free {
  display: inline-flex; margin-top: 3px; padding: 1px 7px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
  background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-200);
}
html.dark .rota-free { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }

/* Cells. Two states and no more. A day off is a visible centred dash rather than
   an empty cell: in a bordered grid a blank reads as loading, and a rota that
   looks like it is still loading looks broken. --gray-400 clears 4.5:1 on the
   card surface in both themes, and the words behind it are there for anyone who
   is not looking at it. */
.rota-cell {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  width: 100%; min-width: 0; min-height: 40px; padding: 6px;
  border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
  background: var(--gray-100); font-family: 'DM Sans', sans-serif;
  font-size: 12.5px; font-weight: 500; line-height: 1.25; text-align: center;
  color: var(--gray-900);
}
.rota-cell-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rota-table tr.rota-inactive .rota-cell { opacity: 0.72; }
.rota-cell.is-off {
  background: none; border-color: transparent;
  font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 400; color: var(--gray-400);
}
/* In edit mode every cell is a control, and then they are the primary touch
   targets of this page -- so they get the 44px this file otherwise does not
   insist on, because its controls are secondary icon buttons at 28px. */
.rota-cell.is-editable { min-height: 44px; cursor: pointer; }
.rota-cell.is-editable:hover { border-color: var(--blue-mid); background: var(--blue-light); color: var(--blue); }
.rota-cell.is-editable:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
/* Overnight: the single use of --orange on this page, and only as an edge. */
.rota-cell.is-night { border-left: 3px solid var(--orange); padding-left: 4px; }
.rota-cell.is-off.is-night { border-left: 1px solid transparent; }
/* "+1" on the same baseline as the name so it reads as part of it rather than
   as a badge stuck on the side. DM Mono 11px in --gray-600: small, but this is a
   redundant cue for a fact the orange edge and the legend already state. */
.rota-cell-plus1 {
  flex-shrink: 0; font-family: 'DM Mono', monospace;
  font-size: 11px; font-weight: 600; color: var(--gray-600);
}
/* The "that landed" moment, reusing the pulse already written for the status
   column, so a change feels like every other save in this app. */
.rota-cell.just-saved { animation: statusHighlightPulse 700ms ease-out; }

/* Today. Today is a COLUMN, so it is marked as one. The header takes the
   established "you are here" pairing -- --blue-light wash, --blue ink -- used by
   .nav-item.active, .chip.active and .lang-btn.active, so it is already
   understood here. The body cells are fenced by two --blue-mid vertical rules
   rather than washed, because a body wash would need a fourth blue and there is
   not one that is both faint enough to sit under seven chips and strong enough
   to survive on the dark card.

   !important on the background because the dark block sets `thead th` with one;
   .rota-table thead th.<class> out-specifies `html.dark thead th`, so both are
   !important and this one wins on specificity rather than order. */
.rota-table thead th.rota-headcol-today {
  background: var(--blue-light) !important; color: var(--blue); border-bottom-color: var(--blue-mid);
}
.rota-table thead th.rota-headcol-today .rota-daynum { color: var(--blue); }
.rota-table tbody td.rota-col-today { box-shadow: inset 1px 0 0 var(--blue-mid), inset -1px 0 0 var(--blue-mid); }

/* The cell picker. The geometry is RoomPicker's, deliberately: absolutely
   positioned inside a relatively positioned cell, overlaying the rows below
   rather than pushing them down, z-index 30 above everything else in the content
   area. A second popover here would mean a second set of answers to the
   questions .room-picker already answers -- what Escape does, what a click
   outside does. The JSX reuses its outside-click and capture-phase-Escape
   handlers verbatim. */
.rota-picker { position: relative; display: block; }
.rota-picker-panel {
  position: absolute; z-index: 30; top: calc(100% + 4px); left: 0;
  min-width: 216px; max-height: 244px; overflow-y: auto; padding: 4px;
  background: #fff; border: 1px solid var(--gray-200);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md);
}
/* Two of the seven sit against the right edge of the card, and .table-card is
   overflow:hidden to clip its own corners -- a panel opening rightwards would be
   silently cut in half. Saturday and Sunday open leftwards. */
.rota-picker-panel.align-right { left: auto; right: 0; }
/* And the last two rows, vertically, for the same reason: the panel would open
   under the fold with no way to reach it but scrolling the grid out from under
   the pointer. */
.rota-picker-panel.open-up { top: auto; bottom: calc(100% + 4px); }
html.dark .rota-picker-panel { background: var(--gray-50); border-color: var(--gray-300); }

/* Forked from .room-option for exactly one reason: that class sets DM Mono,
   which is right for a room number read character by character and wrong for
   "Night". Everything else is the same, on purpose. */
.rota-option {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border: none; background: none; border-radius: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--gray-900);
  text-align: left; cursor: pointer;
}
.rota-option:hover, .rota-option.active { background: var(--blue-light); }
.rota-option-chosen { color: var(--blue); font-weight: 600; }
.rota-option-tick { display: inline-flex; align-items: center; flex-shrink: 0; }
.rota-option-tick svg { width: 13px; height: 13px; flex-shrink: 0; }
.rota-option-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rota-option-hours {
  font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray-600);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.rota-option.is-night { border-left: 3px solid var(--orange); }
.rota-picker-foot {
  margin-top: 4px; padding: 6px 10px 4px; font-size: 11.5px; color: var(--gray-400);
  border-top: 1px solid var(--gray-100);
}

/* The dirty count and the save bar. The count sits in the header so the state of
   the edit is visible without scrolling; the actions sit under the grid, because
   .table-footer is already this file's home for "a button about the list as a
   whole rather than an action on one row" -- Save is exactly that -- and because
   DOM order puts them after the grid, so Tab out of the last cell lands on
   Cancel and then Save with no key handling at all. */
.rota-dirty {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  padding: 4px 11px; border-radius: 999px; white-space: nowrap;
  font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700;
  color: var(--blue); background: #fff; border: 1px solid var(--blue-mid);
}
html.dark .rota-dirty { background: var(--gray-50); }
.rota-savebar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 18px; text-align: left;
  background: var(--blue-light); border-top: 1px solid var(--blue-mid);
  font-size: 12.5px; color: var(--gray-600); line-height: 1.45;
}
.rota-savebar svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--blue); }
.rota-savebar-spacer { flex: 1 1 auto; }
/* .table-footer centres; this one does not, because it carries a sentence on the
   left and two buttons on the right. */
.rota-savebar .btn { font-size: 12px; padding: 6px 14px; }

/* Empty states. */
.rota-empty-head { margin: 0; font-size: 15px; font-weight: 600; color: var(--gray-900); }
.rota-empty-sub  { margin: 0; max-width: 46ch; font-size: 13px; color: var(--gray-600); line-height: 1.55; }
/* The one empty state on this page that carries an action, and only for a
   manager. It navigates to the Settings group rather than opening a second copy
   of the shift form -- the form has exactly one home and duplicating it would be
   the second of them in a fortnight. */
.rota-empty-cta { margin-top: 8px; }

/* The shift templates card, on the Settings page. Nothing here that .set-body,
   .set-form and .table-card do not already do. Only the rows needed three things
   the catalogs did not: two time fields side by side, an in-place edit holding
   three controls in one row, and the night marker surviving at 12.5px. */
.rota-settings-times { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rota-settings-times .form-control { width: 88px; padding: 6px 8px; text-align: center; }
.rota-settings-dash { font-size: 13px; color: var(--gray-400); }
/* Stated, not predicted. The hint appears only once the server has said
   overnight:true, so a disagreement between here and there cannot show a manager
   a warning that turns out to be wrong. */
.rota-settings-night {
  display: flex; align-items: center; gap: 7px; width: 100%;
  margin-top: 9px; padding: 6px 9px; border-radius: var(--radius-sm);
  border: 1px solid var(--orange); background: var(--orange-light);
  font-size: 12px; color: var(--gray-600);
}
.rota-settings-night svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--orange); }

/* Print. The week navigation exists largely for this: the same standing pattern,
   printed with a different week's dates on it. The mode switch and the save bar
   are the two things that must not reach paper, and the pinned column has to let
   go or the sheet prints with every name on top of every other row. The day
   header repeats on each sheet, which is the whole reason a rota gets printed. */
@media print {
  .rota-modeswitch, .rota-savebar, .rota-readonly, .rota-week-btn { display: none !important; }
  .rota-table-wrap { overflow: visible; }
  .rota-table { min-width: 0; }
  .rota-table thead th.rota-name-head,
  .rota-table tbody td.rota-name-cell { position: static; box-shadow: none; }
  .rota-table thead { display: table-header-group; }
}
.bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--gray-100); }
.bar-row:last-child { border-bottom: none; }
.bar-label { font-size: 13px; display: flex; align-items: center; gap: 7px; min-width: 90px; }
.bar-track { flex: 1; height: 6px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.bar-count { font-size: 13px; font-weight: 600; min-width: 20px; text-align: right; }

/* ── Team page ── */
/* The role icon is an inline <svg> with a viewBox and no width/height. Without
   a rule like this one it has no intrinsic size and flex stretches it to
   hundreds of pixels — and to a *different* size per icon, so manager and
   technician cards ended up different heights. Every other icon in the app is
   sized the same way; see .nav-item svg, .btn svg and friends. */
.team-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; min-width: 0; }
/* min-width:0 lets the name shrink inside the flex row so it can ellipsis
   instead of forcing the card wider than its grid track. */
.team-card-id { min-width: 0; }
.team-card-name {
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 7px; min-width: 0;
}
.team-card-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-card-role {
  font-size: 12px; color: var(--gray-400); margin-top: 2px;
  display: flex; align-items: center; gap: 5px;
}
.team-role-icon { display: flex; align-items: center; flex-shrink: 0; }
.team-role-icon svg { width: 13px; height: 13px; flex-shrink: 0; }
.team-card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.team-stat {
  background: var(--gray-50); border: 1px solid var(--gray-200);
  border-radius: var(--radius-md); padding: 10px 12px; min-width: 0;
}
.team-stat-label { font-size: 11px; color: var(--gray-400); margin-bottom: 3px; }
.team-stat-value { font-size: 18px; font-weight: 600; }
.team-you {
  background: var(--blue-light); color: var(--blue);
  font-size: 10px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
}
html.dark .team-you { background: var(--blue-light) !important; color: var(--blue) !important; }
/* A deactivated account cannot log in, so it is dimmed and labelled rather
   than presented like a working member of the team. */
.team-card-inactive { opacity: 0.6; }
.team-inactive-badge {
  background: var(--gray-100); color: var(--gray-400);
  font-size: 10px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0;
}

/* Switches the Team page between the member cards and the manager-only
   management table. */
.team-viewbar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
.team-segmented {
  display: inline-flex; gap: 2px;
  background: var(--gray-100); border: 1px solid var(--gray-200);
  border-radius: var(--radius-md); padding: 3px;
}
.team-segmented button {
  border: none; background: none; cursor: pointer;
  padding: 6px 14px; border-radius: 6px;
  font: 500 13px 'DM Sans', sans-serif; color: var(--gray-600);
  display: flex; align-items: center; gap: 6px;
}
.team-segmented button:hover { color: var(--gray-900); }
.team-segmented button.active {
  background: #fff; color: var(--blue);
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
html.dark .team-segmented button.active { background: var(--gray-50); }
/* Sized here rather than left to the flex default, which stretches an unsized
   svg to hundreds of pixels. */
.team-segmented button svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ── Weekly consumables report ────────────────────────────────────────── */

.week-nav { display: flex; align-items: center; gap: 8px; }
.week-nav .label {
  font-size: 13px; color: var(--gray-600); font-weight: 500;
  min-width: 150px; text-align: center;
}
.week-nav button {
  border: 1px solid var(--gray-200); background: #fff; cursor: pointer;
  border-radius: var(--radius-md); padding: 6px 10px;
  display: flex; align-items: center; color: var(--gray-600);
}
.week-nav button:hover:not(:disabled) { background: var(--gray-100); color: var(--gray-900); }
.week-nav button:disabled { opacity: 0.4; cursor: default; }
.week-nav button svg { width: 14px; height: 14px; flex-shrink: 0; }
html.dark .week-nav button { background: var(--gray-50); }

/* Per-day usage. Bars grow from a fixed baseline and are floored so a day with
   a single unit is still visible. */
.daychart {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 10px; align-items: end; height: 130px;
}
.daycol { display: flex; flex-direction: column; align-items: center; height: 100%; }
.daycol .qty { font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
.daycol .track {
  flex: 1; width: 100%; display: flex; align-items: flex-end;
  background: var(--gray-100); border-radius: var(--radius-sm); overflow: hidden;
}
.daycol .fill { width: 100%; background: var(--blue); border-radius: var(--radius-sm); min-height: 2px; }
.daycol.empty .fill { background: var(--gray-300); }
.daycol .dow { font-size: 10px; color: var(--gray-400); margin-top: 6px; text-transform: uppercase; }
.daycol .dom { font-size: 10px; color: var(--gray-300); }

.week-breakdowns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.week-bar-row { display: grid; grid-template-columns: 1fr 90px 34px; align-items: center; gap: 8px; padding: 5px 0; }
.week-bar-label {
  display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--gray-600);
  min-width: 0;
}
.week-bar-label > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
