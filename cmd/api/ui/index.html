function sysTone(value, warn, bad) {          // lower is better (usage %, latency ms)
  if (value == null) return 'gray';
  if (value >= bad) return 'red';
  if (value >= warn) return 'amber';
  return 'green';
}

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
}

function formatUptime(totalSeconds, t) {
  const d = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

// One of the four headline cards: an icon, a big value, and a usage gauge underneath.
function SysCard({ icon, label, tone, value, unit, gauge, sub, na }) {
  return (
    <div className="sys-card">
      <div className="sys-card-head">
        <span className="sys-card-label">{label}</span>
        <span className={`sys-icon tone-${tone}`}>{icon}</span>
      </div>
      <div className={`sys-value tone-${tone}`}>{value}{unit && <span className="sys-unit">{unit}</span>}</div>
      {gauge != null && (
        <div className="sys-gauge-track"><div className={`sys-gauge-fill tone-${tone}`} style={{width:`${Math.min(gauge,100)}%`}}/></div>
      )}
      {na ? <div className="sys-na">{na}</div> : sub && <div className="sys-sub">{sub}</div>}
    </div>
  );
}

// Server health: CPU, RAM, and round-trip latency to the server and the database.
// Refetches on a fixed 60s clock (see REFRESH_MS) for as long as this page stays open.
const SYS_REFRESH_MS = 60000;

function SystemStatusPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [data, setData] = useState(null);
  const [serverLatency, setServerLatency] = useState(null);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);
  const [secondsAgo, setSecondsAgo] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const lastFetchedAt = useRef(null);

  // manual: true for the on-demand button, so it can show its own spinner
  // without disturbing the (much less frequent) full-page loading state.
  const load = useCallback(async (manual) => {
    if (manual) setRefreshing(true);
    const start = performance.now();
    try {
      const res = await apiFetch('/system/status', { token });
      setServerLatency(Math.round(performance.now() - start));
      setData(res.system);
      setErr('');
    } catch (ex) {
      setErr(ex.message);
    } finally {
      lastFetchedAt.current = Date.now();
      setSecondsAgo(0);
      setLoading(false);
      if (manual) setRefreshing(false);
    }
  }, [token]);

  useEffect(() => {
    load(false);
    // The interval keeps its own fixed 60s cadence regardless of manual refreshes —
    // clicking "refresh now" gets you fresh data immediately without resetting the clock.
    const refresh = setInterval(load, SYS_REFRESH_MS);
    const tick = setInterval(() => {
      if (lastFetchedAt.current) setSecondsAgo(Math.round((Date.now() - lastFetchedAt.current) / 1000));
    }, 1000);
    return () => { clearInterval(refresh); clearInterval(tick); };
  }, [load]);

  if (loading) return <div className="empty-state">{Ic.server}<p>{t.sysRefreshing}</p></div>;

  const stale = !!err;
  const cpu = data?.cpu;
  const mem = data?.memory;
  const db = data?.database;
  const cpuTone = cpu?.available ? sysTone(cpu.percent, 60, 85) : 'gray';
  const memTone = mem?.system_wide ? sysTone(mem.percent, 70, 90) : 'gray';
  const srvTone = sysTone(serverLatency, 100, 300);
  const dbTone = db ? (db.reachable ? sysTone(db.latency_ms, 100, 300) : 'red') : 'gray';

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18, flexWrap:'wrap', gap:10}}>
        <p style={{fontSize:13, color:'var(--gray-400)', margin:0}}>{t.systemStatusSub}</p>
        <div className="sys-live">
          <span className={`sys-live-dot ${stale ? 'stale' : ''}`}/>
          {stale ? t.sysStale : (secondsAgo < 2 ? t.sysUpdatedJustNow : t.sysUpdatedAgo.replace('{n}', secondsAgo))}
          <span style={{opacity:0.6}}>· {t.sysAutoRefresh}</span>
          <button type="button" className={`sys-refresh-btn ${refreshing ? 'spinning' : ''}`}
            onClick={()=>load(true)} disabled={refreshing} title={t.sysRefreshNow} aria-label={t.sysRefreshNow}>
            {Ic.refresh}
          </button>
        </div>
      </div>

      <div className="sys-grid">
        <SysCard icon={Ic.cpu} label={t.cpuUsage} tone={cpuTone}
          value={cpu?.available ? cpu.percent : '—'} unit={cpu?.available ? '%' : ''}
          gauge={cpu?.available ? cpu.percent : null}
          sub={cpu?.available ? `${cpu.cores} ${t.sysCores}` : null}
          na={!cpu?.available ? t.sysCpuUnavailable.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.server} label={t.ramUsage} tone={memTone}
          value={mem?.system_wide ? mem.percent : formatBytes(mem?.used_bytes)}
          unit={mem?.system_wide ? '%' : ''}
          gauge={mem?.system_wide ? mem.percent : null}
          sub={mem?.system_wide ? `${formatBytes(mem.used_bytes)} / ${formatBytes(mem.total_bytes)}` : null}
          na={!mem?.system_wide ? t.sysProcessOnly.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.activity} label={t.latencyServer} tone={srvTone}
          value={serverLatency ?? '—'} unit="ms"
          sub="Round trip from your browser"/>

        <SysCard icon={Ic.database} label={t.latencyDatabase} tone={dbTone}
          value={db?.reachable ? db.latency_ms : (db ? '—' : '—')} unit={db?.reachable ? 'ms' : ''}
          sub={db && !db.reachable ? null : (db ? t.dbConnectionsSub.replace('{inUse}',db.in_use).replace('{idle}',db.idle).replace('{max}',db.max_open_connections) : null)}
          na={db && !db.reachable ? t.dbUnreachable : null}/>
      </div>

      <div className="mini-card">
        <div className="mini-card-title">{t.systemStatus}</div>
        <div className="sys-detail-grid">
          <div className="sys-detail-item"><div className="sys-detail-label">{t.uptime}</div><div className="sys-detail-value">{data ? formatUptime(data.uptime_seconds, t) : '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goroutines}</div><div className="sys-detail-value">{data?.goroutines ?? '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.serverOs}</div><div className="sys-detail-value" style={{textTransform:'capitalize'}}>{data?.os || '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goVersion}</div><div className="sys-detail-value">{data?.go_version || '—'}</div></div>
        </div>
      </div>
    </div>
  );
}

function AdminPage({ token, issueTypes, onTypesUpdate, departments, onDepartmentsUpdate, connectaAgents, onConnectaAgentsUpdate, consumableItems, onConsumableItemsUpdate, settings, onSettingsUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [name, setName] = useState('');
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  const [deptName, setDeptName] = useState('');
  const [savingDept, setSavingDept] = useState(false);
  const [deptErr, setDeptErr] = useState('');

  const [agentName, setAgentName] = useState('');
  const [savingAgent, setSavingAgent] = useState(false);
  const [agentErr, setAgentErr] = useState('');

  const [ciName, setCiName] = useState('');
  const [ciIcon, setCiIcon] = useState('box');
  const [savingCi, setSavingCi] = useState(false);
  const [ciErr, setCiErr] = useState('');
  const [editingIconId, setEditingIconId] = useState(null);

  const [windowHours, setWindowHours] = useState(settings?.duplicate_window_hours ?? 24);
  const [savingSettings, setSavingSettings] = useState(false);
  useEffect(() => {
    if (settings) setWindowHours(settings.duplicate_window_hours);
  }, [settings]);

  async function saveSettings(e) {
    e.preventDefault();
    setSavingSettings(true);
    try {
      const res = await apiFetch('/settings', {method:'PATCH', body:{duplicate_window_hours: Number(windowHours)}, token});
      onSettingsUpdate(res.settings);
      setToast(t.settingsSaved);
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSavingSettings(false); }
  }

  async function addType(e) {
    e.preventDefault();
    const trimmed = name.trim();
    if (!trimmed) return;
    setSaving(true); setErr('');
    try {
      const res = await apiFetch('/issue-types', {method:'POST', body:{name: trimmed}, token});
      onTypesUpdate(prev => [...prev, res.issue_type].sort((a,b)=>a.name.localeCompare(b.name)));
      setName('');
      setToast(t.toastTypeAdded);
    } catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  async function removeType(id) {
    try {
      await apiFetch(`/issue-types/${id}`, {method:'DELETE', token});
      onTypesUpdate(prev => prev.filter(it => it.id !== id));
      setToast(t.toastTypeDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function updateTypeColor(id, hex) {
    try {
      const res = await apiFetch(`/issue-types/${id}/color`, {method:'PATCH', body:{color:hex}, token});
      onTypesUpdate(prev => prev.map(it => it.id===id ? res.issue_type : it));
      setToast(t.toastTypeColorUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addDept(e) {
    e.preventDefault();
    const trimmed = deptName.trim();
    if (!trimmed) return;
    setSavingDept(true); setDeptErr('');
    try {
      const res = await apiFetch('/departments', {method:'POST', body:{name: trimmed}, token});
      onDepartmentsUpdate(prev => [...prev, res.department].sort((a,b)=>a.name.localeCompare(b.name)));
      setDeptName('');
      setToast(t.toastDeptAdded);
    } catch(ex) { setDeptErr(ex.message); }
    finally { setSavingDept(false); }
  }

  async function removeDept(id) {
    try {
      await apiFetch(`/departments/${id}`, {method:'DELETE', token});
      onDepartmentsUpdate(prev => prev.filter(d => d.id !== id));
      setToast(t.toastDeptDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addAgent(e) {
    e.preventDefault();
    const trimmed = agentName.trim();
    if (!trimmed) return;
    setSavingAgent(true); setAgentErr('');
    try {
      const res = await apiFetch('/connecta-agents', {method:'POST', body:{name: trimmed}, token});
      onConnectaAgentsUpdate(prev => [...prev, res.connecta_agent].sort((a,b)=>a.name.localeCompare(b.name)));
      setAgentName('');
      setToast(t.toastAgentAdded);
    } catch(ex) { setAgentErr(ex.message); }
    finally { setSavingAgent(false); }
  }

  async function removeAgent(id) {
    try {
      await apiFetch(`/connecta-agents/${id}`, {method:'DELETE', token});
      onConnectaAgentsUpdate(prev => prev.filter(a => a.id !== id));
      setToast(t.toastAgentDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addConsumableItem(e) {
    e.preventDefault();
    const trimmed = ciName.trim();
    if (!trimmed) return;
    setSavingCi(true); setCiErr('');
    try {
      const res = await apiFetch('/consumable-items', {method:'POST', body:{name: trimmed, icon: ciIcon}, token});
      onConsumableItemsUpdate(prev => [...prev, res.consumable_item].sort((a,b)=>a.name.localeCompare(b.name)));
      setCiName(''); setCiIcon('box');
      setToast(t.toastConsumableAdded);
    } catch(ex) { setCiErr(ex.message); }
    finally { setSavingCi(false); }
  }

  async function removeConsumableItem(id) {
    try {
      await apiFetch(`/consumable-items/${id}`, {method:'DELETE', token});
      onConsumableItemsUpdate(prev => prev.filter(ci => ci.id !== id));
      if (editingIconId === id) setEditingIconId(null);
      setToast(t.toastConsumableDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function updateConsumableItemIcon(id, icon) {
    try {
      const res = await apiFetch(`/consumable-items/${id}/icon`, {method:'PATCH', body:{icon}, token});
      onConsumableItemsUpdate(prev => prev.map(ci => ci.id===id ? res.consumable_item : ci));
      setEditingIconId(null);
      setToast(t.toastConsumableIconUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  return (
    <div style={{maxWidth:1360}}>
      <div className="mini-card" style={{marginBottom:20}}>
        <div className="mini-card-title" style={{marginBottom:6}}>{t.adminAlerts}</div>
        <p style={{fontSize:13,color:'var(--gray-400)',margin:'0 0 16px'}}>{t.adminAlertsSub}</p>
        <form onSubmit={saveSettings} className="admin-form">
          <div className="form-group" style={{maxWidth:180}}>
            <label>{t.duplicateWindowLabel}</label>
            <input className="form-control" type="number" min="1" max="720" value={windowHours}
              onChange={e=>setWindowHours(e.target.value)} />
          </div>
          <button type="submit" className="btn btn-primary" disabled={savingSettings || !windowHours}>
            {Ic.check} {savingSettings ? '…' : t.saveChanges}
          </button>
        </form>
      </div>

      <div className="admin-grid">
        <div>
          <div className="mini-card" style={{marginBottom:20}}>
            <div className="mini-card-title" style={{marginBottom:6}}>{t.adminIssueTypes}</div>
            <p style={{fontSize:13,color:'var(--gray-400)',margin:'0 0 16px'}}>{t.adminIssueTypesSub}</p>
            {err && <div className="auth-error" style={{marginBottom:14}}>{err}</div>}
            <form onSubmit={addType} className="admin-form">
              <div className="form-group">
                <label>{t.issueType}</label>
                <input className="form-control" placeholder={t.issueTypePlaceholder} value={name}
                  onChange={e=>setName(e.target.value)} maxLength={50}/>
              </div>
              <button type="submit" className="btn btn-primary" disabled={saving || !name.trim()}>
                {Ic.plus} {saving ? '…' : t.addIssueType}
              </button>
            </form>
          </div>

          <div className="table-card">
            <div className="table-header">
              <span className="table-title">{t.adminIssueTypes}</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{issueTypes.length}</span>
            </div>
            {issueTypes.length === 0
              ? <div className="empty-state">{Ic.list}<p>{t.noIssueTypes}</p></div>
              : <table>
                  <thead>
                    <tr><th>{t.type}</th><th></th></tr>
                  </thead>
                  <tbody>
                    {issueTypes.map(it=>(
                      <tr key={it.id}>
                        <td><TypeBadge type={it.name}/></td>
                        <td style={{textAlign:'right'}}>
                          <input type="color" className="color-swatch-input" title={t.changeColor}
                            value={it.color} onChange={e=>updateTypeColor(it.id, e.target.value)}/>
                          <button className="icon-btn" title={t.removeType} onClick={()=>removeType(it.id)}>{Ic.trash}</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>

        <div>
          <div className="mini-card" style={{marginBottom:20}}>
            <div className="mini-card-title" style={{marginBottom:6}}>{t.adminDepartments}</div>
            <p style={{fontSize:13,color:'var(--gray-400)',margin:'0 0 16px'}}>{t.adminDepartmentsSub}</p>
            {deptErr && <div className="auth-error" style={{marginBottom:14}}>{deptErr}</div>}
            <form onSubmit={addDept} className="admin-form">
              <div className="form-group">
                <label>{t.department}</label>
                <input className="form-control" placeholder={t.departmentPlaceholder} value={deptName}
                  onChange={e=>setDeptName(e.target.value)} maxLength={50}/>
              </div>
              <button type="submit" className="btn btn-primary" disabled={savingDept || !deptName.trim()}>
                {Ic.plus} {savingDept ? '…' : t.addDepartment}
              </button>
            </form>
          </div>

          <div className="table-card">
            <div className="table-header">
              <span className="table-title">{t.adminDepartments}</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{departments.length}</span>
            </div>
            {departments.length === 0
              ? <div className="empty-state">{Ic.list}<p>{t.noDepartments}</p></div>
              : <table>
                  <thead>
                    <tr><th>{t.department}</th><th></th></tr>
                  </thead>
                  <tbody>
                    {departments.map(d=>(
                      <tr key={d.id}>
                        <td>{d.name}</td>
                        <td style={{textAlign:'right'}}>
                          <button className="icon-btn" title={t.removeDepartment} onClick={()=>removeDept(d.id)}>{Ic.trash}</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>

        <div>
          <div className="mini-card" style={{marginBottom:20}}>
            <div className="mini-card-title" style={{marginBottom:6}}>{t.adminAgents}</div>
            <p style={{fontSize:13,color:'var(--gray-400)',margin:'0 0 16px'}}>{t.adminAgentsSub}</p>
            {agentErr && <div className="auth-error" style={{marginBottom:14}}>{agentErr}</div>}
            <form onSubmit={addAgent} className="admin-form">
              <div className="form-group">
                <label>{t.connectaAgent}</label>
                <input className="form-control" placeholder={t.agentPlaceholder} value={agentName}
                  onChange={e=>setAgentName(e.target.value)} maxLength={100}/>
              </div>
              <button type="submit" className="btn btn-primary" disabled={savingAgent || !agentName.trim()}>
                {Ic.plus} {savingAgent ? '…' : t.addAgent}
              </button>
            </form>
          </div>

          <div className="table-card">
            <div className="table-header">
              <span className="table-title">{t.adminAgents}</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{connectaAgents.length}</span>
            </div>
            {connectaAgents.length === 0
              ? <div className="empty-state">{Ic.list}<p>{t.noAgents}</p></div>
              : <table>
                  <thead>
                    <tr><th>{t.connectaAgent}</th><th></th></tr>
                  </thead>
                  <tbody>
                    {connectaAgents.map(a=>(
                      <tr key={a.id}>
                        <td>{a.name}</td>
                        <td style={{textAlign:'right'}}>
                          <button className="icon-btn" title={t.removeAgent} onClick={()=>removeAgent(a.id)}>{Ic.trash}</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>

        <div>
          <div className="mini-card" style={{marginBottom:20}}>
            <div className="mini-card-title" style={{marginBottom:6}}>{t.adminConsumables}</div>
            <p style={{fontSize:13,color:'var(--gray-400)',margin:'0 0 16px'}}>{t.adminConsumablesSub}</p>
            {ciErr && <div className="auth-error" style={{marginBottom:14}}>{ciErr}</div>}
            <form onSubmit={addConsumableItem}>
              <div className="form-group">
                <label>{t.consumableName}</label>
                <input className="form-control" placeholder={t.consumableNamePlaceholder} value={ciName}
                  onChange={e=>setCiName(e.target.value)} maxLength={50}/>
              </div>
              <div className="form-group" style={{marginTop:14}}>
                <label>{t.consumableIconLabel}</label>
                <ConsumableIconGrid value={ciIcon} onChange={setCiIcon}/>
              </div>
              <div className="admin-form-inline" style={{marginTop:16}}>
                <div className="ci-preview">
                  <ConsumableIcon name={ciIcon} size={36}/>
                  <span style={{color: ciName.trim() ? 'var(--gray-900)' : 'var(--gray-400)'}}>{ciName.trim() || t.consumableNamePlaceholder}</span>
                </div>
                <button type="submit" className="btn btn-primary" disabled={savingCi || !ciName.trim()}>
                  {Ic.plus} {savingCi ? '…' : t.addConsumable}
                </button>
              </div>
            </form>
          </div>

          <div className="table-card">
            <div className="table-header">
              <span className="table-title">{t.adminConsumables}</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>{consumableItems.length}</span>
            </div>
            {consumableItems.length === 0
              ? <div className="empty-state">{Ic.box}<p>{t.noConsumableItems}</p></div>
              : <table>
                  <thead>
                    <tr><th>{t.consumableName}</th><th></th></tr>
                  </thead>
                  <tbody>
                    {consumableItems.map(ci=>(
                      <React.Fragment key={ci.id}>
                        <tr>
                          <td>
                            <div style={{display:'flex',alignItems:'center',gap:10}}>
                              <button type="button" className="cicon-btn" title={t.changeIcon}
                                onClick={()=>setEditingIconId(editingIconId===ci.id ? null : ci.id)}>
                                <ConsumableIcon name={ci.icon} size={34}/>
                              </button>
                              <span style={{fontWeight:500}}>{ci.name}</span>
                            </div>
                          </td>
                          <td style={{textAlign:'right'}}>
                            <button className="icon-btn" title={t.removeConsumable} onClick={()=>removeConsumableItem(ci.id)}>{Ic.trash}</button>
                          </td>
                        </tr>
                        {editingIconId === ci.id && (
                          <tr className="icon-editor-row">
                            <td colSpan={2}>
                              <div className="icon-editor-label">{t.changeIcon}</div>
                              <ConsumableIconGrid value={ci.icon} onChange={icon=>updateConsumableItemIcon(ci.id, icon)}/>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════ ROOT APP ════════════════ */
function App() {
  const [lang,    setLang]    = useState(()=>loadLS('lira_lang','en'));
  const [theme,   setTheme]   = useState(()=>loadLS('lira_theme','light'));
  const [session, setSession] = useState(()=>loadLS('lira_session', null)); // {user, token}
  const [apt,     setApt]     = useState([]);
  const [dept,    setDept]    = useState([]);
  const [users,   setUsers]   = useState([]);
  const [issueTypes, setIssueTypes] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [connectaAgents, setConnectaAgents] = useState([]);
  const [consumableItems, setConsumableItems] = useState([]);
  const [settings, setSettings] = useState(null);
  const [alerts, setAlerts] = useState([]);
  const alertsPendingCount = useMemo(() => alerts.filter(a => a.status === 'pending').length, [alerts]);
  const typeColorMap = useMemo(
    () => Object.fromEntries(issueTypes.map(it => [it.name, it.color])),
    [issueTypes]
  );
  const [stats,   setStats]   = useState(null);
  const [page,    setPage]    = useState('dashboard');
  const [modal,   setModal]   = useState(null);
  const [editing, setEditing] = useState(null);
  const [pending, setPending] = useState(null);   // issue awaiting delete confirmation
  const [toast,   setToast]   = useState(null);
  const [newIssueId, setNewIssueId] = useState(null);
  const [apiErr,  setApiErr]  = useState('');

  const t     = T[lang];
  const token = session?.token;
  const me    = session?.user;

  useEffect(()=>{
    if ((page === 'admin' || page === 'system') && me?.role !== 'manager') setPage('dashboard');
  }, [page, me]);

  useEffect(()=>{ saveLS('lira_lang', lang); }, [lang]);
  useEffect(()=>{
    saveLS('lira_theme', theme);
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);
  useEffect(()=>{ saveLS('lira_session', session); }, [session]);

  // Load all data when logged in
  useEffect(() => {
    if (!token) return;
    const todayStr = new Date().toISOString().slice(0,10);
    Promise.all([
      apiFetch('/issues?mode=apt', {token}),
      apiFetch('/issues?mode=dept', {token}),
      apiFetch('/users', {token}),
      apiFetch(`/stats?date=${todayStr}`, {token}),
      apiFetch('/issue-types', {token}),
      apiFetch('/departments', {token}),
      apiFetch('/connecta-agents', {token}),
      apiFetch('/settings', {token}),
      apiFetch('/alerts', {token}),
      apiFetch('/consumable-items', {token}),
    ]).then(([aptRes, deptRes, usersRes, statsRes, typesRes, deptsRes, agentsRes, settingsRes, alertsRes, consumableItemsRes]) => {
      setApt((aptRes.issues || []).map(mapIssue));
      setDept((deptRes.issues || []).map(mapIssue));
      setUsers(usersRes.users || []);
      setStats(statsRes.stats);
      setIssueTypes(typesRes.issue_types || []);
      setDepartments(deptsRes.departments || []);
      setConnectaAgents(agentsRes.connecta_agents || []);
      setSettings(settingsRes.settings);
      setAlerts(alertsRes.alerts || []);
      setConsumableItems(consumableItemsRes.consumable_items || []);
    }).catch(ex => {
      if (ex.message.includes('401') || ex.message.toLowerCase().includes('token')) {
        setSession(null); // token expired
      } else {
        setApiErr(ex.message);
      }
    });
  }, [token]);

  function login(user, token) {
    setSession({user, token});
    setPage('dashboard');
  }

  function logout() {
    setSession(null);
    setApt([]); setDept([]); setUsers([]); setStats(null); setIssueTypes([]); setDepartments([]); setConnectaAgents([]); setConsumableItems([]); setSettings(null); setAlerts([]);
  }

  // Called when profile updates come back from API
  function onSessionUpdate(updatedUser) {
    setSession(s => ({...s, user: updatedUser}));
    saveLS('lira_session', {...session, user: updatedUser});
  }

  // The third-party handovers as the issue endpoint expects them. Fields that
  // don't belong to a handover's company are dropped here so the server never
  // has to reject the request.
  function supportRequestBody(list) {
    return (list || []).map(s => ({
      id:                  s.id || undefined,
      company:             s.company,
      status:              s.status,
      telnet_technician:   s.company === 'telnet'    ? (s.technician  || null) : null,
      telnet_confirmed_by: s.company === 'telnet'    ? (s.confirmedBy || null) : null,
      telefonica_ticket_id:s.company === 'telefonica' ? (s.ticketId    || null) : null,
      // "YYYY-MM-DDTHH:MM" is exactly what the datetime-local inputs produce.
      started_at:  s.startedAt  || null,
      resolved_at: s.resolvedAt || null,
      notes:       s.notes || '',
    }));
  }

  async function addIssue(form, mode) {
    try {
      const body = {
        mode,
        location: mode==='apt' ? form.apt : form.dept,
        type:         form.type,
        problem:      form.problem,
        resolution:   form.resolution,
        time_minutes: Number(form.time),
        start_time:   form.startTime,
        end_time:     form.endTime,
        status:       form.status,
        reported_by_agent:  form.reportedByAgent,
        confirmed_by_agent: form.confirmedByAgent,
        false_positive: !!form.falsePositive,
        consumables: (form.consumables || []).map(c => ({item_id: c.itemId, quantity: c.quantity})),
        support_requests: supportRequestBody(form.supportRequests),
      };
      const res = await apiFetch('/issues', {method:'POST', body, token});
      const issue = mapIssue(res.issue);
      if (mode==='apt') setApt(p=>[issue,...p]);
      else              setDept(p=>[issue,...p]);
      // Briefly flag the new row so IssuesTable can animate it in and
      // pulse its status indicator, then clear the flag once that's done.
      setNewIssueId(issue.id);
      setTimeout(() => setNewIssueId(id => id===issue.id ? null : id), 1200);
      // Refresh stats
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastLogged);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function saveEdit(form, mode, id) {
    try {
      const body = {
        mode,
        location:     mode==='apt' ? form.apt : form.dept,
        type:         form.type,
        problem:      form.problem,
        resolution:   form.resolution,
        time_minutes: Number(form.time),
        start_time:   form.startTime,
        end_time:     form.endTime,
        status:       form.status,
        reported_by_agent:  form.reportedByAgent,
        confirmed_by_agent: form.confirmedByAgent,
        false_positive: !!form.falsePositive,
        consumables: (form.consumables || []).map(c => ({item_id: c.itemId, quantity: c.quantity})),
        support_requests: supportRequestBody(form.supportRequests),
      };
      const res = await apiFetch(`/issues/${id}`, {method:'PATCH', body, token});
      const updated = mapIssue(res.issue);
      const upd = list => list.map(i=>i.id===id ? updated : i);
      if (mode==='apt') setApt(upd); else setDept(upd);
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  // Deleting is two-step: the row's bin button only asks, and the confirmation
  // dialog calls delIssue. `pending` holds {issue, mode} — and busy:true once
  // the request is in flight, so the dialog can't be double-submitted.
  function askDelete(issue, mode) {
    setPending({issue, mode});
  }

  async function delIssue() {
    if (!pending || pending.busy) return;
    const {issue, mode} = pending;
    setPending({issue, mode, busy:true});
    try {
      await apiFetch(`/issues/${issue.id}`, {method:'DELETE', token});
      if (mode==='apt') setApt(p=>p.filter(i=>i.id!==issue.id));
      else              setDept(p=>p.filter(i=>i.id!==issue.id));
      const todayStr = new Date().toISOString().slice(0,10);
      apiFetch(`/stats?date=${todayStr}`, {token}).then(r=>setStats(r.stats)).catch(()=>{});
      setToast(t.toastDeleted);
      setPending(null);
    } catch(ex) {
      setToast('Error: ' + ex.message);
      setPending(null);
    }
  }

  if (!session) return (
    <LangCtx.Provider value={lang}>
      <AuthScreen onLogin={login} lang={lang} onLangChange={setLang} theme={theme} onThemeChange={setTheme}/>
    </LangCtx.Provider>
  );

  const nav = [
    {id:'dashboard', label:t.dashboard,  icon:Ic.grid },
    {id:'apt',       label:t.aptIssues,  icon:Ic.list },
    {id:'dept',      label:t.deptIssues, icon:Ic.edit },
    {id:'history',   label:t.history,    icon:Ic.clock},
    {id:'alerts',    label:t.alerts,     icon:Ic.bell },
    {id:'analytics', label:t.analytics,  icon:Ic.trending},
    {id:'consumables', label:t.consumables, icon:Ic.box},
    {id:'support',    label:t.supportPage,  icon:Ic.tool},
    {id:'team',      label:t.team,       icon:Ic.users},
    {id:'reports',   label:'Reports',    icon:Ic.report},
    ...(me.role === 'manager' ? [{id:'system', label:t.systemStatus, icon:Ic.server}] : []),
    ...(me.role === 'manager' ? [{id:'admin', label:t.admin, icon:Ic.shield}] : []),
    {id:'profile',   label:'Profile',    icon:Ic.person},
  ];

  return (
    <LangCtx.Provider value={lang}>
    <TypeColorCtx.Provider value={typeColorMap}>
      <div className="app">
        <aside className="sidebar">
          <div className="sidebar-logo">
            <div className="logo-mark">{Ic.logo}</div>
            <div><div className="logo-text">LIRA</div><div className="logo-sub">{t.appSub}</div></div>
          </div>
          <div className="sidebar-section">
            <div className="sidebar-section-label">{t.menu}</div>
            {nav.map(n=>(
              <button key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
                {n.id==='alerts' && alertsPendingCount > 0 ? (
                  <span className="nav-icon-wrap">
                    {n.icon}
                    <span className="nav-badge">{alertsPendingCount > 99 ? '99+' : alertsPendingCount}</span>
                  </span>
                ) : n.icon}
                <span>{n.label}</span>
              </button>
            ))}
          </div>
          <div className="sidebar-footer">
            <div className="sidebar-user" style={{cursor:'pointer'}} onClick={()=>setPage('profile')}>
              {me.avatar_data
                ? <img src={me.avatar_data} style={{width:30,height:30,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                : <Avatar name={me.name} idx={me.avatar_idx}/>
              }
              <div>
                <div className="sidebar-user-name">{me.name}</div>
                <div className="sidebar-user-role">{me.role==='manager' ? t.managerRole : t.techRole}</div>
              </div>
            </div>
            <button className="logout-btn" onClick={logout}>{Ic.logout} {t.signOut}</button>
          </div>
        </aside>

        <div className="main">
          <div className="topbar">
            <div className="topbar-left">
              <h1>{nav.find(n=>n.id===page)?.label || page.charAt(0).toUpperCase() + page.slice(1)}</h1>
              <p>{today(lang)}</p>
            </div>
            <div className="topbar-right">
              <ThemeToggle theme={theme} onChange={setTheme}/>
              <LangToggle lang={lang} onChange={setLang}/>
              {page !== 'profile' && page !== 'reports' && page !== 'admin' && <>
                <button className="btn btn-ghost" onClick={()=>setModal('dept')}>{Ic.plus} {t.deptIssueBtn}</button>
                <button className="btn btn-primary" onClick={()=>setModal('apt')}>{Ic.plus} {t.aptIssueBtn}</button>
              </>}
            </div>
          </div>

          {apiErr && (
            <div style={{margin:'16px 28px 0',background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,display:'flex',alignItems:'center',gap:8}}>
              {Ic.info} {apiErr} <button style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'var(--red)'}} onClick={()=>setApiErr('')}>{Ic.x}</button>
            </div>
          )}

          <div className="content">
            {page==='dashboard' && <Dashboard apt={apt} dept={dept} users={users} stats={stats}/>}
            {page==='apt'       && <IssuesTable issues={apt}  tableMode="apt"  currentUser={me} newIssueId={newIssueId} onDelete={askDelete} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='dept'      && <IssuesTable issues={dept} tableMode="dept" currentUser={me} newIssueId={newIssueId} onDelete={askDelete} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='history'   && <HistoryPage apt={apt} dept={dept} currentUser={me} onDelete={askDelete} onEdit={(i,m)=>setEditing({issue:i,mode:m})}/>}
            {page==='alerts'    && <AlertsPage alerts={alerts} currentUser={me} token={token} onAlertsUpdate={setAlerts} setToast={setToast}/>}
            {page==='analytics' && <AnalyticsPage token={token} alertsPendingCount={alertsPendingCount}/>}
            {page==='consumables' && <ConsumablesPage token={token}/>}
            {page==='support' && <SupportPage token={token}/>}
            {page==='team'    && <TeamPage users={users} apt={apt} dept={dept} currentUser={me}/>}
            {page==='reports' && <ReportsPage token={token}/>}
            {page==='system' && me.role==='manager' && <SystemStatusPage token={token}/>}
            {page==='admin' && me.role==='manager' && <AdminPage
              token={token}
              issueTypes={issueTypes}
              onTypesUpdate={setIssueTypes}
              departments={departments}
              onDepartmentsUpdate={setDepartments}
              connectaAgents={connectaAgents}
              onConnectaAgentsUpdate={setConnectaAgents}
              consumableItems={consumableItems}
              onConsumableItemsUpdate={setConsumableItems}
              settings={settings}
              onSettingsUpdate={setSettings}
              setToast={setToast}
            />}
            {page==='profile' && <ProfilePage
              currentUser={me}
              token={token}
              users={users}
              onSessionUpdate={onSessionUpdate}
              onUsersUpdate={setUsers}
              setToast={setToast}
              lang={lang}
              onLangChange={setLang}
            />}
          </div>
        </div>

        {modal && (
          <IssueModal issueMode={modal} currentUser={me} issueTypes={issueTypes} departments={departments} connectaAgents={connectaAgents} consumableItems={consumableItems} token={token} onClose={()=>setModal(null)} onSave={form=>addIssue(form,modal)}/>
        )}
        {editing && (
          <IssueModal issueMode={editing.mode} editIssue={editing.issue} currentUser={me} issueTypes={issueTypes} departments={departments} connectaAgents={connectaAgents} consumableItems={consumableItems} token={token}
            onClose={()=>setEditing(null)} onSave={form=>saveEdit(form,editing.mode,editing.issue.id)}/>
        )}
        {pending && (
          <ConfirmDeleteIssue issue={pending.issue} deleting={!!pending.busy}
            onCancel={()=>setPending(null)} onConfirm={delIssue}/>
        )}
        {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>
    </TypeColorCtx.Provider>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
