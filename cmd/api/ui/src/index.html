    {swapOpen && (
      <TVSwapModal swaps={form.tvSwaps} currentRoom={location}
        onCancel={()=>setSwapOpen(false)}
        onDone={sel=>{ set('tvSwaps', sel); setSwapOpen(false); }}/>
    )}
    {supportOpen && (
      <SupportRequestModal requests={form.supportRequests}
        onCancel={()=>setSupportOpen(false)}
        onDone={sel=>{ set('supportRequests', sel); setSupportOpen(false); }}/>
    )}
    </>
  );
}

/* ════════════════ DASHBOARD ════════════════ */
/* One person in the "team today" band.
   The shift's own text times are printed rather than the instants from the payload:
   `shift.end_time` is already "16:00" as the hotel writes it, so formatting it is a
   no-op, while re-deriving an hour from a timestamp is exactly the mistake the server
   side spent this change fixing. */
function TodayPerson({ t, m, changed }) {
  const tone = m.status === 'working_now' ? 'is-now'
    : m.status === 'coming_soon' ? 'is-soon'
    : m.status === 'finished'   ? 'is-done'
    : 'is-away';
  const mark = m.status === 'working_now' ? Ic.check
    : m.status === 'coming_soon' ? Ic.clock
    : m.status === 'away'       ? Ic.slash
    : Ic.check;

  // Only working_now and coming_soon have a useful time, and they want DIFFERENT ones:
  // "until 16:00" is how long you have them, "from 19:00" is when they arrive. For
  // somebody who left at 09:00, "until 16:00" would be noise.
  const when = (() => {
    if (!m.shift) return '';
    if (m.status === 'working_now') {
      return t.todayUntil.replace('{time}', m.shift.end_time)
        + (m.from_yesterday ? '' : '');
    }
    if (m.status === 'coming_soon') return t.todayFrom.replace('{time}', m.shift.start_time);
    return m.shift.start_time + ' – ' + m.shift.end_time;
  })();

  return (
    <div className={`rota-person ${tone}${m.active ? '' : ' is-inactive'}${changed ? ' now-person-changed' : ''}`}>
      <Avatar name={m.name} idx={m.avatar_idx}/>
      <span className="rota-person-id">
        <span className="rota-person-name">
          {m.name}
          {/* The overnight tail. Without this, a member on until 06:00 reads as 06:00
              TONIGHT. Reuses the rota page's own mark and key verbatim. */}
          {m.from_yesterday && (
            <span className="rota-person-plus1"
              title={t.todayOvernightTitle.replace('{name}', m.name)}>
              {t.rotaPlusOne}
            </span>
          )}
        </span>
        <span className="rota-person-when">
          {m.shift ? <>{m.shift.name} · <span className="rota-person-time">{when}</span></> : ''}
        </span>
        {/* "+1" reads aloud as "plus one", which means nothing, so the same sentence
            that is in the tooltip is also in the accessible name. The cell is not a
            control, so aria-label cannot carry it. */}
        <span className="sr-only">
          {m.from_yesterday ? t.todayOvernightTitle.replace('{name}', m.name) : ''}
        </span>
      </span>
      <span className="rota-person-mark" aria-hidden="true">{mark}</span>
    </div>
  );
}

/* "Who is on now", and the staleness rules that make it honest.
   A dashboard left open from 07:00 must not show a frozen 07:00. */
function useTodayRota() {
  const [data, setData] = useState(null);
  const [stale, setStale] = useState(false);
  const [shown, setShown] = useState({});   // status keyed by user_id, for the pulse
  const dayRef = useRef('');

  const load = useCallback(() => {
    // No token: /v1/today is PUBLIC, like /v1/schedule, because it is a strict subset of
    // what that already publishes.
    return apiFetch('/today')
      .then(res => {
        const d = res.today;
        if (!d) return;
        // The DAY ROLLED OVER while the tab sat open. The statuses were computed for
        // yesterday, so they are all wrong -- a stale flag alone would be a lie, since
        // the numbers look current.
        const rolled = dayRef.current !== '' && dayRef.current !== d.date;
        dayRef.current = d.date;
        setShown(prev => {
          const next = {};
          for (const m of d.members || []) next[m.user_id] = m.status;
          if (rolled) return {};
          for (const id in prev) if (!(id in next) || prev[id] !== next[id]) next['~' + id] = true;
          return next;
        });
        setData(d);
        setStale(false);
      })
      // Keep the LAST GOOD members and mark the dot stale. A dashboard that empties
      // itself on a network blip is strictly worse than one showing a slightly old
      // answer -- usePagedList documents the same rows-vs-error rule.
      .catch(() => setStale(true));
  }, []);

  useEffect(() => { load(); }, [load]);

  useEffect(() => {
    const id = setInterval(load, 60000);
    // visibilitychange is the one that MATTERS: setInterval is throttled hard in a
    // background tab, so the interval alone is not trustworthy.
    const onVis = () => { if (!document.hidden) load(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
  }, [load]);

  return { data, stale, load, changed: shown };
}

function TodayBand({ t, lang, rota, onGoToPage }) {
  const { data, stale, changed } = rota;
  const members = (data && data.members) || [];

  const groups = [
    { key: 'working_now',  label: t.todayWorking, cls: 'is-now',  cap: 10 },
    { key: 'coming_soon',  label: t.todayComing,  cls: 'is-soon', cap: 10 },
    { key: 'finished',     label: t.todayFinished, cls: 'is-done', cap: 4 },
    { key: 'away',         label: t.todayAway,    cls: 'is-away', cap: 4 },
  ];

  const asOf = data && data.now
    ? new Date(data.now).toLocaleTimeString(lang === 'pt' ? 'pt-PT' : 'en-GB',
        { hour: '2-digit', minute: '2-digit' })
    : '';

  return (
    <div className="mini-card now-band">
      <div className="now-band-head">
        <span className="mini-card-title">{t.todayTeam}</span>
        {data && (
          <span className="now-band-head-right">
            {/* Reuses .sys-live and its dot VERBATIM -- same pulse, same .stale grey --
                because that is already the app's liveness mark. The TEXT differs: System
                says "updated Ns ago", a live countdown. This says "as of 14:22", once,
                from the SERVER's instant, because the question is WHEN THIS WAS TRUE and
                not how old this is. */}
            <span className="now-asof">
              <span className={'sys-live-dot' + (stale ? ' stale' : '')}/>
              {stale ? t.todayStale : t.todayAsOf.replace('{time}', asOf)}
            </span>
            <button type="button" className="btn btn-ghost"
              onClick={() => onGoToPage('schedule')}>
              {t.rotaTitle} {Ic.chevron}
            </button>
          </span>
        )}
      </div>

      {!data && <p className="now-group-empty">{t.analyticsLoading}</p>}

      {data && members.length === 0 && (
        <p className="now-group-empty">{t.todayNoneWorking}</p>
      )}

      {groups.map(g => {
        const rows = members.filter(m => m.status === g.key);
        if (rows.length === 0) return null;
        const shownRows = rows.slice(0, g.cap);
        return (
          <div className="now-group" key={g.key}>
            <div className="now-group-head">
              {g.label}
              <span className="now-group-count">{rows.length}</span>
            </div>
            <div className="now-people">
              {shownRows.map(m => (
                <TodayPerson key={m.user_id} t={t} m={m}
                  changed={!!changed['~' + m.user_id]}/>
              ))}
            </div>
          </div>
        );
      })}

      {/* One footnote for the whole block, and only while somebody is affected. A +1 with
          no legend is a mark that means nothing. */}
      {data && members.some(m => m.from_yesterday) && (
        <p className="now-note">{t.todayOvernightNote}</p>
      )}
    </div>
  );
}

/* "Needs attention".
   NO new request: App already holds the whole consumables catalog from
   /consumable-items at boot, and each item carries a server-derived low_stock, so there
   is exactly ONE low-stock predicate in the app and this block reuses it rather than
   inventing a second that could disagree with the Consumables page.

   The filter is BROADER than low_stock on purpose: `stock <= 0` also catches a genuinely
   empty item whose reorder level was never set. That does not contradict the Consumables
   page, which answers a different question -- "which items are below a configured
   threshold?" -- and keeps showing "Low stock: 0" for the rest. */
function AttentionBand({ t, items, onGoToPage }) {
  const catalog = items || [];
  // Deliberately a DIFFERENT order from the Consumables page's, which sorts by name
  // because it is a catalog you look things up in. This is a triage list, so the most
  // depleted item has to be first. The id tail makes it total.
  const rows = catalog
    .filter(ci => (ci.stock ?? 0) <= 0 || ci.low_stock)
    .sort((a, b) => (a.stock ?? 0) - (b.stock ?? 0)
      || String(a.name).localeCompare(String(b.name))
      || a.id - b.id);

  const CAP = 8;
  const shown = rows.slice(0, CAP);
  const rest = rows.length - shown.length;

  return (
    <div className="mini-card now-band">
      <div className="now-band-head">
        <span className="mini-card-title">{t.attentionTitle}</span>
        <span className="now-band-head-right">
          <button type="button" className="btn btn-ghost" onClick={() => onGoToPage('consumables')}>
            {t.attentionOpen}
          </button>
        </span>
      </div>

      {/* The block ALWAYS renders, empty or not. A block that vanishes teaches the
          reader it does not exist, and absence-of-block on a dashboard is
          indistinguishable from absence-of-feature -- which is the whole answer to "how
          does anyone know it is here". The all-clear is deliberately QUIET ink and a
          small check rather than a green wash: this is the absence of a conclusion, not
          a conclusion, and a green card would be announcing good news. */}
      {catalog.length === 0 && <p className="now-group-empty">{t.noConsumableItems}</p>}

      {catalog.length > 0 && rows.length === 0 && (
        <span className="attn-allgood">{Ic.check} {t.attentionAllGood}</span>
      )}

      {shown.length > 0 && (
        <div className="attn-chips">
          {shown.map(ci => (
            <span className={'attn-chip' + ((ci.stock ?? 0) < 0 ? ' is-over' : '')}
              key={ci.id}
              title={(ci.low_stock || (ci.stock ?? 0) < 0)
                ? t.attentionAtLevel.replace('{n}', ci.reorder_level)
                : t.attentionEmpty}>
              <ConsumableIcon name={ci.icon} size={22}/>
              <span className="attn-name">{ci.name}</span>
              {/* The badge says WHY, and only when it adds something the number does
                  not. A chip reading "empty  0" says the same thing twice, which is
                  what the first screenshot showed for every item; the zero alone is
                  the alarm, and "empty" moves to the title where it explains the chip
                  to a pointer or a screen reader without repeating it visually. */}
              {(ci.stock ?? 0) < 0 ? <span className="badge badge-overdue">{t.stockOverdrawn}</span>
                : ci.low_stock ? <span className="badge badge-soon">{t.lowStock}</span>
                : null}
              <span className="attn-stock">{ci.stock ?? 0}</span>
            </span>
          ))}
          {/* A plain count, not a button: the block already has one link to the same
              destination, and the sort puts the LEAST urgent items in this tail. */}
          {rest > 0 && <span className="attn-more">{t.attentionAndMore.replace('{count}', rest)}</span>}
        </div>
      )}
    </div>
  );
}

function Dashboard({ users, stats, consumableItems, onGoToPage }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];

  /* Everything here comes from /stats. It used to fall back to counting the issue
     list App had in memory while that request was in flight, which meant App had
     to hold every issue ever logged for the sake of a loading state that lasted
     a moment. /stats is fetched at start-up alongside everything else, so the
     numbers are simply absent until it lands. */
  const totalIssues  = stats ? stats.total_issues  : 0;
  const resolved     = stats ? stats.resolved       : 0;
  const byType       = stats ? stats.by_type        : {};
  const byTech       = stats ? stats.by_technician  : [];
  const maxWork      = Math.max(...(byTech.map(t=>t.count)), 1);
  const maxType      = Math.max(...Object.values(byType), 1);

  // Split out from avgTime so the counter has a number to tween. null is the
  // one case that is not a figure at all — nothing to average yet — and it has
  // to stay an em dash rather than count up from zero to nothing.
  const avgNum = stats ? Number(stats.avg_minutes) : null;
  const avgText = avgNum === null ? '—' : Number(avgNum).toFixed(1);

  // ONE rota fetch for the whole page, lifted out of TodayBand so the tile and the band
  // cannot disagree. Two requests would be two answers to "who is on", sixty seconds
  // apart, and the number in the tile would be the one nobody reads.
  const rota = useTodayRota();
  const rotaMembers = (rota.data && rota.data.members) || [];
  // null, not 0: while the answer is unknown the tile must show an em dash. "0 people
  // working" is a meaningful and WRONG answer, and it is the one a naive
  // `(rotaMembers || []).length` produces.
  const onNow = rota.data ? rotaMembers.filter(m => m.status === 'working_now').length : null;
  // Whoever is next, which is what the old tile should have been saying. Coming_soon is
  // already sorted by shift start, so the first of them is the soonest.
  const onNextCell = rotaMembers.find(m => m.status === 'coming_soon' && m.shift);
  const onNext = onNextCell ? { name: onNextCell.name, time: onNextCell.shift.start_time } : null;

  // The bars grow once the data behind them is settled. Keyed on the props rather
  // than on byTech/byType, because both are rebuilt into a fresh object on every
  // render while stats are still loading -- keying on those would restart the
  // animation continuously instead of once.
  const barsRef = useAnimate((g, root, opts) => {
    MOTION.grow(g, root.querySelectorAll('.bar-fill'), 'x', 0.04);
  }, [stats, users]);

  return (
    <div ref={barsRef}>
      {/* The accent on each tile comes from the theme, not from a hex written
          here. They used to be literals, which meant the dark theme never reached
          them -- "Resolved" kept the *light* --green at 3.90:1 while its three
          siblings inherited body ink at 14.36:1, so the least prominent number on
          the page was the one reporting something good. #639922 was not one of
          this app's greens at all. Routing all four through tokens lets each page
          follow the theme with no override of its own. */}
      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-label">{t.totalToday}</div>
          <div className="stat-value"><CountUp value={totalIssues}/></div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'var(--blue)'}}></span>{t.aptsAndDepts}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.resolved}</div>
          <div className="stat-value" style={{color:'var(--green)'}}><CountUp value={resolved}/></div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'var(--green)'}}></span>{totalIssues ? Math.round(resolved/totalIssues*100) : 0}{t.resolutionRate}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.avgTime}</div>
          {/* The em dash case gets no unit: "—m" would read as a figure. */}
            <div className="stat-value">{avgNum === null ? avgText : <><CountUp value={avgNum} decimals={1}/><span style={{fontSize:14,fontWeight:400,color:'var(--gray-400)'}}>m</span></>}</div>
          <div className="stat-sub"><span className="stat-dot" style={{background:'var(--amber)'}}></span>{t.acrossAll}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">{t.todayOnShift}</div>
          {/* An EM DASH while the answer is unknown, never 0. "0 people working" is a
              meaningful and wrong answer; the em dash is the one thing on this row that
              is not a figure, which is the same reasoning avgTime gives above. */}
          <div className="stat-value">
            {onNow === null ? '—' : <CountUp value={onNow}/>}
          </div>
          <div className="stat-sub">
            <span className="stat-dot" style={{background: onNow ? 'var(--green)' : 'var(--teal-mid)'}}></span>
            {/* The old tile put EVERY active user's name into this box, which .stat-sub
                has no clamp for -- about 1,800px of text in a 244px column, seven
                wrapped lines, and the page read BROKEN rather than empty. One bounded
                line naming who is NEXT, which is the thing a reader actually wants off
                a dashboard, replaces it.

                The caption is CONDITIONAL rather than falling back to a sentence about
                nobody being on. The first version fell back to todayNoneWorking, which
                printed "2" directly above "Nobody is on shift right now" -- the tile
                contradicting its own caption because the caption was about the wrong
                thing. When nobody is coming later the honest caption is no caption. */}
            {onNext
              ? t.todayNext.replace('{name}', onNext.name).replace('{time}', onNext.time)
              : (onNow === 0 ? t.todayNoneWorking : '')}
          </div>
        </div>
      </div>

      {/* The two operational bands sit ABOVE the bar charts, not below them. Everything
          above them is retrospective -- issues logged, issues resolved, averages -- and
          nothing on the page answered "what is happening now" until these two arrived.
          The charts are the only surfaces for by_technician and by_type, so they stay
          rather than go; costing them a scroll is the price of putting the perishable
          content where people are looking. */}
      <TodayBand t={t} lang={lang} rota={rota} onGoToPage={onGoToPage}/>
      <AttentionBand t={t} items={consumableItems} onGoToPage={onGoToPage}/>

      <div className="bottom-grid">
        <div className="mini-card">
          <div className="mini-card-title">{t.workload}</div>
          {byTech.length===0 && <p style={{color:'var(--gray-400)',fontSize:13}}>{t.noUsers}</p>}
          {byTech.map(ts=>(
            <div className="bar-row" key={ts.user_id}>
              <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxWork)*100}%`,background:'#1769AA'}}></div></div>
              <div className="bar-count">{ts.count}</div>
            </div>
          ))}
        </div>
        <div className="mini-card">
          <div className="mini-card-title">{t.byType}</div>
          {Object.keys(byType).length===0 && <p style={{color:'var(--gray-400)',fontSize:13}}>{t.noIssues}</p>}
          {Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
            <div className="bar-row" key={type}>
              <div className="bar-label">
                <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                {type}
              </div>
              <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
              <div className="bar-count">{count}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ════════════════ ISSUES TABLE ════════════════ */
// The one place that decides whether a resolution time has breached the SLA.
//
// Four tables show a resolution time -- both issue lists, the history table, the
// daily report and the profile -- and a component rather than a helper returning
// a style object is what keeps the comparison and the red from drifting apart
// between them. With no SLA configured it renders exactly what these tables
// rendered before one existed, so the feature is invisible until it is switched on.
//
// sla is nullable and that is the whole off switch: null means no SLA, so nothing
// is ever flagged. Zero could not mean the same thing -- it would mark every issue
// that took any time at all, including a three-minute fix.
function IssueTime({ minutes, sla, t }) {
  const m = Number(minutes) || 0;
  const base = {fontFamily:'DM Mono,monospace', fontSize:13};
  if (sla == null || m <= sla) return <span style={base}>{m}m</span>;
  return (
    <span className="sla-breach" style={base}
      title={t.slaBreachedTitle.replace('{minutes}', sla)}>
      {m}m
    </span>
  );
}

/* `onFailure` / `peerError` / `isPrimary` exist only for the History page, which
   stacks two of these. They share one endpoint, so a dead /issues fails both at
   once and printed the same red banner twice. The parent collects both failures
   through onFailure and passes each table the other's, so the first table to fail
   draws the banner and the second stays quiet -- and a table that fails alone
   still draws its own, rather than being silenced by a peer it is not failing
   with. `isPrimary` is what breaks the tie when both have failed.

   `retrySignal` is the matching half: the parent increments it so one Try again
   re-asks for both tables rather than only the one it was clicked in. */
function IssuesTable({ token, issueTypes, tableMode, date='', epoch=0, currentUser, newIssueId, slaMinutes, onDelete, onEdit, onFailure, peerError, isPrimary, retrySignal=0, onRetryAll }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  // `null` means "no type filter", rather than the translated word for "All".
  // Comparing against t.all left the table empty in any language whose word
  // for "All" isn't literally "All" (Portuguese: "Todas"), and an issue type
  // could also be *named* All/Todas, which the old check couldn't tell apart
  // from the catch-all chip.
  const [filter, setFilter] = useState(null);
  const [search, setSearch] = useState('');
  // Bumped by the retry button under a failed request. Separate from the `epoch`
  // prop -- that one is the page telling this table the world moved on, and is not
  // something a button here should be advancing on the app's behalf.
  const [retry, setRetry] = useState(0);

  /* The search box talks to the server rather than filtering the rows in hand.
     It used to narrow an array that held every issue ever logged, which is why
     it could be a plain input handler. Now that only a page of rows is in hand,
     filtering locally would mean searching twenty issues and calling it the whole
     list -- so the term goes to the endpoint, which already knew how to match it.
     Debounced, because each keystroke otherwise becomes a request. */
  const [query, setQuery] = useState('');
  useEffect(() => {
    const id = setTimeout(() => setQuery(search.trim()), 250);
    return () => clearTimeout(id);
  }, [search]);

  // `date` is how the History page narrows to a single day. It goes to the server
  // rather than being applied to whatever arrived, for the same reason the search
  // does: a day filter applied to a loaded page would report a day with nothing
  // in it while the server was holding the rows.
  const list = usePagedList(limit => {
    const qs = new URLSearchParams({mode: tableMode, limit: String(limit)});
    if (filter) qs.set('type', filter);
    if (query) qs.set('search', query);
    if (date) qs.set('date', date);
    return `/issues?${qs}`;
  }, token, {rowsKey:'issues', map:mapIssue, filterKey: `${tableMode}|${filter}|${query}|${date}|${epoch}|${retry}|${retrySignal}`});

  const issues = list.rows || [];

  // Reported up to the History page. A ref-and-callback rather than a dependency
  // so a parent passing an inline arrow does not restart the fetch.
  const onFailureRef = useRef(onFailure);
  onFailureRef.current = onFailure;
  useEffect(() => {
    if (onFailureRef.current) onFailureRef.current(tableMode, list.error || null);
  }, [tableMode, list.error]);
  // The chips come from the type catalog rather than from the rows on screen: with
  // only the loaded page in hand, a type whose issues are all further down would
  // have no chip at all, and picking it was impossible.
  const chips = [{label:t.all, value:null}, ...issueTypes.map(ty=>({label:ty.name, value:ty.name}))];

  const canAct = issue => currentUser.role==='manager' || issue.loggedBy===currentUser.id;

  // Clicking anywhere in a row opens it for editing, but only for the user who
  // logged it (or a manager) — the same rule the edit button and the API enforce.
  function openFromRow(e, issue) {
    // A click that ends with text selected is someone trying to copy
    // something out of the row, not someone trying to edit the issue.
    if (window.getSelection()?.toString()) return;
    onEdit(issue, tableMode);
  }

  return (
    <div className="table-card">
      <div className="table-header">
        <span className="table-title">{tableMode==='apt' ? t.aptIssuesTitle : t.deptIssuesTitle}</span>
        <div className="table-actions">
          <div className="filter-chips">
            {chips.map(c=><button key={c.value ?? '__all__'} className={`chip ${filter===c.value?'active':''}`} onClick={()=>setFilter(c.value)}>{c.label}</button>)}
          </div>
          <div className="search-wrap">
            {Ic.search}
            <input aria-label={tableMode==='apt' ? t.searchApt : t.searchDept}
              placeholder={tableMode==='apt' ? t.searchApt : t.searchDept} value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
        </div>
      </div>
      {/* The request failed. Checked before rows, because a failed request also
          leaves rows null -- asking for rows alone meant a dead endpoint rendered
          "Loading analytics…" here for as long as the page was open. */}
      {list.error ? (
        /* Kept quiet when this table's peer has failed too and it is not the one
           that owns the banner -- same failure, same message, same retry, printed
           twice on one screen. */
        (peerError && !isPrimary) ? null :
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,marginBottom:16,display:'flex',alignItems:'center',gap:10}}>
          <span style={{flex:1}}>{list.error}</span>
          <button className="btn btn-ghost" style={{padding:'4px 12px',fontSize:12}}
            onClick={() => { setRetry(n => n + 1); if (onRetryAll) onRetryAll(); }}>{t.tryAgain}</button>
        </div>
      ) : !list.rows ? (
        <div className="empty-state">{Ic.list}<p>{t.analyticsLoading}</p></div>
      ) : issues.length===0 ? (
        <div className="empty-state">{Ic.list}<p>{t.noMatch}</p></div>
      ) : (
        /* Scrolls sideways rather than being clipped by the card. Eight columns
           will not fit a laptop window, and .table-card is overflow:hidden to clip
           its own corners -- so without this the last column and the row's edit and
           delete buttons sit past the card's right edge with no way to reach them,
           and a technician on a narrow screen cannot edit or delete an issue at all.
           Same wrapper the team list and the maintenance activity table use. */
        <div style={{overflowX:'auto'}}>
        <table>
          <thead>
            <tr>
              <th>{tableMode==='apt' ? t.apt : t.dept}</th>
              <th>{t.type}</th><th>{t.problem}</th><th>{t.resolution}</th><th>{t.time}</th><th>{t.status}</th><th>{t.loggedBy}</th><th></th>
            </tr>
          </thead>
          <tbody>
            {issues.map(issue=>(
              <tr key={issue.id}
                  className={`${issue.id===newIssueId ? 'row-enter' : ''}${canAct(issue) ? ' row-clickable' : ''}`}
                  onClick={canAct(issue) ? e=>openFromRow(e,issue) : undefined}
                  title={canAct(issue) ? t.editIssue : undefined}>
                <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{issue.apt||issue.dept}</strong></td>
                <td><TypeBadge type={issue.type}/></td>
                <td style={{maxWidth:150}}>{issue.problem}{issue.falsePositive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}<TVSwapStrip swaps={issue.tvSwaps} t={t}/><ConsumableStrip items={issue.consumables}/><SupportRequestStrip requests={issue.supportRequests} t={t}/></td>
                <td style={{maxWidth:190,color:'var(--gray-600)',fontSize:13}}>{issue.resolution}</td>
                <td><IssueTime minutes={issue.time} sla={slaMinutes} t={t}/></td>
                <td><span className={`badge ${issue.status==='Ok'?'badge-ok':'badge-pending'} ${issue.id===newIssueId ? 'status-highlight' : ''}`}>{issue.status}</span></td>
                <td>
                  <div style={{display:'flex',alignItems:'center',gap:7}}>
                    <Avatar name={issue.loggedByName} idx={issue.loggedByIdx??0} size="sm"/>
                    <span style={{fontSize:13,color:'var(--gray-600)'}}>{issue.loggedByName}</span>
                    {issue.loggedBy===currentUser.id && (
                      <span className="badge" style={{background:'var(--blue-light)',color:'var(--blue)',fontSize:10,padding:'1px 6px'}}>{t.you}</span>
                    )}
                  </div>
                </td>
                <td>
                  <div className="action-cell">
                    {canAct(issue) ? (
                      <>
                        {/* stopPropagation: these sit inside a clickable row, and
                            without it a click on the bin would delete the issue
                            and then open it for editing. */}
                        <button className="icon-btn" title={t.saveChanges} onClick={e=>{e.stopPropagation();onEdit(issue,tableMode);}}>{Ic.edit}</button>
                        <button className="icon-btn danger" title={t.toastDeleted} onClick={e=>{e.stopPropagation();onDelete(issue,tableMode);}}>{Ic.trash}</button>
                      </>
                    ) : (
                      <span style={{fontSize:11,color:'var(--gray-300)',padding:'0 8px',userSelect:'none'}} title="Only the owner or a manager can edit this">—</span>
                    )}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      )}
      <LoadMore list={list} t={t}/>
    </div>
  );
}

/* ════════════════ HISTORY PAGE ════════════════ */
function HistoryPage({ token, issueTypes, epoch=0, currentUser, slaMinutes, onDelete, onEdit }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const todayStr = localISODate(new Date());
  const [date, setDate] = useState('');
  /* Both tables below ask the same endpoint, so when /issues is unreachable they
     both fail at once and each printed its own red banner with the same text.
     Which of them failed is tracked here instead, and only one banner is drawn:
     the apt table's, because it is the one that comes first on the page. The
     retry counter is shared for the same reason -- one Try again re-asks both
     questions, rather than fixing whichever table the button happened to be in
     and leaving the other showing the stale failure. */
  const [failures, setFailures] = useState({});
  const [retrySignal, setRetrySignal] = useState(0);
  const noteFailure = useCallback((mode, error) => {
    setFailures(prev => prev[mode] === error ? prev : {...prev, [mode]: error});
  }, []);

  return (
    <div>
      <div className="table-card" style={{marginBottom:16,padding:'14px 20px',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <label htmlFor="history-date" style={{fontSize:13,fontWeight:600,color:'var(--gray-600)'}}>{t.historyPickDate}</label>
        <input
          id="history-date" type="date" className="form-control" style={{width:'auto'}}
          value={date} max={todayStr}
          onChange={e=>setDate(e.target.value)}
        />
        <button className="btn btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>setDate(todayStr)}>{t.historyToday}</button>
        <button className="btn btn-ghost" style={{fontSize:12,padding:'6px 12px'}} onClick={()=>setDate('')}>{t.historyAllDates}</button>
        {/* Today's list is not just today's issues: anything still pending from an
            earlier day stays on it until it is solved, so the number of rows can
            be larger than the number logged today. Saying so is the difference
            between that looking like a bug and looking like the point. A past
            date is that date alone, which is why only today is mentioned. */}
        {!date
          ? <span style={{fontSize:12,color:'var(--gray-400)',marginLeft:'auto'}}>{t.historyShowingAll}</span>
          : date === todayStr &&
            <span style={{fontSize:12,color:'var(--gray-400)',marginLeft:'auto'}}>{t.historyTodayCarriesPending}</span>}
      </div>

      {/* Both tables are given the chosen date and ask the server for that day's
          rows. They used to receive the whole issue list and narrow it here,
          which is why this page needed every issue in memory to show one day of
          them. Each table now paginates on its own, so the two can be showing
          different amounts. */}
      <IssuesTable token={token} issueTypes={issueTypes} tableMode="apt"  date={date} epoch={epoch} currentUser={currentUser} slaMinutes={slaMinutes} onDelete={onDelete} onEdit={onEdit}
        onFailure={noteFailure} peerError={failures.dept} isPrimary retrySignal={retrySignal} onRetryAll={()=>setRetrySignal(n => n + 1)}/>
      <IssuesTable token={token} issueTypes={issueTypes} tableMode="dept" date={date} epoch={epoch} currentUser={currentUser} slaMinutes={slaMinutes} onDelete={onDelete} onEdit={onEdit}
        onFailure={noteFailure} peerError={failures.apt} retrySignal={retrySignal} onRetryAll={()=>setRetrySignal(n => n + 1)}/>
    </div>
  );
}

/* ════════════════ ALERTS PAGE ════════════════ */
function AlertsPage({ currentUser, token, onCountsUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const isManager = currentUser.role === 'manager';
  const [filter, setFilter] = useState('pending');
  const [solvingId, setSolvingId] = useState(null);
  const [solvingTvId, setSolvingTvId] = useState(null);
  const [solutionText, setSolutionText] = useState('');
  const [saving, setSaving] = useState(false);

  /* This page fetches its own alerts. It used to receive them from App, which
     also needed them only for the sidebar badge -- so App held every alert card
     and its nested list of occurrences in memory to draw one number.

     The status filter goes to the server, so switching between Pending and Solved
     asks for that set rather than narrowing a set it already has. The endpoint
     answers with both kinds in one request and its own pending counts, which is
     what the chips are drawn from -- those count every outstanding alert, not
     just the loaded page, so the badge never empties itself when you look at the
     solved ones. */
  // Re-read after a solve or a delete so the card that was just dealt with leaves
  // the list it was on. Part of the filter key, which also drops the limit back
  // to one page: the card that was solved is no longer in this set at all, so
  // there is nothing to be gained by keeping the pages that were already loaded.
  const [epoch, setEpoch] = useState(0);
  const refresh = () => setEpoch(n => n + 1);

  const paged = usePagedList(limit => `/alerts?limit=${limit}&status=${filter}`, token,
    {rowsKey:'alerts', filterKey: `${filter}|${epoch}`});

  // `rows` is the alert array itself; the counts and the second list live alongside
  // it in the response, so they are read from there rather than off the array.
  //
  // These two are declared before the effect below, not after it, and that ordering
  // is load-bearing. A dependency array is evaluated while rendering -- before the
  // effect's body ever runs -- so naming `data` in it while `data` is still a const
  // awaiting its declaration is a ReferenceError, not a stale read. It read as
  // harmless for as long as Babel was compiling this file, because Babel's preset-env
  // quietly rewrote every const to var and the uninitialised read came back as
  // undefined instead of throwing: no crash, and a sidebar badge that never updated
  // after an alert was dealt with here. esbuild keeps the const, so the same line
  // took the whole page down.
  const data = paged.res;
  const list = paged.rows;

  // The sidebar badge and the Analytics sentence are drawn from a count the app
  // holds, and this page is now the only thing that knows when an alert has been
  // dealt with. Without handing the fresh figure back, signing off the last
  // recurring alert here would leave a "1" in the sidebar until the next reload.
  useEffect(() => {
    if (data && onCountsUpdate) onCountsUpdate(data.pending_count || 0);
  }, [data, onCountsUpdate]);

  const tvList = data ? (data.tv_swap_alerts || []) : [];
  // The server has already filtered both lists by status, so this is what is
  // on screen -- no narrowing needed here.
  const tvFiltered = tvList;
  // The chips count every alert of each kind, across all pages rather than the
  // loaded one, and across both kinds of alert.
  const pendingCount = data ? (data.pending_count || 0) + (data.tv_swap_pending_count || 0) : 0;
  const solvedCount  = data ? (data.solved_count  || 0) + (data.tv_swap_solved_count  || 0) : 0;
  // Section headings: how many this filter holds, which is `total` because the
  // request was already filtered.
  const tvShownTotal  = data ? (data.tv_swap_total || 0) : 0;
  const shownTotal    = data ? (data.total || 0) : 0;

  async function submitSolve(id) {
    const trimmed = solutionText.trim();
    if (!trimmed) return;
    setSaving(true);
    try {
      await apiFetch(`/alerts/${id}/solve`, {method:'PATCH', body:{solution:trimmed}, token});
      setSolvingId(null);
      setSolutionText('');
      setToast(t.alertSolved);
      refresh();
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSaving(false); }
  }

  async function removeAlert(id) {
    try {
      await apiFetch(`/alerts/${id}`, {method:'DELETE', token});
      setToast(t.alertDeleted);
      refresh();
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function submitTvSolve(id) {
    const trimmed = solutionText.trim();
    if (!trimmed) return;
    setSaving(true);
    try {
      await apiFetch(`/tv-swap-alerts/${id}/solve`, {method:'PATCH', body:{solution:trimmed}, token});
      setSolvingTvId(null);
      setSolutionText('');
      setToast(t.tvSwapAlertSolved);
      refresh();
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSaving(false); }
  }

  /* A dead /alerts is not an empty list of alerts. Everything below is drawn from
     `data`, and with no data those counts are zeros -- so a failed request left the
     chips reading "Pending (0) | Solved (0)", contradicting the sidebar badge that
     still held the real figure, and both sections showing "Loading analytics…"
     forever. There is nothing honest to draw without the answer, so the page says
     what happened once and offers to ask again.

     An early return rather than a branch inside the markup: the two sections below
     are long, and a ternary wrapped around them would either reindent all of it or
     leave the section headings -- which are outside the `!data` branches -- still
     announcing "0 of". */
  if (paged.error) {
    return (
      <div>
        <div className="table-card" style={{marginBottom:16,padding:'14px 20px'}}>
          <p style={{fontSize:13,color:'var(--gray-400)',margin:0}}>{t.alertsSubtitle}</p>
        </div>
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,marginBottom:16,display:'flex',alignItems:'center',gap:10}}>
          <span style={{flex:1}}>{paged.error}</span>
          <button className="btn btn-ghost" style={{padding:'4px 12px',fontSize:12}}
            onClick={refresh}>{t.tryAgain}</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="table-card" style={{marginBottom:16,padding:'14px 20px'}}>
        <p style={{fontSize:13,color:'var(--gray-400)',margin:0}}>{t.alertsSubtitle}</p>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <button className={`chip ${filter==='pending'?'active':''}`} onClick={()=>setFilter('pending')}>
          {t.alertsPending} ({pendingCount})
        </button>
        <button className={`chip ${filter==='solved'?'active':''}`} onClick={()=>setFilter('solved')}>
          {t.alertsSolved} ({solvedCount})
        </button>
      </div>

      {/* ── Equipment swapped out ──
          Its own section above the recurring ones, because a swap is not the same
          kind of warning: it says a set was carried in to cover for a fault, so
          the room's own equipment is still broken. Nothing about it is recurring.
          The empty case is spelled out rather than left blank, so an absent
          section does not read as a section that failed to load. */}
      <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:12}}>
        <h2 style={{fontSize:15,margin:0}}>{t.tvSwapAlertsTitle}</h2>
        <span style={{fontSize:12.5,color:'var(--gray-400)'}}>
          {tvShownTotal} {t.tvSwapAlertsOf}
        </span>
      </div>

      {!data ? (
        <div className="empty-state">{Ic.tv}<p>{t.analyticsLoading}</p></div>
      ) : tvFiltered.length === 0 ? (
        <div className="empty-state">{Ic.tv}
          <p>{filter==='pending' ? t.tvSwapAlertsEmpty : t.tvSwapAlertsSolvedEmpty}</p>
        </div>
      ) : tvFiltered.map(alert => (
        <div className="table-card" key={'tv'+alert.id} style={{marginBottom:16}}>
          <div className="table-header">
            <div style={{display:'flex',alignItems:'center',gap:10,minWidth:0}}>
              <span style={{color: alert.status==='solved' ? 'var(--green)' : 'var(--amber)'}}>{Ic.tv}</span>
              {/* The room named is the swap's source, not the issue's location.
                  The issue was logged where the fault was found, which is the
                  room that borrowed a working set; the room now left holding a
                  dud is the one that lent its own away, and that is the room
                  somebody has to walk to. Falls back to the issue's location so a
                  swap recorded without a source shows something rather than a
                  blank heading. */}
              <span className="table-title">{alert.from_room || alert.location}</span>
              <TypeBadge type={alert.type}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {isManager && alert.status==='pending' && solvingTvId!==alert.id && (
                <button className="btn btn-ghost" style={{padding:'4px 10px',fontSize:12}}
                  onClick={()=>{setSolvingTvId(alert.id); setSolutionText('');}}>
                  {t.markSolved}
                </button>
              )}
            </div>
          </div>

          <div style={{padding:'13px 20px',borderBottom: alert.status==='solved' || solvingTvId===alert.id ? 'none' : '1px solid var(--gray-200)'}}>
            {/* One {type} in the sentence, so a single replace covers it. The type is
                named rather than hard-coded as "TV", so this stays right if
                another type ever records swaps. */}
            <p style={{margin:'0 0 9px',fontSize:13.5}}>{t.tvSwapAlertBody.replace('{type}', alert.type)}</p>
            {alert.problem && (
              <p style={{margin:'0 0 9px',fontSize:13,color:'var(--gray-600)'}}>{alert.problem}</p>
            )}
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px 18px',fontSize:12,color:'var(--gray-400)'}}>
              <span>{t.tvSwapAlertFrom} <strong style={{color:'var(--gray-900)'}}>{alert.from_room}</strong></span>
              <span>{t.tvSwapAlertTo} <strong style={{color:'var(--gray-900)'}}>{alert.to_room}</strong></span>
              <span>{t.date} {new Date(alert.swap_created_at).toLocaleString()}</span>
              <span>{t.loggedBy} {alert.logged_by_name}</span>
            </div>
            {alert.notes && (
              <p style={{margin:'9px 0 0',fontSize:12.5,color:'var(--gray-600)',fontStyle:'italic'}}>{alert.notes}</p>
            )}
          </div>

          {alert.status === 'solved' && (
            <div style={{padding:'12px 20px',background:'var(--green-light)',borderTop:'1px solid var(--gray-200)'}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--green)',textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:4}}>{t.finalSolution}</div>
              <div style={{fontSize:13,color:'var(--gray-900)'}}>{alert.solution}</div>
              <div style={{fontSize:11.5,color:'var(--gray-400)',marginTop:6}}>
                {t.solvedBy} <strong>{alert.solved_by_name}</strong>

              <col style={{width:'14%'}}/>
              <col style={{width:'20%'}}/>
              <col style={{width:'34%'}}/>
              <col style={{width:'12%'}}/>
              <col style={{width:'20%'}}/>

            <thead>
              <tr>
                <th>{t.date}</th>
                <th>{t.problem}</th>
                <th>{t.resolution}</th>

                <th>{t.loggedBy}</th>

            </thead>
            <tbody>
              {issues.map(issue => (
                <tr key={issue.id}>
                  <td style={{fontSize:12,color:'var(--gray-400)',whiteSpace:'nowrap'}}>
                    {new Date(issue.created_at).toLocaleString()}

                  <td>{issue.problem || '—'}
                    <TVSwapStrip swaps={issue.tv_swaps} t={t}/></td>
                  <td>{issue.resolution || '—'}</td>
                  <td><span className={`badge ${issue.status==='Ok'?'badge-ok':'badge-pending'}`}>{issue.status}</span></td>
                  <td>{issue.logged_by_name}</td>
                </tr>
              ))}
            </tbody>
          </table>

          {/* Every issue this alert was raised for has since been deleted, so
              it is a leftover rather than a live problem. An empty table with
              headers and no rows reads as a bug, so say what it actually is and
              point at the one action that clears it. */}
          {isStale && (
            <div className="alert-stale">
              <p className="alert-stale-title">{t.alertStaleTitle}</p>
              <p className="alert-stale-body">{t.alertStaleBody}</p>

                  onClick={()=>removeAlert(alert.id)}>
                  {t.alertStaleDismiss}
                </button>
              )}
            </div>
          )}
        </div>
      );})}

      {/* One footer for the page rather than one per section: both sections come
          from a single request and page together, so a reader who has loaded six
          pages has six pages of each. */}
      <LoadMore list={paged} t={t}/>
    </div>
  );
}

/* ── Third-party support: how long the company took ── */
/* Renders a number of minutes the way the support page shows it: days first
   once a handover runs past a day, then hours and minutes. Returns null for a
   missing duration, so callers can show a dash rather than a misleading "0m". */
function formatSupportDuration(minutes) {
  if (minutes == null) return null;
  const total = Math.round(minutes);
  if (total <= 0) return '0m';
  const days   = Math.floor(total / 1440);
  const hours  = Math.floor((total % 1440) / 60);
  const mins   = total % 60;
  const unit = (n, u) => `${n}${u}${n === 1 ? '' : 's'}`;
  if (days > 0 && hours > 0) return `${unit(days,'d')} ${unit(hours,'h')}`;
  if (days > 0)             return unit(days, 'd');
  if (hours > 0 && mins > 0) return `${unit(hours,'h')} ${unit(mins,'m')}`;
  if (hours > 0)             return unit(hours, 'h');
  return unit(mins, 'm');
}

/* Formats a timestamp for the "Reported" / "Solution" columns. Shows just the
   date when the range spans more than a day, and the time as well when it does
   not, which is what makes a same-day turnaround readable. */
function formatSupportMoment(iso, withTime) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return withTime
    ? d.toLocaleString(undefined, {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})
    : d.toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric'});
}

          </div>

function SupportPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [range, setRange] = useState('all');

  /* The table pages; the statistics above it do not. Both come from the same
     request, and the server computes the figures over every matching row whatever
     the limit is -- so the headline numbers keep describing the whole period
     while only a pageful of handovers is on screen. */
  const paged = usePagedList(limit => {
    const days = SUPPORT_RANGES.find(r=>r.id===range).days;
    const params = new URLSearchParams({limit: String(limit)});
    if (days > 0) {
      // Inclusive of today, so "last 30 days" is 30 days wide rather than 29.
      const from = new Date(); from.setDate(from.getDate() - (days - 1));
      params.set('from', localISODate(from));
      params.set('to', localISODate(new Date()));
    }
    return `/support-requests?${params}`;
  }, token, {rowsKey:'requests', filterKey: range});

  const data = paged.res;
  const loading = paged.loading && !data;
  const stats  = data && data.stats;
  const rows   = (data && data.requests) || [];
  // The same window is either a same-day turnaround or a multi-day one, so show
  // the time of day only when every row fits inside a single day.
  const withTime = rows.some(r => {
    if (!r.started_at || !r.resolved_at) return false;
    return new Date(r.started_at).toDateString() === new Date(r.resolved_at).toDateString();
  });

  return (
    <>
      <p style={{fontSize:13,color:'var(--gray-400)',margin:'-6px 0 18px',maxWidth:760}}>{t.supportSubtitle}</p>

      <div className="table-card" style={{marginBottom:18}}>
        <div className="table-header">
          <span className="table-title">{t.supportRange}</span>
          <div className="filter-chips">
            {SUPPORT_RANGES.map(r=>(
              <button key={r.id} className={`chip ${range===r.id?'active':''}`} onClick={()=>setRange(r.id)}>
                {t[`supportRange${r.id==='all'?'All':r.id}`]}
              </button>
            ))}
          </div>
        </div>
      </div>

      {stats && (
        <>
          <div className="support-grid">
            {stats.by_company.map(s => <SupportStatCard key={s.company} stats={s} t={t}/>)}
          </div>
          <SupportStatCard stats={stats.overall} t={t} isOverall/>
        </>
      )}

      <p className="support-note" style={{marginTop:18}}>{t.supportExcluded}</p>

      <div className="table-card">
        <div className="table-header">
          <span className="table-title">{t.supportListTitle}</span>
          <span style={{fontSize:12,color:'var(--gray-400)'}}>{rows.length}</span>
        </div>
        {loading ? (
          <div className="empty-state"><p>…</p></div>
        ) : rows.length === 0 ? (
          <div className="empty-state">{Ic.clock}<p>{t.supportListEmpty}</p></div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>{t.supportListColumnIssue}</th><th>{t.supportListColumnCompany}</th>
                <th>{t.supportListColumnReference}</th><th>{t.supportListColumnReported}</th>
                <th>{t.supportListColumnSolution}</th><th>{t.supportListColumnDuration}</th>
                <th>{t.supportListColumnStatus}</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(r=>(
                <tr key={r.id}>
                  <td>
                    <strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{r.issue_location}</strong>
                    <div style={{fontSize:12.5,color:'var(--gray-500)',marginTop:2}}>{r.issue_problem}</div>
                  </td>
                  <td>
                    <span className={`tp-strip-item ${r.company}`} style={{fontSize:11}}>
                      {r.company==='telnet' ? t.companyTelnet : t.companyTelefonica}
                    </span>
                  </td>
                  <td style={{fontSize:12.5,color:'var(--gray-600)'}}>{r.reference || '—'}</td>
                  <td style={{fontSize:12.5,color:'var(--gray-500)',whiteSpace:'nowrap'}}>
                    {formatSupportMoment(r.started_at, withTime) || '—'}
                  </td>
                  <td style={{fontSize:12.5,color:'var(--gray-500)',whiteSpace:'nowrap'}}>
                    {formatSupportMoment(r.resolved_at, withTime) || '—'}
                  </td>
                  <td>
                    <span className={`support-dur ${r.duration_minutes==null ? 'pending' : ''}`}>
                      {formatSupportDuration(r.duration_minutes) || '—'}
                    </span>
                  </td>
                  <td>
                    <span className={`badge ${r.status==='solved'?'badge-ok':'badge-pending'}`}>
                      {r.status==='solved' ? t.supportSolved : t.supportPending}
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
        <LoadMore list={paged} t={t}/>
      </div>
    </>
  );
}

/* Every TV swap in one list, for the overview the per-issue strips cannot give:
   which rooms have been borrowing sets from each other, and whether the same pair
   keeps recurring (which usually means one room's set is failing for good). */
function TVSwapsPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [range, setRange] = useState('all');
  const [query, setQuery] = useState('');
  // Bumped by the retry button under a failed request, in the same way the issue
  // tables do it. The range alone is not enough to re-run a fetch that failed.
  const [retry, setRetry] = useState(0);

  /* The swap list pages from the server. The search box below still narrows what
     has been loaded rather than going to the server, which is a deliberate
     difference from the issues table: the terms here are room numbers and short
     notes typed by a technician looking at one screen, and the endpoint has no
     search of its own to send them to. So "load more" is what widens it, and the
     footer says how much is loaded out of how much exists. */
  const paged = usePagedList(limit => {
    const days = SUPPORT_RANGES.find(r=>r.id===range).days;
    const params = new URLSearchParams({limit: String(limit)});
    if (days > 0) {
      // Inclusive of today, so "last 30 days" is 30 days wide rather than 29.
      const from = new Date(); from.setDate(from.getDate() - (days - 1));
      params.set('from', localISODate(from));
      params.set('to', localISODate(new Date()));
    }
    return `/tv-swaps?${params}`;
  }, token, {rowsKey:'swaps', filterKey: `${range}|${retry}`});

  const swaps = paged.rows || [];
  // Gated on the error as well as the rows: a failed request also leaves rows
  // null, so asking only for rows drew "no swaps recorded" for a request that
  // had already come back broken -- a page reporting an absence it never asked
  // about. Same reasoning as the LCU list and the issue table.
  const loading = paged.loading && !paged.rows && !paged.error;

  const q = query.trim().toLowerCase();
  const shown = q
    ? swaps.filter(s => [s.from_room, s.to_room, s.notes, s.issue_problem, s.issue_type]
        .some(v => String(v||'').toLowerCase().includes(q)))
    : swaps;

  // Counted over the whole range, not over `shown`. Tying the search box's
  // visibility to the filtered list would make it vanish the moment it
  // narrowed the results, stranding the user in the filtered view with no way
  // to widen it again.
  const allRooms = useMemo(() => {
    const set = new Set();
    for (const s of swaps) { set.add(s.from_room); set.add(s.to_room); }
    return set.size;
  }, [swaps]);

  // A room that borrowed more than it lent is the one worth looking at: it is
  // living off a set that belongs elsewhere. Counted from the destination side
  // so "1301 <- 1204" credits 1204 as the lender.
  const tally = useMemo(() => {
    const borrowed = new Map(), lent = new Map();
    for (const s of shown) {
      borrowed.set(s.to_room,   (borrowed.get(s.to_room)   || 0) + 1);
      lent.set(s.from_room,     (lent.get(s.from_room)     || 0) + 1);
    }
    return {borrowed, lent};
  }, [shown]);

  const rooms = useMemo(() => {
    const set = new Set();
    for (const s of shown) { set.add(s.from_room); set.add(s.to_room); }
    return [...set].sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
  }, [shown]);

  return (
    <>
      <p style={{fontSize:13,color:'var(--gray-400)',margin:'-6px 0 18px',maxWidth:760}}>{t.tvSwapsSubtitle}</p>

      <div className="table-card" style={{marginBottom:18}}>
        <div className="table-header">
          <span className="table-title">{t.supportRange}</span>
          <div className="filter-chips">
            {SUPPORT_RANGES.map(r=>(
              <button key={r.id} className={`chip ${range===r.id?'active':''}`} onClick={()=>setRange(r.id)}>
                {t[`supportRange${r.id==='all'?'All':r.id}`]}
              </button>
            ))}
          </div>
        </div>
      </div>

      {rooms.length > 0 && (
        <div className="analytics-grid" style={{marginBottom:18}}>
          <div className="stat-card">
            <div className="stat-label" style={{marginBottom:4}}>{t.tvSwapsStatTotal}</div>
            <div className="stat-value">{shown.length}</div>
          </div>
          <div className="stat-card">
            <div className="stat-label" style={{marginBottom:4}}>{t.tvSwapsStatRooms}</div>
            <div className="stat-value">{rooms.length}</div>
          </div>
        </div>
      )}

      {/* The search box lives outside the table so it survives the results
          narrowing to nothing — otherwise a search that matched nothing would
          remove the only control that could undo it. */}
      {!loading && allRooms > 8 && (
        <div className="table-card" style={{marginBottom:18}}>
          <div className="search-wrap" style={{padding:'14px 20px 0'}}>
            {Ic.search}
            <input aria-label={t.tvSwapsSearch} placeholder={t.tvSwapsSearch} value={query} onChange={e=>setQuery(e.target.value)}/>
          </div>
        </div>
      )}

      {paged.error ? (
        <div className="table-card">
          <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,margin:'14px 20px',display:'flex',alignItems:'center',gap:10}}>
            <span style={{flex:1}}>{paged.error}</span>
            <button className="btn btn-ghost" style={{padding:'4px 12px',fontSize:12}}
              onClick={()=>setRetry(n => n + 1)}>{t.tryAgain}</button>
          </div>
        </div>
      ) : loading ? (
        <div className="empty-state"><p>{t.analyticsLoading}</p></div>
      ) : shown.length === 0 ? (
        <div className="empty-state">{Ic.tv}<p>{q ? t.tvSwapsNoMatch : t.tvSwapsEmpty}</p></div>
      ) : (
        <div className="table-card">
          <table>
            <thead>
              <tr>
                <th>{t.date}</th>
                <th>{t.tvSwapFrom}</th>
                <th>{t.tvSwapTo}</th>
                <th>{t.tvSwapsColIssue}</th>
                <th>{t.tvSwapNotes}</th>
                <th>{t.loggedBy}</th>
              </tr>
            </thead>
            <tbody>
              {shown.map(s=>{
                const borrowed = tally.borrowed.get(s.to_room) || 0;
                const lent     = tally.lent.get(s.from_room)     || 0;
                return (
                  <tr key={s.id}>
                    <td style={{fontSize:12,color:'var(--gray-400)',whiteSpace:'nowrap'}}>
                      {new Date(s.created_at).toLocaleString()}
                    </td>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <span style={{color:'var(--gray-400)',fontSize:11}}>{Ic.tv}</span>
                        <strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{s.from_room}</strong>
                        {/* A room that has lent more often than it borrowed is
                            the one worth looking at: its own sets keep going
                            somewhere else. */}
                        {lent > 1 && (
                          <span className="badge" style={{background:'var(--amber-light)',color:'var(--amber)',fontSize:10,padding:'1px 7px'}}>
                            {lent} {t.tvSwapsLent}
                          </span>
                        )}
                      </div>
                    </td>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <span style={{color:'var(--gray-300)',fontSize:13}}>{'\u2192'}</span>
                        <strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{s.to_room}</strong>
                        {borrowed > 1 && (
                          <span className="badge" style={{background:'var(--amber-light)',color:'var(--amber)',fontSize:10,padding:'1px 7px'}}>
                            {borrowed} {t.tvSwapsBorrowed}
                          </span>
                        )}
                      </div>
                    </td>
                    <td style={{maxWidth:180}}>

/* Formats a current-vs-previous change: {pct, dir, color}. goodDirection
   is 'up', 'down', or 'neutral' - determines whether an increase should be
   shown as good (green) or bad (red). */
function analyticsChange(current, previous, goodDirection) {
  if (previous === 0) {
    if (current === 0) return null;
    const dir = current > 0 ? 'up' : 'down';
    return { pct: null, dir, color: analyticsChangeColor(dir, goodDirection) };
  }
  const pct = ((current - previous) / previous) * 100;
  if (Math.abs(pct) < 0.5) return { pct: 0, dir: 'flat', color: 'var(--gray-400)' };
  const dir = pct > 0 ? 'up' : 'down';
  return { pct, dir, color: analyticsChangeColor(dir, goodDirection) };
}
function analyticsChangeColor(dir, goodDirection) {
  if (goodDirection === 'neutral') return 'var(--gray-400)';
  const isGood = (dir === 'up' && goodDirection === 'up') || (dir === 'down' && goodDirection === 'down');
  return isGood ? 'var(--green)' : 'var(--red)';
}

function AnalyticsMetricCard({ label, current, previous, suffix, decimals, goodDirection, t }) {
  const change = analyticsChange(current, previous, goodDirection);
  return (
    <div className="stat-card">
      <div className="stat-label">{label}</div>
      <div className="stat-value">{current.toFixed(decimals||0)}{suffix||''}</div>
      <div className="stat-sub">
        {change && change.dir !== 'flat' && (
          <span style={{color:change.color,fontWeight:600}}>
            {change.dir==='up' ? '▲' : '▼'} {change.pct!=null ? Math.abs(change.pct).toFixed(0)+'%' : ''}
          </span>
        )}
        <span style={{color:'var(--gray-400)'}}>{t.vsPrevious}</span>
      </div>
    </div>
  );
}

/* Lets a manager put stock in, take it out, or correct it to a counted figure.
   The resulting count is previewed live, and a removal that would overdraw the
   item is pointed out before saving — the server allows a negative count, but
   doing it by accident is not what someone reaching for "remove" means. */
function StockAdjustDialog({ item, onCancel, onSave, saving, t }) {
  const [mode, setMode] = useState('add');   // add | remove | set
  const [value, setValue] = useState('');
  const [note, setNote] = useState('');

  // Escape closes, but not while a save is in flight: the dialog owns the
  // message that will say whether it worked, so it cannot be dismissed first.
  const panelRef = useDialog({onClose: saving ? null : onCancel});
  const n = Number(value);
  const valid = value !== '' && Number.isFinite(n) && (mode === 'set' ? n >= 0 : n > 0);
  const result = !valid ? null : mode === 'set' ? n : mode === 'add' ? item.stock + n : item.stock - n;
  const error = !valid ? null
    : mode === 'set'    ? (n === item.stock ? t.stockNoChange : null)
    : mode === 'remove' ? (n > item.stock ? t.stockWouldGoNegative : null)
    : null;

  function submit() {
    if (!valid || error) return;
    if (mode === 'set')   onSave({set_to: n, note});
    else if (mode === 'add') onSave({change: n, note});
    else                  onSave({change: -n, note});
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && !saving && onCancel()}>
      <div className="modal" style={{maxWidth:420}} ref={panelRef} role="dialog" aria-modal="true" aria-label={t.adjustStock}>
        <div className="modal-header">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <ConsumableIcon name={item.icon} size={30}/>
            <div>
              <h2>{t.adjustStock}</h2>
              <div className="picker-sub">{item.name}</div>
            </div>
          </div>
          <button type="button" className="icon-btn" onClick={onCancel} disabled={saving}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          <div className="form-group">
            {/* A caption for the three mode buttons, not a label: there is no one control
                behind it. The group role is what names it. */}
            <div className="form-group-h" id="stock-mode-h">{t.stockHow}</div>
            <div className="filter-chips" style={{marginTop:2}} role="group" aria-labelledby="stock-mode-h">
              {['add','remove','set'].map(m=>(
                <button key={m} className={`chip ${mode===m?'active':''}`} aria-pressed={mode===m}
                  onClick={()=>{setMode(m);setValue('');}}>
                  {t['stockMode_'+m]}
                </button>
              ))}
            </div>
          </div>
          <div className="form-group">
            <label htmlFor="stock-qty">{mode === 'set' ? t.stockCountedAs : t.stockHowMany}</label>
            <input id="stock-qty" className="form-control" type="number" inputMode="numeric" value={value} autoFocus
              onChange={e=>setValue(e.target.value)} onKeyDown={e=>e.key==='Enter' && submit()}/>
          </div>
          <div className="form-group">
            <label htmlFor="stock-note">{t.stockNote}</label>
            <input id="stock-note" className="form-control" placeholder={t.stockNotePlaceholder} value={note} maxLength={200}
              onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==='Enter' && submit()}/>
          </div>
          {error && <div style={{fontSize:12.5,color:'var(--amber)'}}>{error}</div>}
          {valid && !error && (
            <div style={{fontSize:12.5,color:'var(--gray-400)'}}>
              {t.inStock}: <strong style={{color:'var(--gray-900)'}}>{item.stock}</strong>
              {' → '}
              <strong style={{color: result < 0 ? 'var(--red)' : 'var(--gray-900)'}}>{result}</strong>
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={saving}>{t.cancel}</button>
          <button type="button" className="btn btn-primary" onClick={submit} disabled={!valid || !!error || saving}>
            {saving ? t.analyticsLoading : t.saveChanges}
          </button>
        </div>
      </div>
    </div>
  );
}

function ConsumablesPage({ token, currentUser, onCatalogUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const todayStr = localISODate(new Date());
  const [view, setView] = useState('log');
  // Bumped by the retry button under a failed usage request, as on the issue
  // tables. The date alone cannot re-run a fetch that already failed.
  const [retry, setRetry] = useState(0);

  // ── Log view ──
  const [date, setDate] = useState('');
  /* The usage log pages -- it grows by one row every time anything is used on
     any issue, forever. The per-item running totals above it do not: the server
     computes those over every recorded use regardless of the limit, so the
     figures do not quietly shrink as more rows are loaded under them. */
  const usage = usePagedList(limit => {
    const qs = new URLSearchParams({limit: String(limit)});
    if (date) qs.set('date', date);
    return `/consumables?${qs}`;
  }, token, {rowsKey:'consumables', filterKey: `${date}|${view === 'log' ? 'log' : 'other'}|${retry}`});

  const items   = usage.rows || [];
  const summary = (usage.res && usage.res.summary) || [];
  // Gated on the error too. rows is null after a failure as well as while a
  // request is in flight, so the loading branch alone claimed an empty log for
  // an endpoint that had just answered with an error.
  const loading = usage.loading && !usage.rows && !usage.error;
  // Inventory state. The catalog is fetched here as well as from the issue
  // form, because this page is where stock is corrected and explained.
  const [catalog, setCatalog] = useState([]);
  const [adjusting, setAdjusting] = useState(null);
  const [saving, setSaving] = useState(false);
  const [historyFor, setHistoryFor] = useState(null);
  const [movements, setMovements] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);
  const canManage = !!(currentUser && currentUser.role === 'manager');

  // The issue form's consumable picker is fed from the catalog the app loaded
  // at start-up, which would otherwise still show the count from before any
  // correction made here. Writing every change through to it means a manager
  // who fixes a count is immediately followed by a technician seeing the right
  // number, without anyone reloading.
  const publish = (listOrUpdater) => {
    setCatalog(listOrUpdater);
    if (onCatalogUpdate) onCatalogUpdate(listOrUpdater);
  };
  const replaceItem = updated => publish(list => list.map(ci => ci.id === updated.id ? updated : ci));

  // In full, not a page: this is a catalog rather than a log, and the picker in the
  // issue form has to be able to offer every item in it. The inventory table
  // further down is the same list, and it is where the pagination is worth having.
  const loadCatalog = () =>
    apiFetch('/consumable-items?limit=1000', {token}).then(res => publish(res.consumable_items || []));

  useEffect(() => {
    if (view !== 'log') return;
    loadCatalog().catch(() => {});
  }, [view, token]);

  // ── Weekly report view ──
  // anchor is any day inside the week being shown; the server expands it to the
  // Monday-to-Sunday window and reports the range back.
  const [anchor, setAnchor] = useState(todayStr);
  const [report, setReport] = useState(null);
  const [rLoading, setRLoading] = useState(false);
  const [rError, setRError] = useState('');
  const [downloading, setDownloading] = useState(false);

  useEffect(() => {
    if (view !== 'report') return;
    let cancelled = false;
    setRLoading(true); setRError('');
    apiFetch(`/reports/consumables/weekly?week=${anchor}`, {token})
      .then(res => { if (!cancelled) setReport(res.report || null); })
      .catch(ex => { if (!cancelled) setRError(ex.message); })
      .finally(() => { if (!cancelled) setRLoading(false); });
    return () => { cancelled = true; };
  }, [anchor, token, view]);

  function shiftWeek(days) {
    const d = new Date(anchor + 'T00:00:00');
    d.setDate(d.getDate() + days);
    setAnchor(localISODate(d));
  }

  // Downloading goes through fetch rather than a plain link so the
  // Authorization header reaches the endpoint.
  async function downloadWeeklyPDF() {
    if (!report || downloading) return;
    setDownloading(true);
    try {
      const res = await fetch(`${API}/reports/consumables/weekly.pdf?week=${anchor}`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) {
        let msg = 'Could not generate the PDF';
        try {
          const body = await res.json();
          if (body.error) msg = typeof body.error === 'string' ? body.error : Object.values(body.error).join(', ');
        } catch {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `LIRA-Consumables-Week-${report.from_date}-to-${report.to_date}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (ex) {
      setRError('Error: ' + ex.message);
    } finally {
      setDownloading(false);
    }
  }

  // A bar never reads as zero-width, so a day with one unit is still a day.
  const dayMax = report ? Math.max(1, ...(report.by_day || []).map(d => d.quantity)) : 1;
  // One bar per day of the week, so a quiet day shows as quiet rather than
  // simply missing.
  const dayCells = report ? (() => {
    const byDate = new Map((report.by_day || []).map(d => [d.date, d.quantity]));
    const out = [];
    const start = new Date(report.from_date + 'T00:00:00');
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getTime() + i * 86400000);
      const key = localISODate(d);
      const qty = byDate.get(key) || 0;
      out.push({
        key, qty,
        dow: d.toLocaleDateString(lang === 'pt' ? 'pt-PT' : 'en-GB', { weekday: 'short' }),
        dom: d.getDate(),
        height: qty === 0 ? 2 : Math.max(6, (qty / dayMax) * 100),
      });
    }
    return out;
  })() : [];

  const itemMax    = report ? Math.max(1, ...(report.by_item || []).map(x => x.quantity)) : 1;
  const locMax     = report ? Math.max(1, ...(report.by_location || []).map(x => x.quantity)) : 1;
  const techMax    = report ? Math.max(1, ...(report.by_technician || []).map(x => x.quantity)) : 1;
  const aptRows    = report ? (report.entries || []).filter(e => e.mode === 'apt') : [];
  const deptRows   = report ? (report.entries || []).filter(e => e.mode !== 'apt') : [];

  const statCards = report ? [
    { label: t.item + 's',       value: report.total_quantity, sub: t.weekTotalUnits,   color: '#1769AA' },
    { label: t.records,          value: report.total_records,  sub: t.weekTotalRecords, color: '#1D9E75' },
