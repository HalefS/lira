/* ── what a dialog owes the keyboard ──
   Eleven overlays in this app share one shape: a panel, a header, a close
   button. Ten of them declared aria-modal="true" and not one of them acted on
   it. Focus stayed on whatever opened the dialog, Tab walked straight out into
   the page behind, and Escape did nothing at all.

   That combination is worse than either half on its own. aria-modal tells
   assistive technology the rest of the page is gone; if Tab then puts the focus
   ring out there anyway, the reader has been told something the keyboard is
   contradicting. Withdrawing aria-modal was the other option and it is the
   weaker one -- it leaves screen-reader users free to browse a page that is
   visually covered. So the claim is kept and made true here, once, for all of
   them rather than in each.

   Three things that are load-bearing and not obvious:

   Only the topmost dialog reacts, checked by DOM order. The consumable picker,
   the TV-swap modal and the third-party modal all open from inside the issue
   form and live in the same document, so without this an Escape inside the
   picker would close the picker and the form behind it in the same keystroke.
   The `claimed` flag covers the case DOM order alone gets wrong: React commits
   the child's effect before the parent's, so the picker installs its listener
   first and handles Escape before the form's listener has run at all.

   An element that already holds focus is left there. `autoFocus` and
   `initialFocus` both run before this effect does, and several of these panels
   deliberately start somewhere other than the first control -- the Cancel in a
   destructive confirmation, the room field in the issue form -- so taking focus
   unconditionally would undo choices that were made on purpose.

   Focus is handed back on unmount. A dialog opened from the keyboard has to
   return the user to where they were, or closing one silently teleports them to
   the top of the document and they have to tab all the way down again. */
const DIALOG_FOCUSABLE = [
  'a[href]', 'button:not([disabled])', 'input:not([disabled])',
  'select:not([disabled])', 'textarea:not([disabled])',
  '[tabindex]:not([tabindex="-1"])',
].join(',');

function useDialog({ onClose, initialFocus, preventClose = false }) {
  const panelRef = useRef(null);
  // The handler is held in a ref rather than listed as a dependency, because
  // every caller passes an inline arrow -- a fresh function each render -- and
  // depending on it would tear the listener down and rebuild it constantly.
  const closeRef = useRef(onClose);
  closeRef.current = onClose;

  useEffect(() => {
    const panel = panelRef.current;
    if (!panel) return;
    const restoreTo = document.activeElement;

    if (!panel.contains(document.activeElement)) {
      // The body before the whole panel. Every panel here opens with a close
      // button in its header, so focusing the first focusable outright would put
      // a dialog that has nothing to fill in -- the pickers -- on the X, which is
      // both a control nobody came here to use and a poor place to start reading
      // a list from. A caller that wants a specific field passes initialFocus.
      const body = panel.querySelector('.modal-body') || panel;
      const first = (initialFocus && panel.querySelector(initialFocus))
                 || body.querySelector(DIALOG_FOCUSABLE)
                 || panel.querySelector(DIALOG_FOCUSABLE);
      if (first) first.focus();
    }

    const onKeyDown = e => {
      if (e.claimedByDialog) return;
      const dialogs = document.querySelectorAll('[role="dialog"]');
      // Last in the DOM is the one drawn on top, and the only one entitled to
      // answer the keyboard.
      //
      // dialogs[length - 1], not dialogs[0][length - 1]: the second indexes the
      // first element's children by an integer, which an Element does not have, so
      // it is always undefined, never equals panel, and this returned early on
      // every key -- leaving all eleven dialogs unable to close on Escape or trap
      // Tab while appearing to.
      if (dialogs.length === 0 || dialogs[dialogs.length - 1] !== panel) return;
      e.claimedByDialog = true;

      if (e.key === 'Escape') {
        if (!preventClose && closeRef.current) closeRef.current();
        return;
      }
      if (e.key !== 'Tab') return;
      // Tab and Shift+Tab wrap, so the focus cannot leave through the page
      // behind. Only rendered controls count -- a chip that is not on screen is
      // not somewhere the keyboard can be sent. getClientRects rather than
      // offsetParent, which is null for anything position:fixed and would drop
      // real stops inside a panel that happens to be one.
      const stops = [...panel.querySelectorAll(DIALOG_FOCUSABLE)]
        .filter(el => el.getClientRects().length > 0);
      if (stops.length === 0) { e.preventDefault(); return; }
      const first = stops[0], last = stops[stops.length - 1];
      const at = document.activeElement;
      if (e.shiftKey ? (at === first || !panel.contains(at)) : (at === last || !panel.contains(at))) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    };
    document.addEventListener('keydown', onKeyDown);
    return () => {
      document.removeEventListener('keydown', onKeyDown);
      // Only take focus back if it belongs to this dialog. Two cases count: it is
      // still inside the panel, or it has fallen to <body> because the element
      // that held it was just removed -- which is what a browser does with focus
      // on a node it deletes, and which otherwise drops a keyboard user at the
      // top of the document. If focus has already moved somewhere real -- to the
      // field a sibling dialog put it in, say -- leave it alone; yanking it back
      // would be the bug rather than the fix.
      const at = document.activeElement;
      const ours = panel.contains(at) || at === document.body || at === null;
      if (restoreTo && restoreTo !== document.body && ours && restoreTo.isConnected) {
        restoreTo.focus();
      }
    };
    // initialFocus is a constant selector per caller; onClose is in a ref.
  }, [initialFocus, preventClose]);

  return panelRef;
}

/* The dialog opened by "Add consumables". Works on a draft copy of the selection;
   nothing changes on the issue until the user presses Done. */
function ConsumablePicker({ items, value, onCancel, onDone }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [draft, setDraft] = useState(value);   // [{itemId, quantity}]
  const [query, setQuery] = useState('');

  const panelRef = useDialog({onClose: onCancel});

  const byId = useMemo(()=>Object.fromEntries(draft.map(d=>[d.itemId,d])), [draft]);
  const q = query.trim().toLowerCase();
  const shown = q ? items.filter(it=>it.name.toLowerCase().includes(q)) : items;

  function toggle(id) {
    setDraft(d => d.some(x=>x.itemId===id) ? d.filter(x=>x.itemId!==id) : [...d, {itemId:id, quantity:1}]);
  }
  // Works from the latest state (not the last render), so fast clicks never lose a step.
  function bump(id, delta) {
    setDraft(d => d.flatMap(x => {
      if (x.itemId !== id) return [x];
      const qty = x.quantity + delta;
      return qty < 1 ? [] : [{...x, quantity: Math.min(qty, MAX_CONSUMABLE_QTY)}];  // stepping down from 1 un-selects it
    }));
  }

  return (
    <div className="modal-overlay picker-overlay" onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="modal picker-modal" ref={panelRef} role="dialog" aria-modal="true" aria-label={t.consumablePickerTitle}>
        <div className="modal-header">
          <div>
            <h2>{t.consumablePickerTitle}</h2>
            <div className="picker-sub">{t.consumablePickerSub}</div>
          </div>
          <button type="button" className="icon-btn" onClick={onCancel}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {items.length > 8 && (
            <div className="search-wrap" style={{width:'100%'}}>
              {Ic.search}
              {/* The placeholder is what a sighted reader sees, and a placeholder is not an
                accessible name -- it disappears on first keystroke and is not
                reliably announced at all. Same wording, now as a real name. */}
              <input aria-label={t.consumableSearch} placeholder={t.consumableSearch}
                value={query} onChange={e=>setQuery(e.target.value)} autoFocus/>
            </div>
          )}
          {items.length === 0 ? (
            <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.box}<p>{t.consumableNone}</p></div>
          ) : shown.length === 0 ? (
            <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.search}<p>{t.consumableNoMatch}</p></div>
          ) : (
            <div className="cpick-grid">
              {shown.map(it=>{
                const sel = byId[it.id];
                return (
                  <div key={it.id} role="button" tabIndex={0} aria-pressed={!!sel}
                    className={`cpick-card ${sel?'selected':''}`}
                    onClick={()=>toggle(it.id)}
                    onKeyDown={e=>{ if (e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(it.id); } }}>
                    <span className="cpick-check">{Ic.check}</span>
                    <ConsumableIcon name={it.icon} size={48}/>
                    <span className="cpick-name">{it.name}</span>
                    {/* Remaining stock, so it is obvious before saving that
                        something is about to be drawn down. Shortfall is
                        allowed — the work happened — but shown in red. */}
                    <span className="cpick-stock">
                      {t.inStock}: <strong style={{
                        color: (it.stock ?? 0) < 0 ? 'var(--red)'
                            : it.reorder_level > 0 && it.stock <= it.reorder_level ? 'var(--amber)'
                            : 'var(--gray-500)',
                      }}>{it.stock ?? 0}</strong>
                    </span>
                    {sel ? (
                      <div className="cpick-stepper" onClick={e=>e.stopPropagation()} onKeyDown={e=>e.stopPropagation()}>
                        <button type="button" aria-label="−" onClick={()=>bump(it.id, -1)}>{Ic.minus}</button>
                        <span>{sel.quantity}</span>
                        <button type="button" aria-label="+" onClick={()=>bump(it.id, +1)}>{Ic.plus}</button>
                      </div>
                    ) : (
                      <span className="cpick-hint">{t.consumableTapToAdd}</span>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button type="button" className="btn btn-ghost" onClick={onCancel}>{t.cancel}</button>
          <button type="button" className="btn btn-primary" onClick={()=>onDone(draft)}>
            {Ic.check} {t.consumableDone}{draft.length > 0 ? ` (${draft.length})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

/* The dialog opened by "TV swap" in the issue form: records that a working TV
   was taken from one room to another because the room's own set was unusable
   and there was no spare in stock.
   Works on a draft copy; nothing changes on the issue until Done. `key` is
   client-only and identifies a swap that doesn't exist on the server yet, so
   `id` stays the server's own row id (0 for a new one). */
function TVSwapModal({ swaps, currentRoom, onCancel, onDone }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [items, setItems] = useState(swaps);
  const [draft, setDraft] = useState(null);   // null = list view, otherwise the swap being added/edited
  const [err, setErr] = useState('');

  function blank() {
    return {key: `new-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, id: 0,
            fromRoom: '', toRoom: currentRoom || '', notes: ''};
  }
  // Adding a swap needs its own trigger. It used to live in the footer, which
  // meant the only way out of the list view was Done — and Done discards,
  // so a swap added from there could never be kept.
  function startAdd()   { setDraft(blank()); setErr(''); }
  function startEdit(s) { setDraft({...s});  setErr(''); }
  function cancelEdit() { setDraft(null);    setErr(''); }
  function patch(k,v)   { setDraft(d=>({...d,[k]:v})); setErr(''); }

  function remove(key) {
    setItems(list => list.filter(x => x.key !== key));
    if (draft && draft.key === key) cancelEdit();
  }

  // Mirrors ValidateTVSwaps on the server, so the user is told here rather than
  // after a round-trip. The comparison is case-insensitive because room numbers
  // are typed by hand and "1324" / " 1324 " are the same room.
  function save() {
    const from = draft.fromRoom.trim();
    const to   = draft.toRoom.trim();
    if (!from)              return setErr(t.tvSwapErrNoFrom);
    if (!to)                return setErr(t.tvSwapErrNoTo);
    if (from.toLowerCase() === to.toLowerCase()) return setErr(t.tvSwapErrSame);
    const dup = items.some(x => x.key !== draft.key
      && x.fromRoom.trim().toLowerCase() === from.toLowerCase()
      && x.toRoom.trim().toLowerCase()   === to.toLowerCase());
    if (dup)                return setErr(t.tvSwapErrDup);
    if (items.length >= MAX_TV_SWAPS)  return setErr(t.tvSwapErrTooMany);

    const saved = {...draft, fromRoom: from, toRoom: to, notes: draft.notes.trim()};
    setItems(list => list.some(x => x.key === saved.key)
      ? list.map(x => x.key === saved.key ? saved : x)
      : [...list, saved]);
    cancelEdit();
  }

  // Escape means "back out of what I am in", not "close": from the editor it
  // returns to the list, and only from the list does it close the dialog.
  const panelRef = useDialog({onClose: () => draft ? cancelEdit() : onCancel()});

  function renderList() {
    return (
      <div className="modal-body">
        {/* Adding lives above the list, not in the footer, so the footer can
            commit the list. With it in the footer there was no way to add a
            swap and then keep it. */}
        <button type="button" className="btn btn-ghost" style={{marginBottom:12}}
          onClick={startAdd} disabled={items.length >= MAX_TV_SWAPS}>
          {Ic.plus} {t.addTvSwap}
        </button>
        {items.length === 0 ? (
          <div className="empty-state" style={{padding:'28px 12px'}}>{Ic.tv}<p>{t.tvSwapNone}</p></div>
        ) : items.map(s=>(
          <div className="tp-row" key={s.key}
               onClick={()=>startEdit(s)}
               role="button" tabIndex={0}
               onKeyDown={e=>{ if (e.key==='Enter') startEdit(s); }}
               style={{cursor:'pointer'}}>
            <span className="tp-row-icon">{Ic.tv}</span>
            <div style={{minWidth:0,flex:1}}>
              <div className="tp-row-title">
                <strong>{s.fromRoom}</strong>
                <span style={{color:'var(--gray-400)',margin:'0 6px'}}>{'\u2194'}</span>
                <strong>{s.toRoom}</strong>
              </div>
              {s.notes && <div className="tp-row-sub">{s.notes}</div>}
            </div>
            <button type="button" className="icon-btn" aria-label={t.tvSwapRemove}
              onClick={e=>{ e.stopPropagation(); remove(s.key); }}>{Ic.trash}</button>
          </div>
        ))}
        {err && <div style={{fontSize:12.5,color:'var(--red)',marginTop:8}}>{err}</div>}
      </div>
    );
  }

  function renderEditor() {
    return (
      <div className="modal-body">
        <div className="form-group">
          <label htmlFor="tvswap-from">{t.tvSwapFrom}</label>
          <input id="tvswap-from" className="form-control" value={draft.fromRoom} maxLength={100} autoFocus
            placeholder={t.tvSwapFromPlaceholder}
            onChange={e=>patch('fromRoom', e.target.value)}
            onKeyDown={e=>{ if (e.key==='Enter') save(); }}/>
        </div>
        <div className="form-group">
          <label htmlFor="tvswap-to">{t.tvSwapTo}</label>
          <input id="tvswap-to" className="form-control" value={draft.toRoom} maxLength={100}
            placeholder={currentRoom || t.tvSwapToPlaceholder}
            onChange={e=>patch('toRoom', e.target.value)}
            onKeyDown={e=>{ if (e.key==='Enter') save(); }}/>
        </div>
        <div className="form-group">
          <label htmlFor="tvswap-notes">{t.tvSwapNotes}</label>
          <input id="tvswap-notes" className="form-control" value={draft.notes} maxLength={500}
            placeholder={t.tvSwapNotesPlaceholder}
            onChange={e=>patch('notes', e.target.value)}
            onKeyDown={e=>{ if (e.key==='Enter') save(); }}/>
        </div>
        {/* Which room was actually reported broken is usually the destination,
            so calling that out saves re-reading the two fields. */}
        <div style={{fontSize:12,color:'var(--gray-400)'}}>
          {t.tvSwapHint}
        </div>
        {err && <div style={{fontSize:12.5,color:'var(--red)',marginTop:8}}>{err}</div>}
      </div>
    );
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onCancel()}>
      <div className="modal picker-modal" ref={panelRef} role="dialog" aria-modal="true" aria-label={t.addTvSwap}>
        <div className="modal-header">
          <div>
            <h2>{draft ? t.editTvSwap : t.addTvSwap}</h2>
            <div className="picker-sub">{draft ? t.tvSwapEditSub : t.tvSwapSub}</div>
          </div>
          <button type="button" className="icon-btn" onClick={onCancel}>{Ic.x}</button>
        </div>
        {draft ? renderEditor() : renderList()}
        <div className="modal-footer">
          {draft ? (
            <>
              <button type="button" className="btn btn-ghost" onClick={cancelEdit}>{t.cancel}</button>
              <button type="button" className="btn btn-primary" onClick={save}>{Ic.check} {t.saveChanges}</button>
            </>
          ) : (
            <>
              <button type="button" className="btn btn-ghost" onClick={onCancel}>{t.cancel}</button>
              <button type="button" className="btn btn-primary" onClick={()=>onDone(items)}>
                {Ic.check} {t.consumableDone}{items.length > 0 ? ` (${items.length})` : ''}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* The dialog opened by "Third-party support" in the issue form. Works on a
   draft copy of the handovers; nothing changes on the issue until Done.
   `key` is client-only and identifies a handover that doesn't exist on the
   server yet, so `id` stays the server's own row id (0 for a new one). */
function SupportRequestModal({ requests, onCancel, onDone }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [items, setItems] = useState(requests);
  const [draft, setDraft] = useState(null);   // null = list view, otherwise the handover being added/edited
  const [err, setErr] = useState('');

  // Escape from the handover being edited goes back to the list, which is what
  // the overlay click and the close button do from the same place.
  const panelRef = useDialog({onClose: () => draft ? cancelEdit() : onCancel()});

  // A "YYYY-MM-DDTHH:MM" value in the browser's own timezone, matching the
  // format the datetime-local inputs and the API use.
  function localDateTimeValue(d) {
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function blank() {
    // We know when we are reporting it — it is now — so the start is prefilled
    // rather than left as one more empty field to discover.
    return {key: `new-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, id: 0,
            company: 'telnet', status: 'pending',
            technician: '', confirmedBy: '', ticketId: '',
            startedAt: localDateTimeValue(new Date()), resolvedAt: '', notes: ''};
  }
  function startAdd()   { setDraft(blank());            setErr(''); }
  function startEdit(s) { setDraft({...s});             setErr(''); }
  function cancelEdit() { setDraft(null);               setErr(''); }
  function patch(k,v)   { setDraft(d=>({...d,[k]:v})); setErr(''); }

  // Whole minutes between the two moments, or null when either is missing.
  const elapsed = useMemo(()=>{
    if (!draft || !draft.startedAt) return null;
    const start = new Date(draft.startedAt).getTime();
    const end   = draft.resolvedAt ? new Date(draft.resolvedAt).getTime() : Date.now();
    if (isNaN(start) || isNaN(end)) return null;
    const mins = Math.round((end - start) / 60000);
    return mins < 0 ? null : mins;
  }, [draft]);

  // Mirrors ValidateSupportRequests on the server, so the user is told here
  // rather than after a round-trip.
  function commit() {
    const technician  = (draft.technician ||'').trim();
    const confirmedBy = (draft.confirmedBy||'').trim();
    if (draft.company === 'telnet') {
      if (!technician) return setErr(t.telnetNeedsTechnician);
      if (draft.status==='solved' && !confirmedBy) return setErr(t.telnetNeedsConfirmation);
    } else {
      const ticket = (draft.ticketId||'').trim();
      if (!ticket) return setErr(t.telefonicaNeedsTicket);
      if (items.some(s=>s.key!==draft.key && (s.ticketId||'').trim().toLowerCase()===ticket.toLowerCase()))
        return setErr(t.telefonicaNeedsTicket);
    }
    if (!draft.startedAt) return setErr(t.supportNeedsReported);
    if (draft.status==='solved' && !draft.resolvedAt) return setErr(t.supportNeedsResolved);
    if (draft.startedAt && draft.resolvedAt && draft.resolvedAt < draft.startedAt) {
      return setErr(t.supportResolvedBefore);
    }
    const saved = {
      ...draft,
      // Fields that don't belong to the chosen company are dropped here as
      // well as on the server, so a draft can't carry stale values around.
      ticketId:      draft.company==='telefonica' ? (draft.ticketId||'').trim() : '',
      technician:    draft.company==='telnet' ? technician  : '',
      confirmedBy:   draft.company==='telnet' ? confirmedBy : '',
      notes: (draft.notes||'').trim(),
    };
    setItems(list=> list.some(s=>s.key===draft.key) ? list.map(s=>s.key===draft.key?saved:s) : [...list, saved]);
    cancelEdit();
  }

  function remove(s) {
    setItems(list=>list.filter(x=>x.key!==s.key));
  }

  // Switching company on an existing draft can strand a half-filled field
  // (e.g. a Telnet technician with no Telefónica ticket id), so start it clean.
  function setCompany(company) {
    setDraft(d=>({...d, company,
      ticketId:    company==='telefonica' ? d.ticketId : '',
      technician:  company==='telnet' ? d.technician  : '',
      confirmedBy: company==='telnet' ? d.confirmedBy : '',
    }));
    setErr('');
  }

  // Marking a handover OK is the moment a solution arrived, so offer "now" as
  // the answer rather than making it be looked up.
  function markSolvedNow() {
    patch('status', 'solved');
    patch('resolvedAt', localDateTimeValue(new Date()));
  }

  // The second line of a handover row. The company line already names the
  // Telnet technician, so this carries whatever it doesn't: Telefonica's ticket
  // id, or who confirmed the Telnet fix. Returns null when there is genuinely
  // nothing to add, so the row collapses instead of repeating the status badge.
  function detail(s) {
    if (s.company === 'telnet') {
      if (s.confirmedBy) return `${t.telnetConfirmedBy}: ${s.confirmedBy}`;
      return s.notes || null;
    }
    return `${t.telefonicaTicket}: ${s.ticketId}`;
  }

  return (
    <div className="modal-overlay picker-overlay" onClick={e=>e.target===e.currentTarget&&(draft?cancelEdit():onCancel())}>
      <div className="modal picker-modal" ref={panelRef} role="dialog" aria-modal="true" aria-label={t.thirdPartyTitle}>
        <div className="modal-header">
          <div>
            <h2>{t.thirdPartyTitle}</h2>
            <div className="picker-sub">{t.thirdPartySub}</div>
          </div>
          <button type="button" className="icon-btn" onClick={()=>draft?cancelEdit():onCancel()}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {draft ? (
            <>
              <div className="form-group">
                {/* A heading, not a label: this caption names a pair of buttons and neither of
                    them is the control for it, so a <label for> would point at
                    something that does not exist. The group role is what carries
                    the relationship to assistive technology instead. */}
                <div className="form-group-h" id="tp-company-h">{t.company}</div>
                <div className="tp-company" role="group" aria-labelledby="tp-company-h">
                  <button type="button" className={`tp-company-opt ${draft.company==='telnet'?'active':''}`}
                    aria-pressed={draft.company==='telnet'} onClick={()=>setCompany('telnet')}>
                    <span className="tp-company-dot telnet"/>{t.companyTelnet}
                  </button>
                  <button type="button" className={`tp-company-opt ${draft.company==='telefonica'?'active':''}`}
                    aria-pressed={draft.company==='telefonica'} onClick={()=>setCompany('telefonica')}>
                    <span className="tp-company-dot telefonica"/>{t.companyTelefonica}
                  </button>
                </div>
              </div>

              {draft.company==='telnet' ? (
                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="tp-technician">{t.telnetTechnician}</label>
                    <input id="tp-technician" className="form-control" placeholder={t.telnetTechPlaceholder} value={draft.technician}
                      onChange={e=>patch('technician', e.target.value)}/>
                  </div>
                  <div className="form-group">
                    <label htmlFor="tp-confirmed-by">{t.telnetConfirmedBy}</label>
                    <input id="tp-confirmed-by" className="form-control" placeholder={t.telnetConfirmPlaceholder} value={draft.confirmedBy}
                      onChange={e=>patch('confirmedBy', e.target.value)}/>
                  </div>
                </div>
              ) : (
                <div className="form-group">
                  <label htmlFor="tp-ticket">{t.telefonicaTicket}</label>
                  <input id="tp-ticket" className="form-control" placeholder={t.ticketIdPlaceholder} value={draft.ticketId}
                    onChange={e=>patch('ticketId', e.target.value)}/>
                </div>
              )}

              <div className="form-group">
                <label htmlFor="tp-status">{t.supportStatus}</label>
                <select id="tp-status" className="form-control" value={draft.status} onChange={e=>patch('status', e.target.value)}>
                  <option value="pending">{t.supportPending}</option>
                  <option value="solved">{t.supportSolved}</option>
                </select>
              </div>

              {/* When we reported the problem, and when the company answered.
                  This is the company's turnaround, so it is wall-clock across
                  days rather than a shift length. */}
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="tp-reported-at">{t.supportReportedAt}</label>
                  <input id="tp-reported-at" type="datetime-local" className="form-control" value={draft.startedAt}
                    onChange={e=>patch('startedAt', e.target.value)}/>
                </div>
                <div className="form-group">
                  <label htmlFor="tp-resolved-at">{t.supportResolvedAt}</label>
                  <input id="tp-resolved-at" type="datetime-local" className="form-control" value={draft.resolvedAt}
                    onChange={e=>patch('resolvedAt', e.target.value)}/>
                </div>
              </div>

              {/* Live duration, so the effect of the two times above is
                  visible before saving. */}
              {elapsed != null && (
                <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:-8}}>
                  {t.supportDuration}: <strong style={{color:'var(--gray-600)'}}>{formatSupportDuration(elapsed)}</strong>
                </div>
              )}

              <div className="form-group">
                <label htmlFor="tp-notes">{t.supportNotes}</label>
                <input id="tp-notes" className="form-control" placeholder={t.supportNotesPlaceholder} value={draft.notes}
                  onChange={e=>patch('notes', e.target.value)}/>
              </div>

              {err && <div style={{fontSize:12.5,color:'var(--red)'}}>{err}</div>}
            </>
          ) : items.length === 0 ? (

          ) : (
            <div className="tp-list">
              {items.map(s=>(
                <div className="tp-row" key={s.key}>
                  <div className="tp-row-main">
                    <div className="tp-row-company">
                      <span className={`tp-company-dot ${s.company}`}/>
                      {s.company==='telnet' ? t.companyTelnet : t.companyTelefonica}
                      {s.company==='telnet' && s.technician && (
                        <span style={{fontWeight:400,color:'var(--gray-500)'}}>— {s.technician}</span>
                      )}
                    </div>
                    {detail(s) && <div className="tp-row-detail">{detail(s)}</div>}
                    {s.durationMinutes != null && (
                      <div className="tp-row-detail">
                        {t.supportDuration}: <strong>{formatSupportDuration(s.durationMinutes)}</strong>
                      </div>
                    )}
                  </div>
                  <span className={`tp-row-status ${s.status}`}>{s.status==='solved' ? t.supportSolved : t.supportPending}</span>
                  <button type="button" className="icon-btn" title={t.editThirdParty} onClick={()=>startEdit(s)}>{Ic.edit}</button>
                  <button type="button" className="icon-btn danger" title={t.thirdPartyRemove} onClick={()=>remove(s)}>{Ic.trash}</button>
                </div>
              ))}
            </div>
          )}

          {!draft && (
            <button type="button" className="consumable-add-btn" onClick={startAdd} style={{width:'100%',padding:'9px 12px',fontSize:13}}>
              {Ic.plus} {items.length ? t.editThirdParty : t.addThirdParty}
            </button>
          )}
        </div>
        <div className="modal-footer">
          {draft ? (
            <>
              <button type="button" className="btn btn-ghost" onClick={cancelEdit}>{t.cancel}</button>
              <button type="button" className="btn btn-primary" onClick={commit}>{Ic.check} {t.saveChanges}</button>
            </>
          ) : (
            <>
              <button type="button" className="btn btn-ghost" onClick={onCancel}>{t.cancel}</button>
              <button type="button" className="btn btn-primary" onClick={()=>onDone(items)}>
                {Ic.check} {t.consumableDone}{items.length > 0 ? ` (${items.length})` : ''}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Asks before deleting an issue. Deleting takes the issue's consumables and its
   third-party handovers with it, so it is not something to do on a stray click.
   The subject line repeats which issue is about to go, because the confirm can
   be triggered from a row the user is looking at rather than at. */
function ConfirmDeleteIssue({ issue, onCancel, onConfirm, deleting }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];

  // Escape does nothing mid-delete: the request is already out and abandoning the
  // dialog would leave it with nowhere to report to.
  const panelRef = useDialog({onClose: deleting ? null : onCancel});

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && !deleting && onCancel()}>
      <div className="modal confirm-modal" ref={panelRef} role="dialog" aria-modal="true" aria-label={t.deleteIssueTitle}>
        <div className="modal-header">
          <h2>{t.deleteIssueTitle}</h2>
          <button type="button" className="icon-btn" onClick={onCancel} disabled={deleting}>{Ic.x}</button>
        </div>
        <div className="modal-body confirm-body">
          <span className="confirm-icon">{Ic.trash}</span>
          <div className="confirm-text">
            {t.deleteIssueBody}
            <span className="confirm-subject">
              {issue.apt||issue.dept} · {issue.type} — {issue.problem}
            </span>
          </div>
        </div>
        <div className="modal-footer">
          {/* Cancel takes the initial focus, not the delete button: Enter is
              often still held over from whatever the user did before, and a
              reflexive Enter should not destroy an issue. */}
          <button type="button" className="btn btn-ghost" onClick={onCancel} disabled={deleting} autoFocus>{t.cancel}</button>
          <button type="button" className="btn btn-danger" onClick={onConfirm} disabled={deleting}>
            {deleting ? t.deleting : <>{Ic.trash} {t.deleteIssueConfirm}</>}
          </button>
        </div>
      </div>
    </div>
  );
}

/*
  The start/end times to open the edit form with.

  Three cases, and the middle one is easy to confuse with the last:

  1. The issue has real times. Use them.
  2. The issue is Pending. It has no end time because the work is not finished,
     which is a real absence rather than missing data — so the end stays empty
     instead of being given a made-up one.
  3. The issue predates clock times. Nothing was ever recorded, so rebuild a
     placeholder pair ending "now" that reproduces the stored duration. Without
     this the duration line would be blank on every legacy issue.
*/
function initialClockTimes(issue) {
  if (issue.startTime && issue.endTime) {
    return { startTime: issue.startTime, endTime: issue.endTime };
  }
  if (issue.status === 'Pending') {
    return { startTime: issue.startTime || '', endTime: '' };
  }
  const end = new Date();
  const start = new Date(end.getTime() - issue.time*60000);
  const toHM = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return { startTime: toHM(start), endTime: toHM(end) };
}

/* The apartment room field: a typeahead over the room inventory.

   Why this is not a <select>: the inventory is stored as ranges and may be
   hundreds of rooms, and the field's whole purpose is to narrow that by typing.
   A dropdown would have to be scrolled.

   Why the value is not simply what is typed: the room is the one field on this
   form that must be an existing room rather than free text, so typing does not
   commit anything. onChange is only called with a room that came back from the
   server, and typing clears the committed value -- which is what makes the form
   refuse to submit, since its validity test is on the committed value and not on
   the text in the box. The consequence is that "1214" typed and abandoned leaves
   an invalid form rather than an issue against a room called "1214 " that nobody
   can find again.

   The search is debounced and abandoned when the query changes, so a fast typist
   does not get a slow room's results painted over a fast room's. It fails
   silently: a network problem should not block logging a fault.
*/
function RoomPicker({ value, onChange, token, t, id }) {
  const [query, setQuery]   = useState(value || '');
  const [matches, setMatches] = useState([]);
  const [open, setOpen]     = useState(false);
  const [cursor, setCursor] = useState(0);
  // Which query the current matches belong to. A response for "13" must never be
  // painted as the answer to "7777", so the results carry the query they were
  // fetched for and are discarded if the box has moved on. The server's answer is
  // already scoped to the request that asked for it; this is about the gap between
  // asking and being told.
  const [answered, setAnswered] = useState('');
  // Whether the server had more matches than it returned. Kept apart from
  // matches.length because the count on screen is a number of results, not a
  // claim that those were all of them, and only the server knows which it was.
  const [more, setMore] = useState(false);
  const wrapRef = useRef(null);
  const listId  = 'room-options';

  // Keep the box in step with the committed value, which changes when an issue
  // loads into the form or when Maintenance opens this form with a room prefilled.
  useEffect(() => { setQuery(value || ''); }, [value]);

  useEffect(() => {
    const q = query.trim();
    if (!open || !q) { setMatches([]); setAnswered(''); setMore(false); return; }
    let live = true;
    const handle = setTimeout(() => {
      apiFetch(`/rooms/search?q=${encodeURIComponent(q)}`, {token})
        .then(res => {
          if (!live) return;
          setMatches(res.rooms || []);
          // Recorded so "no results" is only claimed for the query these results
          // were actually fetched with. Without it the box says a room is missing
          // from the inventory before the search for it has even been sent, which
          // is a confident answer to a question nobody has asked yet.
          setAnswered(q);
          setMore(!!res.more);
          setCursor(0);
        })
        .catch(() => { if (live) { setMatches([]); setAnswered(''); setMore(false); } });
    }, 180);
    return () => { live = false; clearTimeout(handle); };
  }, [query, open, token]);

  // Clicking anywhere else closes the panel. A mousedown listener rather than
  // blur, because blur fires before a click on an option has been handled and the
  // option would never be selected.
  useEffect(() => {
    if (!open) return;
    const away = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    // Capture phase, and it claims the event. This panel is inside a dialog, and
    // that dialog closes on Escape too: Escape should dismiss the dropdown and
    // leave the form it belongs to open. Registration order cannot be relied on
    // for this -- the panel is mounted with the form but its listener is attached
    // whenever `open` flips, which may be before or after the dialog's -- whereas
    // capture reliably runs ahead of a bubble-phase listener on document.
    const esc = e => {
      if (e.key !== 'Escape') return;
      e.claimedByDialog = true;
      setOpen(false);
    };
    document.addEventListener('mousedown', away);
    document.addEventListener('keydown', esc, true);
    return () => {
      document.removeEventListener('mousedown', away);
      document.removeEventListener('keydown', esc, true);
    };
  }, [open]);

  const choose = room => {
    onChange(String(room));
    setQuery(String(room));
    setOpen(false);
  };

  const onKeyDown = e => {
    if (!open) {
      if (e.key === 'ArrowDown' || e.key === 'Enter') { setOpen(true); e.preventDefault(); }
      return;
    }
    if (e.key === 'ArrowDown') { setCursor(c => Math.min(c + 1, matches.length - 1)); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { setCursor(c => Math.max(c - 1, 0)); e.preventDefault(); }
    else if (e.key === 'Enter') {
      // Enter picks the highlighted room. With nothing highlighted it is left
      // alone, so the key still submits the form rather than silently choosing
      // the first match in a list nobody was looking at.
      if (matches[cursor] !== undefined) { choose(matches[cursor]); e.preventDefault(); }
    }
  };

  const typed   = query.trim();
  const chosen  = value || '';
  // Where the arrow keys currently are, as an id the combobox can point at. The
  // `.active` class already moves with the cursor, so a sighted reader knows;
  // a screen reader has only the DOM, and with nothing here it says nothing at
  // all while arrowing. Derived from the room rather than from the cursor index,
  // so the id belongs to that option for as long as it is on screen and the
  // attribute is not rewritten as the list re-renders under it.
  const optionId = room => `${listId}-${room}`;
  const activeId = (open && matches[cursor] !== undefined) ? optionId(matches[cursor]) : undefined;
  // Red only once there is text that is not the chosen room. Empty is neutral --
  // an empty required field is not an error until it has been filled in wrongly.
  const unmatched = typed !== '' && typed !== chosen;

  return (
    <div className={`room-picker${unmatched ? ' unmatched' : ''}`} ref={wrapRef}>
      <input id={id} className="form-control" autoComplete="off" role="combobox"
        aria-expanded={open} aria-controls={listId} aria-autocomplete="list"
        aria-activedescendant={activeId}
        placeholder={t.aptRoomPlaceholder}
        value={query}
        onChange={e => {
          const next = e.target.value;
          setQuery(next);
          setOpen(true);
          // Typing invalidates the choice: the room is only committed by picking
          // one from the list, so the box and the form cannot disagree.
          if (next.trim() !== chosen) onChange('');
        }}
        onFocus={() => setOpen(true)}
        onKeyDown={onKeyDown}/>

      {open && (
        <div className="room-picker-panel" id={listId} role="listbox">
          {/* The "type to search" line is only for an empty box. Once there is a
              query, an empty result is a different statement -- that room is not
              in the inventory -- and it must not be confused with "nothing typed
              yet", which is what an earlier version showed and why typing 7777
              appeared to do nothing at all. */}
          {!typed && (
            <div className="room-picker-empty">
              {t.aptRoomTypeToSearch}
            </div>
          )}
          {typed && answered === typed && matches.length === 0 && (
            <div className="room-picker-empty">
              {t.aptRoomNoMatch.replace('{room}', typed)}
              {' '}{t.aptRoomAddHint}
            </div>
          )}
          {matches.map((room, i) => (
            <button type="button" key={room} role="option" id={optionId(room)}
              aria-selected={String(room) === chosen}
              className={`room-option${i === cursor ? ' active' : ''}${String(room) === chosen ? ' room-option-chosen' : ''}`}
              onMouseEnter={() => setCursor(i)}
              onMouseDown={e => e.preventDefault()}  // keep focus so the panel stays open
              onClick={() => choose(room)}>
              {String(room) === chosen && <span className="room-option-tick">{Ic.check}</span>}
              {String(room)}
            </button>
          ))}
          {typed && matches.length > 0 && (
            <div className="room-picker-foot">
              {more
                ? t.aptRoomMatchesMore.replace('{count}', matches.length)
                : t.aptRoomMatches.replace('{count}', matches.length)}
            </div>
          )}
          {/* Only once there is something to pick. `unmatched` on its own is true
              for the whole of every fresh query -- the search is debounced by 180ms
              and then in flight, and matches is empty throughout -- so asking the
              reader to pick from the list above printed "pick one of the rooms
              above" over an empty panel. Same reasoning as the two lines above it:
              nothing has been answered yet, so nothing should be claimed. */}
          {unmatched && matches.length > 0 && (
            <div className="room-picker-foot warn">{t.aptRoomMustPick}</div>
          )}
        </div>
      )}
    </div>
  );
}

function IssueModal({ issueMode, editIssue, prefill, currentUser, issueTypes, departments, connectaAgents, consumableItems, token, onClose, onSave }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const isEdit = !!editIssue;
  // Whether the selected issue type offers to record equipment being moved
  // between rooms. Read off the type rather than matched by name, so renaming
  // a type cannot make the prompt disappear.
  const swapCapableTypes = useMemo(
    () => new Set((issueTypes || []).filter(it => it.tracks_swaps).map(it => it.name)),
    [issueTypes]
  );
  const typeNames = (issueTypes || []).map(it => it.name);
  if (isEdit && editIssue.type && !typeNames.includes(editIssue.type)) {
    typeNames.unshift(editIssue.type);
  }
  const deptNames = (departments || []).map(d => d.name);
  if (isEdit && editIssue.dept && !deptNames.includes(editIssue.dept)) {
    deptNames.unshift(editIssue.dept);
  }
  const agentNames = (connectaAgents || []).map(a => a.name);
  if (isEdit && editIssue.reportedByAgent && !agentNames.includes(editIssue.reportedByAgent)) {
    agentNames.unshift(editIssue.reportedByAgent);
  }
  if (isEdit && editIssue.confirmedByAgent && !agentNames.includes(editIssue.confirmedByAgent)) {
    agentNames.unshift(editIssue.confirmedByAgent);
  }
  const firstType = typeNames[0] || '';
  const catalogById = Object.fromEntries((consumableItems || []).map(ci => [ci.id, ci]));
  const defaults = issueMode==='apt'
    ? {apt:'', type:firstType, problem:'', resolution:'', startTime:'', endTime:'', status:'Ok', reportedByAgent:'', confirmedByAgent:'', falsePositive:false, consumables:[], supportRequests:[], tvSwaps:[]}
    : {dept:'',type:firstType, problem:'', resolution:'', startTime:'', endTime:'', status:'Ok', reportedByAgent:'', confirmedByAgent:'', falsePositive:false, consumables:[], supportRequests:[], tvSwaps:[]};
  // prefill lets another page open this form with some of it already answered --
  // the Maintenance page does, so a fault found during a check does not have to
  // have its department and equipment type typed out again.
  const initial = prefill ? {...defaults, ...prefill} : defaults;
  const [form, setForm] = useState(isEdit ? {
    apt:        editIssue.apt||'',
    dept:       editIssue.dept||'',
    type:       editIssue.type,
    problem:    editIssue.problem,
    resolution: editIssue.resolution,
    // Use the actual start/end times the issue was logged with.
    ...initialClockTimes(editIssue),
    status:           editIssue.status,
    reportedByAgent:  editIssue.reportedByAgent || '',
    confirmedByAgent: editIssue.confirmedByAgent || '',
    falsePositive: !!editIssue.falsePositive,
    // Only items still in the catalog can be edited here. Usage recorded against
    // an item that has since been removed is kept on the server untouched.
    consumables: (editIssue.consumables || [])
      .filter(c => c.itemId != null && catalogById[c.itemId])
      .map(c => ({ itemId: c.itemId, quantity: c.quantity })),
    // Handovers to Telnet / Telefonica, as they are on the issue. The `key`
    // is client-only and derived from the server's row id, so the list can be
    // edited in place without an extra round-trip.
    supportRequests: (editIssue.supportRequests || []).map(s => ({...s, key: `srv-${s.id}`})),
    // TVs already moved for this issue. The `key` is client-only and derived
    // from the server's row id, so the list can be edited in place without an
    // extra round-trip.
    tvSwaps: (editIssue.tvSwaps || []).map(s => ({...s, key: `tvs-${s.id}`})),
  } : initial);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [supportOpen, setSupportOpen] = useState(false);
  const [swapOpen, setSwapOpen] = useState(false);
  // Only offered on an issue type flagged tracks_swaps. Swaps already recorded
  // stay visible if the flag is later turned off, so the record isn't hidden
  // from someone editing that issue — but no new one can be added.
  const swapsOffered = swapCapableTypes.has(form.type);
  const showSwapBox = swapsOffered || form.tvSwaps.length > 0;
  const selectedConsumables = form.consumables
    .map(c => ({ ...c, ...catalogById[c.itemId] }))     // adds name + icon
    .filter(c => c.name);

  function set(k,v) { setForm(f=>({...f,[k]:v})); }
  const duration = useMemo(()=>computeDurationMinutes(form.startTime, form.endTime), [form.startTime, form.endTime]);
  const timeRangeInvalid = form.startTime && form.endTime && duration === null;

  // Focus lands on the first field, which is the one that decides what this form
  // is for: the room, or the department. Not the close button, which is what the
  // first tab stop would otherwise be.
  const panelRef = useDialog({
    onClose,
    initialFocus: issueMode==='apt' ? '#apt-room' : '#issue-dept',
  });

  // A Pending issue has not been fixed yet, so the two fields that say the work
  // is done are taken away: the resolution is not the technician's to write, and
  // there is no end time for a job that has not ended. Switching back to Ok
  // clears the resolution too, so a real one has to be written from scratch
  // rather than the "still waiting" placeholder being kept and mistaken for one.
  const isPending = form.status === 'Pending';
  const resolution = isPending ? t.stillWaiting : form.resolution;

  function setStatus(next) {
    setForm(f => next === 'Pending'
      ? {...f, status: next, resolution: '', endTime: ''}
      : {...f, status: next, resolution: ''});
  }

  // A pending issue is logged without an end time, so there is no duration to
  // compute and none is required; everything else still has to be filled in.
  const valid = (issueMode==='apt'
    ? form.apt && form.type && form.problem && resolution
    : form.dept && form.type && form.problem && resolution
  ) && (isPending || duration !== null);

  // Recurring-issue check: once a location + type are picked, ask the
  // backend (debounced) whether this same issue type has already happened
  // there within the manager-configured window.
  const location = issueMode==='apt' ? form.apt : form.dept;
  const [dupeInfo, setDupeInfo] = useState(null); // {count, window_hours, issues}
  useEffect(() => {
    if (!location || !form.type || !token) { setDupeInfo(null); return; }
    const handle = setTimeout(() => {
      const params = new URLSearchParams({ mode: issueMode, location, type: form.type });
      if (isEdit) params.set('exclude_id', String(editIssue.id));
      apiFetch(`/issue-duplicates?${params.toString()}`, {token})
        .then(res => setDupeInfo(res))
        .catch(() => {}); // non-critical — fail silently, don't block logging
    }, 400);
    return () => clearTimeout(handle);
  }, [location, form.type, issueMode, token, isEdit, editIssue?.id]);

  return (
    <>
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      {/* aria-labelledby rather than aria-label because the title is already in
          the DOM and reads better with its own wording than a copy of it. */}
      <div className="modal" ref={panelRef} role="dialog" aria-modal="true" aria-labelledby="issue-modal-title">
        <div className="modal-header">
          <h2 id="issue-modal-title">{isEdit ? t.editIssue : (issueMode==='apt' ? t.logAptIssue : t.logDeptIssue)}</h2>
          <button className="icon-btn" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            {issueMode==='apt' ? (
              <div className="form-group">
                <label htmlFor="apt-room">{t.aptNum}</label>
                {/* A room must be picked from the inventory, not typed. RoomPicker
                    only calls set('apt', ...) with a room the server confirmed
                    exists, so form.apt is never a string nobody chose. */}
                <RoomPicker id="apt-room" value={form.apt} token={token} t={t}
                  onChange={room => set('apt', room)}/>
              </div>
            ) : (
              <div className="form-group">
                <label htmlFor="issue-dept">{t.department}</label>
                <select id="issue-dept" className="form-control" value={form.dept} onChange={e=>set('dept',e.target.value)}>
                  <option value="">{t.selectDept}</option>
                  {deptNames.map(d=><option key={d}>{d}</option>)}
                </select>
              </div>
            )}
            <div className="form-group">
              <label htmlFor="issue-type">{t.issueType}</label>
              <select id="issue-type" className="form-control" value={form.type} onChange={e=>set('type',e.target.value)}>
                {typeNames.length === 0 && <option value="">{t.selectDept}</option>}
                {typeNames.map(t2=><option key={t2}>{t2}</option>)}
              </select>
            </div>
          </div>
          {dupeInfo && dupeInfo.count > 0 && (
            <div style={{background:'var(--amber-light)',borderRadius:'var(--radius-md)',padding:'10px 14px',fontSize:13,color:'var(--amber)',display:'flex',alignItems:'flex-start',gap:8}}>
              <span style={{flexShrink:0,marginTop:1}}>{Ic.clock}</span>
              <div>
                <strong>{t.duplicateAlertTitle}.</strong>{' '}
                {duplicateAlertMessage(lang, dupeInfo.count, location, dupeInfo.window_hours)}
              </div>
            </div>
          )}
          <div className="form-group">
            <label htmlFor="issue-problem">{t.problemDesc}</label>
            <input id="issue-problem" className="form-control" placeholder={t.descPlaceholder} value={form.problem} onChange={e=>set('problem',e.target.value)} />
          </div>
          <div className="form-group">
            <label htmlFor="issue-resolution">{t.resolutionLabel}</label>
            <input id="issue-resolution" className="form-control" placeholder={t.resolutionPlaceholder}
              disabled={isPending} title={isPending ? t.stillWaiting : undefined}
              value={resolution} onChange={e=>set('resolution',e.target.value)} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label htmlFor="issue-start">{t.startTime}</label>
              <input id="issue-start" className="form-control" type="time" lang="sv-SE" value={form.startTime} onChange={e=>set('startTime',e.target.value)} />
            </div>
            <div className="form-group">
              <label htmlFor="issue-end">{t.endTime}</label>
              <input id="issue-end" className="form-control" type="time" lang="sv-SE" disabled={isPending}
                value={form.endTime} onChange={e=>set('endTime',e.target.value)} />
            </div>
          </div>
          <div className="form-group">
            <label htmlFor="issue-status">{t.statusLabel}</label>
            <select id="issue-status" className="form-control" value={form.status} onChange={e=>setStatus(e.target.value)}>
              <option value="Ok">{t.statusOk}</option>
              <option value="Pending">{t.statusPending}</option>
            </select>
          </div>
          <label className={`fp-check ${form.falsePositive ? 'checked' : ''}`}>
            <input id="issue-false-positive" type="checkbox" checked={form.falsePositive} onChange={e=>set('falsePositive', e.target.checked)}/>
            <span className="fp-box">{Ic.check}</span>
            <span>
              <span className="fp-title">{t.falsePositiveLabel}</span>
              <span className="fp-sub">{t.falsePositiveHint}</span>
            </span>
          </label>
          <div className="form-group">
            {/* A caption, not a label. What is below is a row of chips and one button,
                so there is no single control for a <label for> to name -- the
                group role carries the relationship instead. */}
            <div className="form-group-h" id="issue-consumables-h">{t.consumablesLabel}</div>
            <div className={`consumable-box ${selectedConsumables.length ? 'has-items' : ''}`}

                </span>

              <button type="button" className="consumable-add-btn" onClick={()=>setPickerOpen(true)}>

              </button>

          </div>
          <div className="form-row">
            <div className="form-group">
              <label htmlFor="issue-agent-reported">{t.reportedByAgent}</label>
              <select id="issue-agent-reported" className="form-control" value={form.reportedByAgent} onChange={e=>set('reportedByAgent',e.target.value)}>
                <option value="">{t.noAgentSelected}</option>

            <div className="form-group">
              <label htmlFor="issue-agent-confirmed">{t.confirmedByAgent}</label>
              <select id="issue-agent-confirmed" className="form-control" value={form.confirmedByAgent} onChange={e=>set('confirmedByAgent',e.target.value)}>
                <option value="">{t.noAgentSelected}</option>
                {agentNames.map(a=><option key={a}>{a}</option>)}
              </select>

          </div>
          {/* Equipment moved between rooms. Only shown for an issue type flagged
              tracks_swaps (TV by default), which is how the question "did you
              have to take a TV from another room?" gets asked at all. */}
          {showSwapBox && (
            <div className="form-group">
              <div className="form-group-h" id="issue-swaps-h">{t.tvSwapLabel}</div>
              <div className={`tp-box ${form.tvSwaps.length ? 'has-items' : ''}`}
                   role="group" aria-labelledby="issue-swaps-h">
                {form.tvSwaps.map(s=>(
                  <span className="tp-chip tp-chip-swap" key={s.key}>
                    <span style={{display:'flex',alignItems:'center'}}>{Ic.tv}</span>
                    <span className="tp-chip-detail">
                      <strong>{s.fromRoom}</strong>
                      <span style={{color:'var(--gray-400)',margin:'0 4px'}}>{'\u2194'}</span>
                      <strong>{s.toRoom}</strong>
                    </span>
                    <button type="button" className="consumable-chip-x" aria-label={t.tvSwapRemove}
                      onClick={()=>set('tvSwaps', form.tvSwaps.filter(x=>x.key!==s.key))}>{Ic.x}</button>
                  </span>
                ))}
                {swapsOffered && (
                  <button type="button" className="consumable-add-btn" onClick={()=>setSwapOpen(true)}>
                    {form.tvSwaps.length ? Ic.edit : Ic.plus} {form.tvSwaps.length ? t.editTvSwaps : t.addTvSwap}
                  </button>
                )}
                {!swapsOffered && (
                  <span style={{fontSize:12,color:'var(--gray-400)'}}>{t.tvSwapFlagOff}</span>
                )}

          <div className="form-group">
            <div className="form-group-h" id="issue-thirdparty-h">{t.thirdPartyLabel}</div>
            <div className={`tp-box ${form.supportRequests.length ? 'has-items' : ''}`}
                 role="group" aria-labelledby="issue-thirdparty-h">
              {form.supportRequests.map(s=>(
                <span className={`tp-chip tp-chip-${s.company}`} key={s.key}>
                  <span className="tp-chip-company">{s.company==='telnet' ? t.companyTelnet : t.companyTelefonica}</span>
                  <span className="tp-chip-detail">
                    {s.company==='telnet' ? (s.technician || '—') : s.ticketId}
                  </span>
                  {s.status==='solved' && <span style={{color:'var(--green)'}}>{Ic.check}</span>}
                  <button type="button" className="consumable-chip-x" aria-label={t.thirdPartyRemove}
                    onClick={()=>set('supportRequests', form.supportRequests.filter(x=>x.key!==s.key))}>{Ic.x}</button>
                </span>
              ))}
              <button type="button" className="consumable-add-btn" onClick={()=>setSupportOpen(true)}>
                {form.supportRequests.length ? Ic.edit : Ic.plus} {form.supportRequests.length ? t.editThirdParty : t.addThirdParty}
              </button>
            </div>
          </div>
          {timeRangeInvalid ? (
            <div style={{fontSize:12.5,color:'var(--red)',marginTop:-8}}>{t.invalidTimeRange}</div>
          ) : duration !== null && !isPending ? (
            <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:-8}}>{t.duration}: <strong style={{color:'var(--gray-600)'}}>{duration}m</strong></div>
          ) : null}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
          <button className="btn btn-primary" disabled={!valid} onClick={()=>{onSave({...form,resolution:resolution,time:isPending?0:duration,reportedByAgent:form.reportedByAgent||null,confirmedByAgent:form.confirmedByAgent||null});onClose();}}>
            {Ic.check} {isEdit ? t.saveChanges : t.logIssue}
          </button>
        </div>
      </div>
    </div>
    {pickerOpen && (
      <ConsumablePicker items={consumableItems || []} value={form.consumables}
        onCancel={()=>setPickerOpen(false)}
        onDone={sel=>{ set('consumables', sel); setPickerOpen(false); }}/>
