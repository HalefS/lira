/* ════════════════ TEAM PAGE ════════════════ */
/* Two views over the same roster: the member cards everyone can see, and the
   management table (promote/demote, deactivate/reactivate) that managers only
   get. The management table used to live as a tab on the Profile page, which
   was a strange home for it — administering the team belongs with the team. */
/* ════════════════ RESET CODE DIALOG ════════════════ */
/*
  Shown to a manager immediately after they generate a reset code, and never
  again. The server keeps a bcrypt hash and returns the plaintext exactly once,
  so this dialog is the only place the code will ever be visible — if the manager
  closes it, the fix is another click, not a lookup.
*/
function ResetCodeDialog({ code, userName, expiresIn, onDone, t }) {
  const [copied, setCopied] = useState(false);

  async function copy() {
    try {
      // navigator.clipboard needs a secure context; the fallback covers a plain
      // http:// host on the hotel's own network, which is where this runs.
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(code);
      } else {
        const ta = document.createElement('textarea');
        ta.value = code;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      setCopied(true);
    } catch(e) {
      // Nothing to recover: the digits are on screen and selectable, so a failed
      // clipboard is not worth interrupting the manager over.
      setCopied(false);
    }
  }

  const minutes = Math.max(1, Math.round((expiresIn || 3600) / 60));

  const panelRef = useDialog({onClose: onDone});

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onDone()}>
      <div className="modal" style={{maxWidth:430}} ref={panelRef} role="dialog" aria-modal="true"
        aria-label={t.resetCodeTitle.replace('{name}', userName)}>
        <div className="modal-header">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{color:'var(--blue)',display:'flex'}}>{Ic.shield}</span>
            <div>
              <h2>{t.resetCodeTitle.replace('{name}', userName)}</h2>
            </div>
          </div>
        </div>
        <div className="modal-body">
          <div className="reset-code-display">{code}</div>
          <div style={{fontSize:12.5,lineHeight:1.55,color:'var(--gray-600)'}}>
            {t.resetCodeBody}
          </div>
          <div style={{fontSize:12.5,color:'var(--gray-600)'}}>
            {userName} · {minutes} min
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={copy}>
            {copied ? <>{Ic.check} {t.resetCodeCopied}</> : t.resetCodeCopy}
          </button>
          <button className="btn btn-primary" onClick={onDone}>
            {t.resetCodeDone}
          </button>
        </div>
      </div>
    </div>
  );
}

function TeamPage({ token, users, userIssueStats, currentUser, onUsersUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const canManage = currentUser?.role === 'manager';
  const [view, setView] = useState('members');
  // The code a manager has just generated, while its dialog is open.
  const [resetCode, setResetCode] = useState(null);

  // If the signed-in user stops being a manager while the management view is
  // open, drop back to the cards rather than showing controls the API will
  // reject anyway.
  useEffect(() => { if (!canManage) setView('members'); }, [canManage]);

  /* Nothing on this page narrows the roster -- the tabs are drawn from the rows
     themselves -- so this list has no filter key of its own and the retry counter
     below is the only thing that can put the request back in front of the effect. */
  const [retry, setRetry] = useState(0);

  const list = usePagedList(limit => `/users?limit=${limit}`, token, {rowsKey:'users', filterKey: `${retry}`});

  // Per-member totals, aggregated by the server. These used to be counted in the
  // browser out of every issue App had loaded, which only worked while App held
  // all of them: once the issue tables page their results, counting here would
  // quietly under-report anyone with more than a pageful of issues.
  const stats = useMemo(() => {
    const byUser = new Map();
    for (const s of userIssueStats || []) byUser.set(s.user_id, s);
    return byUser;
  }, [userIssueStats]);

  async function changeRole(userId, newRole) {
    try {
      const res = await apiFetch(`/users/${userId}/role`, {method:'PATCH', body:{role: newRole}, token});
      onUsersUpdate(prev => prev.map(u => u.id === userId ? {...u, role: res.user.role} : u));
      setToast('Role updated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function toggleActive(userId, active) {
    try {
      const res = await apiFetch(`/users/${userId}/deactivate`, {method:'PATCH', body:{active}, token});
      onUsersUpdate(prev => prev.map(u => u.id === userId ? {...u, active: res.user.active} : u));
      setToast(active ? 'Account reactivated' : 'Account deactivated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  /* Asks the server for a reset code for this user. Nothing is chosen here and no
     password is created: the server raises a flag, signs the user out of every
     session, and returns a six-digit code that the manager reads out to them.
     Called with required=false to take the request back, which matters when a
     manager presses it on the wrong person. */
  async function setPasswordReset(userId, required) {
    try {
      const res = await apiFetch(`/users/${userId}/reset-password`, {method:'POST', body:{required}, token});
      onUsersUpdate(prev => prev.map(u => u.id === userId
        ? {...u, must_reset_password: res.user.must_reset_password} : u));
      if (required && res.code) {
        // Only place the code is ever shown, so it is held in component state
        // and shown in a dialog rather than buried in a toast that disappears.
        setResetCode({ code: res.code, name: res.user.name, expiresIn: res.expires_in });
        setToast(t.resetPasswordDone.replace('{name}', res.user.name));
      } else {
        setToast(t.resetPasswordCleared.replace('{name}', res.user.name));
      }
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  // `shown` rather than `users`: this page fetches and pages its own member list
  // now, so `users` is the whole roster App loaded at start-up and may be a
  // different thing entirely from what is on screen.
  const shown = list.rows || [];

  if (list.error) {
    return (
      <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,display:'flex',alignItems:'center',gap:10}}>
        <span style={{flex:1}}>{list.error}</span>
        <button className="btn btn-ghost" style={{padding:'4px 12px',fontSize:12}}
          onClick={()=>setRetry(n => n + 1)}>{t.tryAgain}</button>
      </div>
    );
  }

  if (!list.rows) {
    return (
      <div className="table-card">
        <div className="empty-state">{Ic.users}<p>{t.analyticsLoading}</p></div>
      </div>
    );
  }

  if (!shown.length) {
    return (
      <div className="table-card">
        <div className="empty-state">
          {Ic.users}
          <p>No team members yet.</p>
        </div>
      </div>
    );
  }

  // ── Management view (managers only) ──
  const manageTable = (
    <div className="table-card">
      <div className="table-header">
        <span className="table-title">{t.teamMembers}</span>
      </div>

      )}

/* ════════════════ LCU TESTING PAGE ════════════════ */
/*
  A door card reader that has gone intermittent is put on trial for a week
  before it is scrapped. The test is holding an RFID card against it: a green
  light means it read the card, red means it did not. A reader that works on
  Monday can still be failing by Friday, hence seven days rather than one.

  The unit is the reader; its seven days are the log. The server decides who may
  answer (the technician who added it, or a manager) and sends can_answer so the
  controls are only drawn where they will actually work.
*/

// One cell per day of the trial. The dot is the reader's light on that day.
function LCUDayStrip({ unit, today, index = 0 }) {
  const lang = React.useContext(LangCtx);

  /* The lights come on in day order as the page is displayed. Keyed on the day
     count and on how many days carry a verdict, so it re-runs when the strip
     actually changes shape -- a window that grew, or a day just answered -- and
     not on every unrelated re-render of the card around it.

     `index` offsets each reader against the last, so a page with four readers on
     trial fills in one strip after another instead of all four at once. Capped,
     or a long list would leave the last card waiting seconds to start. */
  const answered = unit.days.filter(d => d.result).length;
  const stripRef = useAnimate((g, root) => {
    MOTION.light(g, root.querySelectorAll('.lcu-day.pass .lcu-day-light, .lcu-day.fail .lcu-day-light'),
      { delay: Math.min(index, 8) * 0.13 });
  }, [unit.days.length, answered]);

  return (
    <div className="lcu-strip" ref={stripRef}>
      {unit.days.map(day=>{
        const cls = ['lcu-day'];
        if (day.result === 'pass') cls.push('pass');
        else if (day.result === 'fail') cls.push('fail');
        if (day.day.slice(0,10) === today) cls.push('today');
        // A `date` column arrives from the server as midnight UTC. Handing that
        // straight to new Date() and reading getDate() back shows the PREVIOUS
        // day anywhere west of Greenwich, so the window would start a day early.
        // Building the local date from its parts keeps the label on the day the
        // server meant.
        const [y, m, dNum] = day.day.slice(0,10).split('-').map(Number);
        const asDate = new Date(y, m-1, dNum);
        return (
          <div key={day.day} className={cls.join(' ')}
            title={`${day.day.slice(0,10)}${day.result ? ' — ' + day.result : ''}`}>
            <span className="lcu-day-dow">{asDate.toLocaleDateString(lang==='pt'?'pt-PT':'en-GB',{weekday:'narrow'})}</span>
            <span className="lcu-day-date">{asDate.getDate()}</span>
            <span className="lcu-day-light"/>
          </div>
        );
      })}
    </div>
  );
}

function LCUUnitCard({ unit, today, onAnswer, onDelete, t, index }) {
  const [choosing, setChoosing] = useState(false);
  const [choice, setChoice]   = useState('');
  const [saving, setSaving]   = useState(false);
  const [err, setErr]         = useState('');

  const active = unit.status === 'active';
  const tested = unit.passes + unit.fails;
  const dayNo  = unit.days.findIndex(d=>d.day.slice(0,10) === today) + 1;
  // Only the days that have not happened yet count towards "left", and only
  // while the window is still open.
  const left  = active ? unit.days.filter(d=>d.day.slice(0,10) > today).length : 0;

  async function save(result) {
    setSaving(true); setErr('');
    try { await onAnswer(unit.id, result); setChoosing(false); setChoice(''); }
    catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  return (
    <div className="table-card" style={{padding:'18px 20px'}}>
      <div className="lcu-row">
        <div>
          <span className="lcu-serial">{unit.serial}</span>
          <div className="lcu-meta" style={{marginTop:5}}>
            {unit.added_by_name && <span>{t.lcuAddedBy} {unit.added_by_name}</span>}
            <span>{unit.starts_on.slice(0,10)} → {unit.ends_on.slice(0,10)}</span>
            {unit.note && <span>· {unit.note}</span>}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {unit.status === 'passed' && <span className="badge badge-ok">{t.lcuPassed}</span>}
          {unit.status === 'failed' && <span className="badge" style={{background:'var(--red-light)',color:'var(--red)'}}>{t.lcuFailed}</span>}
          {active && <span className="badge badge-pending">{t.lcuOnTrial}</span>}
          {active && dayNo > 0 && <span className="lcu-meta">{t.lcuDay} {dayNo}/{unit.days.length}</span>}
        </div>
      </div>

      <LCUDayStrip unit={unit} today={today} index={index}/>

      <div className="lcu-row" style={{marginTop:16,marginBottom:0,alignItems:'center'}}>
        <div className="lcu-tally">
          <b>{unit.passes}</b> {t.lcuPassed.toLowerCase()} · <b>{unit.fails}</b> {t.lcuFailed.toLowerCase()}
          {left > 0 && <> · {left} {t.lcuDaysLeft.toLowerCase()}</>}
        </div>
        <div style={{display:'flex',gap:8}}>
          {active && unit.can_answer && !choosing && dayNo > 0 && (
            <button className="btn btn-primary" onClick={()=>setChoosing(true)}>
              {t.lcuRecordToday}
            </button>
          )}
          {unit.can_answer && (
            /* The confirm names the unit's own window rather than the current
               setting, so it stays truthful for a reader that was put on trial
               under a different length. */
            <button className="btn btn-ghost" style={{fontSize:12,padding:'6px 12px'}}
              onClick={()=>{ if (confirm(t.lcuDeleteConfirm.replace('{days}', unit.window_days || 7))) onDelete(unit.id); }}>
              {t.lcuDelete}
            </button>
          )}
        </div>
      </div>

      {err && <div className="auth-error" style={{marginTop:12}}>{err}</div>}

      {choosing && (
        <div style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--gray-200)'}}>
          <div className="lcu-howto" style={{marginBottom:12}}>
            {Ic.info}
            <span>{t.lcuHowToTest}</span>
          </div>
          <div className="lcu-choice">
            <button className={`lcu-choice-btn pass ${choice==='pass'?'on':''}`}
              onClick={()=>setChoice('pass')} disabled={saving}>
              <span className="lcu-bulb"/>{t.lcuPassed}
            </button>
            <button className={`lcu-choice-btn fail ${choice==='fail'?'on':''}`}
              onClick={()=>setChoice('fail')} disabled={saving}>
              <span className="lcu-bulb"/>{t.lcuNotPassed}
            </button>
          </div>
          <div style={{display:'flex',gap:8,marginTop:12,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={()=>{setChoosing(false);setChoice('');}} disabled={saving}>
              {t.cancel}
            </button>
            <button className="btn btn-primary" disabled={!choice || saving} onClick={()=>save(choice)}>
              {saving ? '…' : t.lcuSave}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* One row of the resting history -- a trial that has ended.

   A table row, and specifically NOT an LCUUnitCard. A resolved unit's whole log is
   three numbers: passes, fails, window length. Seven coloured day-cells carry
   exactly those three numbers, so the strip is ninety pixels of picture around twenty
   pixels of information, and on a forty-row pool that is the difference between a
   scroll and a page.

   It also carries no answer control, because there is nothing left to answer. */
function LCURestingRow({ t, lang, unit, fresh, onDelete, busy }) {
  const [err, setErr] = useState('');

  const passed = unit.status === 'passed';
  // The window it actually ran, not the current setting -- a reader trialled for a
  // week stays a week long after the default moves to fourteen.
  const range = `${unit.starts_on.slice(0,10)} → ${unit.ends_on.slice(0,10)}`;
  const since = unit.pool_counted_at
    ? new Date(unit.pool_counted_at).toLocaleDateString(lang === 'pt' ? 'pt-PT' : 'en-GB',
        { day: '2-digit', month: 'short' })
    : '';

  async function remove() {
    setErr('');
    try { await onDelete(unit); }
    catch (ex) {
      // Row-local, not the page banner. The banner sits above the list, so a refusal
      // reported there is nine hundred pixels from the button that caused it.
      if (ex.status === 409) { setErr(t.lcuDeleteBlocked); return; }
      setErr(ex.message || '');
    }
  }

  return (
    <tr className={fresh ? 'row-enter' : undefined}>
      <td><span className="lcu-serial">{unit.serial}</span></td>
      <td>
        <span className={`badge lcu-verdict ${passed ? 'is-pass' : 'is-fail'}`}>
          {passed ? t.lcuPassed : t.lcuFailed}
        </span>
      </td>
      <td className="lcu-cell-dim">{range}</td>
      <td className="lcu-cell-fig"
        title={`${unit.passes} ${t.lcuPassed.toLowerCase()} · ${unit.fails} ${t.lcuFailed.toLowerCase()}`}>
        {unit.passes}/{unit.window_days}
      </td>
      <td className="lcu-cell-dim">
        {unit.resolved_at
          ? new Date(unit.resolved_at).toLocaleDateString(lang === 'pt' ? 'pt-PT' : 'en-GB',
              { day: '2-digit', month: 'short' })
          : '—'}
      </td>
      <td className="lcu-cell-recond">
        {unit.in_pool ? (
          <>
            <span className="lcu-pool-since">{t.lcuPoolSince.replace('{date}', since)}</span>
            {unit.added_by_name && <span className="lcu-meta">{t.lcuAddedBy} {unit.added_by_name}</span>}
          </>
        ) : (
          <span className="lcu-cell-none">—</span>
        )}
      </td>
      <td style={{textAlign:'right'}}>
        {/* Delete is offered ONLY when the reader is not in the pool, and the reason is
            not that deleting is forbidden -- it is not, with force -- but that on a
            pool-bound reader the button's most common outcome is a refusal. A control
            whose common outcome is an error is a bad control.

            It is still there for failed readers and for passed readers that predate the
            pool, so nothing that used to be deletable becomes quietly undeletable. */}
        {!unit.in_pool && unit.can_answer && (
          <button className="btn btn-ghost" style={{fontSize:12,padding:'6px 12px'}}
            disabled={busy}
            onClick={()=>{ if (confirm(t.lcuDeleteConfirm.replace('{days}', unit.window_days || 7))) remove(); }}>
            {t.lcuDelete}
          </button>
        )}
      </td>
      {err && (
        <tr className="lcu-err-row"><td colSpan={7}>
          <div className="auth-error" style={{margin:'0'}}>{err}</div>
        </td></tr>
      )}
    </tr>
  );
}

function LCUPage({ token, setToast, onLcuRequired, refreshKey, windowDays }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [err, setErr]         = useState('');
  const [adding, setAdding]   = useState(false);
  const [serial, setSerial]   = useState('');
  const [note, setNote]       = useState('');
  const [saving, setSaving]   = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [restBusy, setRestBusy] = useState(false);

  // The trial length is a manager setting, so the page copy cannot name a number.
  // 7 is the same default the server falls back to.
  const days = windowDays || 7;
  // Fills the {days} placeholder the shared strings carry. Small enough to run
  // on every render without mattering.
  const withDays = s => s.replace('{days}', days);

  /* The resting history, paged independently of the active list.

     A second usePagedList instance is safe because all of that hook's state is
     function-local -- no module state, no context, no singleton -- so the two carry
     separate limits and separate rows. They share filterKey deliberately: one reload
     after answering a day should drop BOTH back to a single page, and the reason the
     active list drops back is that its rows were fetched before the answer and the
     answer is not among them.

     It is also the request that PERFORMS the sweep. See cmd/api/lcu.go: this
     endpoint is the only place ResolveDue runs, precisely so that a credit made by
     any sweep can be reported to the next load of this page. */
  const restingList = usePagedList(limit => `/lcu/resting?limit=${limit}`, token, {
    rowsKey: 'units',
    filterKey: `${refreshKey}|${reloadKey}`,
    onError: ex => {
      if (ex.lcuRequired) { onLcuRequired(ex); return; }
      // Deliberately NOT setErr. The active list owns the page-level banner; two
      // failing requests must not stack two copies of the same message at the top.
    },
  });
  /* Readers on trial, paged. `refreshKey` is bumped when the daily prompt closes,
     so the list is re-read after an answer rather than left showing whatever it
     managed to fetch before the gate closed -- and it doubles as the filter key,
     so it also drops back to a single page rather than showing the answer under
     pages of rows fetched before it.

     THE FILTER KEY IS DELIBERATELY PAIRED WITH THE RESTING LIST'S ARRIVAL BELOW.

     ResolveDue -- the sweep that closes ended windows and credits the pool -- now
     runs on GET /v1/lcu/resting and nowhere else, so that a credit made by ANY
     sweep can be reported (cmd/api/lcu.go explains why /v1/lcu/today was the wrong
     home for it). The cost is that /vcu/units no longer sweeps, and a page that
     fetched both in parallel could read the active list BEFORE the sweep and render
     eight resolved readers as "On trial" -- which is exactly what the first
     screenshot showed.

     Making this list wait for the resting list is the fix. It costs one round trip
     of ordering on a page that is showing a week of history anyway, and it is the
     only thing here that is load-bearing rather than tidy: reversing these two
     requests reproduces the bug immediately. Hence the key, and hence this
     paragraph -- a bare `filterKey` that happens to encode "after" is the kind of
     line nobody dares touch.

     Adding a unit makes today's result owed straight away, so the reload that
     follows is itself refused. That is the gate working, not a failure, and it
     arrives here as an error rather than an empty list. */
  const paged = usePagedList(limit => `/lcu/units?limit=${limit}`, token, {
    rowsKey: 'units',
    filterKey: restingList.rows ? `${refreshKey}|${reloadKey}` : 'awaiting-sweep',
    onError: ex => {
      if (ex.lcuRequired) { onLcuRequired(ex); return; }
      setErr(ex.message);
    },
  });

  const units = paged.rows || [];
  const today = (paged.res && paged.res.today) || localISODate(new Date());
  // Cleared on a successful fetch, so a transient failure does not leave a red
  // line above a list that has since loaded perfectly well.
  useEffect(() => { if (paged.res) setErr(''); }, [paged.res]);


  const restRows = restingList.rows || [];
  const restRes  = restingList.res;
  const pool    = (restRes && restRes.reconditioned && restRes.reconditioned.pool) || 0;
  const yours   = (restRes && restRes.reconditioned && restRes.reconditioned.yours) || 0;
  const credits = (restRes && restRes.newly_reconditioned) || [];

  /* THE TOAST, GUARDED ON IDENTITY RATHER THAN ON "FIRST RENDER".

     loadMore refetches /lcu/resting with a bigger limit, and a sweep can genuinely
     happen between two of those fetches -- so newly_reconditioned can legitimately be
     non-empty again on a later load, not only on the first. Guarding on ids rather
     than on a once-flag therefore does the right thing in both cases, where "only
     toast on mount" would announce the same three readers twice and "only ever toast
     once" would stay silent about the fourth. */
  const announced = useRef({});
  useEffect(() => {
    if (!credits.length) return;
    const fresh = credits.filter(c => !announced.current[c.unit_id || c.serial]);
    if (!fresh.length) return;
    credits.forEach(c => { announced.current[c.unit_id || c.serial] = true; });
    setToast(fresh.length === 1
      ? t.lcuReconditionedOne
      : t.lcuReconditionedMany.replace('{count}', fresh.length));
  }, [restRes, setToast, t]);

  // The pulse is a one-shot flag rather than a class held for ever: the number stops
  // moving, so the highlight has to stop too or it reads as "still counting".
  const [poolFresh, setPoolFresh] = useState(false);
  useEffect(() => {
    if (!credits.length) return;
    setPoolFresh(true);
    const h = setTimeout(() => setPoolFresh(false), 800);
    return () => clearTimeout(h);
  }, [restRes]);
  useEffect(() => { if (!restRes) setPoolFresh(false); }, [restRes]);

  async function reload() {
    // Handled by bumping the key the hooks watch.
    setReloadKey(k => k + 1);
  }

  async function add(e) {
    e.preventDefault();
    setSaving(true); setErr('');
    try {
      await apiFetch('/lcu/units', {method:'POST', token, body:{serial, note}});
      setSerial(''); setNote(''); setAdding(false);
      setToast(t.lcuAdded);
      // The new reader is today's outstanding test, so this reload is the one the
      // gate refuses -- which opens the prompt through the hook's error handler.
      reload();
    } catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  async function answer(unitID, result) {
    await apiFetch('/lcu/tests', {method:'POST', token, body:{results:[{unit_id:unitID, result}]}});
    setToast(t.lcuRecorded);
    reload();
  }

  async function remove(id) {
    try {
      await apiFetch(`/lcu/units/${id}`, {method:'DELETE', token});
      setToast(t.lcuDeleted);
      reload();
    } catch(ex) { setErr(ex.message); }
  }

  /* Removing from the resting history.

     It RE-THROWS rather than reporting, because the two callers want different
     things: an active card wants the message on the page banner, and a resting row
     wants it next to the button. The row catches a 409 and keeps it to itself; the
     active card lets it land on the banner as before. */
  async function removeResting(unit) {
    setRestBusy(true);
    try {
      await apiFetch(`/lcu/units/${unit.id}`, {method:'DELETE', token});
      setToast(t.lcuDeleted);
      reload();
    } finally {
      setRestBusy(false);
    }
  }

  return (
    <div style={{maxWidth:900}}>
      <div className="lcu-howto" style={{marginBottom:18}}>
        {Ic.info}
        <span>{withDays(t.lcuIntro)}</span>
      </div>

      {/* THE POOL, ABOVE EVERYTHING ELSE.

          The number frames the work, and the "+1" is an event about a count -- so the
          news has to land where people are already looking. My first candidate put
          this block below the resting history, which is where the credit is most
          legible; that is wrong, because by then you have scrolled past the thing the
          toast just told you changed.

          The block is CONDITIONAL on a non-zero pool rather than rendering a zero. A
          large grey "0" above an "Add test unit" button reads as a shortfall, when the
          honest statement is that nobody has run a trial yet -- which is silence, and
          silence is what an unused feature looks like. */}
      {(pool > 0 || credits.length > 0) && (
        <div className="lcu-pool-grid">
          <div className="stat-card">
            <div className="stat-label">{t.lcuPool}</div>
            <div className={'stat-value' + (poolFresh ? ' lcu-pool-fresh' : '')}>{pool}</div>
            <div className="stat-sub">{t.lcuPoolSub}</div>
          </div>
          {/* OMITTED ENTIRELY at zero rather than shown as "0". A zero here is a
              statement about the reader ("I have done nothing"); the true statement is
              "none of these are mine", which is not worth a tile. */}
          {yours > 0 && (
            <div className="stat-card">
              <div className="stat-label">{t.lcuPoolYours}</div>
              <div className="stat-value">{yours}</div>
            </div>
          )}
        </div>
      )}

      <div className="team-viewbar" style={{marginBottom:16}}>
        <button className="btn btn-primary" onClick={()=>setAdding(a=>!a)}>
          {Ic.plus} {t.lcuAddUnit}
        </button>
      </div>

      {adding && (
        <form onSubmit={add} className="admin-form" style={{marginBottom:20}}>
          <div className="form-group">
            <label htmlFor="lcu-serial">{t.lcuSerial}</label>
            <input id="lcu-serial" className="form-control" value={serial} maxLength={64} required autoFocus
              placeholder={t.lcuSerialPlaceholder} onChange={e=>setSerial(e.target.value)}/>
          </div>
          <div className="form-group">
            <label htmlFor="lcu-note">{t.lcuNote}</label>
            <input id="lcu-note" className="form-control" value={note} maxLength={200}
              placeholder={t.lcuNotePlaceholder} onChange={e=>setNote(e.target.value)}/>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button type="button" className="btn btn-ghost" onClick={()=>setAdding(false)} disabled={saving}>
              {t.cancel}
            </button>
            <button type="submit" className="btn btn-primary" disabled={saving || !serial.trim()}>
              {saving ? '…' : withDays(t.lcuStartTrial)}
            </button>
          </div>
        </form>
      )}

      {err && <div className="auth-error" style={{marginBottom:16}}>{err}</div>}

      {/* Gated on the error as well as the rows: a failed fetch also leaves rows
          null, so asking only for rows printed "Loading analytics…" underneath the
          red line above, which says the request already failed. */}
      {!paged.rows && !paged.error && <div className="table-card"><div className="empty-state"><p>{t.analyticsLoading}</p></div></div>}

      {paged.rows && units.length === 0 && (
        <div className="table-card">
          <div className="empty-state">{Ic.server}<p>{t.lcuNone}</p></div>
        </div>
      )}

      {paged.rows && units.map((u, i)=>(
        <LCUUnitCard key={u.id} unit={u} today={today} t={t} index={i}
          onAnswer={answer} onDelete={remove}/>
      ))}

      <LoadMore list={paged} t={t}/>

      {/* THE RESTING HISTORY, below the active work rather than beside it.

          A first run therefore shows ONE empty state, not two: the whole section --
          header, table, LoadMore and all -- is withheld until there is something in
          it. Two stacked .empty-state blocks two hundred pixels apart, on a page whose
          job is "add a reader", is a lot of nothing.

          Gated on !rows && !error rather than on rows alone, for the reason the active
          list's loading state gives at the top of this file: rows is null both while a
          request is in flight and after one failed, so asking only for rows prints
          "Loading analytics..." underneath a red line saying the request already
          failed. */}
      {(restRows.length > 0 || pool > 0) && (
        <div className="table-card" style={{marginTop:4}}>
          <div className="table-header">
            <span className="table-title">{t.lcuResting}</span>
            <span className="lcu-meta">{t.lcuRestingSub}</span>
          </div>

          {!restingList.rows && !restingList.error && (
            <div className="empty-state"><p>{t.analyticsLoading}</p></div>
          )}

          {restingList.rows && restRows.length === 0 && (
            <div className="empty-state">{Ic.server}<p>{t.lcuRestingNone}</p></div>
          )}

          {restRows.length > 0 && (
            <table className="lcu-resting-table">
              <thead>
                <tr>
                  <th>{t.lcuSerial}</th>
                  <th>{t.lcuColVerdict}</th>
                  <th>{t.lcuColWindow}</th>
                  <th>{t.lcuColResult}</th>
                  <th>{t.lcuColResolved}</th>
                  <th>{t.lcuPool}</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {restRows.map(u => (
                  <LCURestingRow key={u.id}
                    t={t} lang={lang} unit={u} busy={restBusy}
                    // Only the rows THIS sweep credited animate. Animating all forty on
                    // first paint would be noise, and it looks like a loading bug.
                    fresh={!!u.pool_counted_at
                      && credits.some(c => c.unit_id === u.id)}
                    onDelete={removeResting}/>
                ))}
              </tbody>
            </table>
          )}

          <LoadMore list={restingList} t={t}/>
        </div>
      )}
    </div>
  );
}

/*
  The daily LCU prompt. This has no close button on purpose: a reader being
  trialled is only judged on seven honest days, so a result has to be given
  before the app is usable. The server refuses everything else until it is, so
  this dialog is the way through rather than a decoration over a locked app --
  the only way out of it is answering or logging out.
*/
function LCUPrompt({ units, token, onDone, onLogout }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  // One entry per unit, all of which must be answered before the form will send.
  const [answers, setAnswers] = useState(() => Object.fromEntries(units.map(u=>[u.id, ''])));
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  // No Escape here, unlike every other dialog: this one has no close button on
  // purpose, because the only ways out are answering or signing out and a
  // keyboard user should not get a third. Focus is still moved in and still
  // trapped, which is the part that is about the page behind rather than about
  // dismissing this.
  const panelRef = useDialog({preventClose: true});

  const complete = units.every(u => answers[u.id]);

  async function submit() {
    setSaving(true); setErr('');
    try {
      await apiFetch('/lcu/tests', {method:'POST', token, body:{
        results: units.map(u=>({unit_id:u.id, result:answers[u.id]})),
      }});
      onDone();
    } catch(ex) {
      setErr(ex.message);
      setSaving(false);
    }
  }

  return (
    <div className="modal-overlay" style={{zIndex:200}}>
      <div className="modal" style={{maxWidth:480}} ref={panelRef} role="dialog" aria-modal="true" aria-label={t.lcuGateTitle}>
        <div className="modal-header">
          <h2>{t.lcuGateTitle}</h2>
        </div>
        <div className="modal-body lcu-gate-body">
          <p style={{margin:0,fontSize:13,color:'var(--gray-600)'}}>{t.lcuGateBody}</p>

          <div className="lcu-howto">
            {Ic.info}
            <span>{t.lcuHowToTest}</span>
          </div>

          {units.map(u=>(
            <div key={u.id} className="lcu-gate-unit">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
                <span className="lcu-serial">{u.serial}</span>
                {u.note && <span className="lcu-meta">{u.note}</span>}
              </div>
              <div className="lcu-choice">
                <button className={`lcu-choice-btn pass ${answers[u.id]==='pass'?'on':''}`}
                  onClick={()=>setAnswers(a=>({...a,[u.id]:'pass'}))} disabled={saving}>
                  <span className="lcu-bulb"/>{t.lcuPassed}
                </button>
                <button className={`lcu-choice-btn fail ${answers[u.id]==='fail'?'on':''}`}
                  onClick={()=>setAnswers(a=>({...a,[u.id]:'fail'}))} disabled={saving}>
                  <span className="lcu-bulb"/>{t.lcuFailed}
                </button>
              </div>
            </div>
          ))}

          {err && <div className="auth-error">{err}</div>}
        </div>
        <div className="modal-footer" style={{flexDirection:'column',alignItems:'stretch',gap:8}}>
          <button className="btn btn-primary btn-full" disabled={!complete || saving} onClick={submit}>
            {saving ? t.analyticsLoading : t.lcuRecordToday}
          </button>
          <div className="lcu-lockout">{t.lcuGateLocked}</div>
          <button className="btn btn-ghost btn-full" onClick={onLogout} disabled={saving}>
            {t.lcuGateLogOut}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════ MAINTENANCE PAGE ════════════════ */
/*
  Preventive maintenance on department printers and phones.

  This is a work queue, not a report: what matters is what is due and who is
  going to do it, so the page opens on the overdue list and everything else
  follows in order of urgency.

  The one rule that shapes everything here: recording a check is not the same as
  logging an issue. Almost every check finds nothing, and if each of those became
  an issue the counts and averages everywhere else in the app would quietly
  change. So "Mark done" writes a check, and only a fault offers to also write an
  issue — and that offer can be declined, because a fault put right on the spot
  is a real thing worth recording that is not anybody's problem to track.
*/
const MAINTENANCE_PRESETS = [
  {days:7,    key:'weekly'},
  {days:30,   key:'monthly'},
  {days:90,   key:'quarterly'},
  {days:180,  key:'biannual'},
  {days:365,  key:'yearly'},
];

// The issue type a piece of equipment raises, so a fault logged from here lands
// in the normal tables already categorised.
const maintenanceIssueType = eq => eq === 'phone' ? 'Phone' : 'Printer';

function MaintenanceDeviceCard({ s, t, canManage, onComplete, onHistory, onEdit, index = 0 }) {
  const late = s.due_state === 'overdue';
  const soon = s.due_state === 'due_soon';
  const isPhone = s.equipment_type === 'phone';
  const typeLabel = isPhone ? t.maintenancePhone : t.maintenancePrinter;

  let dueText;
  if (late) {
    dueText = s.days_overdue === 1
      ? t.maintenanceDayOverdue
      : t.maintenanceDaysOverdue.replace('{days}', s.days_overdue);
  } else if (soon) {
    dueText = s.next_due_on === s.last_done_on
      ? t.maintenanceDueToday
      : t.maintenanceNotYet.replace('{date}', formatDateShort(s.next_due_on));
  } else {
    dueText = t.maintenanceNotYet.replace('{date}', formatDateShort(s.next_due_on));
  }

  // The foot answers two questions, and both are dates: when this device was last
  // looked at, and when it is next wanted. next_due_on already arrived with the
  // row, so the countdown is arithmetic on loaded data rather than a new endpoint.
  //
  // "Checked today" rather than today's date, because a date the reader already
  // knows is a date that takes up room to say nothing.
  const todayISO = localISODate(new Date());
  const checkedToday = !!s.last_done_on && String(s.last_done_on).slice(0, 10) === todayISO;
  const dueDay = dayNumber(s.next_due_on);
  const todayDay = dayNumber(todayISO);
  const daysToNextDue = dueDay === null || todayDay === null ? null : dueDay - todayDay;

  let lastText;
  if (!s.last_done_on) {
    lastText = t.maintenanceNeverChecked;
  } else if (checkedToday) {
    lastText = t.maintenanceCheckedToday;
  } else {
    lastText = `${formatDateShort(s.last_done_on)} · ${
      s.last_outcome === 'fault' ? t.maintenanceFault : t.maintenanceAllFine}`;
  }

  // The countdown is only spelled out while the tile is comfortable. An overdue or
  // soon device already says so on the coloured badge above, and a tile that
  // repeats itself is a tile nobody reads.
  let nextText = '';
  if (!late && !soon && s.active && daysToNextDue !== null && daysToNextDue >= 0) {
    nextText = daysToNextDue === 0
      ? t.maintenanceNextToday
      : daysToNextDue === 1
        ? t.maintenanceNextTomorrow
        : t.maintenanceNextIn.replace('{days}', daysToNextDue);
  }

  return (
    <div className={`maint-card maint-enter ${
        late ? 'maint-overdue' : soon ? 'maint-soon' : 'maint-scheduled'
      } ${!s.active ? 'maint-retired' : ''}`}
      // Staggered by position so the queue arrives in order instead of all at
      // once. Capped: a long overdue queue should not take a second to appear.
      style={{animationDelay: `${Math.min(index, 8) * 30}ms`}}>
      <div className="maint-head">
        <span className={`maint-chip maint-chip-${isPhone ? 'phone' : 'printer'}`} aria-hidden="true">
          {isPhone ? Ic.phone : Ic.printer}
        </span>
        <strong className="maint-name">{s.device_name}</strong>
      </div>
      {/* The caption replaces the type pill that used to sit here. The chip beside
          the name already says printer or phone, so a badge saying it again was
          decoration; the words stay as plain text because the chip is
          aria-hidden, and a card whose only statement of what it is lives in a
          picture is unreadable to a screen reader. */}
      <div className="maint-tags">
        <span className="maint-caption">{typeLabel}</span>
        {late && <span className="badge badge-overdue">{dueText}</span>}
        {!late && soon && <span className="badge badge-soon">{dueText}</span>}
        {!s.active && <span className="badge badge-slate">{t.maintenanceRetired}</span>}
      </div>
      {/* One fact per icon, so the line reads without labels and wraps cleanly
          when an assignee makes it longer than the tile. */}
      <div className="maint-sub">
        <span className="maint-fact maint-fact-location">
          <span className="maint-fact-ic" aria-hidden="true">{Ic.pin}</span>{s.department_name}
        </span>
        <span className="maint-fact maint-fact-interval">
          <span className="maint-fact-ic" aria-hidden="true">{Ic.refresh}</span>
          {t.maintenanceIntervalDays.replace('{days}', s.interval_days)}
        </span>
        {/* Shown only when someone owns it. A manager needs to see who, because
            they are the ones who reassign; a technician can only ever see their
            own or a shared one, and "all technicians" on every tile would just
            be noise. */}
        {s.assignee_name && <span className="maint-fact">{s.assignee_name}</span>}
      </div>
      {/* The foot, under a rule: the two dates a reader scans a queue for. The
          words go green or red with the dot, so a device that was checked today
          and found nothing reads as closed at a glance. */}
      <div className="maint-last">
        <span className={`maint-last-dot ${
          !s.last_done_on ? '' : s.last_outcome === 'fault' ? 'fault' : 'ok'}`}/>
        <span className={`maint-last-when ${
          !s.last_done_on ? '' : s.last_outcome === 'fault' ? 'fault' : 'ok'}`}>
          {lastText}
        </span>
        {nextText && <span className="maint-last-due">{nextText}</span>}
      </div>
      <div className="maint-card-actions">
        {s.active && (
          <button className="btn btn-primary" onClick={()=>onComplete(s)}>
            {/* A device already checked today is not waiting to be done, it has
                been done -- what the button offers is another look. Saying so
                stops the tile reading as though it had been overlooked. */}
            {Ic.check} {checkedToday ? t.maintenanceDoneAgain : t.maintenanceMarkDoneCard}
          </button>
        )}
        <button className="icon-btn" title={t.maintenanceHistory} aria-label={t.maintenanceHistory}
          onClick={()=>onHistory(s)}>{Ic.clock}</button>
        {canManage && (
          <button className="icon-btn" title={t.maintenanceEditDevice} aria-label={t.maintenanceEditDevice}
            onClick={()=>onEdit(s)}>{Ic.edit}</button>
        )}
      </div>
    </div>
  );
}

// formatDateShort renders a YYYY-MM-DD date for display. Parsed as local midnight
// on purpose: new Date('2026-10-03') is UTC midnight, which in Lisbon is still
// the 2nd, and the due date would read a day early for anyone east of Greenwich.
function formatDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return String(iso);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {day:'numeric', month:'short'});
}

// dayNumber turns a YYYY-MM-DD string into whole days since the epoch.
//
// Both sides are built with Date.UTC so the two dates are compared as plain
// calendar days and neither can slip by one according to where the reader is --
// the same reason formatDateShort avoids new Date(iso) above. Returns null for
// anything unparseable rather than NaN, so a missing date leaves the countdown
// off the tile instead of rendering it as NaN days.
function dayNumber(iso) {
  const [y, m, d] = String(iso || '').slice(0, 10).split('-').map(Number);
  return y && m && d ? Math.floor(Date.UTC(y, m - 1, d) / 86400000) : null;
}

function MaintenanceQueue({ title, list, t, emptyText, canManage, handlers, testId }) {
  if (!list.length) return null;
  return (
    <div className={`maint-queue maint-queue-${testId}`} data-maint-section={testId}>
      <div className="maint-queue-head">
        <span className="maint-queue-dot" aria-hidden="true"/>
        <h2>{title}</h2>
        <span className="maint-queue-count">{list.length}</span>
      </div>
      <div className="maint-grid">
        {list.map((s, i) => (
          <MaintenanceDeviceCard key={s.id} s={s} t={t} index={i} canManage={canManage} {...handlers}/>
        ))}
      </div>
      {emptyText && <div className="empty-state">{Ic.box}<p>{emptyText}</p></div>}
    </div>
  );
}

function MaintenancePage({ token, currentUser, departments, setToast, onCountsUpdate, onRequestIssue }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const canManage = currentUser?.role === 'manager';
  const todayStr = localISODate(new Date());

  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [epoch, setEpoch] = useState(0);
  const [editing, setEditing] = useState(null);   // a schedule, or 'new'
  const [completing, setCompleting] = useState(null);
  const [historyFor, setHistoryFor] = useState(null);
  // Who each check can be assigned to. Fetched here rather than taken from the
  // app's user list, which is a page of its own -- a truncated roster would leave
  // a technician silently missing from the dropdown and their checks quietly
  // stuck on "all technicians".
  const [staff, setStaff] = useState([]);
  // Which kind of equipment the queue is showing: '' for all, or a type. Reset
  // when the page is left, like every other filter in the app.
  const [equipFilter, setEquipFilter] = useState('');
  // Which of the four groups the tiles are filtering down to, or null for all of
  // them. Separate from equipFilter because the two answer different questions --
  // what kind of equipment, and what state -- and both can be set at once.
  const [stateFilter, setStateFilter] = useState(null);

  const refresh = () => setEpoch(n => n + 1);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    apiFetch('/maintenance/schedules?recent=10', {token})
      .then(res => {
        if (cancelled) return;
        setData(res);
        setErr('');
        if (onCountsUpdate) onCountsUpdate(res.due_count || 0);
      })
      .catch(ex => { if (!cancelled) setErr(ex.message); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [token, epoch]);

  // Only a manager assigns anybody, so only a manager pays for the roster.
  useEffect(() => {
    if (!canManage) return;
    let cancelled = false;
    apiFetch('/users?limit=1000', {token})
      .then(res => { if (!cancelled) setStaff((res.users || []).filter(u => u.active)); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [token, canManage]);

  if (loading && !data) {
    return <div className="table-card"><div className="empty-state">{Ic.tool}<p>{t.analyticsLoading}</p></div></div>;
  }

  if (err) {
    /* The server's own message, but as an error rather than as an empty state.
       An .empty-state is the app's way of saying "there is genuinely nothing
       here", in grey, with nothing to click -- so a failed request used to print
       "network down" in exactly that shape and look like an answer. It also left
       onCountsUpdate uncalled, because due_count arrives on the success path, so
       the sidebar badge kept whatever it last knew instead of being told the
       count could not be read. refresh() puts the request back in front of the
       effect; nothing else has to change for it to actually re-run. */
    return (
      <div>
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,display:'flex',alignItems:'center',gap:10}}>
          <span style={{flex:1}}>{err}</span>
          <button className="btn btn-ghost" style={{padding:'4px 12px',fontSize:12}}
            onClick={refresh}>{t.tryAgain}</button>
        </div>
      </div>
    );
  }

  const all        = data?.schedules || [];

  // The equipment type filter is applied here rather than asked of the server.
  // This list is the one listing that is not paginated -- ListSchedules takes no
  // limit and the whole schedule arrives in one response -- so every device is
  // already in hand and there is nothing a server round trip would add.
  //
  // It also keeps the sidebar badge honest: due_count is computed over every
  // active device the caller may see, so narrowing the view cannot narrow the
  // count of work waiting. The badge answers "is anything due", the tiles answer
  // "what am I looking at", and only the second one follows the filter.
  const shown      = equipFilter ? all.filter(s => s.equipment_type === equipFilter) : all;
  const active     = shown.filter(s => s.active);

  // The four groups, counted over everything the equipment filter left. These are
  // also the tiles' numbers, which is why they are kept apart from what is on
  // screen: a tile that counted only the selected group would read 0 on the other
  // three, and a row of zeroes is a dead end -- you could not see what else there
  // was to switch to. So the tiles always report the real size of each group and
  // act as the navigation, and stateFilter only decides which groups are listed
  // underneath them.
  const groups = {
    overdue:   active.filter(s => s.due_state === 'overdue'),
    soon:      active.filter(s => s.due_state === 'due_soon'),
    scheduled: active.filter(s => s.due_state === 'scheduled'),
    retired:   shown.filter(s => !s.active),
  };
  const groupVisible = key => stateFilter === null || stateFilter === key;

  // Recent checks follow the filter too, so the table under the queue describes
  // the same equipment the queue does. The device is looked up in the unfiltered
  // list: a check whose device is currently filtered out still needs its name if
  // it is going to be shown, and a check on a hidden device must not resolve to a
  // bare dash.
  const shownIds   = new Set(shown.map(s => s.id));
  const recent     = (data?.recent || []).filter(c => shownIds.has(c.schedule_id));

  // Counts on the chips, so the filter says what is behind it before it is used.
  const typeChips = [
    { key: '',        label: t.maintenanceFilterAll, n: all.length },
    { key: 'printer', label: t.maintenancePrinters,  n: all.filter(s => s.equipment_type === 'printer').length },
    { key: 'phone',   label: t.maintenancePhones,    n: all.filter(s => s.equipment_type === 'phone').length },
  ];

  const handlers = {
    onComplete: setCompleting,
    onHistory:  setHistoryFor,
    onEdit:     setEditing,
  };

  // The check is filed the moment the dialog is saved, before the issue question
  // is even asked. Recording it second meant closing the issue form could lose a
  // fault the technician had already reported, and left the check dialog sitting
  // on top of the issue form. Filing first also means cancelling the issue form is
  // harmless: the fault is on record with its note, just not linked to a ticket.
  async function complete({schedule, outcome, note, doneOn, raiseIssue}) {
    setCompleting(null);

    let check;
    try {
      const res = await apiFetch(`/maintenance/schedules/${schedule.id}/checks`, {method:'POST', token,
        body:{outcome, note, done_on: doneOn || todayStr}});
      check = res.check;
    } catch(ex) {
      setToast('Error: ' + ex.message);
      return;
    }
    setToast(t.maintenanceCheckSaved);
    refresh();

    if (!raiseIssue) return;

    onRequestIssue({
      prefill: {
        dept: schedule.department_name,
        type:  maintenanceIssueType(schedule.equipment_type),
        // Named first so the issue says which machine it is about; the check it
        // links to says the rest.
        problem: `${schedule.device_name} — `,
      },
      onLinked: async issueId => {
        try {
          await apiFetch(`/maintenance/checks/${check.id}/link`, {method:'POST', token,
            body:{issue_id: issueId}});
          setToast(t.maintenanceIssueLogged);
          refresh();
        } catch(ex) { setToast('Error: ' + ex.message); }
      },
    });
  }

  return (
    <div>
      <div className="table-card" style={{marginBottom:18,padding:'14px 20px',display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
        <p style={{fontSize:13,color:'var(--gray-400)',margin:0,flex:1,minWidth:260}}>{t.maintenanceSubtitle}</p>
        {/* Hidden until there is something to filter: with no equipment at all,
            one chip that can only be selected is a control that does nothing. */}
        {all.length > 0 && (
          <div className="filter-chips" role="group" aria-label={t.maintenanceEquipment}>
            {typeChips.map(c => (
              <button key={c.key || '__all__'} className={`chip ${equipFilter === c.key ? 'active' : ''}`}
                aria-pressed={equipFilter === c.key} onClick={()=>setEquipFilter(c.key)}>
                {c.label} <span style={{opacity:0.6}}>{c.n}</span>
              </button>
            ))}
          </div>
        )}
        {canManage && (
          <button className="btn btn-primary" style={{padding:'7px 14px',fontSize:12.5}}
            onClick={()=>setEditing('new')}>
            {Ic.plus} {t.maintenanceAddDevice}
          </button>
        )}
      </div>

      {/* Only once there is something to count. Four grey zeroes above "no
          equipment yet" is noise, and the empty state already says it.

          Each tile is a button that narrows the queue to its own group, and
          clicking the selected one puts everything back. Real buttons rather than
          divs with a role, so keyboard activation and focus come for free rather
          than being reimplemented. */}
      {all.length > 0 && (
        <div className="maint-tiles">
          {[
            { key: 'overdue',   label: t.maintenanceOverdue },
            { key: 'soon',      label: t.maintenanceDueSoon },
            { key: 'scheduled', label: t.maintenanceScheduled },
            { key: 'retired',   label: t.maintenanceRetired },
          ].map(x => {
            const n = groups[x.key].length;
            const on = stateFilter === x.key;
            return (
              <button key={x.key} type="button"
                className={`maint-tile ${x.key}${n ? ' live' : ''}${on ? ' is-filter' : ''}`}
                aria-pressed={on}
                onClick={()=>setStateFilter(on ? null : x.key)}>
                <span className="maint-tile-label"><span className="stat-dot" aria-hidden="true"/>{x.label}</span>
                <span className="maint-tile-value"><CountUp value={n}/></span>
              </button>
            );
          })}
        </div>
      )}

      {/* Three different emptinesses, and they need different words: nothing is on
          the schedule at all, nothing of the kind just filtered to, or the group
          picked on the tiles turned out to be empty. The middle one names the
          equipment type so it is obvious the filter emptied the page rather than
          the schedule being lost. */}
      {!all.length ? (
        <div className="empty-state">{Ic.tool}<p>{t.maintenanceNone}</p></div>
      ) : !shown.length ? (
        <div className="empty-state">{Ic.tool}
          <p>{equipFilter === 'phone' ? t.maintenanceNoPhones : t.maintenanceNoPrinters}</p>
        </div>
      ) : stateFilter !== null && groups[stateFilter].length === 0 ? (
        // A group with nothing in it still gets an answer, rather than the page
        // just going blank under a highlighted tile.
        <div className="empty-state">{Ic.tool}<p>{t.maintenanceNothingInGroup}</p></div>
      ) : (
        <>
          <MaintenanceQueue title={t.maintenanceOverdue}   list={groupVisible('overdue')   ? groups.overdue   : []} t={t} canManage={canManage} handlers={handlers} testId="overdue"/>
          <MaintenanceQueue title={t.maintenanceDueSoon}   list={groupVisible('soon')      ? groups.soon      : []} t={t} canManage={canManage} handlers={handlers} testId="soon"/>
          <MaintenanceQueue title={t.maintenanceScheduled} list={groupVisible('scheduled') ? groups.scheduled : []} t={t} canManage={canManage} handlers={handlers} testId="scheduled"/>
          <MaintenanceQueue title={t.maintenanceRetired}   list={groupVisible('retired')   ? groups.retired   : []} t={t} canManage={canManage} handlers={handlers} testId="retired"/>
        </>
      )}

      {/* Hidden when the filter matched nothing: "no checks recorded yet" would be
          a lie, there are plenty -- just none for this equipment. */}
      {shown.length > 0 && (
        <div style={{marginTop:26}}>
          <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:10}}>
            <h2 style={{fontSize:15,margin:0}}>{t.maintenanceRecent}</h2>
          </div>
          {!recent.length ? (
            <div className="empty-state">{Ic.clock}<p>{t.maintenanceRecentEmpty}</p></div>
          ) : (
            <div className="table-card">
              <div style={{overflowX:'auto'}}>
                <table>
                  <thead>
                    <tr>
                      <th>{t.date}</th><th>{t.maintenanceEquipment}</th><th>{t.maintenanceOutcome}</th>
                      <th>{t.maintenanceNote}</th><th>{t.loggedBy}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {recent.map(c => {
                      const device = all.find(s => s.id === c.schedule_id);
                      return (
                        <tr key={c.id}>
                          <td style={{whiteSpace:'nowrap',fontSize:12.5,color:'var(--gray-500)'}}>
                            {formatDateShort(c.done_on)}
                          </td>
                          <td>
                            {device ? (
                              <span style={{fontSize:12.5}}>
                                {device.device_name}
                                <span style={{color:'var(--gray-400)'}}> · {device.department_name}</span>
                              </span>
                            ) : '—'}
                          </td>
                          <td>
                            <span className={`badge ${c.outcome==='fault' ? 'badge-pending' : 'badge-ok'}`}>
                              {c.outcome==='fault' ? t.maintenanceFault : t.maintenanceAllFine}
                            </span>
                            {c.issue_label && (
                              <div style={{fontSize:11.5,color:'var(--gray-400)',marginTop:2}}>{c.issue_label}</div>
                            )}
                          </td>
                          <td style={{maxWidth:260,fontSize:12.5,color:'var(--gray-600)'}}>{c.note || '—'}</td>
                          <td style={{fontSize:12.5}}>{c.done_by_name}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}

      {completing && (
        <MaintenanceCheckDialog schedule={completing} t={t} today={todayStr}
          onCancel={()=>setCompleting(null)} onSave={complete}/>
      )}
      {editing && (
        <MaintenanceScheduleDialog schedule={editing === 'new' ? null : editing}
            departments={departments} staff={staff} t={t} token={token} setToast={setToast}
          onDone={()=>{setEditing(null); refresh();}} onDeleted={()=>{setEditing(null); refresh();}}/>
      )}
      {historyFor && (
        <MaintenanceHistoryDialog schedule={historyFor} token={token} t={t} onClose={()=>setHistoryFor(null)}/>
      )}
    </div>
  );
}

// ── Record a check ──

  // Escape is left live while saving: there is nothing to lose here, the note
  // and the outcome are re-entered from the card rather than recovered.
  const panelRef = useDialog({onClose});

  async function save() {
    if (saving) return;
    setSaving(true);

      await onSave({schedule, outcome, note, doneOn, raiseIssue: outcome === 'fault' && raiseIssue});
    } finally { setSaving(false); }

  const typeLabel = schedule.equipment_type === 'phone' ? t.maintenancePhone : t.maintenancePrinter;

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onCancel()}>

          <button className="icon-btn" onClick={onCancel}>{Ic.x}</button>

        <div className="modal-body" style={{display:'grid',gap:14}}>

            <div style={{display:'flex',gap:8,marginTop:6}} role="group" aria-labelledby="maint-outcome-h">

          <div>

// ── Add or edit a device ──
function MaintenanceScheduleDialog({ schedule, departments, staff, t, token, setToast, onDone, onDeleted }) {
  const isNew = !schedule;
  const [name, setName] = useState(schedule?.device_name || '');
  const [type, setType] = useState(schedule?.equipment_type || 'printer');
  const [deptId, setDeptId] = useState(schedule?.department_id || (departments[0]?.id ?? ''));
  const [interval, setInterval] = useState(schedule?.interval_days ?? 30);
  const [custom, setCustom] = useState(
    schedule ? !MAINTENANCE_PRESETS.some(p => p.days === schedule.interval_days) : false);
  const [days, setDays] = useState(schedule?.interval_days ?? 30);
  // Retirement lives here rather than on the card: taking a device out of the
  // queue while keeping its history is a deliberate choice about one device, so
  // it belongs beside the other settings for that device. It has to be settable
  // both ways -- a device retired by mistake has to be recoverable.
  const [active, setActive] = useState(schedule ? schedule.active !== false : true);
  // ' means every technician. A string rather than a number so the empty case is
  // distinct from id 0, and so it maps straight onto the option's value.
  const [assignee, setAssignee] = useState(schedule && schedule.assignee_id ? String(schedule.assignee_id) : '');
  const [err, setErr] = useState('');
  const [saving, setSaving] = useState(false);

  const panelRef = useDialog({onClose: saving ? null : onDone});

  async function save() {
    if (saving) return;
    setSaving(true);
    setErr('');
    const body = {
      device_name: name,
      equipment_type: type,
      department_id: Number(deptId),
      interval_days: Number(custom ? days : interval),
      // Only meaningful on an edit: a new device is always active, and sending
      // it as retired would create something nobody can find.
      ...(isNew ? {} : {active}),
      assignee_id: assignee ? Number(assignee) : null,
    };
    try {
      if (isNew) {
        await apiFetch('/maintenance/schedules', {method:'POST', token, body});
      } else {
        await apiFetch(`/maintenance/schedules/${schedule.id}`, {method:'PATCH', token, body});
      }
      setToast(t.maintenanceScheduleSaved);
      onDone();
    } catch(ex) {
      // A validation failure comes back keyed by field; show the first message
      // rather than a bare "request failed", which tells the reader nothing.
      setErr(ex.message || 'Error');
    } finally { setSaving(false); }
  }

  // Printers and phones do not come round at the same rate, so picking the class
  // moves the cadence with it -- but only when the cadence is still one of the
  // presets. Overriding an interval the manager deliberately chose would be rude,
  // and a custom one cannot be guessed at in the other direction either.
  function pickType(next) {
    setType(next);
    if (custom) return;
    if (next === 'printer' && interval !== 30 && MAINTENANCE_PRESETS.some(p => p.days === interval)) {
      setInterval(30);
    }
    if (next === 'phone' && interval !== 90 && MAINTENANCE_PRESETS.some(p => p.days === interval)) {
      setInterval(90);
    }
  }

  async function remove() {
    // The count comes off the schedule row, so the prompt can say what deleting it
    // costs rather than quoting a number nobody kept.
    const count = schedule && schedule.check_count != null ? schedule.check_count : 0;
    if (!confirm(t.maintenanceDeleteConfirm.replace('{name}', schedule.device_name).replace('{count}', count))) return;
    setSaving(true);
    try {
      await apiFetch(`/maintenance/schedules/${schedule.id}`, {method:'DELETE', token});
      setToast(t.maintenanceScheduleDeleted);
      onDeleted();
    } catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onDone()}>
      <div className="modal" style={{maxWidth:460}} ref={panelRef} role="dialog" aria-modal="true"
        aria-label={isNew ? t.maintenanceAddDevice : t.maintenanceEditDevice}>
        <div className="modal-header">
          <div style={{fontSize:15,fontWeight:600}}>
            {isNew ? t.maintenanceAddDevice : t.maintenanceEditDevice}
          </div>
          <button className="icon-btn" onClick={onDone}>{Ic.x}</button>
        </div>
        <div className="modal-body" style={{gap:16}}>
          <div className="form-group">
            <label htmlFor="maint-name">{t.maintenanceDeviceName}</label>
            <input id="maint-name" className="form-control" maxLength={80} autoFocus
              value={name} onChange={e=>setName(e.target.value)} placeholder={t.maintenanceDeviceNameHint}/>
            <div className="maint-hint">{t.maintenanceDeviceNameHint}</div>
          </div>

          <div className="form-group">
            <div className="form-group-h" id="maint-equipment-h">{t.maintenanceEquipment}</div>
            <div className="maint-choices" role="group" aria-labelledby="maint-equipment-h">
              <button type="button" className={`maint-choice ${type==='printer' ? 'on' : ''}`}
                aria-pressed={type==='printer'}
                onClick={()=>pickType('printer')}>
                {Ic.printer} {t.maintenancePrinter}
              </button>
              <button type="button" className={`maint-choice ${type==='phone' ? 'on' : ''}`}
                aria-pressed={type==='phone'}
                onClick={()=>pickType('phone')}>
                {Ic.phone} {t.maintenancePhone}
              </button>
            </div>
          </div>

          <div className="form-group">
            <label htmlFor="maint-dept">{t.maintenanceDepartment}</label>
            <select id="maint-dept" className="form-control" value={deptId}
              onChange={e=>setDeptId(e.target.value)}>
              {(departments || []).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>

          {/* A select, not chips. Five presets plus a custom escape will not fill a
              row evenly however they wrap, and this sits directly under another
              select -- so the same control twice reads as deliberate rather than
              as a fallback for the one field that happened to run out of room. */}
          <div className="form-group">
            <label htmlFor="maint-interval">{t.maintenanceInterval}</label>
            <select id="maint-interval" className="form-control" value={custom ? 'custom' : String(interval)}
              onChange={e=>{
                if (e.target.value === 'custom') { setCustom(true); setDays(interval); }
                else { setCustom(false); setInterval(Number(e.target.value)); }
              }}>
              {MAINTENANCE_PRESETS.map(p => (
                <option key={p.key} value={p.days}>
                  {t['maintenanceInterval' + p.key.charAt(0).toUpperCase() + p.key.slice(1)]}
                </option>
              ))}
              <option value="custom">{t.maintenanceIntervalCustom}</option>
            </select>
            {custom && (
              <>
                {/* Its own name, not the interval label above: that label belongs to the
                    select, and one label cannot cover two controls. Same wording
                    as the option that revealed this field. */}
                <input id="maint-interval-days" type="number" className="form-control" min={7} max={730}
                  aria-label={t.maintenanceIntervalCustom}
                  value={days} onChange={e=>setDays(e.target.value)}/>
                <div className="maint-hint">
                  {t.maintenanceIntervalDays.replace('{days}', days || '—')}
                </div>
              </>
            )}
          </div>

          <div className="form-group">
            <label htmlFor="maint-assignee">{t.maintenanceAssignTo}</label>
            <select id="maint-assignee" className="form-control" value={assignee} onChange={e=>setAssignee(e.target.value)}>
              <option value="">{t.maintenanceAllTechnicians}</option>
              {(staff || []).map(u => (
                <option key={u.id} value={u.id}>{u.name}</option>
              ))}
            </select>
            <div className="maint-hint">{t.maintenanceAssignHint}</div>
          </div>

          {!isNew && (
            <label style={{display:'flex',gap:9,alignItems:'flex-start',fontSize:13,cursor:'pointer',
              borderTop:'1px solid var(--gray-200)',paddingTop:16}}>
              <input id="maint-active" type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)}
                style={{marginTop:2}}/>
              <span>
                <strong style={{fontWeight:500}}>{t.maintenanceInQueue}</strong>
                <div className="maint-hint" style={{marginTop:2}}>{t.maintenanceRetireHint}</div>
              </span>
            </label>
          )}

          {err && <div style={{fontSize:12.5,color:'var(--red)'}}>{err}</div>}
        </div>
        <div className="modal-footer">
          {!isNew && (
            <button className="btn btn-ghost" style={{marginRight:'auto',color:'var(--red)'}}
              onClick={remove} disabled={saving}>{t.maintenanceDelete}</button>
          )}
          <button className="btn btn-ghost" onClick={onDone} disabled={saving}>{t.cancel}</button>
          <button className="btn btn-primary" onClick={save}
            disabled={saving || !name.trim() || !deptId}>
            {/* Named for what it does rather than always "Save changes", which on an
                empty form reads as saving something. */}
            {saving ? '…' : isNew ? t.maintenanceAddDevice : t.saveChanges}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── One device's history ──
function MaintenanceHistoryDialog({ schedule, token, t, onClose }) {
  const [checks, setChecks] = useState(null);
  const [err, setErr] = useState('');

  useEffect(() => {
    let cancelled = false;
    apiFetch(`/maintenance/schedules/${schedule.id}/checks`, {token})
      .then(res => { if (!cancelled) setChecks(res.checks || []); })
      .catch(ex => { if (!cancelled) setErr(ex.message); });
    return () => { cancelled = true; };
  }, [schedule.id, token]);

  const typeLabel = schedule.equipment_type === 'phone' ? t.maintenancePhone : t.maintenancePrinter;

  const panelRef = useDialog({onClose});

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:520}} ref={panelRef} role="dialog" aria-modal="true"
        aria-label={t.maintenanceHistory}>
        <div className="modal-header">
          <div>
            <div style={{fontSize:15,fontWeight:600}}>{schedule.device_name}</div>
            <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:2}}>
              {typeLabel} · {schedule.department_name} · {t.maintenanceIntervalDays.replace('{days}', schedule.interval_days)}
            </div>
          </div>
          <button className="icon-btn" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {err ? <div style={{fontSize:12.5,color:'var(--red)'}}>{err}</div>
            : !checks ? <p style={{color:'var(--gray-400)',fontSize:13}}>{t.analyticsLoading}</p>
            : !checks.length ? <p style={{color:'var(--gray-400)',fontSize:13}}>{t.maintenanceNoHistory}</p>
            : (
              <div style={{display:'grid',gap:9}}>
                {checks.map(c => (
                  <div key={c.id} style={{display:'flex',gap:11,alignItems:'flex-start',paddingBottom:9,borderBottom:'1px solid var(--gray-200)'}}>
                    <span className={`badge ${c.outcome==='fault' ? 'badge-pending' : 'badge-ok'}`}
                      style={{flexShrink:0,minWidth:62,justifyContent:'center'}}>
                      {c.outcome==='fault' ? t.maintenanceFault : t.maintenanceAllFine}
                    </span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,color:'var(--gray-500)'}}>
                        {formatDateShort(c.done_on)} · {t.maintenanceBy.replace('{name}', c.done_by_name)}
                      </div>
                      {c.note && <div style={{fontSize:13,marginTop:2}}>{c.note}</div>}
                      {c.issue_label && (
                        <div style={{fontSize:11.5,color:'var(--blue)',marginTop:2}}>↳ {c.issue_label}</div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════ REPORTS PAGE ════════════════ */
function ReportsPage({ token, slaMinutes }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [date,    setDate]    = useState(localISODate(new Date()));
  const [error,   setError]   = useState('');
  const [downloading, setDownloading] = useState(false);
  // Re-asks for the same date. setDate(d => d) cannot do this: it sets the state
  // to the identical value, React bails out of the re-render, filterKey never
  // changes and the fetch effect never runs -- which left this button, and the
  // retry below it, doing nothing at all. A counter in the filter key is how
  // AlertsPage refreshes, and the point of it is that the path comes back
  // byte-identical, so the key is the only thing that can carry the request.
  const [epoch,   setEpoch]   = useState(0);

  /* The two issue tables page; everything else on this page does not.
     The summary tiles, the by-type and by-technician charts are aggregates over
     the whole day and the server computes them without regard to the limit, so
     the figures stay true while a busy day's rows are still being loaded. */
  const paged = usePagedList(limit => `/reports/daily?date=${date}&limit=${limit}`, token, {
    // The report is one object rather than an array of rows, so `rows` holds that
    // object and the two tables inside it are what page. An object is not an
    // array, so it arrives as-is rather than being coerced.
    rowsKey: 'report',
    filterKey: `${date}|${epoch}`,
    onError: ex => setError(ex.message),
  });
  const report = paged.res && paged.res.report;
  const loading = paged.loading && !report;
  // Clears the banner as well as re-asking: the point of pressing it after a
  // failure is to find out whether the failure is over, so a request that
  // succeeds must be allowed to take the error down with it.
  const reload = () => { setError(''); setEpoch(n => n + 1); };

  // The printable report is rendered server-side: the Go backend builds an
  // HTML+CSS document styled with this app's own palette and prints it with a
  // headless Chromium (see internal/report). Fetching it as a blob, rather
  // than linking straight to the URL, is what lets us send the Authorization
  // header the endpoint requires.
  async function downloadPDF() {
    if (!report || downloading) return;
    setDownloading(true);
    try {
      const res = await fetch(`${API}/reports/daily.pdf?date=${date}`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) {
        let msg = 'Could not generate the PDF';
        try {
          const body = await res.json();
          if (body.error) msg = typeof body.error === 'string' ? body.error : Object.values(body.error).join(', ');
        } catch {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `LIRA-Daily-Report-${report.date}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Release the object URL once the download has been handed to the browser.
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (ex) {
      setError('Error: ' + ex.message);
    } finally {
      setDownloading(false);
    }
  }

  const fpCount    = report ? (report.summary.false_positives || 0) : 0;
  const realCount  = report ? report.summary.total_issues - fpCount : 0;
  const fpRate     = report && report.summary.total_issues > 0 ? (fpCount / report.summary.total_issues * 100).toFixed(0) : '0';

  /* Theme tokens rather than hex literals, for the reason given above the
     Dashboard's own stat grid: written as literals these pinned the tiles to the
     light palette, so the dark theme left "Resolved" sitting at 3.90:1 against
     body ink's 14.36:1. */
  const summaryCards = report ? [
    {label:'Total issues',     value: report.summary.total_issues,  sub:'Apts + Departments',             color:'var(--blue)'},
    {label:'Resolved',         value: report.summary.resolved,      sub:`${report.summary.resolution_rate.toFixed(0)}% rate`, color:'var(--green)'},
    {label:'Pending',          value: report.summary.pending,       sub:'Still open',                     color:'var(--amber)'},
    {label:'Avg. time',        value: report.summary.avg_minutes.toFixed(1)+'m', sub:'Per issue',         color:'var(--teal)'},
    {label:'Total time spent', value: report.summary.total_minutes+'m', sub:'All issues combined',        color:'var(--blue)'},
    {label:'Fastest fix',      value: report.summary.fastest_minutes+'m', sub:'Quickest resolution',     color:'var(--green)'},
    {label:'Slowest fix',      value: report.summary.slowest_minutes+'m', sub:'Longest resolution',      color:'var(--amber)'},
    {label:'Apt. issues',      value: report.summary.apt_issues,    sub:'Apartment',                     color:'var(--blue)'},
    {label:'Dept. issues',     value: report.summary.dept_issues,   sub:'Department',                    color:'var(--teal)'},
    {label:'False positives',  value: fpCount,                      sub:'Nothing was wrong',              color:'var(--amber)'},
    {label:'False positive rate', value: fpRate+'%',                sub:'Of all issues',                  color:'var(--amber)'},
