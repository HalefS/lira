// ── Add or edit a device ──
function MaintenanceScheduleDialog({ schedule, departments, staff, t, token, setToast, onDone, onDeleted }) {
  const isNew = !schedule;
  const [name, setName] = useState(schedule?.device_name || '');
  const [type, setType] = useState(schedule?.equipment_type || 'printer');
  const [deptId, setDeptId] = useState(schedule?.department_id || (departments[0]?.id ?? ''));
  const [interval, setInterval] = useState(schedule?.interval_days ?? 30);
  const [custom, setCustom] = useState(
    schedule ? !MAINTENANCE_PRESETS.some(p => p.days === schedule.interval_days) : false);
  const [days, setDays] = useState(schedule?.interval_days ?? 30);
  // Retirement lives here rather than on the card: taking a device out of the
  // queue while keeping its history is a deliberate choice about one device, so
  // it belongs beside the other settings for that device. It has to be settable
  // both ways -- a device retired by mistake has to be recoverable.
  const [active, setActive] = useState(schedule ? schedule.active !== false : true);
  // ' means every technician. A string rather than a number so the empty case is
  // distinct from id 0, and so it maps straight onto the option's value.
  const [assignee, setAssignee] = useState(schedule && schedule.assignee_id ? String(schedule.assignee_id) : '');
  const [err, setErr] = useState('');
  const [saving, setSaving] = useState(false);

  const panelRef = useDialog({onClose: saving ? null : onDone});

  async function save() {
    if (saving) return;
    setSaving(true);
    setErr('');
    const body = {
      device_name: name,
      equipment_type: type,
      department_id: Number(deptId),
      interval_days: Number(custom ? days : interval),
      // Only meaningful on an edit: a new device is always active, and sending
      // it as retired would create something nobody can find.
      ...(isNew ? {} : {active}),
      assignee_id: assignee ? Number(assignee) : null,
    };
    try {
      if (isNew) {
        await apiFetch('/maintenance/schedules', {method:'POST', token, body});
      } else {
        await apiFetch(`/maintenance/schedules/${schedule.id}`, {method:'PATCH', token, body});
      }
      setToast(t.maintenanceScheduleSaved);
      onDone();
    } catch(ex) {
      // A validation failure comes back keyed by field; show the first message
      // rather than a bare "request failed", which tells the reader nothing.
      setErr(ex.message || 'Error');
    } finally { setSaving(false); }
  }

  // Printers and phones do not come round at the same rate, so picking the class
  // moves the cadence with it -- but only when the cadence is still one of the
  // presets. Overriding an interval the manager deliberately chose would be rude,
  // and a custom one cannot be guessed at in the other direction either.
  function pickType(next) {
    setType(next);
    if (custom) return;
    if (next === 'printer' && interval !== 30 && MAINTENANCE_PRESETS.some(p => p.days === interval)) {
      setInterval(30);
    }
    if (next === 'phone' && interval !== 90 && MAINTENANCE_PRESETS.some(p => p.days === interval)) {
      setInterval(90);
    }
  }

  async function remove() {
    // The count comes off the schedule row, so the prompt can say what deleting it
    // costs rather than quoting a number nobody kept.
    const count = schedule && schedule.check_count != null ? schedule.check_count : 0;
    if (!confirm(t.maintenanceDeleteConfirm.replace('{name}', schedule.device_name).replace('{count}', count))) return;
    setSaving(true);
    try {
      await apiFetch(`/maintenance/schedules/${schedule.id}`, {method:'DELETE', token});
      setToast(t.maintenanceScheduleDeleted);
      onDeleted();
    } catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onDone()}>
      <div className="modal" style={{maxWidth:460}} ref={panelRef} role="dialog" aria-modal="true"
        aria-label={isNew ? t.maintenanceAddDevice : t.maintenanceEditDevice}>
        <div className="modal-header">
          <div style={{fontSize:15,fontWeight:600}}>
            {isNew ? t.maintenanceAddDevice : t.maintenanceEditDevice}
          </div>
          <button className="icon-btn" onClick={onDone}>{Ic.x}</button>
        </div>
        <div className="modal-body" style={{gap:16}}>
          <div className="form-group">
            <label htmlFor="maint-name">{t.maintenanceDeviceName}</label>
            <input id="maint-name" className="form-control" maxLength={80} autoFocus
              value={name} onChange={e=>setName(e.target.value)} placeholder={t.maintenanceDeviceNameHint}/>
            <div className="maint-hint">{t.maintenanceDeviceNameHint}</div>
          </div>

          <div className="form-group">
            <div className="form-group-h" id="maint-equipment-h">{t.maintenanceEquipment}</div>
            <div className="maint-choices" role="group" aria-labelledby="maint-equipment-h">
              <button type="button" className={`maint-choice ${type==='printer' ? 'on' : ''}`}
                aria-pressed={type==='printer'}
                onClick={()=>pickType('printer')}>
                {Ic.printer} {t.maintenancePrinter}
              </button>
              <button type="button" className={`maint-choice ${type==='phone' ? 'on' : ''}`}
                aria-pressed={type==='phone'}
                onClick={()=>pickType('phone')}>
                {Ic.phone} {t.maintenancePhone}
              </button>
            </div>
          </div>

          <div className="form-group">
            <label htmlFor="maint-dept">{t.maintenanceDepartment}</label>
            <select id="maint-dept" className="form-control" value={deptId}
              onChange={e=>setDeptId(e.target.value)}>
              {(departments || []).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>

          {/* A select, not chips. Five presets plus a custom escape will not fill a
              row evenly however they wrap, and this sits directly under another
              select -- so the same control twice reads as deliberate rather than
              as a fallback for the one field that happened to run out of room. */}
          <div className="form-group">
            <label htmlFor="maint-interval">{t.maintenanceInterval}</label>
            <select id="maint-interval" className="form-control" value={custom ? 'custom' : String(interval)}
              onChange={e=>{
                if (e.target.value === 'custom') { setCustom(true); setDays(interval); }
                else { setCustom(false); setInterval(Number(e.target.value)); }
              }}>
              {MAINTENANCE_PRESETS.map(p => (
                <option key={p.key} value={p.days}>
                  {t['maintenanceInterval' + p.key.charAt(0).toUpperCase() + p.key.slice(1)]}
                </option>
              ))}
              <option value="custom">{t.maintenanceIntervalCustom}</option>
            </select>
            {custom && (
              <>
                {/* Its own name, not the interval label above: that label belongs to the
                    select, and one label cannot cover two controls. Same wording
                    as the option that revealed this field. */}
                <input id="maint-interval-days" type="number" className="form-control" min={7} max={730}
                  aria-label={t.maintenanceIntervalCustom}
                  value={days} onChange={e=>setDays(e.target.value)}/>
                <div className="maint-hint">
                  {t.maintenanceIntervalDays.replace('{days}', days || '—')}
                </div>
              </>
            )}
          </div>

          <div className="form-group">
            <label htmlFor="maint-assignee">{t.maintenanceAssignTo}</label>
            <select id="maint-assignee" className="form-control" value={assignee} onChange={e=>setAssignee(e.target.value)}>
              <option value="">{t.maintenanceAllTechnicians}</option>
              {(staff || []).map(u => (
                <option key={u.id} value={u.id}>{u.name}</option>
              ))}
            </select>
            <div className="maint-hint">{t.maintenanceAssignHint}</div>
          </div>

          {!isNew && (
            <label style={{display:'flex',gap:9,alignItems:'flex-start',fontSize:13,cursor:'pointer',
              borderTop:'1px solid var(--gray-200)',paddingTop:16}}>
              <input id="maint-active" type="checkbox" checked={active} onChange={e=>setActive(e.target.checked)}
                style={{marginTop:2}}/>
              <span>
                <strong style={{fontWeight:500}}>{t.maintenanceInQueue}</strong>
                <div className="maint-hint" style={{marginTop:2}}>{t.maintenanceRetireHint}</div>
              </span>
            </label>
          )}

          {err && <div style={{fontSize:12.5,color:'var(--red)'}}>{err}</div>}
        </div>
        <div className="modal-footer">
          {!isNew && (
            <button className="btn btn-ghost" style={{marginRight:'auto',color:'var(--red)'}}
              onClick={remove} disabled={saving}>{t.maintenanceDelete}</button>
          )}
          <button className="btn btn-ghost" onClick={onDone} disabled={saving}>{t.cancel}</button>
          <button className="btn btn-primary" onClick={save}
            disabled={saving || !name.trim() || !deptId}>
            {/* Named for what it does rather than always "Save changes", which on an
                empty form reads as saving something. */}
            {saving ? '…' : isNew ? t.maintenanceAddDevice : t.saveChanges}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── One device's history ──
function MaintenanceHistoryDialog({ schedule, token, t, onClose }) {
  const [checks, setChecks] = useState(null);
  const [err, setErr] = useState('');

  useEffect(() => {
    let cancelled = false;
    apiFetch(`/maintenance/schedules/${schedule.id}/checks`, {token})
      .then(res => { if (!cancelled) setChecks(res.checks || []); })
      .catch(ex => { if (!cancelled) setErr(ex.message); });
    return () => { cancelled = true; };
  }, [schedule.id, token]);

  const typeLabel = schedule.equipment_type === 'phone' ? t.maintenancePhone : t.maintenancePrinter;

  const panelRef = useDialog({onClose});

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:520}} ref={panelRef} role="dialog" aria-modal="true"
        aria-label={t.maintenanceHistory}>
        <div className="modal-header">
          <div>
            <div style={{fontSize:15,fontWeight:600}}>{schedule.device_name}</div>
            <div style={{fontSize:12.5,color:'var(--gray-400)',marginTop:2}}>
              {typeLabel} · {schedule.department_name} · {t.maintenanceIntervalDays.replace('{days}', schedule.interval_days)}
            </div>
          </div>
          <button className="icon-btn" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          {err ? <div style={{fontSize:12.5,color:'var(--red)'}}>{err}</div>
            : !checks ? <p style={{color:'var(--gray-400)',fontSize:13}}>{t.analyticsLoading}</p>
            : !checks.length ? <p style={{color:'var(--gray-400)',fontSize:13}}>{t.maintenanceNoHistory}</p>
            : (
              <div style={{display:'grid',gap:9}}>
                {checks.map(c => (
                  <div key={c.id} style={{display:'flex',gap:11,alignItems:'flex-start',paddingBottom:9,borderBottom:'1px solid var(--gray-200)'}}>
                    <span className={`badge ${c.outcome==='fault' ? 'badge-pending' : 'badge-ok'}`}
                      style={{flexShrink:0,minWidth:62,justifyContent:'center'}}>
                      {c.outcome==='fault' ? t.maintenanceFault : t.maintenanceAllFine}
                    </span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,color:'var(--gray-500)'}}>
                        {formatDateShort(c.done_on)} · {t.maintenanceBy.replace('{name}', c.done_by_name)}
                      </div>
                      {c.note && <div style={{fontSize:13,marginTop:2}}>{c.note}</div>}
                      {c.issue_label && (
                        <div style={{fontSize:11.5,color:'var(--blue)',marginTop:2}}>↳ {c.issue_label}</div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>{t.cancel}</button>
        </div>
      </div>
    </div>
  );
}

/* ════════════════ REPORTS PAGE ════════════════ */
function ReportsPage({ token, slaMinutes }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [date,    setDate]    = useState(localISODate(new Date()));
  const [error,   setError]   = useState('');
  const [downloading, setDownloading] = useState(false);
  // Re-asks for the same date. setDate(d => d) cannot do this: it sets the state
  // to the identical value, React bails out of the re-render, filterKey never
  // changes and the fetch effect never runs -- which left this button, and the
  // retry below it, doing nothing at all. A counter in the filter key is how
  // AlertsPage refreshes, and the point of it is that the path comes back
  // byte-identical, so the key is the only thing that can carry the request.
  const [epoch,   setEpoch]   = useState(0);

  /* The two issue tables page; everything else on this page does not.
     The summary tiles, the by-type and by-technician charts are aggregates over
     the whole day and the server computes them without regard to the limit, so
     the figures stay true while a busy day's rows are still being loaded. */
  const paged = usePagedList(limit => `/reports/daily?date=${date}&limit=${limit}`, token, {
    // The report is one object rather than an array of rows, so `rows` holds that
    // object and the two tables inside it are what page. An object is not an
    // array, so it arrives as-is rather than being coerced.
    rowsKey: 'report',
    filterKey: `${date}|${epoch}`,
    onError: ex => setError(ex.message),
  });
  const report = paged.res && paged.res.report;
  const loading = paged.loading && !report;
  // Clears the banner as well as re-asking: the point of pressing it after a
  // failure is to find out whether the failure is over, so a request that
  // succeeds must be allowed to take the error down with it.
  const reload = () => { setError(''); setEpoch(n => n + 1); };

  // The printable report is rendered server-side: the Go backend builds an
  // HTML+CSS document styled with this app's own palette and prints it with a
  // headless Chromium (see internal/report). Fetching it as a blob, rather
  // than linking straight to the URL, is what lets us send the Authorization
  // header the endpoint requires.
  async function downloadPDF() {
    if (!report || downloading) return;
    setDownloading(true);
    try {
      const res = await fetch(`${API}/reports/daily.pdf?date=${date}`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) {
        let msg = 'Could not generate the PDF';
        try {
          const body = await res.json();
          if (body.error) msg = typeof body.error === 'string' ? body.error : Object.values(body.error).join(', ');
        } catch {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `LIRA-Daily-Report-${report.date}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Release the object URL once the download has been handed to the browser.
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (ex) {
      setError('Error: ' + ex.message);
    } finally {
      setDownloading(false);
    }
  }

  const fpCount    = report ? (report.summary.false_positives || 0) : 0;
  const realCount  = report ? report.summary.total_issues - fpCount : 0;
  const fpRate     = report && report.summary.total_issues > 0 ? (fpCount / report.summary.total_issues * 100).toFixed(0) : '0';

  const summaryCards = report ? [
    {label:'Total issues',     value: report.summary.total_issues,  sub:'Apts + Departments',             color:'#1769AA'},
    {label:'Resolved',         value: report.summary.resolved,      sub:`${report.summary.resolution_rate.toFixed(0)}% rate`, color:'#2E8B57'},
    {label:'Pending',          value: report.summary.pending,       sub:'Still open',                     color:'#D88A18'},
    {label:'Avg. time',        value: report.summary.avg_minutes.toFixed(1)+'m', sub:'Per issue',         color:'#1D9E75'},
    {label:'Total time spent', value: report.summary.total_minutes+'m', sub:'All issues combined',        color:'#1769AA'},
    {label:'Fastest fix',      value: report.summary.fastest_minutes+'m', sub:'Quickest resolution',     color:'#2E8B57'},
    {label:'Slowest fix',      value: report.summary.slowest_minutes+'m', sub:'Longest resolution',      color:'#D88A18'},
    {label:'Apt. issues',      value: report.summary.apt_issues,    sub:'Apartment',                     color:'#1769AA'},
    {label:'Dept. issues',     value: report.summary.dept_issues,   sub:'Department',                    color:'#1D9E75'},
    {label:'False positives',  value: fpCount,                      sub:'Nothing was wrong',              color:'#D88A18'},
    {label:'False positive rate', value: fpRate+'%',                sub:'Of all issues',                  color:'#D88A18'},
    {label:'Real issues',      value: realCount,                    sub:'Something was wrong',            color:'#2E8B57'},
  ] : [];

  const maxType = report ? Math.max(...Object.values(report.by_type), 1) : 1;
  const maxTech = report ? Math.max(...(report.by_technician||[]).map(t=>t.count), 1) : 1;

  return (
    <div>
      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid var(--gray-200)',borderRadius:'var(--radius-md)',padding:'6px 12px'}}>
          {Ic.calendar}
          <input
            type="date" value={date} onChange={e=>setDate(e.target.value)}
            aria-label={t.historyPickDate}
            style={{border:'none',outline:'none',fontSize:13,fontFamily:'DM Sans,sans-serif',color:'var(--gray-900)',background:'transparent'}}
          />
        </div>
        <button className="btn btn-ghost" onClick={reload} disabled={loading}>
          {loading ? '…' : 'Refresh'}
        </button>
        <button className="btn btn-primary" onClick={downloadPDF} disabled={!report || loading || downloading}
          style={{marginLeft:'auto'}}>
          {Ic.download} {downloading ? 'Generating…' : 'Download PDF'}
        </button>
      </div>

      {error && (
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,marginBottom:16}}>
          {error}
        </div>
      )}

      {loading && (
        <div style={{textAlign:'center',padding:'60px 0',color:'var(--gray-400)',fontSize:14}}>
          Loading report…
        </div>
      )}

      {report && !loading && (
        <>
          {/* Summary cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:22}}>
            {summaryCards.map(c=>(
              <div className="stat-card" key={c.label}>
                <div className="stat-label">{c.label}</div>
                <div className="stat-value" style={{color:c.color}}>{c.value}</div>
                <div className="stat-sub"><span className="stat-dot" style={{background:c.color}}></span>{c.sub}</div>
              </div>
            ))}
          </div>

          {/* Breakdowns */}
          <div className="bottom-grid" style={{marginBottom:22}}>
            <div className="mini-card">
              <div className="mini-card-title">Issues by type</div>
              {Object.keys(report.by_type).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No issues logged.</p>
                : Object.entries(report.by_type).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
                    <div className="bar-row" key={type}>
                      <div className="bar-label">
                        <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                        {type}
                      </div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
                      <div className="bar-count">{count}</div>
                    </div>
                  ))
              }
            </div>
            <div className="mini-card">
              <div className="mini-card-title">By technician</div>
              {(report.by_technician||[]).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No technicians.</p>
                : report.by_technician.map(ts=>(
                    <div className="bar-row" key={ts.user_id}>
                      <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxTech)*100}%`,background:'#1769AA'}}></div></div>
                      <div className="bar-count">{ts.count}</div>
                    </div>
                  ))
              }
            </div>
          </div>

          {/* Apt issues table */}
          {(report.apt_issues||[]).length > 0 && (
            <div className="table-card" style={{marginBottom:20}}>
              <div className="table-header">
                <span className="table-title">Apartment issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.apt_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Apt.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.apt_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td><IssueTime minutes={i.time_minutes} sla={slaMinutes} t={t}/></td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Dept issues table */}
          {(report.dept_issues||[]).length > 0 && (
            <div className="table-card">
              <div className="table-header">
                <span className="table-title">Department issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.dept_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Dept.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.dept_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td><IssueTime minutes={i.time_minutes} sla={slaMinutes} t={t}/></td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Both tables came from one request and page together, so there is one
              footer for the pair. Neither table's own count is the count of rows
              the server sent -- each is capped at the same limit independently --
              so the pair is added up from the per-mode totals in the summary,
              which describe the whole day. */}
          <LoadMore list={paged} t={t}
            shown={Math.min(paged.limit, report.summary.apt_issues||0) + Math.min(paged.limit, report.summary.dept_issues||0)}
            total={(report.summary.apt_issues||0) + (report.summary.dept_issues||0)}/>

          {report.summary.total_issues === 0 && (
            <div className="table-card">
              <div className="empty-state">
                {Ic.report}
                <p>No issues logged on {report.date}.</p>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ════════════════ PROFILE PAGE ════════════════ */
function ProfilePage({ currentUser, token, onSessionUpdate, setToast, lang, onLangChange, slaMinutes }) {
  const t = T[lang];
  const [myStats,  setMyStats]  = useState(null);
  const [myIssues, setMyIssues] = useState([]);
  const [section,  setSection]  = useState('identity');
  const [saving,   setSaving]   = useState(false);

  // identity form
  const [name,     setName]     = useState(currentUser.name);
  const [email,    setEmail]    = useState(currentUser.email);
  const [pw,       setPw]       = useState('');
  const [pwConf,   setPwConf]   = useState('');
  const [pwErr,    setPwErr]    = useState('');
  const [idErr,    setIdErr]    = useState('');

  // avatar
  const [avatarData, setAvatarData] = useState(currentUser.avatar_data || '');
  const fileRef = useRef();

  useEffect(() => {
    Promise.all([
      apiFetch('/profile/stats',  {token}),
      apiFetch('/profile/issues?limit=10', {token}),
    ]).then(([sRes, iRes]) => {
      setMyStats(sRes.stats);
      setMyIssues((iRes.issues || []).map(mapIssue));
    }).catch(() => {});
  }, [token]);

  async function saveIdentity() {
    setIdErr(''); setSaving(true);
    if (pw && pw !== pwConf) { setPwErr('Passwords do not match.'); setSaving(false); return; }
    try {
      const body = { name, email };
      if (pw) body.password = pw;
      const res = await apiFetch('/profile', {method:'PATCH', body, token});
      onSessionUpdate(res.user);
      setPw(''); setPwConf(''); setPwErr('');
      setToast('Profile updated');
    } catch(ex) { setIdErr(ex.message); }
    finally { setSaving(false); }
  }

  async function saveAvatar(data) {
    try {
      const res = await apiFetch('/profile', {method:'PATCH', body:{avatar_data: data}, token});
      setAvatarData(data);
      onSessionUpdate(res.user);
      setToast('Avatar updated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      // Resize using canvas
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 160;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width  - min) / 2;
        const sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        saveAvatar(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function saveLang(l) {
    onLangChange(l);
    try {
      await apiFetch('/profile', {method:'PATCH', body:{language: l}, token});
    } catch(ex) {}
  }

  const sections = [
    {id:'identity',    label:'Identity'},
    {id:'avatar',      label:'Avatar'},
    {id:'preferences', label:'Preferences'},
    {id:'activity',    label:'My Activity'},
  ];

  const statCards = myStats ? [
    {label:'Total issues',  value: myStats.total_issues, color:'#1769AA'},
    {label:'Resolved',      value: myStats.resolved,     color:'#2E8B57'},
    {label:'This week',     value: myStats.this_week,    color:'#D88A18'},
    {label:'Avg. time',     value: myStats.avg_minutes.toFixed(1)+'m', color:'#1D9E75'},
  ] : [];

  return (
    <div style={{maxWidth:720,margin:'0 auto'}}>

      {/* Profile header */}
      <div className="mini-card" style={{display:'flex',alignItems:'center',gap:20,marginBottom:20,padding:'20px 24px'}}>
        <div style={{position:'relative',flexShrink:0}}>
          <Avatar name={currentUser.name} idx={currentUser.avatar_idx} size="lg"
            src={avatarData || currentUser.avatar_data}
            style={{width:64,height:64,fontSize:22,border:'2px solid var(--gray-200)'}}/>
          <button onClick={()=>fileRef.current.click()}
            style={{position:'absolute',bottom:0,right:0,width:22,height:22,borderRadius:'50%',
              background:'var(--blue)',border:'2px solid #fff',cursor:'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="white" strokeWidth="2"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>
          </button>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFileChange}/>
        </div>
        <div>
          <div style={{fontSize:18,fontWeight:600}}>{currentUser.name}</div>
          <div style={{fontSize:13,color:'var(--gray-400)',marginTop:2,display:'flex',alignItems:'center',gap:6}}>
            {currentUser.role==='manager' ? Ic.shield : Ic.tool}
            {currentUser.role==='manager' ? t.managerRole : t.techRole}
          </div>
          <div style={{fontSize:12,color:'var(--gray-400)',marginTop:2}}>{currentUser.email}</div>
        </div>
      </div>

      {/* Sub-nav */}
      <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid var(--gray-200)',paddingBottom:0}}>
        {sections.map(s=>(
          <button key={s.id} onClick={()=>setSection(s.id)}
            style={{padding:'8px 14px',border:'none',background:'none',cursor:'pointer',
              fontSize:13,fontWeight:500,fontFamily:'DM Sans,sans-serif',
              color: section===s.id ? 'var(--blue)' : 'var(--gray-600)',
              borderBottom: section===s.id ? '2px solid var(--blue)' : '2px solid transparent',
              marginBottom:-1}}>
            {s.label}
          </button>
        ))}
      </div>

      {/* ── Identity ── */}
      {section==='identity' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Personal information</div>
          {idErr && <div className="auth-error" style={{marginBottom:14}}>{idErr}</div>}
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="form-row">
              <div className="form-group">
                <label htmlFor="profile-name">Full name</label>
                <input id="profile-name" className="form-control" value={name} onChange={e=>setName(e.target.value)}/>
              </div>
              <div className="form-group">
                <label htmlFor="profile-email">Email address</label>
                <input id="profile-email" className="form-control" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
              </div>
            </div>
            <div style={{borderTop:'1px solid var(--gray-200)',paddingTop:14}}>
              <div style={{fontSize:13,fontWeight:600,color:'var(--gray-600)',marginBottom:12}}>Change password</div>
              {pwErr && <div style={{color:'var(--red)',fontSize:12,marginBottom:8}}>{pwErr}</div>}
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="profile-pw">New password</label>
                  <input id="profile-pw" className="form-control" type="password" placeholder="Min. 6 characters" value={pw} onChange={e=>{setPw(e.target.value);setPwErr('');}}/>
                </div>
                <div className="form-group">
                  <label htmlFor="profile-pw-confirm">Confirm password</label>
                  <input id="profile-pw-confirm" className="form-control" type="password" placeholder="Repeat new password" value={pwConf} onChange={e=>{setPwConf(e.target.value);setPwErr('');}}/>
                </div>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'flex-end'}}>
              <button className="btn btn-primary" onClick={saveIdentity} disabled={saving}>
                {Ic.check} {saving ? 'Saving…' : 'Save changes'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Avatar ── */}
      {section==='avatar' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Profile picture</div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20,padding:'20px 0'}}>
            {avatarData
              ? <img src={avatarData} style={{width:120,height:120,borderRadius:'50%',objectFit:'cover',border:'3px solid var(--gray-200)'}}/>
              : <div style={{width:120,height:120,borderRadius:'50%',background:'var(--blue-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,fontWeight:600,color:'var(--blue)'}}>
                  {initials(currentUser.name)}
                </div>
            }
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-primary" onClick={()=>fileRef.current.click()}>
                {Ic.upload} Upload photo
              </button>
              {avatarData && (
                <button className="btn btn-ghost" onClick={()=>saveAvatar('')}>
                  Remove photo
                </button>
              )}
            </div>
            <div style={{fontSize:12,color:'var(--gray-400)',textAlign:'center'}}>
              JPG, PNG or GIF. Max 2MB. Will be cropped to a square.
            </div>
          </div>
        </div>
      )}

      {/* ── Preferences ── */}
      {section==='preferences' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Preferences</div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid var(--gray-200)'}}>
            <div>
              <div style={{fontSize:14,fontWeight:500}}>Language</div>
              <div style={{fontSize:12,color:'var(--gray-400)',marginTop:2}}>Choose your preferred display language</div>
            </div>
            <LangToggle lang={lang} onChange={saveLang}/>
          </div>
        </div>
      )}

      {/* ── Activity ── */}
      {section==='activity' && (
        <div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
            {statCards.map(c=>(
              <div className="stat-card" key={c.label}>
                <div className="stat-label">{c.label}</div>
                <div className="stat-value" style={{color:c.color}}>{c.value}</div>
              </div>
            ))}
          </div>
          <div className="table-card">
            <div className="table-header">
              <span className="table-title">Recent issues</span>
            </div>
            {myIssues.length === 0
              ? <div className="empty-state">{Ic.list}<p>No issues logged yet.</p></div>
              : <table>
                  <thead>
                    <tr>
                      <th>{currentUser.role==='apt' ? 'Apt.' : 'Location'}</th>
                      <th>Type</th><th>Problem</th><th>Status</th><th>Time</th><th>Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    {myIssues.map(i=>(
                      <tr key={i.id}>
                        <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.apt||i.dept}</strong></td>
                        <td><TypeBadge type={i.type}/></td>
                        <td style={{maxWidth:160,fontSize:13}}>{i.problem}</td>
                        <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                        <td><IssueTime minutes={i.time} sla={slaMinutes} t={t}/></td>
                        <td style={{fontSize:12,color:'var(--gray-400)'}}>{i.createdAt}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>
      )}

    </div>
  );
}

function sysTone(value, warn, bad) {          // lower is better (usage %, latency ms)
  if (value == null) return 'gray';
  if (value >= bad) return 'red';
  if (value >= warn) return 'amber';
  return 'green';
}

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
}

function formatUptime(totalSeconds, t) {
  const d = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

// One of the four headline cards: an icon, a big value, and a usage gauge underneath.
function SysCard({ icon, label, tone, value, unit, gauge, sub, na }) {
  // The gauge refills every 60s as fresh readings arrive, so it is keyed on the
  // reading rather than on mount: each new value is worth watching move.
  const root = useAnimate((g, el, opts) => {
    MOTION.grow(g, el.querySelectorAll('.sys-gauge-fill'), 'x', 0, 1);
  }, [gauge]);
  return (
    <div className="sys-card" ref={root}>
      <div className="sys-card-head">
        <span className="sys-card-label">{label}</span>
        <span className={`sys-icon tone-${tone}`}>{icon}</span>
      </div>
      <div className={`sys-value tone-${tone}`}>{value}{unit && <span className="sys-unit">{unit}</span>}</div>
      {gauge != null && (
        <div className="sys-gauge-track"><div className={`sys-gauge-fill tone-${tone}`} style={{width:`${Math.min(gauge,100)}%`}}/></div>
      )}
      {na ? <div className="sys-na">{na}</div> : sub && <div className="sys-sub">{sub}</div>}
    </div>
  );
}

// Server health: CPU, RAM, and round-trip latency to the server and the database.
// Refetches on a fixed 60s clock (see REFRESH_MS) for as long as this page stays open.
const SYS_REFRESH_MS = 60000;

function SystemStatusPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [data, setData] = useState(null);
  const [serverLatency, setServerLatency] = useState(null);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);
  const [secondsAgo, setSecondsAgo] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const lastFetchedAt = useRef(null);

  // manual: true for the on-demand button, so it can show its own spinner
  // without disturbing the (much less frequent) full-page loading state.
  const load = useCallback(async (manual) => {
    if (manual) setRefreshing(true);
    const start = performance.now();
    try {
      const res = await apiFetch('/system/status', { token });
      setServerLatency(Math.round(performance.now() - start));
      setData(res.system);
      setErr('');
    } catch (ex) {
      setErr(ex.message);
    } finally {
      lastFetchedAt.current = Date.now();
      setSecondsAgo(0);
      setLoading(false);
      if (manual) setRefreshing(false);
    }
  }, [token]);

  useEffect(() => {
    load(false);
    // The interval keeps its own fixed 60s cadence regardless of manual refreshes —
    // clicking "refresh now" gets you fresh data immediately without resetting the clock.
    const refresh = setInterval(load, SYS_REFRESH_MS);
    const tick = setInterval(() => {
      if (lastFetchedAt.current) setSecondsAgo(Math.round((Date.now() - lastFetchedAt.current) / 1000));
    }, 1000);
    return () => { clearInterval(refresh); clearInterval(tick); };
  }, [load]);

  if (loading) return <div className="empty-state">{Ic.server}<p>{t.sysRefreshing}</p></div>;

  const stale = !!err;
  const cpu = data?.cpu;
  const mem = data?.memory;
  const db = data?.database;
  const cpuTone = cpu?.available ? sysTone(cpu.percent, 60, 85) : 'gray';
  const memTone = mem?.system_wide ? sysTone(mem.percent, 70, 90) : 'gray';
  const srvTone = sysTone(serverLatency, 100, 300);
  const dbTone = db ? (db.reachable ? sysTone(db.latency_ms, 100, 300) : 'red') : 'gray';

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18, flexWrap:'wrap', gap:10}}>
        <p style={{fontSize:13, color:'var(--gray-400)', margin:0}}>{t.systemStatusSub}</p>
        <div className="sys-live">
          <span className={`sys-live-dot ${stale ? 'stale' : ''}`}/>
          {stale ? t.sysStale : (secondsAgo < 2 ? t.sysUpdatedJustNow : t.sysUpdatedAgo.replace('{n}', secondsAgo))}
          <span style={{opacity:0.6}}>· {t.sysAutoRefresh}</span>
          <button type="button" className={`sys-refresh-btn ${refreshing ? 'spinning' : ''}`}
            onClick={()=>load(true)} disabled={refreshing} title={t.sysRefreshNow} aria-label={t.sysRefreshNow}>
            {Ic.refresh}
          </button>
        </div>
      </div>

      <div className="sys-grid">
        <SysCard icon={Ic.cpu} label={t.cpuUsage} tone={cpuTone}
          value={cpu?.available ? cpu.percent : '—'} unit={cpu?.available ? '%' : ''}
          gauge={cpu?.available ? cpu.percent : null}
          sub={cpu?.available ? `${cpu.cores} ${t.sysCores}` : null}
          na={!cpu?.available ? t.sysCpuUnavailable.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.server} label={t.ramUsage} tone={memTone}
          value={mem?.system_wide ? mem.percent : formatBytes(mem?.used_bytes)}
          unit={mem?.system_wide ? '%' : ''}
          gauge={mem?.system_wide ? mem.percent : null}
          sub={mem?.system_wide ? `${formatBytes(mem.used_bytes)} / ${formatBytes(mem.total_bytes)}` : null}
          na={!mem?.system_wide ? t.sysProcessOnly.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.activity} label={t.latencyServer} tone={srvTone}
          value={serverLatency ?? '—'} unit="ms"
          sub="Round trip from your browser"/>

        <SysCard icon={Ic.database} label={t.latencyDatabase} tone={dbTone}
          value={db?.reachable ? db.latency_ms : (db ? '—' : '—')} unit={db?.reachable ? 'ms' : ''}
          sub={db && !db.reachable ? null : (db ? t.dbConnectionsSub.replace('{inUse}',db.in_use).replace('{idle}',db.idle).replace('{max}',db.max_open_connections) : null)}
          na={db && !db.reachable ? t.dbUnreachable : null}/>
      </div>

      <div className="mini-card">
        <div className="mini-card-title">{t.systemStatus}</div>
        <div className="sys-detail-grid">
          <div className="sys-detail-item"><div className="sys-detail-label">{t.uptime}</div><div className="sys-detail-value">{data ? formatUptime(data.uptime_seconds, t) : '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goroutines}</div><div className="sys-detail-value">{data?.goroutines ?? '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.serverOs}</div><div className="sys-detail-value" style={{textTransform:'capitalize'}}>{data?.os || '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goVersion}</div><div className="sys-detail-value">{data?.go_version || '—'}</div></div>
        </div>
      </div>
    </div>
  );
}

/* ── collapsed catalog lists ──
   Issue types, departments, Connecta agents and consumables are reference lists:
   most visits are about the one at the top, and the tail is scrolled past. So each
   shows its first few rows and opens on request.

   One constant and one button for all four, deliberately. Four copies of the same
   threshold and the same markup is how three of them end up at five and one at
   six, and a page where one list in a column behaves differently from the one above
   it reads as a bug rather than as a choice.

   Five rows, not five <tr>s. A consumable whose icon is being edited renders a
   second row underneath it, and counting rows would make that item look like two
   and hide a sixth item's worth of nothing.

   The count in each card's header is the real total and is left alone, so the
   length of the list is never a surprise -- only its tail is deferred. */
const ADMIN_PREVIEW_ROWS = 5;

/* Rooms get their own preview length, twice the other catalogs' five.

   A room run is much shorter than a catalog entry -- "1401-1412", a handful of
   characters -- so a list of five of them is a couple of lines of screen. Rooms
   are also added in floors, which means the list grows in visible steps and a
   manager checking whether a floor went in wants to see it without a click. Ten
   is still short enough that the load-more button stays meaningful on a hotel
   with many floors, which is the case it exists for. */
const ROOMS_PREVIEW_ROWS = 10;

// Rendered only while something is actually hidden, so a short list carries no
// button and no ruled footer. The number in brackets is what the click buys, which
// is the part that makes it safe to press without opening a dialog to find out.
function AdminShowMore({ hidden, label, onClick }) {
  if (!hidden) return null;
  return (
    <div className="table-footer">
      <button type="button" className="btn btn-ghost" onClick={onClick}>
        {label} ({hidden})
      </button>
    </div>
  );
}

/* The settings page. Named for what it is called in the nav rather than for what
   it grew out of: it holds the catalogs the rest of the app is configured from --
   issue types, departments, Connecta agents, consumable items -- plus the settings
   themselves. The per-section translation keys kept their `admin` prefix, because
   renaming thirty strings nobody sees buys nothing and risks a typo in one of
   them. */
/* Reads what has been typed into the room field and works out how many rooms it
   would add, so the size of a range is visible before it is saved rather than
   after. A range typed carelessly across a floor boundary expands to every number
   in between, and "1399-1402" quietly becoming rooms nobody has is the one way
   this feature can do real damage.

   The rules here mirror data.ParseRoomRun, and the server is the authority: this
   only decides what the preview says, and anything it gets wrong is caught when
   the save is refused. Kept deliberately small rather than sharing code with the
   server, because the alternative is a round trip per keystroke for a preview.
*/
function previewRoomRun(text) {
  const normalised = String(text || '')
    .trim()
    .replace(/[–—]/g, '-')   // en and em dash
    .replace(/\.\./g, '-')    // "1201..1212"
    .replace(/\bto\b/gi, '-');
  const parts = normalised.split('-');
  const num = part => {
    const p = part.trim();
    return /^[0-9]{1,6}$/.test(p) ? parseInt(p, 10) : null;
  };

  if (parts.length === 1) {
    const n = num(parts[0]);
    return n && n > 0 ? { from: n, to: n, count: 1 } : null;
  }
  if (parts.length !== 2) return null;

  const a = num(parts[0]), b = num(parts[1]);
  if (a === null || b === null || a < 1 || b < 1) return null;

  const from = Math.min(a, b), to = Math.max(a, b);
  return { from, to, count: to - from + 1 };
}

function SettingsPage({ token, issueTypes, onTypesUpdate, departments, onDepartmentsUpdate, connectaAgents, onConnectaAgentsUpdate, consumableItems, onConsumableItemsUpdate, settings, onSettingsUpdate, setToast }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [name, setName] = useState('');
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  // Whether each catalog list has been opened past its first rows. One flag per
  // list rather than one shared flag, because they are separate columns and
  // opening one has no business revealing another. They only ever go from false
  // to true while the page is mounted, so a rename in progress or an icon editor
  // left open cannot be collapsed out from under itself by a re-render.
  const [typesAll,  setTypesAll]  = useState(false);
  const [deptsAll,  setDeptsAll]  = useState(false);
  const [agentsAll, setAgentsAll] = useState(false);
  const [ciAll,     setCiAll]     = useState(false);

  const [deptName, setDeptName] = useState('');
  // Which department row is open for renaming, and what has been typed into it.
  const [editingDeptId, setEditingDeptId] = useState(null);
  const [deptDraft, setDeptDraft]     = useState('');
  const [savingDept, setSavingDept] = useState(false);
  const [deptErr, setDeptErr] = useState('');

  const [agentName, setAgentName] = useState('');
  const [savingAgent, setSavingAgent] = useState(false);
  const [agentErr, setAgentErr] = useState('');

  const [ciName, setCiName] = useState('');
  const [ciIcon, setCiIcon] = useState('box');
  const [savingCi, setSavingCi] = useState(false);
  const [ciErr, setCiErr] = useState('');
  const [editingIconId, setEditingIconId] = useState(null);

  // The room inventory. Held here rather than lifted into the app, because the
  // only other thing that needs rooms is the typeahead on the issue form, and that
  // asks the server for matches as it is typed rather than carrying the list.
  const [rooms, setRooms]           = useState([]);
  const [roomTotal, setRoomTotal]   = useState(0);
  const [maxRunSize, setMaxRunSize] = useState(500);
  const [roomRun, setRoomRun]       = useState('');
  const [savingRoom, setSavingRoom] = useState(false);
  const [roomErr, setRoomErr]       = useState('');
  const [roomsAll, setRoomsAll]     = useState(false);

  const loadRooms = useCallback(() => {
    if (!token) return;
    apiFetch('/rooms', {token})
      .then(res => {
        setRooms(res.rooms || []);
        setRoomTotal(res.total_rooms || 0);
        if (res.max_run_size) setMaxRunSize(res.max_run_size);
      })
      .catch(() => {});
  }, [token]);
  useEffect(() => { loadRooms(); }, [loadRooms]);

  const roomPreview = previewRoomRun(roomRun);

  const [windowHours, setWindowHours] = useState(settings?.duplicate_window_hours ?? 24);
  const [lcuDays, setLcuDays] = useState(settings?.lcu_window_days ?? 7);
  // Held as a string, not a number, because it is optional and blank has to stay
  // a state the field can be in. A manager who never set an SLA must be able to
  // clear the box and save, which means sending null; a number state would turn
  // that cleared field into 0 and the server would -- correctly -- reject it.
  const [slaMinutes, setSlaMinutes] = useState(settings?.sla_minutes ?? '');
  const [savingSettings, setSavingSettings] = useState(false);
  useEffect(() => {
    if (settings) {
      setWindowHours(settings.duplicate_window_hours);
      setLcuDays(settings.lcu_window_days ?? 7);
      setSlaMinutes(settings.sla_minutes ?? '');
    }
  }, [settings]);

  // The settings row is written whole, so every send carries every value. What
  // differs is intent: one form owns the alert window, another the LCU trial
  // window, another the SLA, so a saved field never silently carries the others
  // along with it from the editor.
  async function saveSettings(e, which) {
    e.preventDefault();
    setSavingSettings(true);
    try {
      const trimmed = String(slaMinutes).trim();
      const res = await apiFetch('/settings', {
        method:'PATCH',
        body:{
          duplicate_window_hours: Number(windowHours),
          lcu_window_days: Number(lcuDays),
          // null switches the SLA off. A blank field is how that is done.
          sla_minutes: trimmed === '' ? null : Number(trimmed),
        },
        token});
      onSettingsUpdate(res.settings);
      if (which === 'alert') setWindowHours(res.settings.duplicate_window_hours);
      else if (which === 'lcu') setLcuDays(res.settings.lcu_window_days);
      else setSlaMinutes(res.settings.sla_minutes ?? '');
      setToast(t.settingsSaved);
    } catch(ex) { setToast('Error: ' + ex.message); }
    finally { setSavingSettings(false); }
  }

  const saveAlertWindow = e => saveSettings(e, 'alert');
  const saveLcuWindow   = e => saveSettings(e, 'lcu');
  const saveSla         = e => saveSettings(e, 'sla');

  async function addType(e) {
    e.preventDefault();
    const trimmed = name.trim();
    if (!trimmed) return;
    setSaving(true); setErr('');
    try {
      const res = await apiFetch('/issue-types', {method:'POST', body:{name: trimmed}, token});
      onTypesUpdate(prev => [...prev, res.issue_type].sort((a,b)=>a.name.localeCompare(b.name)));
      // The list is alphabetical, so a new row can land anywhere in it. Opening it
      // is what stops "I added it and nothing happened" -- without this the new row
      // can be row nine of a list showing five.
      setTypesAll(true);
      setName('');
      setToast(t.toastTypeAdded);
    } catch(ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  async function removeType(id) {
    try {
      await apiFetch(`/issue-types/${id}`, {method:'DELETE', token});
      onTypesUpdate(prev => prev.filter(it => it.id !== id));
      setToast(t.toastTypeDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function updateTypeColor(id, hex) {
    try {
      const res = await apiFetch(`/issue-types/${id}/color`, {method:'PATCH', body:{color:hex}, token});
      onTypesUpdate(prev => prev.map(it => it.id===id ? res.issue_type : it));
      setToast(t.toastTypeColorUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  // Whether issues of this type offer to record equipment being moved between
  // rooms. Toggling it only changes whether the prompt appears — swaps already
  // recorded stay on their issues either way.
  async function updateTypeTracksSwaps(id, on) {
    try {
      const res = await apiFetch(`/issue-types/${id}/tracks-swaps`, {method:'PATCH', body:{tracks_swaps:on}, token});
      onTypesUpdate(prev => prev.map(it => it.id===id ? res.issue_type : it));
      setToast(on ? t.toastSwapsEnabled : t.toastSwapsDisabled);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addDept(e) {
    e.preventDefault();
    const trimmed = deptName.trim();
    if (!trimmed) return;
    setSavingDept(true); setDeptErr('');
    try {
      const res = await apiFetch('/departments', {method:'POST', body:{name: trimmed}, token});
      onDepartmentsUpdate(prev => [...prev, res.department].sort((a,b)=>a.name.localeCompare(b.name)));
      setDeptsAll(true);
      setDeptName('');
      setToast(t.toastDeptAdded);
    } catch(ex) { setDeptErr(ex.message); }
    finally { setSavingDept(false); }
  }

  // Renaming edits the row in place rather than opening a dialog: the list
    // already shows the name, so the cell becomes an input and saves from there.
    // A modal for one short field would be heavier than the change being made.
    function startDeptEdit(d) {
      setEditingDeptId(d.id);
      setDeptDraft(d.name);
      setDeptErr('');
    }

    function cancelDeptEdit() {
      setEditingDeptId(null);
      setDeptDraft('');
      setDeptErr('');
    }

    async function saveDeptEdit(id) {
      const trimmed = deptDraft.trim();
      if (!trimmed) { setDeptErr(t.renameDepartmentEmpty); return; }
      setSavingDept(true); setDeptErr('');
      try {
        const res = await apiFetch(`/departments/${id}`, {method:'PATCH', body:{name: trimmed}, token});
        // Replaced rather than edited field-by-field: the API echoes the row back
        // complete, so this is exactly what a fresh load would show.
        onDepartmentsUpdate(prev => prev.map(d => d.id === id ? res.department : d)
          .sort((a,b)=>a.name.localeCompare(b.name)));
        setToast(res.issues_updated > 0
          ? t.toastDeptRenamedWithIssues.replace('{name}', res.department.name)
                                         .replace('{count}', res.issues_updated)
          : t.toastDeptRenamed);
        cancelDeptEdit();
      } catch(ex) { setDeptErr(ex.message); }
      finally { setSavingDept(false); }
    }

    async function removeDept(id) {
    try {
      await apiFetch(`/departments/${id}`, {method:'DELETE', token});
      onDepartmentsUpdate(prev => prev.filter(d => d.id !== id));
      setToast(t.toastDeptDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addAgent(e) {
    e.preventDefault();
    const trimmed = agentName.trim();
    if (!trimmed) return;
    setSavingAgent(true); setAgentErr('');
    try {
      const res = await apiFetch('/connecta-agents', {method:'POST', body:{name: trimmed}, token});
      onConnectaAgentsUpdate(prev => [...prev, res.connecta_agent].sort((a,b)=>a.name.localeCompare(b.name)));
      setAgentsAll(true);
      setAgentName('');
      setToast(t.toastAgentAdded);
    } catch(ex) { setAgentErr(ex.message); }
    finally { setSavingAgent(false); }
  }

  async function removeAgent(id) {
    try {
      await apiFetch(`/connecta-agents/${id}`, {method:'DELETE', token});
      onConnectaAgentsUpdate(prev => prev.filter(a => a.id !== id));
      setToast(t.toastAgentDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addConsumableItem(e) {
    e.preventDefault();
    const trimmed = ciName.trim();
    if (!trimmed) return;
    setSavingCi(true); setCiErr('');
    try {
      const res = await apiFetch('/consumable-items', {method:'POST', body:{name: trimmed, icon: ciIcon}, token});
      onConsumableItemsUpdate(prev => [...prev, res.consumable_item].sort((a,b)=>a.name.localeCompare(b.name)));
      setCiAll(true);
      setCiName(''); setCiIcon('box');
      setToast(t.toastConsumableAdded);
    } catch(ex) { setCiErr(ex.message); }
    finally { setSavingCi(false); }
  }

  async function removeConsumableItem(id) {
    try {
      await apiFetch(`/consumable-items/${id}`, {method:'DELETE', token});
      onConsumableItemsUpdate(prev => prev.filter(ci => ci.id !== id));
      if (editingIconId === id) setEditingIconId(null);
      setToast(t.toastConsumableDeleted);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function updateConsumableItemIcon(id, icon) {
    try {
      const res = await apiFetch(`/consumable-items/${id}/icon`, {method:'PATCH', body:{icon}, token});
      onConsumableItemsUpdate(prev => prev.map(ci => ci.id===id ? res.consumable_item : ci));
      setEditingIconId(null);
      setToast(t.toastConsumableIconUpdated);
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  async function addRooms(e) {
    e.preventDefault();
    const trimmed = roomRun.trim();
    if (!trimmed) return;
    setSavingRoom(true); setRoomErr('');
    try {
      const res = await apiFetch('/rooms', {method:'POST', body:{run: trimmed}, token});
      setRoomRun('');
      loadRooms();

      // The toast reports what the server did, not what was typed. A range can
      // be partly or wholly already in the inventory now, and the difference is
      // the whole point of the operation: a manager who asked for twenty rooms
      // and is told "rooms added" has no way to tell whether eight were added
      // and twelve were quietly refused, or twenty were added.
      const added   = res.added_rooms   || 0;
      const skipped = res.skipped_rooms || 0;

      if (added === 0) {
        setToast(t.adminRoomsAddedNone.replace('{count}', skipped));
      } else if (skipped === 0) {
        setToast(t.adminRoomsAddedCount.replace('{count}', added));
      } else {
        setToast(t.adminRoomsAddedSkipped
          .replace('{added}', added)
          .replace('{skipped}', skipped));
      }

      // Opened on the way in when something was added, for the same reason the
      // catalog lists are: a range added out of order can land below the fold,
      // and "I added it and nothing happened" is the obvious reading of that.
      // Left collapsed when nothing was added, because there is nothing new to
      // go and look at.
      if (added > 0) setRoomsAll(true);
    } catch(ex) { setRoomErr(ex.message); }
    finally { setSavingRoom(false); }
  }

  async function removeRooms(id) {
    try {
      await apiFetch(`/rooms/${id}`, {method:'DELETE', token});
      setToast(t.adminRoomsDeleted);
      loadRooms();
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  return (
    <div style={{maxWidth:1360}}>
      {/* Three separate cards, because these are unrelated settings and saving
          one should not look like it saved the others. They sit in the same grid
          as the add-a-type and add-a-department cards below, so the whole page
          reads as paired cards rather than one full-width row stacked on
          another. Each form sends every value, since the endpoint writes the
          settings row as a whole -- but the visible outcome of each save is only
          its own field. */}
      <div className="admin-grid" style={{marginBottom:20}}>

/* ── Error boundary ── */
/* Without this, any component that throws unmounts the whole tree and the user
   gets a blank white page with nothing in the console they can act on. Two real
   bugs hit exactly that: a nil `issues` array from the alerts API, and a merge
   conflict left in this file. A boundary turns "the app is gone" into "this one
   page broke, here is why, here is how to get back".

   It resets itself when the user navigates elsewhere, so a page that crashes
   once doesn't lock them out of every other page for the rest of the session. */
class PageErrorBoundary extends React.Component {
  static contextType = LangCtx;
  constructor(props) {
    super(props);
    this.state = { error: null, stack: '' };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    // Kept in the console as well as the screen, since the component stack is
    // what actually identifies which of the pages is at fault.
    console.error('Page crashed:', error, info && info.componentStack);
    this.setState({ stack: (info && info.componentStack) || '' });
  }
  componentDidUpdate(prevProps) {
    if (this.state.error && prevProps.resetKey !== this.props.resetKey) {
      this.setState({ error: null, stack: '' });
    }
  }
  render() {
    if (!this.state.error) return this.props.children;
    const t = T[this.context] || T.en;
    return (
      <div className="error-boundary">
        <div className="error-boundary-card">
          <div className="error-boundary-icon">{Ic.info}</div>
          <h2>{t.pageErrorTitle}</h2>
          <p className="error-boundary-msg">{t.pageErrorBody}</p>
          <pre className="error-boundary-detail">{String(this.state.error)}</pre>
          {this.state.stack && <pre className="error-boundary-stack">{this.state.stack.trim()}</pre>}
          <div className="error-boundary-actions">
            <button className="btn btn-primary" onClick={()=>this.setState({error:null, stack:''})}>{t.tryAgain}</button>
            <button className="btn btn-ghost" onClick={()=>location.reload()}>{t.reloadApp}</button>
          </div>
        </div>
      </div>
    );
  }
}

const [issuesEpoch, setIssuesEpoch] = useState(0);
const bumpIssues = () => setIssuesEpoch(n => n + 1);
