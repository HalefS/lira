.lang-btn.active { background: var(--blue-light); color: var(--blue); }
.lang-btn:hover:not(.active) { background: var(--gray-100); color: var(--gray-900); }
.lang-flag { font-size: 14px; line-height: 1; }

/* ── pw toggle ── */
.pw-wrap { position: relative; }
.pw-wrap .form-control { width: 100%; padding-right: 36px; }
.pw-toggle {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--gray-400);
  display: flex; padding: 0;
}

/* ── dark mode surface overrides ── */
html.dark .sidebar,
html.dark .topbar,
html.dark .stat-card,
html.dark .table-card,
html.dark .mini-card,
html.dark .set-group,
html.dark .maint-card,
html.dark .maint-tile,
html.dark .support-stat-card,
html.dark .modal,
html.dark .auth-card,
html.dark .error-boundary-card,
html.dark .btn-ghost,
html.dark .lang-toggle,
html.dark .form-control { background: var(--gray-50) !important; }

html.dark .sidebar { border-color: var(--gray-200) !important; }
html.dark .topbar  { border-color: var(--gray-200) !important; }
html.dark .stat-card,
html.dark .table-card,
html.dark .mini-card,
html.dark .set-group,
html.dark .maint-card,
html.dark .maint-tile,
html.dark .support-stat-card { border-color: var(--gray-200) !important; }
/* The tinted border is the strongest signal that a tile is filtering the queue,
   so it has to outlive the !important above -- otherwise the selected tile looks
   the same in both themes except for its edge width. */
html.dark .maint-tile.is-filter { border-color: var(--tile-color) !important; }
/* The wash over a live tile is a tint in light mode, because the pastel it uses is
   already pale. The dark theme's --*-light values are not pastels of a dark surface,
   they are full-strength colours, so the same overlay at the same opacity fills the
   whole tile rather than washing it -- the scheduled one most of all, where #085041
   reads as a solid green block with a grey label stranded on it. Dark mode gets a
   much lower alpha instead, which keeps the hue as a wash, which is all the overlay
   was ever for. */
html.dark .maint-tile.live::after { opacity: 0.25; }
html.dark .error-boundary-card { border-color: var(--gray-200) !important; }
html.dark .support-counts { border-color: var(--gray-200) !important; }

html.dark thead th { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }
html.dark tbody td { border-color: var(--gray-200) !important; }
html.dark tbody tr:hover td { background: var(--gray-200) !important; }

html.dark .form-control {
  border-color: var(--gray-300) !important;
  color: var(--gray-900) !important;
}
/* Dark --blue is a light accent rather than a dark one, so white ink on it -- the
   app's main action on every page, "Apt. issue", "Download PDF", all eight
   "Mark done" buttons -- measured 2.86:1. Dark ink on the same fill gives
   5.99:1, the same way the dark theme treats that blue as an accent everywhere
   else it appears.
   The hover needs its own rule rather than being left to .btn-primary:hover.
   `html.dark .btn-primary` outranks a single class on that pseudo-class, so
   without this the hover would never apply in dark at all. It keeps
   --blue-hover, which in this theme is lighter than --blue rather than darker --
   the correct direction now that the ink sitting on it is dark, at 8.35:1. */
html.dark .btn-primary       { background: var(--blue); color: #0B1D2C; }
html.dark .btn-primary:hover { background: var(--blue-hover); }

html.dark .btn-ghost {
  color: var(--gray-600) !important;
  border-color: var(--gray-300) !important;
}
html.dark .btn-ghost:hover { background: var(--gray-200) !important; color: var(--gray-900) !important; }
/* In dark mode --red is a light salmon, so white text on it would be barely
   legible. Flip the pairing to a dark red fill with the light red as the text,
   the same way .icon-btn.danger:hover does it. */
html.dark .btn-danger        { background: var(--red-light) !important; color: var(--red) !important; }
html.dark .btn-danger:hover  { background: var(--red-mid) !important; }

/* The count of outstanding alerts, on the nav item a technician checks first.
   Dark --red is a pale salmon, so white on it measured 2.67:1 at 10px. Dark ink
   on the same fill gives 6.71:1. The light pairing needs no override of its own:
   it is the light --red on white, which now clears at 5.34:1. */
html.dark .nav-badge { color: #2A0F0F; }

html.dark .nav-item.active { background: var(--blue-light) !important; color: var(--blue) !important; }
html.dark .nav-item:hover  { background: var(--gray-200) !important; }

html.dark .chip        { background: var(--gray-100) !important; border-color: var(--gray-300) !important; color: var(--gray-600) !important; }
html.dark .chip.active { background: var(--blue-light) !important; color: var(--blue) !important; border-color: var(--blue-mid) !important; }

html.dark .lang-toggle  { border-color: var(--gray-300) !important; }
html.dark .lang-btn.active { background: var(--blue-light) !important; color: var(--blue) !important; }
html.dark .lang-btn:first-child { border-color: var(--gray-300) !important; }

html.dark .search-wrap {
  background: var(--gray-200) !important;
  border-color: var(--gray-300) !important;
}
html.dark .search-wrap input { color: var(--gray-900) !important; }

html.dark .modal-overlay { background: rgba(0,0,0,0.65) !important; }
html.dark .bar-track { background: var(--gray-200) !important; }
html.dark .badge-type,
html.dark .badge-slate { background: var(--gray-200) !important; border-color: var(--gray-300) !important; }

html.dark .auth-right  { background: var(--gray-50) !important; }
   /* The brand panel is the one large surface that is a saturated blue rather than
      a neutral, so it is the one place where the dark --blue token is used as a
      background rather than as an accent. That token is a *light* blue: fine as
      ink on a dark card, wrong as a field behind white text, which lands at 2.4:1
      -- the sign-in screen, which is the first thing anyone sees. Light mode keeps
      white on the mid blue at 5.8:1 and the relationship is the same here, white on
      a blue dark enough to hold it: 12.5:1.

      Using --blue-light rather than a new value also keeps the panel inside the
      dark theme's own surfaces, so the eye is drawn to the login card on the right
      rather than to a bright slab on the left. */

  .stats-grid { grid-template-columns: repeat(2,1fr); }
  .bottom-grid { grid-template-columns: 1fr; }

}

}

/* Self-service reset: the link under the sign-in button, the six-digit code
   field, and the note shown when sign-in was blocked rather than wrong.

}

/* The selector repeats .form-control on purpose: the generic input styling is

   carrying two classes still needs the pairing to be unambiguous. */

  font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: 0.42em;
  text-align: center; padding-left: 0.42em; /* keeps the digits optically centred */
}

.reset-note {
  display: flex; align-items: flex-start; gap: 8px; margin: 0 0 18px;
  padding: 11px 13px; border-radius: var(--radius-md);
  background: var(--blue-light); color: var(--blue);
  font-size: 12.5px; line-height: 1.5;
}
.reset-note svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; }

/* The code the manager has just been handed. Deliberately the loudest thing on
   the dialog: it is shown once and never again, so it has to be readable from
   arm's length across a desk. */
.reset-code-display {
  font-family: 'DM Mono', monospace; font-size: 40px; font-weight: 500;
  letter-spacing: 0.3em; text-align: center; color: var(--blue);

</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* useLayoutEffect rather than useEffect for anything GSAP touches: it runs after
   the DOM is updated but before the browser paints, so a tween starting from
   opacity 0 or scaleX 0 is never painted in its final state first. With
   useEffect that flicker is visible on every navigation. */
const { useState, useMemo, useEffect, useLayoutEffect, useCallback, useRef } = React;

/* ── API config ── */
const API = '/v1';

/* ── API client ── */
async function apiFetch(path, { method='GET', body, token } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  // Read as text and parse by hand, because res.json() rejects an empty body with
  // a SyntaxError that is indistinguishable from a failed request. Signing out
  // answers 204 with nothing in it, and a successful sign-out must not look like
  // a broken network call to whatever asked for it.
  const raw = await res.text();
  let data = {};
  if (raw) { try { data = JSON.parse(raw); } catch (_) { data = {}; } }
  if (!res.ok) {
    const msg = data.error
      ? (typeof data.error === 'object' ? Object.values(data.error).join(', ') : data.error)
      : 'Something went wrong';
    const err = new Error(msg);
    // The STATUS travels with the error.
    //
    // Without it a caller can only tell two refusals apart by matching the English
    // sentence the server wrote -- and envelope.error is server-controlled English, so
    // matching it also breaks the EN/PT parity every other string in this file keeps.
    // The LCU pool guard needs this: deleting a reader that is in the pool is a 409
    // with a perfectly good message, and the row it belongs on has to show its own
    // error rather than the page banner nine hundred pixels away.
    err.status = res.status;
    err.reason = data.reason;
    // The server refuses work from a user who still owes an LCU result for
    // today. Both cases here are 403, so the code in the body is the only way to
    // tell them apart; the units come along so the prompt can be built from the
    // response that refused the call rather than asking again.
    if (data.code === 'lcu_test_required') {
      err.lcuRequired = true;
      err.lcuUnits = data.units || [];
      err.lcuToday  = data.today  || '';
    }
    // Sign-in is refused with 403 while a manager has asked this account to
    // change its password. The password was correct, so this is not a failure:
    // the auth screen has to notice the flag and move to the change step rather
    // than showing "incorrect email or password" for correct credentials.
    if (data.must_reset_password) {
      err.mustResetPassword = true;
    }
    throw err;
  }
  return data;
}

/* ════════════════ MOTION ════════════════ */
/*
  GSAP is used for three things only: the page transition, the dashboard
  counters, and the bars and gauges. Everything else in this file stays on CSS
  keyframes. A declarative fade or slide is not worth a library; what GSAP is
  actually here for is animating values that are only known at runtime -- a
  number that has been computed from the data, a bar whose length depends on the
  largest of a set of counts it has never seen before.

  Two rules keep GSAP and React from fighting over the same DOM node:

  1. Every animation is created inside a gsap.matchMedia() query and destroyed
     with mm.revert() in the effect cleanup. GSAP writes to the DOM directly and
     React owns the same nodes; without the teardown a tween outlives the
     component that started it and goes on writing to a detached element.

  2. Every animation is gated on prefers-reduced-motion. This file had no
     reduced-motion handling of any kind before this, so that is worth having
     for the animations at least. Under reduce(), no tween is ever created and
     the DOM is left exactly as React rendered it -- which means the components
     using these hooks must be able to render their final state on their own.
     They all can, except CountUp, which is why it renders empty and writes its
     own text.
*/

/* Shared tweens. Each takes gsap explicitly rather than reaching for the global,
   so a call site that passes null (GSAP absent, or motion reduced) is obvious. */
const MOTION = {
  /* A page arriving: a short lift and fade. Deliberately under 300ms and with no
     delay, so it reads as instant but not as a cut. */
  enter(g, el, opts = {}) {
    if (!g || opts.reduced || !el) return;
    g.fromTo(el, { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.28, ease: 'power2.out',
        overwrite: true, clearProps: 'transform' });
  },

  /* Bars and gauges are sized with an inline width or height, so the growth is a
     scale transform layered on top of that rather than a fight with the layout
     property itself. Capped, because a long list should settle quickly rather
     than crawl. */
  grow(g, els, axis = 'x', each = 0.04, cap = 40) {
    if (!g || !els) return;
    const list = Array.from(els).slice(0, cap);
    if (!list.length) return;
    const prop = axis === 'x' ? 'scaleX' : 'scaleY';
    g.fromTo(list, { [prop]: 0 },
      { [prop]: 1, duration: 0.55, ease: 'power2.out',
        stagger: { each, from: 'start' }, overwrite: true });
  },

  /* A reader's lights coming on, one day after another down the trial strip.

     Only the dots that carry a result are passed in, so the untested grey ones
     stay where they are and the eye is led along the days that actually
     happened. A failure is animated exactly like a pass -- what colour a dot ends
     up is CSS's business, not this -- so a red in the middle of a green run
     lights on in its own turn rather than being skipped or jumping the queue.

     back.out rather than power2.out, because the overshoot is the point: each
     light arrives with a small pop, so a fortnight of them reads as a run of
     little clicks rather than a slide. `delay` offsets whole strips against each
     other, so several readers fill in one after another instead of all at once. */
  light(g, dots, opts = {}) {
    if (!g || !dots) return;
    const list = Array.from(dots);
    if (!list.length) return;
    const { each = 0.055, delay = 0 } = opts;
    g.fromTo(list, { scale: 0.15, opacity: 0.2 },
      { scale: 1, opacity: 1, duration: 0.32, ease: 'back.out(2.6)',
        delay, stagger: { each, from: 'start' }, overwrite: true });
  },
};

/* Runs build(gsap, element, { reduced }) after the element is on the DOM, again
   whenever deps change, and cleans up after itself. Returns the ref to attach.

   build is always called, even when there is nothing to animate, so a component
   can still establish its final state. When motion is not wanted -- reduced
   motion asked for, or GSAP failed to load -- gsap is handed over as null, which
   every helper here already treats as "leave the DOM alone". That is what makes
   the gate a single decision in one place instead of a check at each call site. */
function useAnimate(build, deps = []) {
  const root = useRef(null);
  useLayoutEffect(() => {
    const el = root.current;
    if (!el) return;
    const g = window.gsap;
    const still = () => build(null, el, { reduced: true });
    if (!g) { still(); return; }
    const mm = g.matchMedia();
    mm.add({
      still:  '(prefers-reduced-motion: reduce)',
      motion: '(prefers-reduced-motion: no-preference)',
    }, (ctx) => {
      if (ctx.conditions.still) still();
      else build(g, el, { reduced: false });
    });
    return () => mm.revert();
  }, deps);
  return root;
}

/* Counts a number up when its value changes.

   The span is rendered with no children on purpose. If React owned this text,
   GSAP's onUpdate would replace the text node while React still held a
   reference to the original, and the next React render would write to the
   detached one -- leaving the number frozen on screen. Here exactly one owner
   writes it, which is this function, on every path including the reduced one. */
function CountUp({ value, decimals = 0, className, style }) {
  const n = Number(value);
  const target = Number.isFinite(n) ? n : 0;
  const ref = useAnimate((g, el, opts) => {
    const final = target.toFixed(decimals);
    // The finished number is written before anything is animated, so the span is
    // never empty. It used to be written only from GSAP's onUpdate, and a tween
    // that is created but never advances -- GSAP's ticker is suspended in a
    // background tab, where requestAnimationFrame does not fire -- left the span
    // blank for good: a tile with a label and no number on it. React still renders
    // no children, so this stays the only thing that ever writes the text, and the
    // animation still gets to run: it starts on the next frame, which lands before
    // the browser paints, so the value written here is never itself shown.
    el.textContent = final;
    if (!g || opts.reduced) return;
    const proxy = { n: 0 };
    g.to(proxy, {
      n: target, duration: 0.8, ease: 'power2.out',
      onUpdate:    () => { el.textContent = proxy.n.toFixed(decimals); },
      onComplete:  () => { el.textContent = final; },
    });
  }, [target, decimals]);
  return <span ref={ref} className={className} style={style}/>;
}

/* ════════════════ PAGE TRANSITION ════════════════ */
/*
  Wraps the page area so changing page cross-fades instead of cutting.

  The wrapper element itself stays mounted and only the animation re-runs, keyed
  on `page`. Remounting the wrapper with a React key would work too, but it would
  throw away and rebuild the whole subtree on every navigation for no reason.
*/
function PageShell({ page, children }) {
  const ref = useAnimate((g, root, opts) => {
    // Animate the rendered page, not the wrapper: animating the wrapper would
    // also fade anything else ever placed alongside the page in here.
    MOTION.enter(g, root.firstElementChild, opts);
  }, [page]);
  return <div ref={ref}>{children}</div>;
}

/* ════════════════ PAGINATED LISTINGS ════════════════ */

/* How many rows a listing shows before the reader asks for more. Matches the
   server's own default, so a page that forgets to say anything still opens at
   20 rather than at whatever the endpoint would otherwise return. */
const PAGE_SIZE = 20;

/* Fetches a listing that grows a page at a time.

   buildPath(limit) returns the request path, so each caller keeps control of its
   own query parameters and the hook only owns how many rows have been asked for.

   filterKey is what the caller considers "these are different rows": change it
   and the limit drops back to a page. That is why it exists rather than asking
   the caller to remember to reset -- a filter that narrows to three rows should
   not open with two hundred already loaded behind them, and a reader who has
   loaded six pages and then searches should not have to click through five empty
   ones to find out their search matched nothing.

   The limit is a growing ceiling rather than a page number with an offset, so
   "load more" asks for everything already on screen plus one page more. Rows
   keep their order and their place, and there is no page number to fall out of
   step with the filters.

   rows is null until the first answer lands, which is how a page tells "still
   loading" from "loaded, and there is genuinely nothing".

   error is the failure message, or null. It exists because rows:null is the
   same value a failed request leaves behind, so a page gating on !rows cannot
   tell the two apart and renders its loading state forever. A page that wants
   to say something about a failure reads error; onError is only for the
   endpoints whose failure the page has to react to rather than just display.

   options:
     rowsKey   which key in the response holds the rows. Every endpoint names its
               own -- issues, units, swaps -- so this cannot be guessed at.
     map       applied to each row on the way in. The issue tables read a mapped
               shape and the rest read the API's own, so it is asked for rather
               than assumed.
     filterKey see above; changes reset the limit to a page.
     onError   for endpoints whose failure means something to the page, such as
               the LCU gate refusing the request. */
function usePagedList(buildPath, token, options = {}) {
  const {rowsKey = 'rows', map = null, filterKey = '', onError = null} = options;
  const [limit, setLimit] = useState(PAGE_SIZE);
  const [state, setState] = useState({rows: null, total: 0, capped: false, loading: true, res: null, error: null});

  // Reset during render rather than in an effect: an effect would build the path
  // once with the new filters and the old limit, fetch it, and then fetch again
  // after resetting -- two requests for one filter change, and whichever answered
  // last would win regardless of which was asked for more recently.
  const [prevKey, setPrevKey] = useState(filterKey);
  if (prevKey !== filterKey) {
    setPrevKey(filterKey);
    setLimit(PAGE_SIZE);
  }

  // buildPath is deliberately not a dependency: it is a fresh closure on every
  // render, and depending on it would refetch in a loop. filterKey stands in for
  // whatever the closure actually reads.
  const path = useMemo(() => buildPath(limit), [limit, filterKey]);

  // map and onError are held in refs so a caller passing an inline arrow does not
  // become an effect dependency and restart the fetch on every render.
  const mapRef = useRef(map);
  mapRef.current = map;
  const onErrorRef = useRef(onError);
  onErrorRef.current = onError;

  useEffect(() => {
    let cancelled = false;
    setState(s => ({...s, loading: true}));
    apiFetch(path, {token})
      .then(res => {
        if (cancelled) return;
        // Coerced to an array whatever came back: every caller maps over it, and
        // a missing or null key would otherwise read as "still loading" forever.
        const raw = res[rowsKey];
        setState({
          rows:   Array.isArray(raw) ? (mapRef.current ? raw.map(mapRef.current) : raw) : [],
          total:  Number(res.total) || 0,
          capped: !!res.limit_capped,
          loading: false,
          res,
          error: null,
        });
      })
      .catch(ex => {
        if (cancelled) return;
        // `error` is what separates "no answer yet" from "the answer was a
        // failure", which rows:null alone cannot: a caller gating on !rows drew
        // its loading state for a request that had already come back broken, and
        // a page that renders one forever is a page that looks like it is working.
        // It is a string rather than the exception so a caller can print it
        // directly, which is what the existing error banners do.
        setState({rows: null, total: 0, capped: false, loading: false, res: null, error: ex.message || 'Request failed'});
        if (onErrorRef.current) onErrorRef.current(ex);
      });
    return () => { cancelled = true; };
    // filterKey is a dependency even though it never appears in the path.
    //
    // A caller uses it to say "these are different rows" for reasons the query
    // string cannot express: an issue was just written and the page behind this
    // list has changed, or the daily answer was recorded. Bumping it recomputes
    // the path to the *identical* string, so on its own it would change nothing --
    // React would compare equal strings and correctly decline to run the effect,
    // and the list would sit there showing a snapshot from before the write.
  }, [path, token, rowsKey, filterKey]);

  return {
    // Spreads `res` through as well: an endpoint may answer with more than the
    // rows, and the LCU list carries the server's idea of today alongside them.
    ...state,
    // How many rows the server actually sent, which is not always how many are on
    // screen: a page that still narrows its own rows client-side shows fewer, and
    // the count here is the honest one for "you have loaded 20 of 340".
    fetched: state.rows ? state.rows.length : 0,
    limit,
    loadMore: () => setLimit(l => l + PAGE_SIZE),
  };
}

/* The footer under a paginated table: what is loaded out of what exists, and the
   button that asks for the next page.

   Renders nothing at all once everything is loaded -- an empty footer with a
   button that does nothing is worse than no footer. rows may be null while the
   first request is in flight, in which case this shows nothing rather than
   flashing "0 of 0".

   `shown` and `total` override the list's own figures. The daily report needs
   that: its two tables come from one response and share one limit, so neither
   table's count is the count of rows the server sent, and the honest pair is
   worked out from the per-mode totals the summary already carries. */
function LoadMore({ list, t, shown, total }) {
  const have = list && (list.rows || list.res);
  if (!have || list.loading) return null;
  const n = shown != null ? shown : list.fetched;
  const m = total  != null ? total  : list.total;
  if (!m || n >= m) return null;
  return (
    <div className="loadmore">
      <span className="loadmore-count">
        {t.showingOf.replace('{shown}', n).replace('{total}', m)}
      </span>
      <button className="btn btn-ghost" style={{padding:'6px 14px',fontSize:12.5}}
        onClick={list.loadMore} disabled={list.loading}>
        {list.loading ? '…' : t.loadMore}
      </button>
      {/* Only when the server refused to go past its own maximum, so a reader who
          reaches it is told why rather than left thinking they had seen
          everything. */}
      {list.capped && <span className="loadmore-note">{t.loadMoreCapped}</span>}
    </div>
  );
}

/* ── helpers ── */
function today(lang) {
  return new Date().toLocaleDateString(lang==='pt' ? 'pt-PT' : 'en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
/* Format a Date as YYYY-MM-DD in the *local* calendar.
   Date.prototype.toISOString() is UTC, so for a Date built at local midnight it
   returns the previous day anywhere east of Greenwich — at Europe/Lisbon in
   summer (+01:00) '2026-10-05T00:00:00' formats as '2026-10-04'. That silently
   moved the week selector: clicking "next week" on a Monday sent the previous
   Sunday, the server resolved the same week, and the button appeared dead. */
function localISODate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function initials(name) {
  return name.trim().split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
}
function loadLS(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

/* ── Map API issue → frontend shape ── */
function mapIssue(i) {
  return {
    id:            i.id,
    apt:           i.mode === 'apt'  ? i.location : undefined,
    dept:          i.mode === 'dept' ? i.location : undefined,
    mode:          i.mode,
    type:          i.type,
    problem:       i.problem,
    resolution:    i.resolution,
    time:          i.time_minutes,
    startTime:     i.start_time || undefined,
    endTime:       i.end_time || undefined,
    // Only ever read/written by the add/edit issue modal — never shown in
    // any table, history, or dashboard view.
    reportedByAgent:  i.reported_by_agent || undefined,
    confirmedByAgent: i.confirmed_by_agent || undefined,
    falsePositive: !!i.false_positive,
    // Consumables used on the issue: [{itemId, item, icon, quantity}]. itemId is
    // null when the item has since been removed from the catalog.
    consumables: (i.consumables || []).map(c => ({
      itemId: c.item_id ?? null, item: c.item, icon: c.icon, quantity: c.quantity,
    })),
    // Handovers to Telnet / Telefonica. The Telnet names are free text — they
    // are whoever we spoke to on the other side, not users of this app.
    // TVs moved between rooms to fix this issue. Rooms are free text, because
    // there is no rooms table in this system.
    tvSwaps: (i.tv_swaps || []).map(s => ({
      id: s.id, fromRoom: s.from_room, toRoom: s.to_room, notes: s.notes || '',
    })),
    supportRequests: (i.support_requests || []).map(s => ({
      id:            s.id,
      company:       s.company,
      status:        s.status,
      technician:    s.telnet_technician || '',
      confirmedBy:   s.telnet_confirmed_by || '',
      ticketId:      s.telefonica_ticket_id || '',
      // The company's turnaround, kept separate from the issue's own time.
      // Sliced to "YYYY-MM-DDTHH:MM" for the datetime-local inputs, which is
      // the format the API takes them back in.
      startedAt:     s.started_at  ? s.started_at.slice(0,16)  : '',
      resolvedAt:    s.resolved_at ? s.resolved_at.slice(0,16) : '',
      durationMinutes: s.duration_minutes,
      notes:         s.notes || '',
    })),
    status:        i.status,
    loggedBy:      i.logged_by,
    loggedByName:  i.logged_by_name,
    loggedByIdx:   i.logged_by_idx,
    createdAt:     i.created_at?.slice(0,10),
    version:       i.version,
  };
}

/* ── Avatar ──
   Shows the member's uploaded photo when they have one, and their initials on
   a colour derived from avatar_idx when they don't. Previously this only ever
   drew initials, so every call site that wanted a photo had to hand-roll an
   img-or-initials ternary — the logic now lives here once.
   `src` and `style` are optional: call sites that only know a name and an index
   (issue lists, the stats charts) keep the initials behaviour. */
function Avatar({ name, idx, size='md', src, style }) {
  const dims = size==='sm' ? {width:24,height:24,fontSize:9} : size==='lg' ? {width:40,height:40,fontSize:15} : {};
  const box  = { ...dims, ...style };
  // alt="" because every current call site already shows the name beside the
  // avatar, and naming it again would have screen readers announce it twice.
  return src
    ? <img className="avatar-circle" src={src} style={box} alt=""/>
    : <div className={`avatar-circle av-${(idx??0)%5}`} style={box}>{initials(name)}</div>;
}

/* ── TypeBadge ── */
// Colors are assigned server-side and stored per issue type as a "#RRGGBB"
// hex value (guaranteed unique — see the admin issue-types catalog).
// TypeColorCtx makes that name -> hex lookup available to any <TypeBadge>
// without having to thread issueTypes through every table component that
// renders one.
const TypeColorCtx = React.createContext({});

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch (max) {
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      default: h = (r-g)/d + 4;
    }
    h /= 6;
  }
  return [h*360, s*100, l*100];
}
function hslToHex(h, s, l) {
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
// Turns any "#RRGGBB" hex into a soft badge style — a light tint
// background and a deep, readable text color of the same hue — matching
// the app's existing badge look regardless of which raw color a manager
// picks in the color picker.
function badgeStyleFromHex(hex) {
  if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return null;
  const [h, s] = hexToHsl(hex);
  const sat = Math.min(s, 70);
  return {
    background: hslToHex(h, sat, 93),
    borderColor: hslToHex(h, sat, 82),
    color: hslToHex(h, Math.min(Math.max(s,40),80), 32),
    borderWidth: 1, borderStyle: 'solid',
  };
}

/* A shift's stored tint, expanded into the custom properties the rota CSS reads.

   The stored value stays one "#rrggbb" and the theme work happens HERE rather than
   in the stylesheet, for the reason badgeStyleFromHex gives: one derivation, used by
   every surface that shows a tint, so a cell and its legend chip cannot disagree
   about what colour a shift is.

     --tint-wash      the cell / legend / picker background. Lightness 92% in light
                      and 17% in dark, which measures 12.4:1 to 14.7:1 against
                      --gray-900 in light and 9.6:1 to 15.0:1 in dark -- a wash that
                      reads on a 44px cell and still carries the cell's ordinary text.
     --tint-dot       the 10px marker on legend chips and picker options. NOT the
                      full-strength hue in dark: that measured 2.16:1 to 2.71:1
                      against its own wash, under the 3:1 a non-text cue owes.
     --tint-ink       ink for a glyph drawn on the raw swatch: white when the swatch
                      is dark enough to carry it, --gray-900 otherwise. All six
                      presets want white; a pale custom yellow wants the other.

   Returns null for no tint, for a malformed hex and for "" -- and the callers spread
   it as style={tintStyle(shift)}, so "no tint" is an ABSENT style and the element
   keeps .rota-cell's own background. That is what makes an untinted shift render
   exactly as it did before, with no conditional CSS anywhere. */
function tintStyle(shift) {
  const hex = (shift && shift.color) || '';
  if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) return null;
  const [h, s] = hexToHsl(hex);
  const sat = Math.min(s, 70);
  return {
    '--tint-wash':     hslToHex(h, sat, 92),
    '--tint-dot':      hslToHex(h, sat, 34),
    '--tint-wash-dark': hslToHex(h, Math.min(s, 56), 17),
    '--tint-dot-dark':  hslToHex(h, sat, 62),
    '--tint-ink':       hexToHsl(hslToHex(h, s, 50))[2] < 62 ? '#FFFFFF' : 'var(--gray-900)',
  };
}

/* Just the two dot custom properties, for the two places that show a colour without
   offering a control. Same derivation, so the two can never disagree.

   Custom PROPERTIES rather than a background, and that is the whole point: an inline
   `background` beats every stylesheet rule, including the html.dark override that
   picks the dot's lightness for a dark card. Written as a background it looked fine
   in light and measured 1.49:1 in dark, because the override never ran. Handing the
   variables over and letting .rota-tint-dot resolve them is what makes the theme
   switch reach this element at all. */
function dotStyle(hex) {
  const s = tintStyle({ color: hex });
  if (!s) return null;
  return { '--tint-dot': s['--tint-dot'], '--tint-dot-dark': s['--tint-dot-dark'] };
}

/* The six preset tints, in picker order: no colour first, then a ladder of hue
   going anti-clockwise from the app's own blue.

   Every one was chosen on four measured constraints rather than on taste:

     white ink on every swatch, 5.11:1 (#0f7d5c) to 6.46:1 (#5b4bc4). One ink
       colour for all six, so the tick glyph inside the chosen tile is #FFFFFF in
       code rather than a per-swatch lookup. This is also why the palette does not
       contain the app's --teal or --green: those are ink tokens tuned for their own
       washes, and a solid swatch needs a darker member of the same hue.

     at least 40 degrees of hue from --orange (h 17.8) and --amber (h 37.4); the
       smallest gap here is 124.6 degrees. Orange is not merely reserved for
       overnight by this list: a tint is a WASH and overnight is a 3px RAIL, so a
       manager who picks orange in the native input gets an orange wash, which still
       cannot read as overnight because the rail is what means overnight.

     pairwise CIE-Lab dE76 at least 25 in normal vision. Measured minimum 29.8.

     pairwise dE76 at least 18 under deuteranopia (Machado 1.0), measured minimum
       19.6. A seventh candidate was cut rather than shipped: a navy that cleared
       every test alone but sat 20.6 from Slate and 20.6 from Blue, and three cool
       neutrals is a difference nobody has to be able to make.

   #5b6779 is deliberately close to --gray-600, because a manager who wants "the
   plain one but tinted" should not have to hunt for a neutral.

   And none of this is load-bearing: the shift name is printed in every cell, in the
   legend and in the picker, so colour is a fourth and last cue everywhere it
   appears. */
const SHIFT_TINTS = ['', '#5b6779', '#1769aa', '#0f7d5c', '#5b4bc4', '#b02e8c', '#be2e4b'];

/* The preset's name in words, which is what makes the control not depend on colour:
   a screen reader hears "Colour for Morning: Indigo", a tooltip reads "Indigo", and
   only the 20px disc is a colour at all. Same idiom as the issue-types swatch. A hex
   the manager picked for itself has no name here, so it falls back to the hex -- a
   worse label than a good name, which is the honest consequence of not having one. */
const shiftTintName = (t, c) => ({
  '':        t.shiftTintNone,
  '#5b6779': t.shiftTintSlate,
  '#1769aa': t.shiftTintBlue,
  '#0f7d5c': t.shiftTintTeal,
  '#5b4bc4': t.shiftTintIndigo,
  '#b02e8c': t.shiftTintMagenta,
  '#be2e4b': t.shiftTintCrimson,
}[c] || (c || '').toUpperCase());

function TypeBadge({ type }) {
  const colors = React.useContext(TypeColorCtx);
  const hex = colors[type];
  const style = hex ? badgeStyleFromHex(hex) : null;
  return <span className="badge" style={style || undefined}>{type}</span>;
}

function Toast({ msg, onDone }) {

/* ════════════════ AUTH SCREEN ════════════════ */

/* Password field with a show/hide toggle, shared by sign-in, sign-up and the
   forced password change so the interaction is identical in all three.

   This lives at module scope, not inside AuthScreen, and that is load-bearing.
   A component defined inside another component's body is a *new function* on
   every render, so React sees a different element type each time, throws the
   old one away and mounts a fresh one. The input is therefore recreated on
   every keystroke and loses focus after the first character. Keep it here. */
function PwField({ label, id, value, onChange, placeholder, showPw, onToggleShow }) {
  return (
    <div className="form-group">
      <label htmlFor={id}>{label}</label>
      <div className="pw-wrap">
        <input id={id} className="form-control" type={showPw?'text':'password'}
          placeholder={placeholder} value={value}
          onChange={e=>onChange(e.target.value)} required/>
        <button type="button" className="pw-toggle" onClick={onToggleShow}
          aria-label={showPw ? 'hide password' : 'show password'}>
          {showPw ? Ic.eyeoff : Ic.eye}
        </button>
      </div>
    </div>
  );
}

/* ── inactivity sign-out ──
   Thirty minutes of doing nothing ends the session. The reasons for the shape of
   this are not obvious, so they are written down rather than left to be
   rediscovered:

   The clock is wall-clock, not a tick count. setInterval is throttled hard in a
   background tab -- to once a minute, sometimes less -- so counting ticks would
   keep a session alive for hours in a tab nobody is looking at, which is exactly
   the case this exists for. Comparing Date.now() against the last moment of
   activity gives the same answer whatever the browser does with the timer, and a
   tab coming back into focus finds itself already signed out rather than waiting
   out the remainder of its throttled interval.

   mousemove counts, but only once every two seconds. Someone reading a long page
   is often barely moving, and being signed out for reading is worse than the risk
   it guards against. The throttle is there so a trackpad reporting a pixel of
   drift cannot hold a session open indefinitely.

   Everything else counted is a deliberate act -- a click, a key, a scroll, a tap.
   A password field left half-filled on a reception PC is exactly what this is for,
   which is why the warning below comes first: five minutes of it, and any movement
   takes it away. */
const IDLE_LIMIT_MS      = 30 * 60 * 1000;
const IDLE_WARN_AFTER_MS = 25 * 60 * 1000;
const IDLE_TICK_MS       = 15 * 1000;
const IDLE_MOVE_EVERY_MS = 2000;

function useIdleSignOut(active, { onWarn, onIdle }) {
  const lastRef   = useRef(Date.now());
  const movedRef  = useRef(0);
  const warnedRef = useRef(false);
  // The callbacks are held in a ref so that a caller passing an inline arrow --
  // which is the normal way to write them -- does not restart the timer on every
  // render of the page above this one.
  const cbsRef    = useRef({ onWarn, onIdle });
  useEffect(() => { cbsRef.current = { onWarn, onIdle }; });

  useEffect(() => {
    if (!active) return;

    const dropWarning = () => {
      if (!warnedRef.current) return;
      warnedRef.current = false;
      cbsRef.current.onWarn(false);
    };
    const bump = () => { lastRef.current = Date.now(); dropWarning(); };
    const move = () => {
      const now = Date.now();
      if (now - movedRef.current < IDLE_MOVE_EVERY_MS) return;
      movedRef.current = now;
      bump();
    };

    // No focus, and no visibilitychange. Returning to the tab is not using it:
    // counting either would mean that coming back after an hour away always reset
    // the clock before a throttled background tick could notice, so the timeout
    // could only ever fire while somebody was already watching the screen -- which
    // is the one case it does not exist for. A tab left alone for half an hour is
    // signed out when it is looked at again, which is the correct outcome and the
    // reason the notice on the sign-in screen names the reason.
    const events = ['mousedown', 'keydown', 'wheel', 'touchstart', 'pointerdown', 'scroll'];
    events.forEach(e => window.addEventListener(e, bump, { passive: true }));
    window.addEventListener('mousemove', move, { passive: true });

    const tick = setInterval(() => {
      const idleFor = Date.now() - lastRef.current;
      if (idleFor >= IDLE_LIMIT_MS) { cbsRef.current.onIdle(); return; }
      if (idleFor >= IDLE_WARN_AFTER_MS && !warnedRef.current) {
        warnedRef.current = true;
        cbsRef.current.onWarn(true);
      }
    }, IDLE_TICK_MS);

    return () => {
      clearInterval(tick);
      events.forEach(e => window.removeEventListener(e, bump));
      window.removeEventListener('mousemove', move);
    };
  }, [active]);
}

function AuthScreen({ onLogin, lang, onLangChange, theme, onThemeChange, notice }) {
  const t = T[lang];
  // 'login' | 'register' | 'forgot'
  //
  // 'forgot' is the self-service reset. The code is not emailed: a manager
  // generates it from the Team panel and reads it out, which is what makes this
  // usable for someone who cannot remember their password at all.
  const [mode, setMode]       = useState('login');
  const [email, setEmail]     = useState('');
  const [pw, setPw]           = useState('');
  const [code, setCode]       = useState('');
  const [newPw, setNewPw]     = useState('');
  const [name, setName]       = useState('');
  const [showPw, setShowPw]   = useState(false);
  const [err, setErr]         = useState('');
  const [loading, setLoading] = useState(false);
  // Set when sign-in was refused because a manager asked for a change, so the
  // form can explain itself instead of looking like a dead end.
  const [locked, setLocked]   = useState(false);

  // Shared by every PwField, passed down rather than closed over, so the fields
  // stay a single component identity.
  const pwProps = { showPw, onToggleShow: () => setShowPw(s => !s) };

  async function doLogin(e) {
    e.preventDefault(); setErr(''); setLoading(true);
    try {
      const data = await apiFetch('/tokens/authentication', {
        method:'POST', body:{ email, password:pw }
      });
      onLogin(data.user, data.token);
    } catch(ex) {
      // The password was accepted but a manager has asked for a new one, so the
      // server issued nothing. Send them to the reset form with the address
      // already filled in, rather than reporting a failure they cannot act on.
      if (ex.mustResetPassword) {
        setLocked(true);
        setErr('');
        setMode('forgot');
      } else {
        setErr(ex.message==='invalid authentication credentials' ? t.errWrongCreds : ex.message);
      }
    } finally { setLoading(false); }
  }

  async function doReset(e) {
    e.preventDefault(); setErr(''); setLoading(true);
    try {
      const data = await apiFetch('/password-change', {
        method:'POST', body:{ email, code, new_password:newPw }
      });
      // Signed in here: the server hands back a token only once a valid code has
      // been redeemed, and there is no old password left to prove anything with.
      onLogin(data.user, data.token);
    } catch(ex) {
      setErr(ex.message);
    } finally { setLoading(false); }
  }

  async function doRegister(e) {
    e.preventDefault(); setErr(''); setLoading(true);
    try {
      const data = await apiFetch('/users', {
        method:'POST', body:{ name, email, password:pw }
      });
      onLogin(data.user, data.token);
    } catch(ex) {
      setErr(ex.message);
    } finally { setLoading(false); }
  }

  /* ── self-service reset: email + manager's code + new password ── */
  function renderForgot() {
    return (
      <>
        <div className="auth-card-title">{t.forgotTitle}</div>
        <div className="auth-card-sub">{t.forgotSub}</div>
        {locked && (
          <div className="reset-note">{Ic.info} <span>{t.needCodeNote}</span></div>
        )}
        <form onSubmit={doReset}>
          <div className="form-group">
            <label htmlFor="auth-reset-email">{t.email}</label>
            {/* Arriving from a blocked sign-in, the address is already filled in,
                so the cursor belongs on the code instead. Coming in cold from the
                link, it belongs on the address. Exactly one of the two takes
                autoFocus — both cannot. */}
            <input id="auth-reset-email" className="form-control" type="email" placeholder={t.emailPlaceholder}
              value={email} onChange={e=>setEmail(e.target.value)} autoFocus={!locked} required/>
          </div>
          <div className="form-group">
            <label htmlFor="auth-reset-code">{t.resetCodeLabel}</label>
            {/* inputMode numeric and a letter-spaced monospace field: the code is
                six digits and someone is copying it off the back of a manager's
                hand, often one-handed. */}
            <input id="auth-reset-code" className="form-control reset-code-input" inputMode="numeric"
              placeholder="000000" maxLength={6} value={code} autoFocus={locked}
              onChange={e=>setCode(e.target.value.replace(/\D/g,''))}/>
            <div style={{fontSize:12,color:'var(--gray-500)',marginTop:5}}>
              {t.codeFromManager}
            </div>
          </div>
          <PwField id="auth-reset-pw" label={t.newPassword} value={newPw} onChange={setNewPw}
            placeholder="••••••••" {...pwProps}/>
          {newPw && newPw.length < 6 && (
            <div style={{fontSize:12,color:'var(--amber)',marginTop:4}}>{t.passwordTooShort}</div>
          )}
          {err && <div className="auth-error">{err}</div>}
          <button type="submit" className="btn btn-primary btn-full" style={{marginTop:4}}
            disabled={loading || code.length !== 6 || newPw.length < 6}>
            {loading ? '…' : t.changePassword}
          </button>
        </form>
        <button type="button" className="btn btn-ghost btn-full" style={{marginTop:8}}
          onClick={()=>{ setCode(''); setNewPw(''); setErr(''); setLocked(false); setMode('login'); }}>
          {t.backToSignIn}
        </button>
      </>
    );
  }

  function switchMode(m) {
    setMode(m); setErr(''); setEmail(''); setPw(''); setName('');
    setCode(''); setNewPw(''); setLocked(false);
  }

  return (
    <div className="auth-screen">
      <div className="auth-left">
        <div className="auth-brand">
          <div className="auth-logo">
            <div className="auth-logo-mark">{Ic.logo}</div>
            <span className="auth-logo-name">LIRA</span>
          </div>
          <div className="auth-headline">{t.authHeadline.split('\n').map((l,i)=><span key={i}>{l}{i===0&&<br/>}</span>)}</div>
          <div className="auth-sub">{t.authSub}</div>
        </div>
        <div className="auth-features">
          {t.authFeatures.map(f=>(
            <div className="auth-feature" key={f}><span className="auth-feature-dot"></span>{f}</div>
          ))}
        </div>
      </div>

      <div className="auth-right">
        <div className="auth-card">
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16,gap:8}}>
            <ThemeToggle theme={theme} onChange={onThemeChange}/>
            <LangToggle lang={lang} onChange={onLangChange}/>
          </div>
          {mode==='forgot' ? renderForgot() : (
          <>
          <div className="auth-card-title">{mode==='login' ? t.welcomeBack : t.createAccount}</div>
          <div className="auth-card-sub">{mode==='login' ? t.signIn : t.joinTeam}</div>

          {/* Why the sign-in form is here when the user did not ask for it. Shown
              on the login step only -- carrying it into "create account" or the
              reset form would be explaining a sign-out they are no longer on the
              path to. */}
          {notice && mode==='login' && (
            <div className="auth-notice" role="status">{Ic.info}<span>{notice}</span></div>
          )}

          <form className="auth-form" onSubmit={mode==='login' ? doLogin : doRegister}>
            {err && <div className="auth-error">{err}</div>}

            {mode==='register' && (
              <div className="form-group">
                <label htmlFor="auth-name">{t.fullName}</label>
                <input id="auth-name" className="form-control" placeholder={t.fullNamePlaceholder} value={name} onChange={e=>setName(e.target.value)} required />
              </div>
            )}
            <div className="form-group">
              <label htmlFor="auth-email">{t.email}</label>
              <input id="auth-email" className="form-control" type="email" placeholder={t.emailPlaceholder} value={email} onChange={e=>setEmail(e.target.value)} required />
            </div>
            <PwField id="auth-pw" label={t.password} value={pw} onChange={setPw}
              placeholder={mode==='register'?t.passwordPlaceholder:'••••••••'} {...pwProps}/>

            <button type="submit" className="btn btn-primary btn-full" style={{marginTop:4}} disabled={loading}>
              {loading ? '…' : (mode==='login' ? t.signInBtn : t.createBtn)}
            </button>
          </form>

          {mode==='login' && (
            <button type="button" className="auth-forgot-link"
              onClick={()=>{ setErr(''); setMode('forgot'); }}>
              {t.forgotPassword}
            </button>
          )}

          <div className="auth-toggle">
            {mode==='login'
              ? <>{t.noAccount} <button onClick={()=>switchMode('register')}>{t.signUp}</button></>
              : <>{t.haveAccount} <button onClick={()=>switchMode('login')}>{t.signInBtn}</button></>}
          </div>
          </>
          )}
        </div>
      </div>
    </div>
  );
}

/* Builds the recurring-issue warning sentence in the active language. */
function duplicateAlertMessage(lang, count, location, windowHours) {
  if (lang === 'pt') {
    return `Este tipo de avaria já ocorreu ${count} ${count===1?'vez':'vezes'} em ${location} nas últimas ${windowHours}h.`;
  }
  return `This issue type has happened ${count} ${count===1?'time':'times'} at ${location} in the last ${windowHours}h.`;
}

/* Computes whole minutes between two "HH:MM" times, treating an end time
   earlier than the start time as crossing midnight. Returns null when the
   inputs are missing or the duration works out to zero. */
function computeDurationMinutes(startTime, endTime) {
  if (!startTime || !endTime) return null;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  if ([sh,sm,eh,em].some(n => Number.isNaN(n))) return null;
  let diff = (eh*60+em) - (sh*60+sm);
  if (diff < 0) diff += 24*60; // crossed midnight
  return diff > 0 ? diff : null;
}
