    {label:'Real issues',      value: realCount,                    sub:'Something was wrong',            color:'var(--green)'},
  ] : [];

  const maxType = report ? Math.max(...Object.values(report.by_type), 1) : 1;
  const maxTech = report ? Math.max(...(report.by_technician||[]).map(t=>t.count), 1) : 1;

  return (
    <div>
      {/* Toolbar */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:22,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,background:'#fff',border:'1px solid var(--gray-200)',borderRadius:'var(--radius-md)',padding:'6px 12px'}}>
          {Ic.calendar}
          <input
            type="date" value={date} onChange={e=>setDate(e.target.value)}
            aria-label={t.historyPickDate}
            style={{border:'none',outline:'none',fontSize:13,fontFamily:'DM Sans,sans-serif',color:'var(--gray-900)',background:'transparent'}}
          />
        </div>
        <button className="btn btn-ghost" onClick={reload} disabled={loading}>
          {loading ? '…' : 'Refresh'}
        </button>
        <button className="btn btn-primary" onClick={downloadPDF} disabled={!report || loading || downloading}
          style={{marginLeft:'auto'}}>
          {Ic.download} {downloading ? 'Generating…' : 'Download PDF'}
        </button>
      </div>

      {error && (
        <div style={{background:'var(--red-light)',color:'var(--red)',borderRadius:'var(--radius-md)',padding:'10px 16px',fontSize:13,marginBottom:16}}>
          {error}
        </div>
      )}

      {loading && (
        <div style={{textAlign:'center',padding:'60px 0',color:'var(--gray-400)',fontSize:14}}>
          Loading report…
        </div>
      )}

      {report && !loading && (
        <>
          {/* Summary cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:22}}>
            {summaryCards.map(c=>(
              <div className="stat-card" key={c.label}>
                <div className="stat-label">{c.label}</div>
                <div className="stat-value" style={{color:c.color}}>{c.value}</div>
                <div className="stat-sub"><span className="stat-dot" style={{background:c.color}}></span>{c.sub}</div>
              </div>
            ))}
          </div>

          {/* Breakdowns */}
          <div className="bottom-grid" style={{marginBottom:22}}>
            <div className="mini-card">
              <div className="mini-card-title">Issues by type</div>
              {Object.keys(report.by_type).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No issues logged.</p>
                : Object.entries(report.by_type).sort((a,b)=>b[1]-a[1]).map(([type,count])=>(
                    <div className="bar-row" key={type}>
                      <div className="bar-label">
                        <span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:TYPE_COLORS[type]||'#888',flexShrink:0}}></span>
                        {type}
                      </div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(count/maxType)*100}%`,background:TYPE_COLORS[type]||'#888'}}></div></div>
                      <div className="bar-count">{count}</div>
                    </div>
                  ))
              }
            </div>
            <div className="mini-card">
              <div className="mini-card-title">By technician</div>
              {(report.by_technician||[]).length === 0
                ? <p style={{color:'var(--gray-400)',fontSize:13}}>No technicians.</p>
                : report.by_technician.map(ts=>(
                    <div className="bar-row" key={ts.user_id}>
                      <div className="bar-label"><Avatar name={ts.name} idx={ts.avatar_idx} size="sm"/>{ts.name}</div>
                      <div className="bar-track"><div className="bar-fill" style={{width:`${(ts.count/maxTech)*100}%`,background:'#1769AA'}}></div></div>
                      <div className="bar-count">{ts.count}</div>
                    </div>
                  ))
              }
            </div>
          </div>

          {/* Apt issues table */}
          {(report.apt_issues||[]).length > 0 && (
            <div className="table-card" style={{marginBottom:20}}>
              <div className="table-header">
                <span className="table-title">Apartment issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.apt_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Apt.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.apt_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td><IssueTime minutes={i.time_minutes} sla={slaMinutes} t={t}/></td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Dept issues table */}
          {(report.dept_issues||[]).length > 0 && (
            <div className="table-card">
              <div className="table-header">
                <span className="table-title">Department issues <span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}>({report.dept_issues.length})</span></span>
              </div>
              <table>
                <thead>
                  <tr><th>Dept.</th><th>Type</th><th>Problem</th><th>Resolution</th><th>Time</th><th>Status</th><th>Technician</th></tr>
                </thead>
                <tbody>
                  {report.dept_issues.map(i=>(
                    <tr key={i.id} className={i.false_positive ? 'fp-row' : ''}>
                      <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.location}</strong></td>
                      <td><TypeBadge type={i.type}/></td>
                      <td style={{maxWidth:140,fontSize:13}}>{i.problem}{i.false_positive && <div><span className="fp-badge">{Ic.check} {t.falsePositiveBadge}</span></div>}</td>
                      <td style={{maxWidth:180,fontSize:13,color:'var(--gray-600)'}}>{i.resolution||'—'}</td>
                      <td><IssueTime minutes={i.time_minutes} sla={slaMinutes} t={t}/></td>
                      <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                      <td>
                        <div style={{display:'flex',alignItems:'center',gap:7}}>
                          <Avatar name={i.logged_by_name} idx={i.logged_by_idx||0} size="sm"/>
                          <span style={{fontSize:13,color:'var(--gray-600)'}}>{i.logged_by_name}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Both tables came from one request and page together, so there is one
              footer for the pair. Neither table's own count is the count of rows
              the server sent -- each is capped at the same limit independently --
              so the pair is added up from the per-mode totals in the summary,
              which describe the whole day. */}
          <LoadMore list={paged} t={t}
            shown={Math.min(paged.limit, report.summary.apt_issues||0) + Math.min(paged.limit, report.summary.dept_issues||0)}
            total={(report.summary.apt_issues||0) + (report.summary.dept_issues||0)}/>

          {report.summary.total_issues === 0 && (
            <div className="table-card">
              <div className="empty-state">
                {Ic.report}
                <p>No issues logged on {report.date}.</p>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ════════════════ PROFILE PAGE ════════════════ */
function ProfilePage({ currentUser, token, onSessionUpdate, setToast, lang, onLangChange, slaMinutes }) {
  const t = T[lang];
  const [myStats,  setMyStats]  = useState(null);
  const [myIssues, setMyIssues] = useState([]);
  const [section,  setSection]  = useState('identity');
  const [saving,   setSaving]   = useState(false);

  // identity form
  const [name,     setName]     = useState(currentUser.name);
  const [email,    setEmail]    = useState(currentUser.email);
  const [pw,       setPw]       = useState('');
  const [pwConf,   setPwConf]   = useState('');
  const [pwErr,    setPwErr]    = useState('');
  const [idErr,    setIdErr]    = useState('');

  // avatar
  const [avatarData, setAvatarData] = useState(currentUser.avatar_data || '');
  const fileRef = useRef();

  useEffect(() => {
    Promise.all([
      apiFetch('/profile/stats',  {token}),
      apiFetch('/profile/issues?limit=10', {token}),
    ]).then(([sRes, iRes]) => {
      setMyStats(sRes.stats);
      setMyIssues((iRes.issues || []).map(mapIssue));
    }).catch(() => {});
  }, [token]);

  async function saveIdentity() {
    setIdErr(''); setSaving(true);
    if (pw && pw !== pwConf) { setPwErr('Passwords do not match.'); setSaving(false); return; }
    try {
      const body = { name, email };
      if (pw) body.password = pw;
      const res = await apiFetch('/profile', {method:'PATCH', body, token});
      onSessionUpdate(res.user);
      setPw(''); setPwConf(''); setPwErr('');
      setToast('Profile updated');
    } catch(ex) { setIdErr(ex.message); }
    finally { setSaving(false); }
  }

  async function saveAvatar(data) {
    try {
      const res = await apiFetch('/profile', {method:'PATCH', body:{avatar_data: data}, token});
      setAvatarData(data);
      onSessionUpdate(res.user);
      setToast('Avatar updated');
    } catch(ex) { setToast('Error: ' + ex.message); }
  }

  function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      // Resize using canvas
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 160;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        const sx = (img.width  - min) / 2;
        const sy = (img.height - min) / 2;
        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
        saveAvatar(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function saveLang(l) {
    onLangChange(l);
    try {
      await apiFetch('/profile', {method:'PATCH', body:{language: l}, token});
    } catch(ex) {}
  }

  const sections = [
    {id:'identity',    label:'Identity'},
    {id:'avatar',      label:'Avatar'},
    {id:'preferences', label:'Preferences'},
    {id:'activity',    label:'My Activity'},
  ];

  const statCards = myStats ? [
    {label:'Total issues',  value: myStats.total_issues, color:'#1769AA'},
    {label:'Resolved',      value: myStats.resolved,     color:'#2E8B57'},
    {label:'This week',     value: myStats.this_week,    color:'#D88A18'},
    {label:'Avg. time',     value: myStats.avg_minutes.toFixed(1)+'m', color:'#1D9E75'},
  ] : [];

  return (
    <div style={{maxWidth:720,margin:'0 auto'}}>

      {/* Profile header */}
      <div className="mini-card" style={{display:'flex',alignItems:'center',gap:20,marginBottom:20,padding:'20px 24px'}}>
        <div style={{position:'relative',flexShrink:0}}>
          <Avatar name={currentUser.name} idx={currentUser.avatar_idx} size="lg"
            src={avatarData || currentUser.avatar_data}
            style={{width:64,height:64,fontSize:22,border:'2px solid var(--gray-200)'}}/>
          <button onClick={()=>fileRef.current.click()}
            style={{position:'absolute',bottom:0,right:0,width:22,height:22,borderRadius:'50%',
              background:'var(--blue)',border:'2px solid #fff',cursor:'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="white" strokeWidth="2"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>
          </button>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleFileChange}/>
        </div>
        <div>
          <div style={{fontSize:18,fontWeight:600}}>{currentUser.name}</div>
          <div style={{fontSize:13,color:'var(--gray-400)',marginTop:2,display:'flex',alignItems:'center',gap:6}}>
            {currentUser.role==='manager' ? Ic.shield : Ic.tool}
            {currentUser.role==='manager' ? t.managerRole : t.techRole}
          </div>
          <div style={{fontSize:12,color:'var(--gray-400)',marginTop:2}}>{currentUser.email}</div>
        </div>
      </div>

      {/* Sub-nav */}
      <div style={{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid var(--gray-200)',paddingBottom:0}}>
        {sections.map(s=>(
          <button key={s.id} onClick={()=>setSection(s.id)}
            style={{padding:'8px 14px',border:'none',background:'none',cursor:'pointer',
              fontSize:13,fontWeight:500,fontFamily:'DM Sans,sans-serif',
              color: section===s.id ? 'var(--blue)' : 'var(--gray-600)',
              borderBottom: section===s.id ? '2px solid var(--blue)' : '2px solid transparent',
              marginBottom:-1}}>
            {s.label}
          </button>
        ))}
      </div>

      {/* ── Identity ── */}
      {section==='identity' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Personal information</div>
          {idErr && <div className="auth-error" style={{marginBottom:14}}>{idErr}</div>}
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="form-row">
              <div className="form-group">
                <label htmlFor="profile-name">Full name</label>
                <input id="profile-name" className="form-control" value={name} onChange={e=>setName(e.target.value)}/>
              </div>
              <div className="form-group">
                <label htmlFor="profile-email">Email address</label>
                <input id="profile-email" className="form-control" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
              </div>
            </div>
            <div style={{borderTop:'1px solid var(--gray-200)',paddingTop:14}}>
              <div style={{fontSize:13,fontWeight:600,color:'var(--gray-600)',marginBottom:12}}>Change password</div>
              {pwErr && <div style={{color:'var(--red)',fontSize:12,marginBottom:8}}>{pwErr}</div>}
              <div className="form-row">
                <div className="form-group">
                  <label htmlFor="profile-pw">New password</label>
                  <input id="profile-pw" className="form-control" type="password" placeholder="Min. 6 characters" value={pw} onChange={e=>{setPw(e.target.value);setPwErr('');}}/>
                </div>
                <div className="form-group">
                  <label htmlFor="profile-pw-confirm">Confirm password</label>
                  <input id="profile-pw-confirm" className="form-control" type="password" placeholder="Repeat new password" value={pwConf} onChange={e=>{setPwConf(e.target.value);setPwErr('');}}/>
                </div>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'flex-end'}}>
              <button className="btn btn-primary" onClick={saveIdentity} disabled={saving}>
                {Ic.check} {saving ? 'Saving…' : 'Save changes'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Avatar ── */}
      {section==='avatar' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Profile picture</div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20,padding:'20px 0'}}>
            {avatarData
              ? <img src={avatarData} style={{width:120,height:120,borderRadius:'50%',objectFit:'cover',border:'3px solid var(--gray-200)'}}/>
              : <div style={{width:120,height:120,borderRadius:'50%',background:'var(--blue-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40,fontWeight:600,color:'var(--blue)'}}>
                  {initials(currentUser.name)}
                </div>
            }
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-primary" onClick={()=>fileRef.current.click()}>
                {Ic.upload} Upload photo
              </button>
              {avatarData && (
                <button className="btn btn-ghost" onClick={()=>saveAvatar('')}>
                  Remove photo
                </button>
              )}
            </div>
            <div style={{fontSize:12,color:'var(--gray-400)',textAlign:'center'}}>
              JPG, PNG or GIF. Max 2MB. Will be cropped to a square.
            </div>
          </div>
        </div>
      )}

      {/* ── Preferences ── */}
      {section==='preferences' && (
        <div className="mini-card">
          <div className="mini-card-title" style={{marginBottom:18}}>Preferences</div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid var(--gray-200)'}}>
            <div>
              <div style={{fontSize:14,fontWeight:500}}>Language</div>
              <div style={{fontSize:12,color:'var(--gray-400)',marginTop:2}}>Choose your preferred display language</div>
            </div>
            <LangToggle lang={lang} onChange={saveLang}/>
          </div>
        </div>
      )}

      {/* ── Activity ── */}
      {section==='activity' && (
        <div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
            {statCards.map(c=>(
              <div className="stat-card" key={c.label}>
                <div className="stat-label">{c.label}</div>
                <div className="stat-value" style={{color:c.color}}>{c.value}</div>
              </div>
            ))}
          </div>
          <div className="table-card">
            <div className="table-header">
              <span className="table-title">Recent issues</span>
            </div>
            {myIssues.length === 0
              ? <div className="empty-state">{Ic.list}<p>No issues logged yet.</p></div>
              : <table>
                  <thead>
                    <tr>
                      <th>{currentUser.role==='apt' ? 'Apt.' : 'Location'}</th>
                      <th>Type</th><th>Problem</th><th>Status</th><th>Time</th><th>Date</th>
                    </tr>
                  </thead>
                  <tbody>
                    {myIssues.map(i=>(
                      <tr key={i.id}>
                        <td><strong style={{fontFamily:'DM Mono,monospace',fontSize:13}}>{i.apt||i.dept}</strong></td>
                        <td><TypeBadge type={i.type}/></td>
                        <td style={{maxWidth:160,fontSize:13}}>{i.problem}</td>
                        <td><span className={`badge ${i.status==='Ok'?'badge-ok':'badge-pending'}`}>{i.status}</span></td>
                        <td><IssueTime minutes={i.time} sla={slaMinutes} t={t}/></td>
                        <td style={{fontSize:12,color:'var(--gray-400)'}}>{i.createdAt}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>
      )}

    </div>
  );
}

/* ════════════════ ADMIN PAGE (managers only) ════════════════ */
/* ════════════════ SYSTEM STATUS ════════════════ */
function sysTone(value, warn, bad) {          // lower is better (usage %, latency ms)
  if (value == null) return 'gray';
  if (value >= bad) return 'red';
  if (value >= warn) return 'amber';
  return 'green';
}

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '—';
  const units = ['B','KB','MB','GB','TB'];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
}

function formatUptime(totalSeconds, t) {
  const d = Math.floor(totalSeconds / 86400);
  const h = Math.floor((totalSeconds % 86400) / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

// One of the four headline cards: an icon, a big value, and a usage gauge underneath.
function SysCard({ icon, label, tone, value, unit, gauge, sub, na }) {
  // The gauge refills every 60s as fresh readings arrive, so it is keyed on the
  // reading rather than on mount: each new value is worth watching move.
  const root = useAnimate((g, el, opts) => {
    MOTION.grow(g, el.querySelectorAll('.sys-gauge-fill'), 'x', 0, 1);
  }, [gauge]);
  return (
    <div className="sys-card" ref={root}>
      <div className="sys-card-head">
        <span className="sys-card-label">{label}</span>
        <span className={`sys-icon tone-${tone}`}>{icon}</span>
      </div>
      <div className={`sys-value tone-${tone}`}>{value}{unit && <span className="sys-unit">{unit}</span>}</div>
      {gauge != null && (
        <div className="sys-gauge-track"><div className={`sys-gauge-fill tone-${tone}`} style={{width:`${Math.min(gauge,100)}%`}}/></div>
      )}
      {na ? <div className="sys-na">{na}</div> : sub && <div className="sys-sub">{sub}</div>}
    </div>
  );
}

// Server health: CPU, RAM, and round-trip latency to the server and the database.
// Refetches on a fixed 60s clock (see REFRESH_MS) for as long as this page stays open.
const SYS_REFRESH_MS = 60000;

function SystemStatusPage({ token }) {
  const lang = React.useContext(LangCtx);
  const t = T[lang];
  const [data, setData] = useState(null);
  const [serverLatency, setServerLatency] = useState(null);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);
  const [secondsAgo, setSecondsAgo] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const lastFetchedAt = useRef(null);

  // manual: true for the on-demand button, so it can show its own spinner
  // without disturbing the (much less frequent) full-page loading state.
  const load = useCallback(async (manual) => {
    if (manual) setRefreshing(true);
    const start = performance.now();
    try {
      const res = await apiFetch('/system/status', { token });
      setServerLatency(Math.round(performance.now() - start));
      setData(res.system);
      setErr('');
    } catch (ex) {
      setErr(ex.message);
    } finally {
      lastFetchedAt.current = Date.now();
      setSecondsAgo(0);
      setLoading(false);
      if (manual) setRefreshing(false);
    }
  }, [token]);

  useEffect(() => {
    load(false);
    // The interval keeps its own fixed 60s cadence regardless of manual refreshes —
    // clicking "refresh now" gets you fresh data immediately without resetting the clock.
    const refresh = setInterval(load, SYS_REFRESH_MS);
    const tick = setInterval(() => {
      if (lastFetchedAt.current) setSecondsAgo(Math.round((Date.now() - lastFetchedAt.current) / 1000));
    }, 1000);
    return () => { clearInterval(refresh); clearInterval(tick); };
  }, [load]);

  if (loading) return <div className="empty-state">{Ic.server}<p>{t.sysRefreshing}</p></div>;

  const stale = !!err;
  const cpu = data?.cpu;
  const mem = data?.memory;
  const db = data?.database;
  const cpuTone = cpu?.available ? sysTone(cpu.percent, 60, 85) : 'gray';
  const memTone = mem?.system_wide ? sysTone(mem.percent, 70, 90) : 'gray';
  const srvTone = sysTone(serverLatency, 100, 300);
  const dbTone = db ? (db.reachable ? sysTone(db.latency_ms, 100, 300) : 'red') : 'gray';

  return (
    <div>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:18, flexWrap:'wrap', gap:10}}>
        <p style={{fontSize:13, color:'var(--gray-400)', margin:0}}>{t.systemStatusSub}</p>
        <div className="sys-live">
          <span className={`sys-live-dot ${stale ? 'stale' : ''}`}/>
          {stale ? t.sysStale : (secondsAgo < 2 ? t.sysUpdatedJustNow : t.sysUpdatedAgo.replace('{n}', secondsAgo))}
          <span style={{opacity:0.6}}>· {t.sysAutoRefresh}</span>
          <button type="button" className={`sys-refresh-btn ${refreshing ? 'spinning' : ''}`}
            onClick={()=>load(true)} disabled={refreshing} title={t.sysRefreshNow} aria-label={t.sysRefreshNow}>
            {Ic.refresh}
          </button>
        </div>
      </div>

      <div className="sys-grid">
        <SysCard icon={Ic.cpu} label={t.cpuUsage} tone={cpuTone}
          value={cpu?.available ? cpu.percent : '—'} unit={cpu?.available ? '%' : ''}
          gauge={cpu?.available ? cpu.percent : null}
          sub={cpu?.available ? `${cpu.cores} ${t.sysCores}` : null}
          na={!cpu?.available ? t.sysCpuUnavailable.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.server} label={t.ramUsage} tone={memTone}
          value={mem?.system_wide ? mem.percent : formatBytes(mem?.used_bytes)}
          unit={mem?.system_wide ? '%' : ''}
          gauge={mem?.system_wide ? mem.percent : null}
          sub={mem?.system_wide ? `${formatBytes(mem.used_bytes)} / ${formatBytes(mem.total_bytes)}` : null}
          na={!mem?.system_wide ? t.sysProcessOnly.replace('{os}', data?.os || '') : null}/>

        <SysCard icon={Ic.activity} label={t.latencyServer} tone={srvTone}
          value={serverLatency ?? '—'} unit="ms"
          sub="Round trip from your browser"/>

        <SysCard icon={Ic.database} label={t.latencyDatabase} tone={dbTone}
          value={db?.reachable ? db.latency_ms : (db ? '—' : '—')} unit={db?.reachable ? 'ms' : ''}
          sub={db && !db.reachable ? null : (db ? t.dbConnectionsSub.replace('{inUse}',db.in_use).replace('{idle}',db.idle).replace('{max}',db.max_open_connections) : null)}
          na={db && !db.reachable ? t.dbUnreachable : null}/>
      </div>

      <div className="mini-card">
        <div className="mini-card-title">{t.systemStatus}</div>
        <div className="sys-detail-grid">
          <div className="sys-detail-item"><div className="sys-detail-label">{t.uptime}</div><div className="sys-detail-value">{data ? formatUptime(data.uptime_seconds, t) : '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goroutines}</div><div className="sys-detail-value">{data?.goroutines ?? '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.serverOs}</div><div className="sys-detail-value" style={{textTransform:'capitalize'}}>{data?.os || '—'}</div></div>
          <div className="sys-detail-item"><div className="sys-detail-label">{t.goVersion}</div><div className="sys-detail-value">{data?.go_version || '—'}</div></div>
        </div>
      </div>
    </div>
  );
}

/* ── collapsed catalog lists ──
   Issue types, departments, Connecta agents and consumables are reference lists:
   most visits are about the one at the top, and the tail is scrolled past. So each
   shows its first few rows and opens on request.

   One constant and one button for all four, deliberately. Four copies of the same
   threshold and the same markup is how three of them end up at five and one at
   six, and a page where one list in a column behaves differently from the one above
   it reads as a bug rather than as a choice.

   Five rows, not five <tr>s. A consumable whose icon is being edited renders a
   second row underneath it, and counting rows would make that item look like two
   and hide a sixth item's worth of nothing.

   The count in each card's header is the real total and is left alone, so the
   length of the list is never a surprise -- only its tail is deferred. */
const ADMIN_PREVIEW_ROWS = 5;

/* Rooms get their own preview length, twice the other catalogs' five.

   A room run is much shorter than a catalog entry -- "1401-1412", a handful of
   characters -- so a list of five of them is a couple of lines of screen. Rooms
   are also added in floors, which means the list grows in visible steps and a
   manager checking whether a floor went in wants to see it without a click. Ten
   is still short enough that the load-more button stays meaningful on a hotel
   with many floors, which is the case it exists for. */
const ROOMS_PREVIEW_ROWS = 10;

// Rendered only while something is actually hidden, so a short list carries no
// button and no ruled footer. The number in brackets is what the click buys, which
// is the part that makes it safe to press without opening a dialog to find out.
function AdminShowMore({ hidden, label, onClick }) {
  if (!hidden) return null;
  return (
    <div className="table-footer">
      <button type="button" className="btn btn-ghost" onClick={onClick}>
        {label} ({hidden})
      </button>
    </div>
  );
}

/* Which Settings groups are open, remembered between visits.
   Re-deriving it every visit is part of what made the page feel unpredictable: a
   manager who had closed Departments to get at Rooms found Departments open
   again the next time they came looking, and had to put it back. Only a manager
   ever reaches this page, so there is no per-account state to keep apart, and a
   read that throws -- private browsing, storage disabled -- falls back to the
   caller's default rather than taking the page down with it. */
const SET_OPEN_KEY = 'lira_set_open_';
function setGroupPrefOpen(id, fallback) {
  try {
    const raw = localStorage.getItem(SET_OPEN_KEY + id);
    return raw === null ? fallback : raw === '1';
  } catch (e) { return fallback; }
}
function rememberSetGroupOpen(id, open) {
  try { localStorage.setItem(SET_OPEN_KEY + id, open ? '1' : '0'); } catch (e) { /* nothing to do */ }
}

/* One collapsible group, used at both levels of the page.
   The header is a single <button> rather than a heading with a toggle button
   beside it: the native element brings Enter, Space, the button role and a focus
   ring without any of it being reimplemented, and the whole 44px row is one tab
   stop instead of two. aria-expanded is what tells a screen reader whether the
   region below is there at all, which is the only thing a collapsed group needs
   announced -- hence no role="region" per group, which would put seven more
   landmarks in the way of someone trying to skim the page. */
function SetGroup({ id, icon, title, sub, count, level, defaultOpen, children }) {
  const [open, setOpen] = useState(() => setGroupPrefOpen(id, !!defaultOpen));
  const inner = useRef(null);

  // A collapsed group keeps its children in the DOM -- that is what lets the
  // height animate -- so its inputs would otherwise still take focus and a
  // keyboard user could tab into a panel they cannot see. inert drops the subtree
  // out of the tab order and out of the accessibility tree without removing the
  // node, so the transition still has something to measure. Set as a DOM property
  // rather than a JSX attribute because React 18 has no `inert` in its property
  // list and would render inert="true", which does nothing.
  useEffect(() => { if (inner.current) inner.current.inert = !open; }, [open]);

  const toggle = () => {
    const next = !open;
    setOpen(next);
    rememberSetGroupOpen(id, next);
  };

  const Heading = level === 1 ? 'h3' : 'h2';
  return (
    /* The id goes on the SECTION, not only in the aria-controls string below.

       SettingsPage's focusGroup effect finds its target with
       document.getElementById(focusGroup), so a group whose id exists only inside
       `id + '-body'` is invisible to it: the effect returns early and opens nothing.
       That silently broke every cross-page link into a Settings group -- including the
       rota's own "Define shifts" empty-state button, whose entire purpose is to land a
       manager on the shift catalog. Nothing errored and the destination page was right,
       which is why it went unnoticed: correct page, wrong target.

       The section is the element that has to be found, because that is what the effect
       walks up from and what scrollIntoView scrolls to. */
    <section id={id}
      className={'set-group' + (open ? ' open' : '') + (level === 1 ? ' set-group--sub' : '')}>
      <Heading style={{margin:0}}>
        <button type="button" className="set-group-head"
          aria-expanded={open} aria-controls={id + '-body'} onClick={toggle}>
          {icon && <span className="set-group-icon" aria-hidden="true">{icon}</span>}
          <span className="set-group-label">
            <span className="set-group-title">{title}</span>
            {sub && <span className="set-group-sub">{sub}</span>}
          </span>
          <span className="set-group-spacer" />
          {/* count != null, not count > 0: an empty catalog still has to say so
              on its collapsed header, or "empty" is indistinguishable from
              "not loaded". */}
          {count != null && <span className="set-group-count">{count}</span>}
          <span className="set-group-chev" aria-hidden="true">{Ic.chevron}</span>
        </button>
      </Heading>
      <div className="set-group-body" id={id + '-body'}>
        <div className="set-group-inner" ref={inner}>{children}</div>
      </div>
    </section>
  );
}

/* -- Weekly rota ----------------------------------------------------------
   A standing weekly pattern: who is on which shift on which weekday. The same
   seven answers every week until somebody changes them, which is why the week
   navigation below moves dates rather than data.

   Helpers first. Four of them, and three exist only because of the recurring
   design:

   - mondayISO: the week this date falls in. Built on the local calendar rather
     than toISOString(), for the reason the comment beside localISODate gives --
     a local Monday in a timezone west of UTC formats through toISOString as the
     Sunday before it, which here would make "next week" a dead button.
   - shiftISO: a day offset from a week anchor.
   - shiftMinutes: how long a shift occupies on the day it starts. The wrap is
     what makes 22:00-06:00 count as 8 hours rather than -16. end === start is
     refused by the server and never arrives, but the 0-to-1440 fallback keeps a
     malformed row from printing a negative week.
   - rotaWeekHours: the standing week's total for one member, which is the number
     that makes an uneven rota visible before anybody reads a word.
   The client computes the total rather than being told it because the server
   sends durations nowhere: Shift has no minutes field, and adding one would mean
   two places computing the same thing. */
function mondayISO(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return localISODate(x);
}
function shiftISO(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return localISODate(new Date(y, m - 1, d + n));
}
/* How many calendar days an inclusive [from, to] span covers, or 0 if it is not a
span at all.

   UTC throughout, and Date.UTC rather than dividing a duration by 24h -- the server's
Absence.DayCount says the same thing for the same reason: two LOCAL midnights are 23
or 25 hours apart in real time across a DST change, and a division then loses a day
twice a year. The form needs this to tell a manager how much they have just booked
while they are looking at a Monday-to-Sunday grid, which is exactly the range where a
DST boundary can fall inside it. */
function absenceDayCount(fromISO, toISO) {
  if (!fromISO || !toISO || toISO < fromISO) return 0;
  const [fy, fm, fd] = fromISO.split('-').map(Number);
  const [ty, tm, td] = toISO.split('-').map(Number);
  return Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000) + 1;
}

function isoToDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function shiftMinutes(s) {
  if (!s) return 0;
  const mins = t => {
    const [h, m] = String(t || '0:00').split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  };
  const raw = mins(s.end_time) - mins(s.start_time);
  return raw > 0 ? raw : raw + 1440;
}
function rotaWeekHours(member) {
  return (member.days || []).reduce((n, s) => n + shiftMinutes(s), 0);
}

/* The four reasons a person can be off on a date, and what each is allowed to look
   like.

   Order is how much each is allowed to disclose, which is not the order the schema
   lists them in and is the reason this is a list here rather than an enum.

   An absence is NOT a shift and never renders as one: no name, no hours, no rail. It
   is a hatch, a rule, a glyph and a word. Two absences may cover one date -- the
   server allows it, because sick leave inside a booked holiday is a real thing -- so
   absenceAt returns the FIRST and the cell shows that one.

   `--hue` is the per-kind accent. vacation is violet, which appears nowhere else in
   this application, so a reader who learns it once keeps it. away is a structural
   grey, deliberately: a generic absence is meant to be unremarkable, and grey is a
   colour no manager can pick as a shift tint. */
const ABSENCE_KINDS = [
  { id: 'vacation',    hue: 'var(--violet)' },
  { id: 'sick',        hue: 'var(--teal)' },
  { id: 'training',    hue: 'var(--green)' },
  { id: 'unavailable', hue: 'var(--gray-600)' },
];
const absenceKind = id => ABSENCE_KINDS.find(k => k.id === id) || ABSENCE_KINDS[3];
const absenceHue  = id => absenceKind(id).hue;
const absenceGlyph = {
  vacation: Ic.sun, sick: Ic.thermometer, training: Ic.cap, unavailable: Ic.slash,
};

/* The absence covering one person on one date, or null.

   `list` is already that person's absences -- SchedulePage groups the flat
   GET /v1/schedule array by user_id once rather than rescanning it per cell.

   Comparisons are string comparisons on "YYYY-MM-DD", which is what the server
   marshals JSONDate to and what week.days[i].date already carries. No Date objects
   anywhere in here, so there is no timezone to get wrong -- and this is exactly the
   trap the server-side Absences.Covers comment describes, where a `date` column
   scanned from Postgres is midnight UTC and the week's dates are local midnight.

   A run is a RANGE rather than seven per-week cells, and that is what lets this
   answer a question the per-week shape cannot: whether the absence carries on past
   the end of the week on screen. See the continuation marker in RotaTable. */
function absenceAt(list, iso) {
  if (!list || !iso) return null;
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    if (a.starts_on <= iso && iso <= a.ends_on) return a;
  }
  return null;
}

/* The hours that will ACTUALLY be worked this week.

   rotaWeekHours stays exactly as it is and stays the standing total: it is what the
   recurring rota says, and it is the number that has to survive an absence ending.
   This is the other number, and it is the one a manager is reconciling a week
   against -- somebody whose Wednesday is HOLIDAY is not working Wednesday's eight
   hours this week, and being told "16 h/week" for them is the one control that
   exists to make an uneven rota visible reporting it wrong.

   The two differ only when an absence covers a day that had a shift, so a rota with
   no absences renders identically to before. */
function rotaWorkedMinutes(member, week, absencesByUser) {
  const list = absencesByUser && absencesByUser.get(member.user_id);
  return (member.days || []).reduce((n, s, i) => {
    const d = week && week.days && week.days[i];
    if (d && absenceAt(list, d.date)) return n;
    return n + shiftMinutes(s);
  }, 0);
}

/* Grouped once per render rather than per cell: 42 cells times a scan of the whole
   absence list is 42 scans, and the grouping is also what lets a member be absent
   for a whole week be answered in O(1) per cell. */
function absencesByUser(absences) {
  const map = new Map();
  for (const a of (absences || [])) {
    if (!map.has(a.user_id)) map.set(a.user_id, []);
    map.get(a.user_id).push(a);
  }
  return map;
}

/* Where a fixed-position popover goes, and when it moves.

   ONE function, called on open, on scroll and on resize, so the three cannot disagree
   about which side the panel is on -- the failure mode when two of them compute
   placement independently is a panel that is correctly placed on open and wrong a
   second later.

   capture:true on the scroll listener because .content is the scroll container and
   scroll events do not bubble to window.

   The panel is position:fixed rather than absolutely positioned inside the cell, and
   NOT rendered through createPortal. A fixed box is positioned against the viewport and
   is not clipped by ancestor overflow, which matters because the cell sits under five
   clipping ancestors:

       .rota-table-wrap   overflow-x: auto     (the horizontal scroller)
       .table-card        overflow: hidden
       .content           overflow: auto      (the vertical scroller)
       .main              overflow: hidden
       .app               overflow: hidden

   Overflow clipping beats any z-index, so the panel's z-index:30 achieved nothing
   against .table-card and it was cut off at the card's edge on the bottom rows --
   measured 119px past the card at row 4 and 174px at row 5, on a 890px viewport.

   Why not createPortal, since react-dom exports it: it would break option clicks on
   arrival. The outside-click handler is
   `wrapRef.current.contains(e.target)`, and options carry onMouseDown={e => e.preventDefault()}
   -- which stops focus moving, not propagation. With the panel in document.body,
   wrapRef.contains(option) is false, so mousedown on an option closes the panel before
   the click fires and the button is already unmounted. Picking a shift would silently
   do nothing. A portal would turn a one-line CSS problem into a rewrite of the
   dismissal contract, and would also have to re-thread id and aria-controls across the
   DOM boundary. Keeping the panel a child of .rota-picker leaves all of that untouched.

   THE CONSTRAINT THAT MAKES position:fixed WORK, and the reason it is worth grepping
   for: an ancestor only re-captures a fixed descendant if it establishes a containing
   block, which means transform, perspective, filter, backdrop-filter, will-change
   (any of those four), contain: paint/layout/strict, or content-visibility. None of
   .rota-table-wrap, .table-card, .content, .main, .app or #root declares any of them
   today. Adding one -- an entry animation on .content is the obvious accident --
   silently puts this panel back inside the clip, and it fails as "the panel is cut
   off" rather than as an error. */
function useAnchoredPanel(open, anchorRef, panelRef, onAnchorGone) {
  const place = React.useCallback(() => {
    const a = anchorRef.current, p = panelRef.current;
    if (!a || !p) return;

    const r = a.getBoundingClientRect();

    // The anchor has left the viewport entirely. Following it would leave a keyboard
    // user holding a listbox they cannot see, so this closes instead. Scrolling the
    // page is fine; losing the thing you opened is not.
    if (r.bottom <= 0 || r.top >= window.innerHeight) {
      if (onAnchorGone) onAnchorGone();
      return;
    }

    const GAP = 4, M = 8;
    const vh = window.innerHeight, vw = window.innerWidth;
    const h = p.getBoundingClientRect().height;

    // Down if it fits below, otherwise up if it fits above, otherwise whichever side
    // has more room -- and that last branch is the only one that can scroll, because
    // the hook writes max-height to whatever room actually exists. At 358px of content
    // on a 890px viewport it is unreachable, which is the point: the requirement is
    // that the panel FITS rather than that it scrolls.
    const down = vh - r.bottom - GAP - M;
    const up   = r.top - GAP - M;
    const below = down >= h || down >= up;
    const room = Math.max(0, below ? down : up);

    p.style.maxHeight = room + 'px';
    p.style.top = (below ? r.bottom + GAP : r.top - GAP - Math.min(h, room)) + 'px';

    // One clamp, replacing the old `i >= 3` column threshold. That number was a
    // measurement of one panel width against one card width at one viewport width; the
    // only edge a fixed panel has to respect is the window's, and this is correct at
    // every width, sidebar width and zoom level.
    const w = p.getBoundingClientRect().width;
    p.style.left = Math.min(Math.max(M, r.left), Math.max(M, vw - M - w)) + 'px';
  }, [anchorRef, panelRef, onAnchorGone]);

  // useLayoutEffect, not useEffect: the panel has to be placed AFTER it has been
  // measured, and this is what guarantees it is painted in the right place before the
  // browser shows it. With a passive effect the first frame puts it at the top-left of
  // the viewport and then snaps it, which is visible.
  React.useLayoutEffect(() => { if (open) place(); }, [open, place]);

  React.useEffect(() => {
    if (!open) return;
    // One frame per scroll burst. There is only ever one open panel, so the cost is one
    // getBoundingClientRect per frame -- cheaper than the alternative of letting the
    // panel drift away from its cell while the grid scrolls under it.
    let raf = 0;
    const tick = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; place(); });
    };
    window.addEventListener('scroll', tick, true);
    window.addEventListener('resize', tick);
    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('scroll', tick, true);
      window.removeEventListener('resize', tick);
    };
  }, [open, place]);

  return place;
}

/* One cell's shift chooser.
   The DISMISSAL geometry, the outside-click mousedown and the capture-phase Escape
   handler are RoomPicker's, deliberately. A second popover in this file would mean a
   second set of answers to the questions .room-picker already answers -- what Escape
   does, what a click outside does, whether the panel survives the dialog that owns
   it -- and the two would drift.

   The POSITIONING is not RoomPicker's, and cannot be: it sits in a form with room
   below it, whereas a cell in a 49-cell grid sits under five clipping ancestors, so
   the panel here is position:fixed and placed by useAnchoredPanel above. It used to
   take two props instead -- alignRight={i >= 3} and openUp={false} -- which were a
   measurement of one panel width against one card width at one viewport width, and
   which left the lower rows clipped anyway. */
function RotaPicker({ cellId, value, shifts, absence, onPick, onAddAbsence,
                       onEditAbsence, onRemoveAbsence, memberName, range, selected, selEnd,
                       autoOpen, t }) {
  const [open, setOpen] = useState(false);
  const [cursor, setCursor] = useState(0);
  const wrapRef = useRef(null);
  const panelRef = useRef(null);
  const listId = cellId + '-options';

  // Placement, and only placement. Focus stays on the cell and aria-activedescendant
  // moves -- which is the opposite of what useDialog does, and is why this picker
  // deliberately does not use it.
  useAnchoredPanel(open, wrapRef, panelRef, () => setOpen(false));

  // Opened by a drag rather than by a click. autoOpen is a NONCE, not a boolean:
  // selecting the same cell twice has to open the panel twice, and a boolean that is
  // already true sees no change and does nothing.
  useEffect(() => { if (autoOpen) setOpen(true); }, [autoOpen]);

  useEffect(() => {
    if (!open) return;
    const away = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    // Capture phase, and it claims the event -- the same reason RoomPicker does
    // it: Escape should dismiss this panel and leave the page it belongs to
    // alone, and capture reliably runs ahead of a bubble-phase listener on
    // document whatever order they were attached in.
    const esc = e => {
      if (e.key !== 'Escape') return;
      e.claimedByDialog = true;
      setOpen(false);
    };
    document.addEventListener('mousedown', away);
    document.addEventListener('keydown', esc, true);
    return () => {
      document.removeEventListener('mousedown', away);
      document.removeEventListener('keydown', esc, true);
    };
  }, [open]);

  // "Day off" first, then every shift in the order a day happens, then the four
  // absence kinds. ONE flat list, not two: a listbox may only contain options, and a
  // second list would mean a second roving cursor, a second End, and a second set of
  // answers to "where does Down go from here".
  //
  // The current choice is in that list already, so it is picked by clicking it again
  // rather than by a separate control that would have to mean the same thing.
  const shiftOpts = [{off: true, name: t.rotaDayOff, start_time: '', end_time: '', overnight: false}]
    .concat(shifts.map(s => ({ ...s })));
  const options = shiftOpts.concat(ABSENCE_KINDS.map(k => ({ abs: k.id, name: t.rotaAbsKind[k.id] })));
  // Where the absences begin, and therefore where the separator and the second
  // heading go. A named constant rather than an index into `options` at two places,
  // because the positions drift together the moment a shift is added.
  const sepAt = shiftOpts.length;

  const chosenIdx = value
    ? options.findIndex(o => !o.off && o.id === value.id)
    : 0;

  const choose = o => {
    // An absence is not a rota cell, so it does not go through onPick. It opens the
    // dialog and saves itself there -- absence writes are immediate, like a retire in
    // the Settings card, and folding them into a draft that Cancel could throw away
    // would make a holiday something a manager could lose by changing their mind
    // about a shift.
    if (o.abs) { setOpen(false); onAddAbsence && onAddAbsence(o.abs); return; }
    onPick(o.off ? null : o);
    setOpen(false);
  };

  const onKeyDown = e => {
    if (!open) {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
        setOpen(true);
        setCursor(Math.max(chosenIdx, 0));
        e.preventDefault();
      }
      return;
    }
    if (e.key === 'ArrowDown') { setCursor(c => Math.min(c + 1, optionCount - 1)); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { setCursor(c => Math.max(c - 1, 0)); e.preventDefault(); }
    else if (e.key === 'Home') { setCursor(0); e.preventDefault(); }
    else if (e.key === 'End') { setCursor(optionCount - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') {
      // Enter picks the highlighted option. With nothing highlighted it is left
      // alone, so the key still does whatever the key does outside a picker.
      // Enter on an absent cell's panel picks whatever is highlighted, which is the
      // three-item list rather than a shift. So the dispatch has to know which panel
      // it is in -- and for this one it opens a dialog instead of writing a cell.
      if (absence) {
        if (cursor === 0) { setOpen(false); }
        else if (cursor === 1) { setOpen(false); onEditAbsence && onEditAbsence(absence); }
        else { setOpen(false); onRemoveAbsence && onRemoveAbsence(absence); }
        e.preventDefault();
        return;
      }
      if (options[cursor] !== undefined) { choose(options[cursor]); e.preventDefault(); }
    }
  };

  // The number of options in the panel that is OPEN, not the shift list's length.
  // An absent cell's panel has three, and Home/End/ArrowDown must address those or a
  // keyboard user can move the cursor onto an option that is not there.
  const optionCount = absence ? 3 : options.length;
  const optionId = i => listId + '-' + i;
  const activeId = (open && options[cursor] !== undefined) ? optionId(cursor) : undefined;

  return (
    <div className="rota-picker" ref={wrapRef}>
      <button type="button"
        className={'rota-cell' + (absence ? ' is-away' : (value ? '' : ' is-off')) +
          (value && value.overnight ? ' is-night' : '') +
          (value && value.color ? ' is-tinted' : '') +
          (selected ? ' is-sel' : '') + (selEnd ? ' is-sel-end' : '') + ' is-editable'}
        /* ONE style attribute answering both features: the absence ink when the day
           is an absence, otherwise the shift's tint. An untinted cell gets a null
           style and keeps its own background, which is what makes it render exactly
           as it did before the tint existed. */
        style={absence ? { '--abs-ink': absenceHue(absence.kind) } : tintStyle(value)}
        role="combobox"
        aria-expanded={open}
        aria-controls={listId}
        aria-activedescendant={activeId}
        aria-haspopup="listbox"
        onClick={() => { setOpen(o => !o); setCursor(Math.max(chosenIdx, 0)); }}
        onKeyDown={onKeyDown}>
        {absence
          ? <>
              {/* The same four cues as the read-only cell -- hatch, glyph, word --
                  so a cell does not change shape when a manager presses Edit. */}
              <span className="rota-cell-hatch" aria-hidden="true"/>
              <span className="rota-cell-kind" aria-hidden="true">
                {absenceGlyph[absence.kind]}
              </span>
              <span className="rota-cell-absword">{t.rotaAbsShort[absence.kind]}</span>
            </>
          : value
          ? <>
              <span className="rota-cell-name">{value.name}</span>
              {/* "+1" on the name's baseline, so it reads as part of the shift
                  rather than as a badge stuck on the side. */}
              {value.overnight && <span className="rota-cell-plus1">+1</span>}
            </>
          : <span aria-hidden="true">&mdash;</span>}
      </button>

      {open && (
        <div className="rota-picker-panel" ref={panelRef}
          id={listId} role="listbox">
          {/* An absent cell's panel, and it REPLACES the shift list rather than
              sitting under a disabled copy of it. That is where the rule "you cannot
              set a shift on a day somebody is away" is actually enforced: setCell is
              never called, because the options that would call it are not rendered at
              all. Showing a list of shifts that cannot be chosen only invites the
              click. */}
          {absence ? (
            <>
              <div className="rota-abs-locked">{t.rotaCellLabelAway
                .replace('{name}', memberName)
                .replace('{kind}', t.rotaAbsKind[absence.kind])}</div>
              <button type="button" role="option" id={optionId(0)} aria-selected="true"
                className={'rota-option is-abs rota-option-chosen' + (cursor === 0 ? ' active' : '')}
                style={{ '--abs-ink': absenceHue(absence.kind) }}
                onMouseEnter={() => setCursor(0)}
                onMouseDown={e => e.preventDefault()}
                onClick={() => setOpen(false)}>
                <span className="rota-option-tick">{Ic.check}</span>
                <span className="rota-option-kind" aria-hidden="true">
                  {absenceGlyph[absence.kind]}
                </span>
                <span className="rota-option-name">{t.rotaAbsKind[absence.kind]}</span>
                <span className="rota-option-hours">
                  {absence.starts_on.slice(5)}&ndash;{absence.ends_on.slice(5)}
                </span>
              </button>
              <button type="button" role="option" id={optionId(1)} aria-selected="false"
                className={'rota-option' + (cursor === 1 ? ' active' : '')}
                onMouseEnter={() => setCursor(1)}
                onMouseDown={e => e.preventDefault()}
                onClick={() => { setOpen(false); onEditAbsence && onEditAbsence(absence); }}>
                {Ic.edit}<span className="rota-option-name">{t.rotaAbsEditOption}</span>
              </button>
              <button type="button" role="option" id={optionId(2)} aria-selected="false"
                className={'rota-option' + (cursor === 2 ? ' active' : '')}
                onMouseEnter={() => setCursor(2)}
                onMouseDown={e => e.preventDefault()}
                onClick={() => { setOpen(false); onRemoveAbsence && onRemoveAbsence(absence); }}>
                {Ic.trash}<span className="rota-option-name">{t.rotaAbsRemoveOption}</span>
              </button>
              <div className="rota-picker-foot">{t.rotaAbsLocked}</div>
            </>
          ) : options.map((o, i) => {
            const selected = o.off ? !value : (!!value && o.id === value.id);
            return (
              <React.Fragment key={o.abs ? 'abs-' + o.abs : (o.off ? 'off' : o.id)}>
              {/* Both headings, not just a rule. A separator says "there are two
                  lists"; a heading says what the second one IS, and rotaChooseShift --
                  defined in both tables and used nowhere until now -- is exactly the
                  first one's caption. aria-hidden, because the option COUNT a screen
                  reader sees has to stay equal to options.length for End and for
                  aria-activedescendant to mean anything. */}
              {i === 1 && <div className="rota-picker-subhead" role="presentation" aria-hidden="true">{t.rotaChooseShift}</div>}
              {i === sepAt && <>
                <div className="rota-picker-sep" role="presentation" aria-hidden="true"/>
                <div className="rota-picker-subhead" role="presentation" aria-hidden="true">{t.rotaAbsGroupHead}</div>
              </>}
              <button type="button"
                role="option"
                id={optionId(i)}
                aria-selected={selected}
                className={'rota-option' + (i === cursor ? ' active' : '') +
                  (selected ? ' rota-option-chosen' : '') + (o.overnight ? ' is-night' : '') +
                  (o.color ? ' is-tinted' : '') + (o.abs ? ' is-abs' : '')}
                style={o.abs ? { '--abs-ink': absenceHue(o.abs) } : tintStyle(o)}
                onMouseEnter={() => setCursor(i)}
                onMouseDown={e => e.preventDefault()}   // keep focus so the panel stays open
                onClick={() => choose(o)}>
                {selected && <span className="rota-option-tick">{Ic.check}</span>}
                {/* A separate 10px circle BEFORE the name, never a second rail: shape
                    discipline is what keeps the tint apart from the overnight edge
                    beside it. */}
                {o.color && <span className="rota-tint-dot" style={dotStyle(o.color)}/>}
                {o.abs && <span className="rota-option-kind" aria-hidden="true">{absenceGlyph[o.abs]}</span>}
                <span className="rota-option-name">{o.name}</span>
                {/* In the flow, immediately after the name -- NOT at the panel's right
                    edge. The panel is 226px wide inside an 85px column inside a
                    horizontally scrolling wrapper, so on a right-hand column it is
                    clipped at the right (27px over at column 3, 158px at column 6 --
                    pre-existing, and the same with or without this feature). Anything
                    pinned to that edge is the first thing to disappear, and this badge
                    carries the fact the manager most needs before choosing. It also
                    reads better here: the multiplier belongs beside the thing it
                    multiplies, not adrift at the far end of the row. */}
                {range && !o.abs && range.applicable > 1 &&
                  <span className="rota-option-multi">{range.applicable}&times;</span>}
                {!o.off && !o.abs && <span className="rota-option-hours">
                  {o.start_time}&ndash;{o.end_time}{o.overnight ? t.rotaPlusOne : ''}
                </span>}
                {/* The same badge the legend uses. A retired shift reaches
                    this list through a cell that is still assigned to it, which
                    is the only way it can be here at all -- so the picker is
                    exactly where the badge is needed most. */}
                {!o.off && !o.abs && o.active === false &&
                  <span className="rota-legend-retired">{t.rotaRetired}</span>}
              </button>
              </React.Fragment>
            );
          })}
          {/* What choosing here will do, before it does it. The second sentence
              exists because the first is not always the whole truth: a run can span
              a day somebody is away, and those days are skipped rather than refused --
              and a manager told "sets 6 days" who watches 5 change has been misled by
              omission. */}
          {range && range.applicable > 0 && (
            <div className="rota-picker-foot">
              {range.applicable < range.count
                ? t.rotaSelSetsSome.replace('{n}', range.applicable)
                                    .replace('{count}', range.count)
                : t.rotaSelSets.replace('{count}', range.count)}
            </div>
          )}
          {!absence && !range && shifts.length === 0 && (
            /* Reachable only in the narrow window where a manager has deleted
               every shift while the grid they came from is still on screen. NOT shown
               on an absent cell: that panel has three options and a foot that already
               explains itself, and "no shifts defined" there would read as a warning
               about the absence. */
            <div className="rota-picker-foot">{t.rotaNoShiftsHead}</div>
          )}
        </div>
      )}
    </div>
  );
}

/* The rota grid, in view mode.
   Split from SchedulePage so the read-only rendering has no `editing` branch
   anywhere inside it -- an anonymous visitor and a manager looking at the rota
   produce byte-identical DOM here, which is the only way to be sure the
   permission flag cannot produce a rendering difference nobody looked at. */
function RotaTable({ t, week, members, shifts, absences, editing, draft, setCell,
                      onAddAbsence, onEditAbsence, onRemoveAbsence }) {
  const shown = editing ? (draft || []) : members;
  const gridRef = useRef(null);

  // Grouped once per render rather than per cell, and the same map answers both the
  // per-day lookup and the "is this person away all week" question below.
  const absByUser = useMemo(() => absencesByUser(absences), [absences]);
  // ---- Range selection ------------------------------------------------------
  //
  // One person's run of days, inside one row. `anchor` is the cell the run grew FROM
  // and never moves; `from`/`to` are its bounds, always ordered.
  //
  // The anchor is in the state rather than re-derived from the focused cell, and that
  // is the whole design. Without it, Shift+ArrowLeft has to work out which end of the
  // range is "towards the key" from where the focus happens to be, and gets it wrong
  // the moment the range was made by dragging right-to-left -- at which point holding
  // the key walks the selection back and forth over itself.
  const [sel, setSel] = useState(null);
  // Which cell's picker to open, plus a nonce so the SAME cell can be re-opened.
  //
  // A drag cannot open a picker by itself. Once the pointer is captured, the click the
  // browser synthesises after pointerup is dispatched to the captured element -- the
  // cell the drag started on -- or to the nearest common ancestor of the two cells,
  // which is the <tr>. Neither is the cell the manager let go over, so the panel would
  // open in the wrong place or not at all. Hence an explicit instruction, and hence the
  // nonce: a boolean would see "still open on this cell" and do nothing.
  const [openAt, setOpenAt] = useState(null);
  const dragRef = useRef(null);
  const swallowRef = useRef(false);

  // Where a pointer is over the grid, as a day index in THIS row, or -1.
  //
  // Hit-tested rather than derived from column geometry: the grid scrolls horizontally
  // inside .rota-table-wrap, the columns are not equal width, and a geometry answer has
  // to know about the scroll offset -- which is a second implementation of the layout,
  // and a second thing to keep correct when the layout changes. What the browser says
  // a point is over IS the layout.
  //
  // Same ROW only, and that check is the feature's boundary rather than a defensive
  // guard: a run crossing into another person would break the save bar's count, which
  // counts people, and would make one gesture write two rows.
  const dayAt = (x, y, tr) => {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.closest) return -1;
    const td = el.closest('td[data-rota-i]');
    if (!td || td.parentElement !== tr) return -1;
    const n = Number(td.getAttribute('data-rota-i'));
    return Number.isInteger(n) ? n : -1;
  };

  const onDayPointerDown = (e, m, i) => {
    if (!editing) return;
    if (e.button !== undefined && e.button !== 0) return;   // right-click is not a drag
    dragRef.current = {
      userId: m.user_id, i, tr: e.currentTarget.parentElement,
      x: e.clientX, y: e.clientY, pointerId: e.pointerId,
      dragging: false, last: i,
    };
    // Deliberately NO capturePointer yet. Below the threshold this gesture has to be
    // indistinguishable from a plain click, and capturing on pointerdown changes which
    // element the click is dispatched to -- which is the mechanism the plain click
    // depends on. Capture is claimed by the first move that commits to being a drag.
  };

  const onDayPointerMove = (e, m) => {
    const d = dragRef.current;
    if (!d || d.pointerId !== e.pointerId) return;

    if (!d.dragging) {
      // 6px, as a straight-line distance. A click is a press and a release a pixel or
      // two apart, and a trackpad's resting tremor is routinely more than the 1px that
      // would read as "obviously not a drag" -- but 6px is still a small fraction of a
      // cell's width, so a manager who means to drag never has to leave the cell they
      // started in to commit to it.
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6) return;
      d.dragging = true;
      try { e.currentTarget.setPointerCapture(d.pointerId); } catch (_) {}
      setSel({ userId: d.userId, anchor: d.i, from: d.i, to: d.i });
    }

    const j = dayAt(e.clientX, e.clientY, d.tr);
    if (j < 0) return;          // off the row: the run holds rather than collapsing
    d.last = j;
    const lo = Math.min(d.i, j), hi = Math.max(d.i, j);
    setSel(s => (s && s.from === lo && s.to === hi) ? s
                                             : { userId: d.userId, anchor: d.i, from: lo, to: hi });
  };

  const onDayPointerUp = (e, m) => {
    const d = dragRef.current;
    if (!d || d.pointerId !== e.pointerId) return;
    dragRef.current = null;
    if (!d.dragging) return;        // a click, not a drag. The button's handler owns it.
    try { e.currentTarget.releasePointerCapture(d.pointerId); } catch (_) {}

    // Swallow the click the browser is about to synthesise: with the pointer captured
    // on the cell the drag started on, that click opens the ANCHOR's picker, right
    // beside the one about to open at the far end. Cleared by the click itself; the
    // timeout is for the drags that end WITHOUT one -- released outside the window,
    // pointer cancelled -- which would otherwise eat the manager's next click.
    swallowRef.current = true;
    setTimeout(() => { swallowRef.current = false; }, 0);

    // Open at the far end, where the eye already is -- unless that day is an absence.
    // An absent cell's panel offers Edit and Remove and no shift at all, so a run that
    // happened to finish on one would be unappliable. The first day in the run that CAN
    // take a shift gets the panel instead, which is the only case where the panel does
    // not open under the pointer.
    const list = absByUser.get(d.userId) || [];
    const lo = Math.min(d.i, d.last), hi = Math.max(d.i, d.last);
    let target = absenceAt(list, week.days[d.last].date) ? -1 : d.last;
    if (target < 0) {
      for (let k = lo; k <= hi; k++) {
        if (!absenceAt(list, week.days[k].date)) { target = k; break; }
      }
    }
    if (target < 0) return;        // the whole run is absence: there is nothing to set
    setOpenAt(a => ({ userId: d.userId, i: target, nonce: (a ? a.nonce : 0) + 1 }));
  };

  const onGridClickCapture = e => {
    if (!swallowRef.current) return;
    swallowRef.current = false;
    // Capture phase, so this runs before the cell button's own onClick. stopPropagation
    // from a capture handler stops the rest of React's dispatch tree, which is what
    // keeps the anchor's picker from opening underneath the one we just asked for.
    e.stopPropagation();
    e.preventDefault();
  };

  const onDayKeyDown = (e, m, i) => {
    if (!editing) return;

    if (e.key === 'Escape') {
      if (sel && sel.userId === m.user_id) { setSel(null); e.preventDefault(); }
      return;
    }
    if (!e.shiftKey) return;
    const left = e.key === 'ArrowLeft', right = e.key === 'ArrowRight';
    const home = e.key === 'Home', end = e.key === 'End';
    if (!(left || right || home || end)) return;

    // aria-expanded rather than a prop: the panel's open state is the truth, and it is
    // already published on the control for assistive technology. Reading it back means
    // the two can never disagree.
    const cell = e.target && e.target.closest && e.target.closest('.rota-cell');
    if (cell && cell.getAttribute('aria-expanded') === 'true') return;

    const n = week.days.length;
    const mine = sel && sel.userId === m.user_id ? sel : null;
    const anchor = mine ? mine.anchor : i;
    let from, to;
    if (home) {
      from = 0; to = anchor;
    } else if (end) {
      from = anchor; to = n - 1;
    } else if (left) {
      // Grow leftward: the left edge moves one further out, the right edge never comes
      // back in. That is what makes holding the key widen the run instead of shrinking
      // it and bouncing off the anchor.
      from = Math.max(0, (mine ? mine.from : anchor) - 1);
      to = Math.max(anchor, mine ? mine.to : anchor);
    } else {
      from = Math.min(anchor, mine ? mine.from : anchor);
      to = Math.min(n - 1, (mine ? mine.to : anchor) + 1);
    }
    setSel({ userId: m.user_id, anchor, from, to });
    // Focus stays on the anchor. The cell being extended FROM is the one the manager is
    // looking at, and moving focus would put the focus ring at the far end of a run
    // whose whole point is being able to see where it started.
    e.preventDefault();
  };

  const inSel = (m, i) => !!(sel && sel.userId === m.user_id && i >= sel.from && i <= sel.to);

  // What the panel needs to say about the run: how many days it covers, and how many of
  // them will actually change.
  const rangeFor = (m, i) => {
    if (!inSel(m, i) || !sel) return null;
    const list = absByUser.get(m.user_id) || [];
    let applicable = 0;
    for (let k = sel.from; k <= sel.to; k++) {
      if (!absenceAt(list, week.days[k].date)) applicable++;
    }
    return { count: sel.to - sel.from + 1, applicable };
  };

  const applyPick = (m, i, s) => {
    const r = sel && sel.userId === m.user_id && i >= sel.from && i <= sel.to ? sel : null;
    setSel(null);
    if (!r) { setCell(m.user_id, i, s); return; }
    const list = absByUser.get(m.user_id) || [];
    for (let k = r.from; k <= r.to; k++) {
      // Absent days inside a run are SKIPPED, not refused. One sick day must not stop a
      // manager setting the other six, and the panel says how many of the N will
      // change -- so the skip is stated in advance rather than discovered afterwards.
      if (!absenceAt(list, week.days[k].date)) setCell(m.user_id, k, s);
    }
  };

  // A run belongs to one week. Changing week or leaving edit mode drops it, rather than
  // leaving a selection painted on cells it no longer describes.
  useEffect(() => { setSel(null); setOpenAt(null); }, [week.start, editing]);

  // Entering edit mode hands focus to the grid's first real cell. On the way out
  // it is left alone: the segmented control is still on screen, so a Tab from
  // wherever the focus ended up still lands somewhere sensible.
  useEffect(() => {
    if (!editing) return;
    const first = gridRef.current && gridRef.current.querySelector('.rota-cell.is-editable');
    if (first) first.focus();
  }, [editing]);

  const peopleOn = shiftId => members.filter(m => (m.days || []).some(d => d && d.id === shiftId)).length;

  return (
    <div className="rota-table-wrap" ref={gridRef} onClickCapture={onGridClickCapture}>
      <table className="rota-table">
        <caption className="sr-only">
          {t.rotaTitle} &mdash; {week.start} to {week.end}
        </caption>
        <thead>
          <tr>
            <th scope="col" className="rota-name-head">{t.rotaNameColumn}</th>
            {week.days.map((d, i) => (
              <th key={d.weekday} scope="col"
                className={d.is_today ? 'rota-headcol-today' : undefined}
                aria-current={d.is_today ? 'date' : undefined}>
                {t.rotaDays[d.weekday - 1] || d.label}
                <span className="rota-daynum">{d.date.slice(8)}</span>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {shown.map(m => {
            const list = absByUser.get(m.user_id) || [];
            const mins = rotaWeekHours(m);
            // What will actually be worked, which is not what the recurring rota says
            // once an absence covers a day that had a shift.
            const worked = rotaWorkedMinutes(m, week, absByUser);
            const awayMins = mins - worked;
            const free = !(m.days || []).some(Boolean);

            // "Not on this rota" and "away all week" are DIFFERENT statements and must
            // never be the same pill. The stored week of somebody on holiday all week
            // is usually all-null, so the plain `free` test calls them "not on this
            // rota" -- which is false. They are on the rota. They are away. That is
            // exactly the confusion this feature exists to prevent, arriving through
            // the back door.
            const awayAll = free && week.days.every(d => absenceAt(list, d.date));
            const freeLabel = awayAll ? t.rotaFreeAway : t.rotaFreeWeek;

            return (
              <tr key={m.user_id} className={m.active ? undefined : 'rota-inactive'}>
                <th scope="row" className="rota-name-cell">
                  <div className="rota-member">
                    <Avatar name={m.name} idx={m.avatar_idx} size="sm"/>
                    <span className="rota-member-text">
                      <span className="rota-member-name">{m.name}</span>
                      {free
                        ? <span className={'rota-free' + (awayAll ? ' is-away' : '')}>
                            {awayAll && <span aria-hidden="true">{Ic.slash}</span>}
                            {freeLabel}
                          </span>
                        : <>
                            <div className="rota-member-hours">
                              {t.rotaHoursLabel.replace('{hours}', (worked / 60).toFixed(worked % 60 ? 1 : 0))}
                            </div>
                            {/* The hours lost to an absence, named on its own line. A
                                struck-through standing total would be two numbers in one
                                column, and this grid has exactly one column for totals. */}
                            {awayMins > 0 && <span className="rota-away-hours">
                              {Ic.slash}
                              {t.rotaAbsHoursAway.replace('{hours}', (awayMins / 60).toFixed(awayMins % 60 ? 1 : 0))}
                            </span>}
                          </>}
                    </span>
                  </div>
                  {/* How many days the run covers, on the row it belongs to. The name
                      cell is the one place in this row with room for words, and a
                      count floating off to the side would be describing a gesture
                      rather than a person. */}
                  {sel && sel.userId === m.user_id && (
                    <span className="rota-sel-count">
                      {sel.to - sel.from + 1 === 1
                        ? t.rotaSelOneDay
                        : t.rotaSelDays.replace('{count}', sel.to - sel.from + 1)}
                    </span>
                  )}
                </th>
                {week.days.map((d, i) => {
                  const shift = (m.days || [])[i] || null;
                  // The absence covering this date, if any. An absence BEATS the
                  // recurring shift for that day, and -- the point -- the shift is
                  // not erased: Days[i] stays exactly as the pattern says it, so a
                  // manager can still see what the rota has them on that weekday and
                  // move it when the absence ends. Precedence is not deletion.
                  const absence = absenceAt(list, d.date);
                  const cellId = 'rota-u' + m.user_id + '-d' + (i + 1);
                  // "Nobody on this rota" and "a day off" both print a dash, and
                  // aria-label is what tells them apart -- the row badge already
                  // carries the first, so the cell only has to carry the second.
                  const label = shift
                    ? t.rotaCellLabel.replace('{name}', m.name).replace('{shift}', shift.name)
                    : (editing
                        ? t.rotaCellLabelUnset.replace('{name}', m.name)
                        : t.rotaCellLabelOff.replace('{name}', m.name));
                  return (
                    <td key={d.weekday}
                      data-rota-i={i}
                      className={'rota-day' + (d.is_today ? ' rota-col-today' : '')}
                      /* On the <td> rather than on the button. The button's own click
                         and focus behaviour is what a plain click depends on, and
                         wrapping it in gesture handlers is how that gets broken. The td
